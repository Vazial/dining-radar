name: CI dining-radar

# Project-local L1 -> L5 chain (meta/verification.md, meta/adr/0026).
# This workflow does not change the repository's hard-required checks; L0 remains
# the only required GitHub check and is provided by govlint.yml.

on:
  pull_request:
    branches: [main, "project/**"]
    paths:
      - "projects/dining-radar/**"
      - ".github/workflows/ci-dining-radar.yml"
  push:
    branches: [main, "project/**"]
    paths:
      - "projects/dining-radar/**"
      - ".github/workflows/ci-dining-radar.yml"

defaults:
  run:
    working-directory: projects/dining-radar

jobs:
  l1-unit-lint:
    name: "L1: internal quality (unit, lint, coverage, mutation)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/dining-radar/pyproject.toml
      - name: Install project and verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Developer tests with branch coverage
        run: |
          python -m coverage run --branch -m pytest \
            tests/test_authentication.py \
            tests/test_bootstrap.py \
            tests/test_candidate_search.py \
            tests/test_gathering.py \
            tests/test_hotpepper_adapter.py \
            tests/test_quality_gate.py \
            tests/test_recommendation.py \
            tests/test_serializers.py \
            tests/test_static_assets.py \
            tests/test_structure.py \
            tests/test_suggestions.py \
            tests/test_template_syntax.py \
            tests/test_test_support.py
          python -m coverage report --fail-under=90
      # test_quality_gate.py only exercises the mutation gate itself, so it cannot
      # kill mutants in application source and stays out of this step.
      - name: Mutation testing
        run: |
          python -X utf8 -m pytest --gremlins \
            tests/test_authentication.py \
            tests/test_bootstrap.py \
            tests/test_candidate_search.py \
            tests/test_gathering.py \
            tests/test_hotpepper_adapter.py \
            tests/test_recommendation.py \
            tests/test_serializers.py \
            tests/test_static_assets.py \
            tests/test_structure.py \
            tests/test_suggestions.py \
            tests/test_template_syntax.py \
            tests/test_test_support.py
          python tools/check_mutation_score.py

  l2-structure:
    name: "L2: structural boundaries"
    runs-on: ubuntu-latest
    needs: l1-unit-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/dining-radar/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Architecture rules
        run: python -m pytest tests/test_structure.py

  l3-boundary:
    name: "L3: authentication, provider, and configuration boundaries"
    runs-on: ubuntu-latest
    needs: l2-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/dining-radar/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Boundary and test-support contracts
        run: >-
          python -m pytest
          tests/test_authentication.py
          tests/test_bootstrap.py
          tests/test_candidate_search.py
          tests/test_hotpepper_adapter.py
          tests/test_static_assets.py
          tests/test_template_syntax.py
          tests/test_test_support.py
      - name: Django production and acceptance checks
        run: |
          python manage.py check
          python manage.py check --settings=dining_radar.settings_test
        env:
          DJANGO_SECRET_KEY: synthetic-ci-verification-only
          DJANGO_ALLOWED_HOSTS: example.invalid

  l4-acceptance:
    name: "L4: acceptance scenarios (TDR-AUTH, TDR-CS)"
    runs-on: ubuntu-latest
    needs: l3-boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/dining-radar/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # TDR-CS renders its candidate surface client-side, so L4 executes the real
      # screen through a JS-capable browser (meta/verification.md L4, ADR-0009).
      # TDR-AUTH keeps the plain-HTTP DSL (ADR-0009 decision 4) and needs no browser.
      - name: Install the JS-capable browser used by TDR-CS acceptance
        run: python -m playwright install --with-deps chromium
      - name: TDR-AUTH and TDR-CS local browser acceptance
        run: python manage.py test tests.acceptance --verbosity 1
        timeout-minutes: 15

  l5-ui-invariants:
    name: "L5: rendered UI invariants"
    runs-on: ubuntu-latest
    # Runs only after L4 is green, per meta/verification.md 3.3 (a lower tier's
    # failure stops the tiers above it). Kept as its own job rather than a step
    # inside l4-acceptance so the two stay distinguishable: L4 answers "does it
    # satisfy the approved scenarios", this answers "does the rendered screen
    # still hold the invariants ADR-0020 decision 4 froze".
    needs: l4-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/dining-radar/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # These invariants are geometry, focus order, and rendered text on the real
      # screen, so they need the same JS-capable browser L4 uses (ADR-0020
      # decision 2: the "snapshot" compared here is a structured DOM/geometry
      # measurement set, deliberately not a pixel bitmap -- meta/adr/0021 and
      # meta/adr/0024 rejected pixel diffing and are not superseded).
      - name: Install the JS-capable browser used by the UI invariants
        run: python -m playwright install --with-deps chromium
      - name: Rendered UI invariants (ADR-0020 decision 4)
        run: python -m pytest tests/ui_invariants -q
        timeout-minutes: 15
