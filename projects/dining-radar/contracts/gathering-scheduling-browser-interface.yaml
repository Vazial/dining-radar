# Dining Radar gathering-scheduling browser acceptance interface
#
# Test infrastructure only. This is the machine-readable control-surface and
# observation SSoT for TDR-GTH acceptance work. It neither creates a public
# API nor changes gathering-scheduling-api.yaml's browser-facing API.
#
# ステータス: 承認待ち — architectが起草したドラフトである。人間の承認前（meta/adr/0043 方式(ii)）。
#   会スコープの契約。この行の形式はmeta/adr/0043の機械検証が要求する
#
# 2026-08-30 起草 (architect、ADR-0036、ADR-0035決定5の後段):
# - ADR-0035決定5は、この契約の起草を「designerが正規パイプラインで第1弾の画面を描き直し、人間が
#   実機で承認した後」に送っていた。同日、designerが `E:\AWS\dsg-out\party\` へ描き直したキャンバス
#   （Flow.dc.html／Organizer.dc.html／Answer.dc.html）のうち F・A①②・B を、人間がチャット
#   （選択肢UI）で第1弾の画面骨格として承認した（orchestratorの実測: A板1120×664/1120×764、
#   B板375×812、いずれもはみ出し0・切り詰め0・44px未満のタップ対象0）。`ADR-0013`の順序
#   （画面が先、契約は追随する）に従い、これらを承認済み設計として本契約の観測面を起こす。
# - **F（Flow.dc.html）はこの契約の観測面を持たない**——静的な説明図であり、操作可能な要素を持たない。
#   その内容（局面インジケータ、分母の区別、締切の不在）は A・B が実際に描く要素として現れており、
#   本契約はそちらを観測する（設計判断1、下記参照）。
# - **単一ファイルに2つの面を分けて収める**（設計判断2）: 幹事面（organizerDashboard、
#   `gathering-scheduling-api.yaml`の`organizerSession`同一起源Cookie）と参加者面
#   （participantAnswer、署名付きリンクのtoken自体が唯一の資格情報、Cookieなし）は認証モデルが
#   根本的に異なるが、同じ1本の業務契約（`gathering-scheduling.feature`）・同じ1本のAPI契約
#   （`gathering-scheduling-api.yaml`）が観測対象であるため、`candidate-search`/`authentication`
#   のように業務契約ごとにファイルを分けるのではなく、本ファイル内で`browserControlSurface`の
#   名前空間を分けるにとどめる。
# - D3（幹事の店リストは票の多い順固定・切替なし）は、承認投票の画面（次スライス以降）そのものを
#   本契約には持ち込まない——`ADR-0035`決定2が承認投票を第3弾へ送っているため。ただし、D3が体現する
#   **原則**（この製品の幹事向け一覧に手動並べ替えを一切許さない）は、`unavailableControls.
#   forbiddenPurposes`へ`manual-ordering`という抽象カテゴリとして今回取り込んだ——これは
#   `candidate-search-browser-interface.yaml`が既に使っている同名カテゴリの再利用であり、今回
#   実際に存在する候補日一覧（`gathering-candidate-date-list`）に適用されると同時に、将来の承認投票
#   スライスが店の一覧を追加したときも、新しいpurposeを何も足さずに同じ禁止が及ぶ（設計判断3）。
# - 幹事のリンク発行操作（`gathering-participant-link-copy`）は、承認済み画面が「回答リンクを
#   コピー」という単一のボタンとして示す一方、`gathering-scheduling-api.yaml`の
#   `issueParticipantLinks`は`count`（発行本数）を受け取るバッチ操作である。起草時点ではこのボタンが
#   クリックのたびに`count: 1`で1件ずつ発行するという解釈を採用しつつ、画面とAPIの間に元からあった
#   不整合の解消そのものは人間へ申し送っていたが、**同日2026-08-30、続く選択肢UIで人間が案A
#   「1クリック=1本」を選び、この運用のまま確定した**（設計判断4、`ADR-0036`決定4、下記参照）。
# - **実行モデルを明示する**（設計判断6、`ADR-0013`決定7・FR-004の教訓の先取り適用）:
#   organizerDashboard・participantAnswerのいずれも、`ADR-0009`決定4がTDR-CSに適用したのと同じ
#   JS-capableなブラウザ自動化DSLで検証する——TDR-AUTHのプレーンHTTP DSLではない。理由は、同時決め
#   プレビュー・回答後のタリー開示・名前の後付けのいずれも、ページ全体の再読み込みを伴わない
#   クライアント側の状態変化を観測対象とするためである（`renderModel`節を参照）。
# - participantAnswer.header にも data-gathering-phase を持たせ、TDR-GTH-11
#   （開催日確定後も局面が「店を選び中」のまま変わらないこと）を参加者画面単独からでも観測できる
#   ようにした——organizerDashboardの`phaseIndicatorAttributes`と同じ語彙・同じ値集合を、
#   `ParticipantView.phase`（gathering-scheduling-api.yaml、常に返される）から同様に投影する。
#
# 2026-08-30 追補 (architect、ADR-0036決定7。人間裁定「発行済みリンクの管理面を第1弾に含める」):
# - 発端は人間の懸念「リンクがわからなくなったら管理されなくなっちゃうかもね」。
#   `gathering-participant-link-list`（一覧）・`gathering-participant-link-recopy`（再コピー）・
#   `gathering-participant-link-revoke`（失効）の観測面を新設する。
# - **一覧にトークン/URLを載せない**（architectの設計判断）: `ParticipantLinkSummary`はtoken/urlを
#   持たない（`gathering-scheduling-api.yaml`参照）。再コピーは1件ずつの専用操作
#   （`recopyParticipantLink`）でだけ資格情報を露出させ、一覧を見るだけの操作では参加者アクセス
#   資格情報が一切画面に出ない。再コピーで得たURLも、リンク発行時と同様
#   `data-issued-link-url`相当の属性で機械観測する（クリップボードを信頼しない、既存の流儀を踏襲）。
# - 失効操作は「未回答のリンク」だけに機械的にも許可される——`data-has-responded="true"`の項目の
#   失効ボタンは非活性化する（disabledStateの既存の流儀。取り除くのではなく非活性にする）。
# - `data-unanswered-count`の算出式を`activeParticipantLinkCount - respondedParticipantCount`へ
#   改める（`totalIssuedParticipantLinks`単体ではなくなった。`gathering-scheduling-api.yaml`の
#   同名フィールド定義変更に追随）。
#
# 2026-09-01 追補 (architect、ADR-0038。人間裁定6件、実機フィードバック「幹事画面への入口が無い」への対応):
# - 実装スライス第1弾の公開後、人間が実機で「ランチ候補画面から会へ辿れない・会をつくる画面が無い・
#   会一覧が無い」ことを発見した。designerが`E:\AWS\dsg-out\party\Entry.dc.html`・
#   `AddDate.dc.html`・`Handoff.dc.html`を描き、人間が2026-09-01のチャットで6件を裁定した。
# - **会の一覧**（`organizerGatheringList`名前空間、`gathering-list`）と**会をつくる画面**
#   （`organizerGatheringCreate`名前空間）の観測面を新設する。TDR-GTH-01は、専用の作成画面が
#   無かったために`notVerifiedHere`としていたが、この追補で解消し`verifiesScenarios`へ移した。
# - **候補日追加フォームはインライン**（人間裁定、`AddDate.dc.html`案A）に決着した。
#   `gathering-add-candidate-date-open`が開く先（`ADR-0036`未決事項2として持ち越されていた）を
#   `gathering-add-candidate-date-form`として定義し、reviewer監査Major#1
#   （`addCandidateDateOpen`の入力サーフェス未定義で正の検査が書けない）を解消する。
# - **候補日の重複防止**（architectの設計判断、人間裁定の対象外）: 同一`startAt`の候補日を
#   二重に追加しようとする操作は拒否される（`gathering-scheduling-api.yaml`の
#   `DUPLICATE_CANDIDATE_DATE`）。フォームは開いたまま、入力値も保持される。
# - **ランチ候補画面から会への導線**（人間裁定: ヘッダーに「会」ボタン＋進行中件数バッジ、
#   `Handoff.dc.html`案B）は、`candidate-search-browser-interface.yaml`側に最小限の追加が要る
#   ——本ファイルではなく同ファイルの2026-09-01追補を参照。バッジの件数は
#   `gathering-scheduling-api.yaml`の`getInProgressGatheringCount`から得る（2つの機能が初めて
#   結合する、designerの指摘どおり）。
# - 候補画面deckの見た目3件（PCカード高さ場所確保・件数ページャー・スマホ高さ削減）は、designerが
#   契約条件を確認済みで契約影響なし——唯一の制約（PCカード案Bの空き場所に
#   `candidate-card-payment-caution`のtest idを付けないこと）は既存の`presenceRule`が既に
#   強制しており、本ファイル・`candidate-search-browser-interface.yaml`とも変更を要しない。
#
# 2026-09-02 追補 (architect、ADR-0039。実装ラウンドの合流でdeveloperが確定させたFR-028の契約穴):
# - developerがこの契約の`organizerGatheringCreate`・`candidateDateList.addCandidateDateForm`を
#   実装したところ、素の値入力欄（`gathering-create-name-input`・
#   `gathering-create-candidate-date-input`・`gathering-add-candidate-date-input`）が横断検査
#   `assert_gathering_screen_has_no_forbidden_surfaces`（`allGatheringScreenFormControlsMustDeclare
#   Purpose`の機械化）に引っかかった。`allowedPurposes`の17件はいずれも動詞的な操作名
#   （open/submit/cancel/select等）であり、値をただ保持するだけの入力欄に対応する語彙が無い。
#   ネイティブ`<input>`を避ける回避は走査を欺く改悪であり不採用（developerの判断に同意）。
# - **本契約はこれまで`forbiddenFormControlCategories`を明示していなかった**（candidate-search-
#   browser-interface.yamlは持つ）——横断検査が暗黙にどの要素種別を拾うかが本ファイル単体では
#   読み取れなかったことが、この穴が起草時点で見えなかった一因である。今回、
#   `candidate-search-browser-interface.yaml`と同じ列挙を明示した。
# - **「操作的コントロール」と「値入力コントロール」を区別する**（ADR-0039、決定の核）:
#   `allGatheringScreenFormControlsMustDeclarePurpose`が要求するpurpose宣言は、活性化それ自体が
#   このcontractのrequiredOutcomeを引き起こす**操作的**コントロール（`allowedPurposes`の17件が
#   すべてそれである）にだけ及ぶ。値を保持するだけで、値の消費は別の操作的コントロール（submit等）の
#   requiredOutcomeが引き受ける**値入力**コントロールは対象外とする——ただし、この契約が
#   `valueEntryControlTestIds`として名指しし、かつどの操作的コントロールがその値を消費するかを
#   `browserControlSurface`内に明記している場合に限る（`unavailableControls.
#   operationalControlScope`参照）。名指しも消費先の明記も無い値入力コントロールは、従来どおり
#   一般則の対象のままである——これは「無条件の値入力欄免除」ではなく、追跡可能性を条件にした
#   限定的な適用範囲の明確化である。
# - この整理により、`gathering-participant-name-input`（参加者の名前入力、当初から存在していたが
#   `nameControl`配下に構造化されたtestId宣言を持たず、この横断検査が実際に走ったときに
#   引っかかるかどうか未検証のまま残っていた）も同じ規律のもとに置いた——`nameControl.input`として
#   明示的に構造化し、`valueEntryControlTestIds`へ追加した。将来この契約に新しい値入力欄が増えても、
#   同じ規律がそのまま及ぶ（一貫して効くことを狙った設計、ADR-0039）。
#
# 2026-09-04 追補 (architect、ADR-0042。designerがPickFive.dc.html／Final.dc.htmlで会フロー
#   後半の画面を仕上げ、判断待ちゼロになったのを受け、ADR-0013の順序どおり画面骨格の確定後に
#   起草する。骨格承認は本一連のPRのマージ自体を承認行為として束ねる、人間の指示に基づく運用):
# - **5件選定面**（`organizerDashboard.shortlistSelection`、PickFive.dc.html案A）: 開いている店の
#   チェックリストと「この◯件で投票する」を新設する。P1（ダッシュボード内で完結）・P2（1件から
#   可）・P3（絞り込みなし）をそのまま反映する。チェックはローカルの保留状態であり、送信ボタンを
#   押すまで`setShortlistedShops`を呼ばない——`candidate-search-browser-interface.yaml`の
#   フィルタパネル（保留→適用）と同じ流儀。
# - **`OpenShopPreviewItem`への`shopId`追加**（`gathering-scheduling-api.yaml`側、adr/0042、
#   architect自己監査）: このチェックリストの各行が`setShortlistedShops`へ送る実際の`shopId`を
#   特定する手段が、起草時点のAPIには無かった（当該フィールドの説明文が対応方法を明示的に
#   先送りしていた）。本ラウンドでAPI側に追加し、本ファイルの`data-shop-id`属性はこの新フィールド
#   を投影する。
# - **投票中の差し替え面**（`organizerDashboard.shortlistedShopVotes`、Organizer.dc.html状態②
#   ・D7）: 投票が始まると（`votingStartedAt`非null）5件選定面はこちらに切り替わる。店ごとの
#   得票（`data-approval-count`・`data-responded-count`、D7の店ごと分母）と、確定用のラジオ
#   選択・確定ボタンを持つ。「5件を差し替える」を押すと5件選定面が再び開き、現在の
#   `shortlistedShops`で事前チェックされる。
# - **確定操作**（`gathering-finalize-shop-select`・`gathering-finalize-submit`）: 幹事が1件を
#   選んで`finalizeGathering`を呼ぶ。最多得票を自動選択しない（product-brief.md §2）。
# - **FINALIZED局面の観測面**（`organizerDashboard.finalizedSummary`、Final.dc.html A③）:
#   `activeContext.md`が第1弾以来記録してきた「FINALIZED局面の観測面ギャップ」をこれで閉じる。
#   決定の帯（`gathering-decision-banner`）を新設し、日程の記録・票の記録は既存の要素
#   （`gathering-candidate-date-list`・`gathering-shortlisted-shop-list`）がそのまま記録として
#   残ることを明記した。**P4（確定後も再コピーのみ）**: `gathering-participant-link-copy`
#   （新規発行）と、各行の`revoke`（失効）が確定後は不在になる——`gathering-participant-link-
#   recopy`だけが残る。あわせて、SCHEDULING専用だった3操作（`gathering-confirm-date-select`・
#   `gathering-add-candidate-date-open`・`gathering-candidate-date`の仮選択purpose）が
#   SCHEDULING以外では不在になることを明記した——これも観測面ギャップを閉じる一部であり、
#   Organizer.dc.html状態②は元からこれらを描いていない（今回初めて契約側の言葉にした）。
# - **参加者の投票面**（`participantAnswer.shopVoteQuestion`、Vote.dc.html／B-2、画面自体は
#   承認済み・無変更）: 参加者は現在の5件から「行ってもいい店」をチェックし、**チェックのたびに
#   即座に`setShopVotes`を呼ぶ**（保留・送信ボタンの無いモデル——Vote.dc.html「選ぶとその場で
#   保存されます」）。自分が投票した後にだけ他者の票が見える（TDR-GTH-29、
#   scheduleQuestion.tallyの流儀を店ごとに拡張）。
# - **参加者の確定後面**（`participantAnswer.finalizedView`、Final.dc.html B-3）: 決定と
#   「あなたの記録」（P5、`ParticipantView.decision.yourScheduleResponse`／
#   `yourApprovedShops`をそのまま観測する）を新設する。`gathering-schedule-question`・
#   `gathering-shop-vote-question`・`gathering-participant-progress`はいずれも
#   `ParticipantView.decision`が非nullになると不在になる——`gathering-scheduling-api.yaml`の
#   ParticipantView.decisionが残していた「後続契約が決める」という未決の書き方を、
#   共存ではなく完全な置き換えとして決着させた。操作（回答・投票・名前）もすべて不在になる
#   （Final.dc.html「この画面に操作はありません」）。
# - **会一覧の名前属性**（`ADR-0040`未決事項2、監査指摘）: `gathering-list-item`へ
#   `data-gathering-title`を追加し、ギャップを解消した。
# - **FR-028として報告する食い違い1件**: Organizer.dc.html状態②は「店を絞りなおす」「5件を
#   差し替える」という2つの異なる文言のボタンを描いているが、今回のdesigner材料はこの2つの
#   区別を再定義していない（Organizer.dc.html自体は今回「承認済み・無変更」として扱われている）。
#   本契約は両方を同じ`gathering-shortlist-open`purposeの2インスタンスとして扱う——これが
#   正しいかは人間の確認待ちとする。
openapi_note: >-
  This file is not an OpenAPI document; it is test infrastructure. The
  `contractVersion`/`kind` header below follows the same convention as
  candidate-search-browser-interface.yaml and authentication-browser-interface.yaml.
contractVersion: '0.5'
kind: acceptance-browser-interface
scope: gathering-scheduling
renderModel: >-
  browserControlSurface.organizerDashboard, organizerGatheringList,
  organizerGatheringCreate, and participantAnswer are all verified by a
  JS-capable browser automation DSL, the same execution model
  candidate-search-browser-interface.yaml uses for TDR-CS (ADR-0009 decision
  4), not authentication-browser-interface.yaml's plain-HTTP DSL for
  TDR-AUTH. Every requiredOutcome in this contract (tentative selection
  revealing a preview, a schedule response revealing its tally, a display
  name attaching, a link list refreshing after recopy/revoke, an inline
  add-date form staying open after a successful submit, a shortlist
  checkbox toggling pending state without a network call, a shop-vote
  checkbox instead calling setShopVotes immediately, a shortlisted-shop
  list's counts refreshing after setShortlistedShops/finalizeGathering)
  describes a client-side DOM change that a plain-HTTP, server-response-only
  DSL cannot observe -- none of this contract's interactions are specified
  as requiring a full page navigation except where explicitly noted (e.g.
  opening a gathering from the list, or leaving the creation screen after
  submit). A control this contract requires present must exist in the DOM
  once the relevant JS-executing render completes; unlike
  authentication-browser-interface.yaml's renderModel, this contract does
  not additionally require presence in the raw server-rendered HTML
  response, because no TDR-GTH scenario depends on a non-JS client (this
  stated explicitly per the FR-004 lesson: a browser-interface contract must
  declare its execution-model assumption at authoring time, not leave it for
  tester to discover at L4).
profiles:
  localAcceptance:
    transport: HTTP
    publicDeployment: false
    verifiesScenarios:
      [TDR-GTH-01, TDR-GTH-02, TDR-GTH-03, TDR-GTH-04, TDR-GTH-05, TDR-GTH-06,
       TDR-GTH-07, TDR-GTH-08, TDR-GTH-09, TDR-GTH-10, TDR-GTH-11,
       TDR-GTH-12, TDR-GTH-14, TDR-GTH-15, TDR-GTH-16, TDR-GTH-17,
       TDR-GTH-18, TDR-GTH-19, TDR-GTH-20, TDR-GTH-21, TDR-GTH-22,
       TDR-GTH-23, TDR-GTH-24, TDR-GTH-25, TDR-GTH-26, TDR-GTH-27,
       TDR-GTH-28, TDR-GTH-29, TDR-GTH-30, TDR-GTH-31, TDR-GTH-32,
       TDR-GTH-33, TDR-GTH-34, TDR-GTH-35, TDR-GTH-36]
    notVerifiedHere:
      - scenario: TDR-GTH-13
        reason: >-
          "Guessing another participant's token" is a security property
          best exercised by direct API-level fuzzing (constructing an
          unissued token value and calling the public API), not by a
          browser click-through. This contract's disclosureObservations
          section still governs what the error surface may and may not
          reveal when a browser does reach an invalid link.
    invariant:
      - The profile is isolated and must never be selected by a public deployment.
      - Gathering, candidate-date, and participant-link state is supplied only through a future test-support-api.yaml extension for TDR-GTH (adr/0035 未決事項, not yet drafted); this contract does not itself define that extension.
      - Browser actions use only the public organizerSession and signed-participant-link boundaries defined by gathering-scheduling-api.yaml.
      - No real provider, configured search origin, credential, or provider response is used.
    syntheticDisclosureCanaries:
      privateSearchOrigin: synthetic-private-origin-never-disclose.invalid
      providerInternals: synthetic-provider-internals-never-disclose
      description: >-
        Reuses the exact canary values candidate-search-browser-interface.yaml
        and authentication-browser-interface.yaml already define, so a single
        shared set of forbidden strings applies across every TDR-* browser
        contract.

browserEntry:
  organizerGatheringList:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/gatherings/'
    note: >-
      The organizer's entry point (Entry.dc.html E-1/E-1b, adr/0038) --
      reachable immediately after sign-in. This contract does not fix
      whether this is also the same URL sign-in redirects to; it fixes only
      that it is reachable under the same base URL and same-origin session
      as every other organizer surface.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome, same as browserEntry.organizerDashboard below.
  organizerGatheringCreate:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    note: >-
      Reachable by activating gathering-create-open from
      organizerGatheringList (Entry.dc.html E-2, adr/0038). This contract
      does not fix its literal route.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome, same as browserEntry.organizerDashboard below.
  organizerDashboard:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/gatherings/{gatheringId}/'
    note: >-
      `{gatheringId}` comes from the response of a prior createGathering call
      or an equivalent test-support seam (adr/0035 未決事項5); this contract
      does not fix the literal route, only that it is reachable under the
      same base URL and same-origin session used by
      candidate-search-browser-interface.yaml and
      authentication-browser-interface.yaml. Also reachable by activating
      gathering-list-item-open from organizerGatheringList (adr/0038). The
      same URL and same screen renders across all three phases
      (Organizer.dc.html's own framing: "同じ1画面が3つの顔を持つ") -- see
      shortlistSelection/shortlistedShopVotes/finalizedSummary below for
      the phase-dependent parts of that one screen.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome (present: auth-sign-in-form; absent:
      authenticated-application-shell) -- this contract adds no new
      unauthenticated-visitor behavior. Every requiredTestIds entry below is
      additionally absent for an unauthenticated visitor.
  participantAnswer:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/participant-links/{token}/'
    note: >-
      `{token}` is a signed participant-link token from a prior
      issueParticipantLinks call or an equivalent test-support seam. This
      route requires no organizerSession cookie and no sign-in -- the token
      itself is the sole credential (gathering-scheduling-api.yaml's
      ParticipantToken parameter). Opening this URL never requires or
      accepts an authenticated organizer session; if a signed-in organizer's
      browser opens it, this contract makes no special-case requirement --
      the token still governs access on its own.
    validLinkOutcome:
      present: [gathering-participant-header, gathering-schedule-question]
      absent: [gathering-participant-link-error]
    invalidLinkOutcome:
      present: [gathering-participant-link-error]
      absent: [gathering-participant-header, gathering-schedule-question,
                gathering-participant-name-open]

unavailableControls:
  allGatheringScreenFormControlsMustDeclarePurpose: true
  purposeAttribute: data-gathering-control-purpose
  forbiddenFormControlCategories:
    [select, input, textarea, checkbox, radio, range, combobox, listbox,
     slider, spinbutton, button]
  forbiddenFormControlCategoriesNote: >-
    Added 2026-09-02 (ADR-0039) -- this contract had required purpose
    declaration since drafting but had never explicitly enumerated which
    element categories the requirement scans, unlike
    candidate-search-browser-interface.yaml. This is the same enumeration
    that file uses, matching the shared tester DSL's FORM_CONTROL_SELECTOR
    (activeContext.md's 2026-08-25 record). See operationalControlScope
    below for the boundary this enumeration is now read against.
  operationalControlScope: >-
    Added 2026-09-02 (ADR-0039, FR-028 gap developer confirmed while
    implementing organizerGatheringCreate and
    candidateDateList.addCandidateDateForm). The purpose-declaration
    requirement above applies to *operational* controls -- an element whose
    own activation is itself a requiredOutcome trigger somewhere in this
    contract. Every entry in allowedPurposes below names exactly one such
    control (open/submit/cancel/select/toggle/recopy/revoke-style
    activations -- this now also includes checkbox/radio controls whose
    activation only changes client-side pending state without an
    immediate public operation call, e.g. gathering-open-shop-select,
    2026-09-04, adr/0042: pending-vs-immediate is not the distinction this
    clause draws; "does this contract's own requiredOutcome fire on
    activation" is). It does not apply to *value-entry* controls -- a
    native `input` (of type text/date/time/datetime-local/number) or
    `textarea` whose own activation (typing into it) is not itself a
    requiredOutcome trigger; it only holds a value that a separately-
    declared operational control (typically a `submit`) consumes when that
    control is activated. This distinction is not a blanket exemption for
    "any input someone decides not to label": a value-entry control is
    exempt from declaring a data-gathering-control-purpose value **only if**
    both of the following hold, so that every value-entry control remains
    individually traceable to exactly one declared operation --
      1. its test id appears in valueEntryControlTestIds below, and
      2. browserControlSurface documents, by test id, which operational
         control's requiredOutcome names this field as a value it consumes
         (e.g. organizerGatheringCreate.nameInput/candidateDateRow.dateInput
         are consumed by organizerGatheringCreate.submit.requiredOutcome;
         candidateDateList.addCandidateDateForm.dateInput is consumed by its
         own submit.requiredOutcome; participantAnswer.nameControl.input is
         consumed by nameControl.submit.requiredOutcome).
    A native input/textarea meeting forbiddenFormControlCategories above
    that is *not* listed in valueEntryControlTestIds, or whose consuming
    operational control this contract does not document, remains subject to
    the general requirement and must declare a purpose from allowedPurposes
    like any other control -- this is what keeps an unaccounted, silently
    added input from escaping the audit this requirement exists for (ADR-0013
    origin: "全フォームコントロールのpurposeをallowedPurposesと突き合わせる").
    This clause does not exempt select/checkbox/radio/combobox/listbox/
    range/slider/spinbutton/button elements, or any interactive ARIA role --
    those represent a bounded choice-from-known-options or an operation in
    their own right and continue to require a declared purpose exactly as
    before (e.g. every existing allowedPurposes entry that is a *-select or
    *-toggle purpose remains unaffected by this clause; this is why every
    new checkbox/radio this round -- gathering-open-shop-select,
    gathering-finalize-shop-select, gathering-shop-vote-select -- has its
    own allowedPurposes entry below rather than being treated as a
    value-entry control).
  valueEntryControlTestIds:
    [gathering-create-name-input, gathering-create-candidate-date-input,
     gathering-add-candidate-date-input, gathering-participant-name-input]
  valueEntryControlTestIdsNote: >-
    Four value-entry controls are exempt under operationalControlScope
    above, each traceable to exactly one consuming operational control's
    requiredOutcome: gathering-create-name-input and
    gathering-create-candidate-date-input (organizerGatheringCreate.submit),
    gathering-add-candidate-date-input
    (candidateDateList.addCandidateDateForm.submit), and
    gathering-participant-name-input (participantAnswer.nameControl.submit).
    The last of these existed since this contract's original 2026-08-30
    draft but had no structured browserControlSurface entry of its own
    (only prose mentioning it) -- ADR-0039 brought it under the same
    discipline retroactively rather than leaving it "not yet caught by
    the cross-cutting check" by accident. No new value-entry controls are
    introduced by this round (2026-09-04, adr/0042) -- every new control
    (shortlist/finalize/shop-vote selection) is a checkbox or radio, which
    operationalControlScope's note above explicitly keeps out of this list.
    Any future value-entry control this contract adds must be listed here
    and traced to its consuming operational control the same way, or it
    remains subject to the general purpose-declaration requirement.
  allowedPurposes:
    [gathering-add-candidate-date-open, gathering-add-candidate-date-submit,
     gathering-add-candidate-date-cancel, gathering-participant-link-copy,
     gathering-candidate-date-tentative-select, gathering-confirm-date-select,
     gathering-schedule-response-select, gathering-participant-name-open,
     gathering-participant-name-submit, gathering-participant-link-recopy,
     gathering-participant-link-revoke, gathering-create-open,
     gathering-list-item-open, gathering-create-add-candidate-date-row,
     gathering-create-remove-candidate-date-row, gathering-create-submit,
     gathering-create-cancel, gathering-open-shop-select,
     gathering-shortlist-submit, gathering-shortlist-open,
     gathering-finalize-shop-select, gathering-finalize-submit,
     gathering-shop-vote-select]
  allowedPurposesNote2026_09_04: >-
    Six purposes added (adr/0042): gathering-open-shop-select
    (PickFive.dc.html's checkbox, organizerDashboard.shortlistSelection),
    gathering-shortlist-submit (its "この◯件で投票する" button),
    gathering-shortlist-open (Organizer.dc.html state②'s "店を絞りなおす"/
    "5件を差し替える", shared -- see this file's header comment's FR-028
    note on why these two labels are not distinguished),
    gathering-finalize-shop-select (the per-shop radio in
    shortlistedShopVotes) and gathering-finalize-submit (its confirm
    button), and gathering-shop-vote-select (the participant's approval
    checkbox in shopVoteQuestion).
  forbiddenPurposes:
    - manual-ordering
    - secondary-condition
  forbiddenPurposesNote: >-
    `manual-ordering` is the same abstract category
    candidate-search-browser-interface.yaml already forbids (ADR-0023
    decision 4's ban on organizer-chosen sort order), reused here rather than
    redefined. It currently constrains
    browserControlSurface.organizerDashboard.candidateDateList (fixed
    goingCount-descending order, no sort toggle), participantLinkList (fixed
    issuedAt-ascending order, no sort toggle -- ADR-0036 decision 7),
    organizerGatheringList.list (fixed createdAt-descending order, no sort
    toggle -- adr/0038), and shortlistedShopVotes.list (fixed
    approvalCount-descending order, no sort toggle -- adr/0042, this is the
    approval-voting shop list ADR-0036 design judgment 3 already
    anticipated when it generalized this category ahead of the list
    existing) and is written as a category -- not tied to any specific
    existing test id -- so any future list this contract adds is covered
    without a new allowedPurposes/forbiddenPurposes edit.
    `secondary-condition` is reused from the same source contract for the
    same reason: this product's existing "no auxiliary condition controls
    beyond the declared filter/sort model" principle (ADR-0005 decision 4)
    applies here too -- this slice still defines no filter controls of its
    own (P3, 2026-09-03, confirms the shortlist/vote surfaces this round
    add none either).
  forbiddenTestIds:
    [candidate-origin-marker, candidate-map, private-search-origin]
  forbiddenTestIdsNote: >-
    No gathering screen may render any candidate-search map/origin element
    -- the gathering never persists or re-displays provider location data of
    its own (adr/0034 decision 6); any shop information a gathering screen
    shows is a live, non-persisted projection
    (gathering-scheduling-api.yaml's OpenShopPreviewItem), never a map.

browserControlSurface:
  organizerGatheringList:
    description: >-
      The organizer's entry point (Entry.dc.html E-1/E-1b, adr/0038). Fills
      the gap the human found in production ("幹事画面への入口が無い").
      Supports TDR-GTH-21/22.
    requiredTestIds:
      list: gathering-list
      createOpen: gathering-create-open
    list:
      testId: gathering-list
      orderingInvariant: >-
        DOM order of gathering-list-item children equals
        GatheringListResponse.gatherings' order (createdAt descending,
        新しい順, gathering-scheduling-api.yaml) at all times. No control in
        this list may claim the forbidden manual-ordering purpose (see
        unavailableControls above).
      item:
        testId: gathering-list-item
        cardinality: zero-or-more-elements-sharing-this-test-id
        attributes:
          id: data-gathering-id
          title: data-gathering-title
          phase: data-gathering-phase
          confirmedCandidateDate: data-confirmed-candidate-date
          respondedCount: data-responded-count
          activeIssuedLinks: data-active-issued-links
        requirement: >-
          One element per Gathering in the response. data-gathering-title
          (added 2026-09-04, adr/0042, closing ADR-0040 未決事項2's
          audit-flagged gap: this list previously had no machine-observable
          attribute for the gathering's own name) equals Gathering.title
          exactly. data-gathering-phase uses the same three-value
          vocabulary as organizerDashboard.phaseIndicatorAttributes
          (SCHEDULING, SELECTING_SHOP, FINALIZED). data-confirmed-
          candidate-date is an ISO-8601 date-time string equal to the
          CandidateDate.startAt whose id matches
          Gathering.confirmedCandidateDateId, or absent when
          confirmedCandidateDateId is null (Entry.dc.html's "候補日 4つ"
          case) -- this contract does not fix whether a candidate-date-count
          is separately exposed when there is no confirmed date; the DOM
          text content is not asserted, only these attributes. data-responded-
          count and data-active-issued-links mirror
          Gathering.respondedParticipantCount /
          Gathering.activeParticipantLinkCount exactly, using the same
          attribute names organizerDashboard's denominatorAttributes already
          establish (D2's two-denominator distinction applies here too).
        open:
          testId: gathering-list-item-open
          purpose: gathering-list-item-open
          requiredOutcome: >-
            Activating it navigates to browserEntry.organizerDashboard for
            this item's data-gathering-id (TDR-GTH-21).
    empty:
      testId: gathering-list-empty
      presenceRule: >-
        Present exactly when GatheringListResponse.gatherings is empty;
        absent otherwise. When present, no gathering-list-item exists in the
        DOM (TDR-GTH-22). This is the "input素が無い" gap the human found in
        production -- Entry.dc.html E-1b is this contract's answer.
      containsCreateOpen: >-
        A second gathering-create-open instance may appear inside
        gathering-list-empty in addition to the one in the persistent header
        (Entry.dc.html E-1b duplicates the entry point). See createOpen
        below for why this test id's cardinality allows more than one
        simultaneous element.
    createOpen:
      testId: gathering-create-open
      purpose: gathering-create-open
      cardinality: >-
        one-or-more-elements-sharing-this-test-id -- at least one instance
        (the persistent header entry point) is always present on this
        screen; a second instance may coexist inside gathering-list-empty
        when the list is empty (Entry.dc.html shows both at once in that
        state). Every instance shares the same purpose and requiredOutcome.
      requiredOutcome: >-
        Activating any instance navigates to browserEntry.
        organizerGatheringCreate (TDR-GTH-22).
  organizerGatheringCreate:
    description: >-
      The gathering-creation screen (Entry.dc.html E-2, adr/0038). Fills the
      second gap the human found in production ("会をつくる画面が無い").
      Supports TDR-GTH-01 (now browser-verifiable) and TDR-GTH-23.
    requiredTestIds:
      nameInput: gathering-create-name-input
      candidateDateRow: gathering-create-candidate-date-row
      addRow: gathering-create-add-candidate-date-row
      submit: gathering-create-submit
      cancel: gathering-create-cancel
    nameInput:
      testId: gathering-create-name-input
      requirement: >-
        A text input whose value becomes CreateGatheringRequest.title on
        submit. Present unconditionally on this screen.
      valueEntryControl: >-
        Exempt from allGatheringScreenFormControlsMustDeclarePurpose per
        unavailableControls.operationalControlScope (ADR-0039) -- its value
        is consumed by submit.requiredOutcome below, which is this field's
        documented consuming operational control.
    candidateDateRow:
      testId: gathering-create-candidate-date-row
      cardinality: >-
        one-or-more-elements-sharing-this-test-id -- exactly one row is
        present when the screen first opens (Entry.dc.html E-2's "1つめ"
        row); addRow appends further rows.
      dateInput:
        testId: gathering-create-candidate-date-input
        valueEntryControl: >-
          Exempt from allGatheringScreenFormControlsMustDeclarePurpose per
          unavailableControls.operationalControlScope (ADR-0039) -- its
          value is consumed by submit.requiredOutcome below.
      note: >-
        This contract requires each row to expose enough input to produce
        one valid ISO-8601 date-time value for
        CandidateDateInput.startAt -- format: date-time already requires a
        time component (see gathering-scheduling-api.yaml's
        CandidateDateInput, adr/0038), so time input is required, not
        optional, resolving designer's open question in Entry.dc.html/
        AddDate.dc.html. Whether the row collects date and time via one
        merged input or two separate inputs (in which case the second uses
        a `-time-input` suffix, designer's own naming proposal) is a UI
        implementation choice this contract does not fix; either shape
        remains covered by the same dateInput valueEntryControl exemption
        above, since it is the same field regardless of how many DOM
        elements implement it.
      addRow:
        testId: gathering-create-add-candidate-date-row
        purpose: gathering-create-add-candidate-date-row
        requiredOutcome: >-
          Activating it appends one new gathering-create-candidate-date-row
          (Entry.dc.html's "候補日を足す" within E-2).
      removeRow:
        testId: gathering-create-remove-candidate-date-row
        purpose: gathering-create-remove-candidate-date-row
        cardinality: zero-or-more-elements-sharing-this-test-id
        presenceRule: >-
          Absent on a row exactly when it is the only remaining row (a
          gathering cannot be created with zero candidate dates, ADR-0035
          decision 1 / D10) -- Entry.dc.html shows this exact rule (the
          "1つめ" row has no remove control, later rows do). Present on
          every other row.
        requiredOutcome: >-
          Activating it removes that specific
          gathering-create-candidate-date-row from the DOM.
    submit:
      testId: gathering-create-submit
      purpose: gathering-create-submit
      disabledState: >-
        Carries the native disabled state whenever gathering-create-name-
        input is empty, or every gathering-create-candidate-date-row lacks a
        complete valid date-time value (ADR-0035 decision 1's "候補日1つ以上"
        requirement, mirrored client-side; the API itself is the
        authoritative enforcement -- this disabledState is a UX affordance,
        not a substitute for server-side validation). Same disable-at-the-
        boundary convention as confirmDate.disabledState.
      requiredOutcome: >-
        Activating it (while not disabled) calls createGathering with
        title (consumed from gathering-create-name-input) and
        candidateDates (consumed from every gathering-create-candidate-
        date-row's dateInput) built from the current rows (TDR-GTH-01). On
        success, the new gathering subsequently appears in
        organizerGatheringList.list (createdAt descending places it first).
        This contract does not fix the immediate post-submit destination
        screen. On a DUPLICATE_CANDIDATE_DATE rejection (adr/0038, two rows
        sharing the same date-time value), the screen remains on
        organizerGatheringCreate with every row's entered value intact --
        no gathering is created and no row is cleared.
    cancel:
      testId: gathering-create-cancel
      purpose: gathering-create-cancel
      requiredOutcome: >-
        Activating it navigates back to organizerGatheringList without
        calling createGathering.
  organizerDashboard:
    requiredTestIds:
      phaseIndicator: gathering-phase-indicator
      respondedSummary: gathering-responded-summary
      unansweredSummary: gathering-unanswered-summary
      candidateDateList: gathering-candidate-date-list
      candidateDate: gathering-candidate-date
      addCandidateDateOpen: gathering-add-candidate-date-open
      participantLinkCopy: gathering-participant-link-copy
      participantLinkList: gathering-participant-link-list
      confirmDate: gathering-confirm-date-select
    phaseIndicatorAttributes:
      testId: gathering-phase-indicator
      attribute: data-gathering-phase
      values: [SCHEDULING, SELECTING_SHOP, FINALIZED]
      requirement: >-
        Exact string match with the current Gathering.phase
        (gathering-scheduling-api.yaml). Present unconditionally whenever the
        organizer dashboard renders. Corresponds to the phase progress
        display Organizer.dc.html's dw-ph header and Flow.dc.html's 会の状態
        row both show; this element is what carries that concept into the
        approved screens actually observed by this contract (F itself has no
        observable surface -- see this file's header comment). Amended
        2026-09-01 (D10, adr/0038): the value set was already exactly these
        three values (no DRAFT) from drafting time; D10 confirms this was
        correct rather than changing it. Amended 2026-09-03 (P6, adr/0041):
        this value set does not gain a fourth value when voting starts --
        see shortlistSelection/shortlistedShopVotes below for how that
        sub-state is represented instead.
    denominatorAttributes:
      description: >-
        D2 (2026-08-30): two distinct denominators must be separately
        machine-observable on the same dashboard, matching Gathering's
        activeParticipantLinkCount and respondedParticipantCount
        (gathering-scheduling-api.yaml), which are never the same value and
        must never be conflated into one attribute. Amended 2026-08-30
        (ADR-0036 decision 7): the unanswered denominator now nets out
        revoked links, not just totalIssuedParticipantLinks.
      respondedSummary:
        testId: gathering-responded-summary
        attributes:
          respondedCount: data-responded-count
          anonymousRespondedCount: data-anonymous-responded-count
        requirement: >-
          data-responded-count equals response.respondedParticipantCount
          exactly; data-anonymous-responded-count equals
          response.anonymousRespondedParticipantCount exactly (both decimal
          integer strings). Supports the visible disclosure "8人が回答（うち
          2人は名前なし）" (Organizer.dc.html) without itself fixing that
          wording.
      unansweredSummary:
        testId: gathering-unanswered-summary
        attributes:
          totalIssuedLinks: data-total-issued-links
          revokedLinks: data-revoked-links
          activeIssuedLinks: data-active-issued-links
          unansweredCount: data-unanswered-count
        requirement: >-
          data-total-issued-links equals
          response.totalIssuedParticipantLinks exactly (lifetime count,
          audit only -- ADR-0036 decision 7). data-revoked-links equals
          response.totalRevokedParticipantLinks exactly. data-active-issued-links
          equals response.activeParticipantLinkCount exactly
          (totalIssuedParticipantLinks - totalRevokedParticipantLinks).
          data-unanswered-count equals
          activeParticipantLinkCount minus respondedParticipantCount exactly
          -- this is the D2 denominator ("まだn人が未回答", amended
          2026-08-30 so a revoked link no longer counts as outstanding,
          TDR-GTH-18), and it must never be computed from or equal to any
          per-candidate-date tally, and must never be computed from
          data-total-issued-links directly (that would reintroduce the
          pre-amendment bug of counting a revoked link as still
          unanswered).
    candidateDateList:
      testId: gathering-candidate-date-list
      orderingInvariant: >-
        DOM order of gathering-candidate-date children equals
        Gathering.candidateDates' order (goingCount descending,
        implementation-chosen stable tie-break, gathering-scheduling-api.yaml)
        at all times. No control in this list may claim the forbidden
        manual-ordering purpose (see unavailableControls above).
      candidateDate:
        testId: gathering-candidate-date
        attributes:
          id: data-candidate-date-id
          goingCount: data-going-count
          maybeCount: data-maybe-count
          notGoingCount: data-not-going-count
          isConfirmed: data-confirmed
          tentativelySelected: data-tentative-selected
        requirement: >-
          One element per CandidateDate, each attribute an exact-match
          projection of the same-named CandidateDate field (data-confirmed
          and data-tentative-selected are "true"/"false" strings). At most
          one gathering-candidate-date carries data-confirmed="true" at a
          time, and it is exactly Gathering.confirmedCandidateDateId's
          target once phase is SELECTING_SHOP or FINALIZED. At most one
          carries data-tentative-selected="true" at a time (see
          tentativeSelectionAndPreview below); tentative selection is
          client-side UI state only, never sent to or reflected by
          gathering-scheduling-api.yaml (adr/0035 decision 1 item 1). This
          list and its items remain present unconditionally across all
          three phases (Final.dc.html A③'s "日程の記録" panel is this same
          element, frozen as a record once FINALIZED, adr/0042) -- only the
          tentative-select interactivity retires (see
          tentativeSelectionAndPreview.trigger below).
      addCandidateDateOpen:
        testId: gathering-add-candidate-date-open
        purpose: gathering-add-candidate-date-open
        presenceRule: >-
          Present only while phase is SCHEDULING; absent once phase is
          SELECTING_SHOP or FINALIZED (addCandidateDate has been rejected
          outside SCHEDULING since ADR-0035, but this contract had not
          previously stated the control's own presence rule -- stated here
          while closing the FINALIZED observation gap, adr/0042;
          Organizer.dc.html state② already omits this control).
        disabledState: >-
          This contract does not require a disabled state for this control
          while present (unlike gathering-create-submit) -- adding a
          further candidate date has no lower-bound precondition the way
          creating a gathering does (ADR-0035 decision 1 already requires
          >=1 at creation time).
        requiredOutcome: >-
          Activating it reveals gathering-add-candidate-date-form inline
          within gathering-candidate-date-list (案A "その場で開く", human
          decision 2026-09-01, adr/0038) -- resolving what was, at drafting
          time, an undefined destination (Organizer.dc.html showed only this
          button's entry point). See addCandidateDateForm below for the
          form itself (TDR-GTH-02, reviewer audit Major#1's positive
          surface).
      addCandidateDateForm:
        testId: gathering-add-candidate-date-form
        presenceRule: >-
          Absent until gathering-add-candidate-date-open is activated.
          Present after activation, and **remains present after a
          successful submit** -- ready for another entry without
          re-opening (human decision 2026-09-01, AddDate.dc.html 案A: "足した
          あとフォームは閉じない"). Absent again only after
          gathering-add-candidate-date-cancel is activated.
        dateInput:
          testId: gathering-add-candidate-date-input
          valueEntryControl: >-
            Exempt from allGatheringScreenFormControlsMustDeclarePurpose per
            unavailableControls.operationalControlScope (ADR-0039) -- its
            value is consumed by submit.requiredOutcome below.
        note: >-
          Same time-is-required note as
          organizerGatheringCreate.candidateDateRow above: `startAt`'s
          `format: date-time` already requires a time value; this contract
          does not fix whether the form collects it via one merged input or
          a separate `-time-input`-suffixed element.
        submit:
          testId: gathering-add-candidate-date-submit
          purpose: gathering-add-candidate-date-submit
          requiredOutcome: >-
            Activating it calls addCandidateDate with the entered
            date-time (consumed from dateInput above). On success, exactly
            one new gathering-candidate-date appears in
            gathering-candidate-date-list (ordering per
            candidateDateList.orderingInvariant), the gathering's phase is
            unchanged, and gathering-add-candidate-date-form remains present
            for the next entry. On a DUPLICATE_CANDIDATE_DATE rejection
            (adr/0038), the form remains present with the entered value
            intact and no new gathering-candidate-date appears
            (TDR-GTH-24).
        cancel:
          testId: gathering-add-candidate-date-cancel
          purpose: gathering-add-candidate-date-cancel
          requiredOutcome: >-
            Activating it makes gathering-add-candidate-date-form absent
            and gathering-add-candidate-date-open reachable again, without
            calling addCandidateDate.
    tentativeSelectionAndPreview:
      description: >-
        The "simultaneous decision" flow (同時決め, human addition
        2026-08-30, adr/0035 decision 1 item 1). Tentatively selecting a
        candidate-date never calls confirmCandidateDate and never changes
        Gathering.phase; it only reveals a preview and toggles
        data-tentative-selected.
      trigger:
        testId: gathering-candidate-date
        purpose: gathering-candidate-date-tentative-select
        presenceRuleForPurpose: >-
          This purpose is only activatable while phase is SCHEDULING;
          once phase is SELECTING_SHOP or FINALIZED, the
          gathering-candidate-date element remains present (as a record,
          see candidateDate.requirement above) but no longer accepts this
          activation (Organizer.dc.html state② shows the confirmed-date
          panel with no tentative-select affordance -- stated explicitly
          here while closing the FINALIZED observation gap, adr/0042).
        requiredOutcome: >-
          While phase is SCHEDULING, exactly one gathering-candidate-date's
          data-tentative-selected becomes "true" (any previously "true"
          element becomes "false"); gathering-open-shop-preview becomes
          present, scoped to that same candidate date; Gathering.phase is
          unchanged; no request to confirmCandidateDate is made.
      preview:
        testId: gathering-open-shop-preview
        attributes:
          candidateDateId: data-candidate-date-id
          openShopCount: data-open-shop-count
        item:
          testId: gathering-open-shop-preview-item
          requiredFields:
            name: {testId: gathering-open-shop-preview-item-name}
          optionalFields:
            genre: {testId: gathering-open-shop-preview-item-genre}
            capacityTier: {testId: gathering-open-shop-preview-item-capacity-tier}
            nonSmokingStatus: {testId: gathering-open-shop-preview-item-non-smoking}
            dinnerBudgetTier: {testId: gathering-open-shop-preview-item-dinner-budget}
          note: >-
            Only `name` is required for TDR-GTH-08's "その日に開いている店の
            プレビューが近い順に示される" assertion (presence + DOM order
            equal to CandidateDateOpenShopPreview.previewShops' order); the
            remaining fields mirror OpenShopPreviewItem's schema for
            consistency but no TDR-GTH scenario currently asserts them, so
            they are optional in this contract (an implementation may omit
            them from the DOM without failing acceptance).
        orderingInvariant: >-
          DOM order of gathering-open-shop-preview-item children equals
          CandidateDateOpenShopPreview.previewShops' order (nearest-first,
          gathering-scheduling-api.yaml). data-open-shop-count equals
          openShopCount exactly and is not derived by counting the preview
          items in the DOM (previewShops is a capped subset; openShopCount
          is the authoritative total).
        forbiddenFields: >-
          gathering-open-shop-preview-item never carries a candidate
          location, coordinate, distance, candidateRef, or providerPageUrl
          -- OpenShopPreviewItem's schema has none of these, and this
          contract does not add any (mirrors
          unavailableControls.forbiddenTestIds above).
    shortlistSelection:
      description: >-
        The 5-shop shortlist picker (PickFive.dc.html 案A, human decisions
        P1/P2/P3, 2026-09-03, adr/0041/adr/0042). Renders inline within the
        same organizer dashboard -- no separate screen (P1). Reuses the
        same open-shop population previewOpenShopsForCandidateDate exposes
        for the confirmed candidate date (gathering-scheduling-api.yaml's
        2026-09-03 header comment) -- each item now carries a data-shop-id
        attribute projecting OpenShopPreviewItem.shopId, added this round
        (adr/0042) after the prior contract round left this correlation
        undefined. Supports TDR-GTH-26/27.
      requiredTestIds:
        list: gathering-open-shop-list
        submit: gathering-shortlist-submit
      presenceRule: >-
        Present whenever phase is SELECTING_SHOP and Gathering.
        votingStartedAt is null (first-time selection, PickFive.dc.html's
        default inline state -- always shown, no separate open action
        needed for this first occurrence). Once votingStartedAt is
        non-null, absent by default (replaced by shortlistedShopVotes
        below) and present again only after gathering-shortlist-open is
        activated (D7 replace). Absent while phase is SCHEDULING or
        FINALIZED.
      list:
        testId: gathering-open-shop-list
        attributes:
          openShopCount: data-open-shop-count
        orderingInvariant: >-
          DOM order of gathering-open-shop-list-item children equals
          CandidateDateOpenShopPreview.previewShops' order (nearest-first).
          No control in this list may claim the forbidden manual-ordering
          purpose.
        item:
          testId: gathering-open-shop-list-item
          cardinality: zero-or-more-elements-sharing-this-test-id
          attributes:
            shopId: data-shop-id
            shortlisted: data-shortlisted
          requirement: >-
            One element per CandidateDateOpenShopPreview.previewShops entry
            (the same capped subset previewOpenShopsForCandidateDate
            already returns -- this contract does not introduce pagination
            or a way to reach shops beyond this cap; when openShopCount
            exceeds the number of items rendered, the excess shops are not
            selectable through this surface in this slice -- PickFive.
            dc.html itself flags this as an unmeasured scale limitation,
            "母集団が多い日の見え方は描いていない", not resolved here).
            data-shop-id equals OpenShopPreviewItem.shopId. data-shortlisted
            is "true" for every item whose shopId is currently in
            Gathering.shortlistedShops (pre-checking the box when reopening
            via gathering-shortlist-open for a D7 replace, TDR-GTH-31/32),
            "false" otherwise; before the first setShortlistedShops call
            every item starts "false" (PickFive.dc.html's fresh state).
          select:
            testId: gathering-open-shop-select
            purpose: gathering-open-shop-select
            requiredOutcome: >-
              Activating it toggles this item's data-shortlisted between
              "true" and "false". This is client-side pending selection
              only -- it calls no public operation (mirrors
              candidate-search-browser-interface.yaml's
              changePendingFilter convention: toggle now, apply on
              submit). gathering-shortlist-submit's disabledState below
              reflects the current count of "true" items. This contract
              does not fix whether a 6th simultaneous "true" is refused
              outright or forces another item back to "false" -- PickFive.
              dc.html does not draw a 6-selected state, since its own
              submit affordance already disables past 5 selections being
              reachable in the drawn flow; either behavior keeps
              INVALID_SHOP_SELECTION unreachable through this control.
      submit:
        testId: gathering-shortlist-submit
        purpose: gathering-shortlist-submit
        disabledState: >-
          Carries the native disabled state whenever fewer than 1 item
          currently has data-shortlisted="true" (P2, 2026-09-03: the lower
          bound is 1, not enforced higher -- PickFive.dc.html: "1件からでも
          押せます").
        requiredOutcome: >-
          Activating it (while not disabled) calls setShortlistedShops with
          shopIds built from every gathering-open-shop-list-item whose
          data-shortlisted is "true". On success, gathering-open-shop-list
          becomes absent and shortlistedShopVotes.list (below) becomes
          present, reflecting the new shortlist (TDR-GTH-26).
          Gathering.phase is unchanged (Gathering.votingStartedAt becomes
          non-null on the first successful call -- see
          phaseIndicatorAttributes' note on why this is not a phase
          transition). On a D7 replace (this is not the first call), kept
          shops retain their gathering-shortlisted-shop-item's
          data-approval-count/data-responded-count; a newly added shop
          starts both at 0 (TDR-GTH-31/32).
    shortlistedShopVotes:
      description: >-
        The vote-tally view once voting has started (Organizer.dc.html
        state②, "お店の候補" panel). Replaces shortlistSelection's inline
        list by default once Gathering.votingStartedAt is non-null.
        Supports TDR-GTH-31/32/33.
      requiredTestIds:
        list: gathering-shortlisted-shop-list
        replaceOpen: gathering-shortlist-open
      presenceRule: >-
        Present whenever Gathering.votingStartedAt is non-null (regardless
        of phase -- list/item remain present, without finalizeSelect, once
        phase is FINALIZED; see finalizedSummary below).
      list:
        testId: gathering-shortlisted-shop-list
        orderingInvariant: >-
          DOM order of gathering-shortlisted-shop-item children equals
          Gathering.shortlistedShops' order (approvalCount descending,
          Organizer.dc.html: "並び: 行ってもいい人が多い順"). No control in
          this list may claim the forbidden manual-ordering purpose
          (already generalized to cover this list without a contract edit,
          ADR-0036 design judgment 3 / this file's forbiddenPurposesNote).
        item:
          testId: gathering-shortlisted-shop-item
          cardinality: zero-to-five-elements-sharing-this-test-id
          attributes:
            shopId: data-shop-id
            approvalCount: data-approval-count
            respondedCount: data-responded-count
          requirement: >-
            One element per Gathering.shortlistedShops entry.
            data-approval-count and data-responded-count mirror
            ShortlistedShop.approvalCount/respondedParticipantCount exactly
            (D7's per-shop denominator -- these two counts may differ
            between items, e.g. a newly replaced-in shop showing a smaller
            data-responded-count than the others, TDR-GTH-31/32). This
            contract does not require any other shop attribute (name,
            genre, etc.) to be machine-asserted here; it fixes only the
            counts an acceptance test needs.
          finalizeSelect:
            testId: gathering-finalize-shop-select
            purpose: gathering-finalize-shop-select
            attribute: data-finalize-selected
            presenceRule: >-
              Present while phase is SELECTING_SHOP; absent once phase is
              FINALIZED (Final.dc.html A③'s vote-record panel has no radio
              controls -- "会を進める操作はありません").
            requiredOutcome: >-
              Activating it makes this item's data-finalize-selected "true"
              and every other gathering-shortlisted-shop-item's
              data-finalize-selected "false" (at most one true at a time,
              Organizer.dc.html's radio group). Client-side pending
              selection only -- calls no public operation.
              gathering-finalize-submit's disabledState below reflects
              whether any item currently has
              data-finalize-selected="true".
      replaceOpen:
        testId: gathering-shortlist-open
        purpose: gathering-shortlist-open
        cardinality: >-
          one-or-more-elements-sharing-this-test-id -- Organizer.dc.html
          state② shows two differently-labeled buttons ("店を絞りなおす"
          and "5件を差し替える") in the same panel; this contract does not
          distinguish them and treats both as instances of the same entry
          point (architect design judgment, FR-028 -- Organizer.dc.html was
          confirmed unchanged/approved this round rather than
          re-specified, so this contract has no documented reason to give
          the two labels different behavior; flagged for human
          confirmation).
        presenceRule: Present only while phase is SELECTING_SHOP (absent once FINALIZED).
        requiredOutcome: >-
          Activating it reveals gathering-open-shop-list again
          (shortlistSelection above), with every item's data-shortlisted
          pre-populated from the current Gathering.shortlistedShops (D7
          replace, TDR-GTH-31/32).
      finalizeSubmit:
        testId: gathering-finalize-submit
        purpose: gathering-finalize-submit
        presenceRule: >-
          Present while phase is SELECTING_SHOP and
          Gathering.shortlistedShops is non-empty; absent once phase is
          FINALIZED.
        disabledState: >-
          Carries the native disabled state whenever no
          gathering-shortlisted-shop-item currently has
          data-finalize-selected="true".
        requiredOutcome: >-
          Activating it (while not disabled) calls finalizeGathering with
          the selected item's shopId. On success, phase becomes FINALIZED
          (TDR-GTH-33); gathering-finalize-submit, every finalizeSelect,
          gathering-shortlist-open, gathering-add-candidate-date-open,
          gathering-confirm-date-select, gathering-participant-link-copy,
          and every gathering-participant-link-item's revoke control all
          become absent (see finalizedSummary below).
    confirmDate:
      testId: gathering-confirm-date-select
      purpose: gathering-confirm-date-select
      description: >-
        The "この日にする" operation (product-brief.md §2, one of the two
        phase-advancing operations; amended 2026-09-03, P6/adr/0041, from
        an earlier draft that described three -- gathering-scheduling-
        api.yaml's confirmCandidateDate).
      presenceRule: >-
        Present only while phase is SCHEDULING; absent once phase is
        SELECTING_SHOP or FINALIZED (confirmCandidateDate has been rejected
        outside SCHEDULING since ADR-0035; this contract had not
        previously stated the control's own presence rule -- stated here
        while closing the FINALIZED observation gap, adr/0042;
        Organizer.dc.html state②'s footer replaces this button entirely
        with shortlistSelection.submit/shortlistedShopVotes.finalizeSubmit).
      disabledState: >-
        While present, carries the native disabled state whenever no
        gathering-candidate-date currently has data-tentative-selected="true"
        (mirrors candidate-search-browser-interface.yaml's
        deckNavigation.disabledState convention for a boundary condition
        rather than removing the control).
      requiredOutcome: >-
        Activating it while a candidate date is tentatively selected calls
        confirmCandidateDate with that date's id. On success,
        gathering-phase-indicator's data-gathering-phase becomes
        SELECTING_SHOP, the confirmed gathering-candidate-date's
        data-confirmed becomes "true", and every other
        gathering-candidate-date's data-confirmed remains "false".
        gathering-open-shop-preview and every gathering-candidate-date's
        data-tentative-selected are unaffected by this call itself (adr/0035
        decision 1 item 1: tentative selection is independent client state).
    participantLinkCopy:
      testId: gathering-participant-link-copy
      purpose: gathering-participant-link-copy
      designNote: >-
        Organizer.dc.html shows one "回答リンクをコピー" control, not a
        count input, while issueParticipantLinks accepts a batch `count`.
        This contract adopts the "1クリック=1本" operating model: each
        activation issues exactly one new link (count: 1), which the
        organizer copies and hands to one participant individually (e.g. via
        Slack or email, outside this product). Confirmed by human decision
        2026-08-30 (ADR-0036 decision 4, option A) -- this is not an
        unresolved gap between the screen and the API; the API's `count`
        parameter remains able to accept a larger value as schema headroom
        for a possible future bulk-issuance screen, but this slice's screen
        and this contract only ever call it with count: 1.
      presenceRule: >-
        Present while phase is SCHEDULING or SELECTING_SHOP; absent once
        phase is FINALIZED (P4, 2026-09-03, adr/0041/adr/0042: Final.dc.html
        A③'s header no longer shows this control at all, unlike
        recopy/revoke's finer-grained treatment below -- "もう発行しない
        （会が締まっている）"). Contrast with participantLinkList.item.recopy
        below, which remains present and enabled regardless of phase.
      requiredOutcome: >-
        Activating it calls issueParticipantLinks with count: 1.
        Gathering.totalIssuedParticipantLinks and activeParticipantLinkCount
        each increase by exactly 1. Because acceptance automation cannot
        reliably read the OS clipboard, the issued URL must also be exposed
        via a data-issued-link-url attribute on the same element immediately
        after activation, holding the exact IssuedParticipantLink.url value
        returned by that call. A new gathering-participant-link-item also
        appears in gathering-participant-link-list (see participantLinkList
        below), since issuing and listing share the same underlying data.
    participantLinkList:
      description: >-
        The link-management surface (ADR-0036 decision 7, human concern
        2026-08-30: "リンクがわからなくなったら管理されなくなっちゃうかもね").
        Supports TDR-GTH-16 through TDR-GTH-20, and TDR-GTH-36 (P4,
        recopy remains available post-FINALIZED).
      testId: gathering-participant-link-list
      orderingInvariant: >-
        DOM order of gathering-participant-link-item children equals
        listParticipantLinks' response order (issuedAt ascending, 発行順,
        gathering-scheduling-api.yaml). Revoked links remain present in this
        list (see item.attributes.revoked below) -- they are never removed
        from the DOM by this contract, only marked. No control in this list
        may claim the forbidden manual-ordering purpose (see
        unavailableControls above). This list itself remains present
        regardless of phase, including FINALIZED (Final.dc.html A③'s "発行
        済みリンク" panel is this same list, read-only except for recopy,
        adr/0042).
      item:
        testId: gathering-participant-link-item
        attributes:
          id: data-participant-link-id
          issuedAt: data-issued-at
          hasResponded: data-has-responded
          revoked: data-revoked
          named: data-participant-named
        requirement: >-
          One element per ParticipantLinkSummary. data-participant-link-id
          equals its `id` (the organizer-facing linkId, never the
          participant token -- ADR-0036 decision 7's ParticipantLinkId
          design). data-issued-at is an ISO-8601 string equal to `issuedAt`.
          data-has-responded and data-revoked are "true"/"false" strings
          equal to `hasResponded`/`revoked`. data-participant-named is
          "false" exactly when `displayName` is null, "true" otherwise (same
          vocabulary as nameControl.status below); this element does not
          require the name's exact text to be machine-asserted (TDR-GTH-16
          only requires "名無しを含む" distinguishability, not text
          equality), though an implementation may additionally show the
          name's visible text inside this item without contract obligation.
          Never carries a token or URL attribute (see this file's header
          comment and gathering-scheduling-api.yaml's ParticipantLinkSummary
          -- token/URL re-exposure is scoped to recopy alone).
        recopy:
          testId: gathering-participant-link-recopy
          purpose: gathering-participant-link-recopy
          disabledState: >-
            Carries the native disabled state whenever this item's
            data-revoked is "true" (a revoked link has nothing left to
            re-copy). Not gated by data-has-responded -- recopy is allowed
            for answered and unanswered links alike (ADR-0036 decision 7).
            **Not gated by phase either** (P4, 2026-09-03, adr/0041/adr/0042):
            this remains the only disabledState condition even once phase
            is FINALIZED -- recopy stays reachable so a lost link can still
            be used to see the decision (Final.dc.html A③'s "決定を見せ直す
            ためだけに残しています").
          requiredOutcome: >-
            Activating it (while not disabled) calls recopyParticipantLink
            for this item's linkId. Exposes the returned URL via a
            data-issued-link-url attribute on this same recopy element
            (same convention as participantLinkCopy above). Does not change
            data-has-responded, data-revoked, data-issued-at, or
            Gathering.totalIssuedParticipantLinks/activeParticipantLinkCount
            (TDR-GTH-17: "そのリンクの回答状況は変わらない"; TDR-GTH-36:
            this also holds once phase is FINALIZED). A participant
            re-visiting with the re-copied URL after FINALIZED reaches
            participantAnswer.finalizedView below.
        revoke:
          testId: gathering-participant-link-revoke
          purpose: gathering-participant-link-revoke
          presenceRule: >-
            Present while phase is SCHEDULING or SELECTING_SHOP; absent
            once phase is FINALIZED (P4, 2026-09-03, adr/0041/adr/0042:
            Final.dc.html A③ shows only a re-copy button per row, no
            revoke -- this is a stronger rule than the disabledState below,
            which merely disables revoke for individual answered/already-
            revoked items pre-FINALIZED; once FINALIZED, the control is
            removed for every item regardless of hasResponded).
          disabledState: >-
            While present, carries the native disabled state whenever this
            item's data-has-responded is "true" or data-revoked is already
            "true" (human decision 2026-08-30: revocation is limited to
            unanswered links -- TDR-GTH-20). This is the same "disable at
            the boundary, don't remove the control" convention as
            confirmDate.disabledState above.
          requiredOutcome: >-
            Activating it (while present and not disabled) calls
            revokeParticipantLink for this item's linkId. On success, this
            item's data-revoked becomes "true"; gathering-unanswered-
            summary's data-revoked-links, data-active-issued-links, and
            data-unanswered-count all refresh to reflect one fewer active
            link (TDR-GTH-18) without requiring a full page reload
            (renderModel). Rejected (PARTICIPANT_LINK_ALREADY_ANSWERED)
            calls -- which this contract's own disabledState above should
            make unreachable through this control, but which the API still
            enforces server-side -- leave data-revoked, data-has-responded,
            and every denominator attribute unchanged (TDR-GTH-20).
    finalizedSummary:
      description: >-
        The FINALIZED-phase view of the same organizer dashboard
        (Final.dc.html A③). Closes the "FINALIZED局面の観測面ギャップ"
        activeContext.md had recorded since the first slice (adr/0042).
      requiredTestIds:
        decisionBanner: gathering-decision-banner
      presenceRule: Present exactly when phase is FINALIZED.
      decisionBanner:
        testId: gathering-decision-banner
        attributes:
          confirmedCandidateDate: data-confirmed-candidate-date
          finalizedShopId: data-finalized-shop-id
        requirement: >-
          data-confirmed-candidate-date equals the startAt of the
          gathering-candidate-date whose data-confirmed is "true"
          (unchanged since SELECTING_SHOP). data-finalized-shop-id equals
          Gathering.finalizedShopId exactly.
      unchangedRecords: >-
        gathering-phase-indicator, gathering-responded-summary,
        gathering-unanswered-summary, gathering-candidate-date-list/
        gathering-candidate-date (schedule record), and
        gathering-shortlisted-shop-list/gathering-shortlisted-shop-item
        (vote record, minus finalizeSelect -- see shortlistedShopVotes
        above) all remain present once FINALIZED, continuing to reflect
        their same fields (Final.dc.html: "日程の記録"/"票の記録" panels
        are the same data, frozen as a record). This contract does not
        require these values to stop changing on the server side; it
        requires only that no organizer-facing control remains that could
        cause them to change (see the various presenceRule entries above
        this section removing every remaining operational control once
        FINALIZED).
      linkManagement: >-
        See participantLinkCopy.presenceRule and participantLinkList.item.
        recopy/revoke above for the read-only-except-recopy rule this
        section's "発行済みリンク" panel embodies (P4).
  participantAnswer:
    requiredTestIds:
      header: gathering-participant-header
      nameStatus: gathering-participant-name-status
      scheduleQuestion: gathering-schedule-question
    headerAttributes:
      testId: gathering-participant-header
      attribute: data-gathering-phase
      values: [SCHEDULING, SELECTING_SHOP, FINALIZED]
      requirement: >-
        Exact string match with ParticipantView.phase
        (gathering-scheduling-api.yaml), mirroring
        organizerDashboard.phaseIndicatorAttributes' same vocabulary and
        value set. Present unconditionally whenever a valid link is opened
        (see browserEntry.participantAnswer.validLinkOutcome). Lets
        TDR-GTH-11 ("開催日確定後も局面は「店を選び中」のまま変わらない") be
        asserted from the participant page alone, without also opening the
        organizer dashboard in the same acceptance run.
    nameControl:
      status:
        testId: gathering-participant-name-status
        attribute: data-participant-named
        values: ['true', 'false']
        requirement: >-
          "false" exactly when ParticipantView.displayName is null; "true"
          otherwise (D5, 2026-08-30). Present unconditionally on the
          participant screen, including once FINALIZED (the name itself
          does not disappear; only the open/submit controls below do).
      open:
        testId: gathering-participant-name-open
        purpose: gathering-participant-name-open
        presenceRule: >-
          Absent once ParticipantView.decision is non-null (Final.dc.html
          B-3: "名前を変える操作も置かない", adr/0042).
        requiredOutcome: >-
          Activating it reveals gathering-participant-name-input (text
          field) and gathering-participant-name-submit.
      input:
        testId: gathering-participant-name-input
        requirement: >-
          A text input whose value becomes setParticipantDisplayName's name
          parameter on submit. Absent until gathering-participant-name-open
          is activated (see open.requiredOutcome above).
        valueEntryControl: >-
          Added 2026-09-02 (ADR-0039) -- this test id existed in this
          contract's prose since 2026-08-30 (open.requiredOutcome
          mentioned it) but had no structured browserControlSurface entry
          of its own until now. Exempt from
          allGatheringScreenFormControlsMustDeclarePurpose per
          unavailableControls.operationalControlScope -- its value is
          consumed by submit.requiredOutcome below, its documented
          consuming operational control.
      submit:
        testId: gathering-participant-name-submit
        purpose: gathering-participant-name-submit
        presenceRule: >-
          Absent once ParticipantView.decision is non-null, matching open
          above (adr/0042).
        requiredOutcome: >-
          Submitting a non-empty name (consumed from
          gathering-participant-name-input) calls setParticipantDisplayName.
          data-participant-named becomes "true" and remains "true" for the
          rest of the session, including for schedule responses recorded
          before the name was attached (TDR-GTH-05) -- this contract does
          not require or forbid a way to remove a name once attached
          (product-brief.md §2/§5 describe only self-reporting and change,
          never removal).
    scheduleQuestion:
      testId: gathering-schedule-question
      presenceRule: >-
        Absent once ParticipantView.decision is non-null (adr/0042) --
        Final.dc.html B-3 does not repeat the per-candidate-date
        breakdown, only finalizedView.decision below. This resolves
        gathering-scheduling-api.yaml's own previously-open note ("left to
        that later contract, ADR-0013 order") in favor of full
        replacement, not coexistence.
      cardinality: >-
        This contract does not fix whether every CandidateDate renders
        simultaneously or progressively (a wizard-style one-at-a-time flow,
        as Answer.dc.html's "このあと聞かれること" section suggests, is
        permitted). It requires only that whichever candidate dates are
        currently reachable in the DOM each expose exactly one
        gathering-schedule-question with the attributes below, and that the
        gathering-participant-progress element (see below) always reflects
        the true total regardless of how many are currently rendered.
      attributes:
        candidateDateId: data-candidate-date-id
        openShopCount: data-open-shop-count
        yourResponse: data-your-response
      yourResponseValues: [GOING, MAYBE, NOT_GOING, UNANSWERED]
      requirement: >-
        data-open-shop-count equals ParticipantScheduleQuestion.openShopCount
        exactly and is present regardless of data-your-response's value (D6,
        2026-08-30: unconditional, unlike tally below). data-your-response is
        "UNANSWERED" exactly when
        ParticipantScheduleQuestion.yourResponse is null; otherwise it is the
        exact ScheduleResponseStatus string. No shop name or other shop
        attribute is present anywhere inside gathering-schedule-question (D6:
        count only, no shop names) -- this is a stronger prohibition than
        organizerDashboard's preview, which does show names.
      responseOptions:
        testId: gathering-schedule-response-option
        purpose: gathering-schedule-response-select
        attribute: data-response-value
        values: [GOING, MAYBE, NOT_GOING]
        cardinality: exactly-three-per-gathering-schedule-question
        requiredOutcome: >-
          Activating the option whose data-response-value is V calls
          setScheduleResponse with status: V for this
          gathering-schedule-question's candidate date. data-your-response
          updates to V. Re-activating a different option updates
          data-your-response again (TDR-GTH-06: always changeable).
      tally:
        testId: gathering-schedule-tally
        attributes:
          goingCount: data-going-count
          maybeCount: data-maybe-count
          notGoingCount: data-not-going-count
        presenceRule: >-
          Present within a given gathering-schedule-question exactly when
          that question's data-your-response is not "UNANSWERED"; absent
          otherwise (product-brief.md §2's "answer first, then see others"
          rule, applied per candidate date, TDR-GTH-12). Its three
          attributes mirror the organizer-facing
          gathering-candidate-date's goingCount/maybeCount/notGoingCount for
          the same candidate date exactly.
    shopVoteQuestion:
      description: >-
        The approval-voting surface (Vote.dc.html B-2, screen already
        approved/unchanged this round; contract observation new this
        round, adr/0042). Supports TDR-GTH-28/29/30.
      testId: gathering-shop-vote-question
      presenceRule: >-
        Present exactly when ParticipantView.shopVoteQuestions is non-null
        (i.e. once Gathering.votingStartedAt is non-null) and
        ParticipantView.decision is still null -- absent while phase is
        SCHEDULING, and absent again once decision is non-null (see
        finalizedView below, which replaces this entirely rather than
        coexisting with it).
      cardinality: >-
        One element per ParticipantShopVoteOption currently in
        ParticipantView.shopVoteQuestions (up to 5). This contract does not
        fix whether all are rendered simultaneously (mirrors
        scheduleQuestion's own cardinality note).
      attributes:
        shopId: data-shop-id
        yourApproval: data-your-approval
      yourApprovalValues: ['true', 'false', 'UNANSWERED']
      requirement: >-
        data-your-approval is "UNANSWERED" exactly when
        ParticipantShopVoteOption.yourApproval is null (D7's "まだ答えて
        いません", Vote.dc.html); otherwise "true"/"false" matching
        yourApproval exactly. No shop attribute beyond shopId is required
        to be machine-asserted here (name/genre/etc. mirror
        ParticipantShopVoteOption's schema but this contract does not fix
        their DOM representation, same convention as organizerDashboard's
        preview optionalFields).
      selectOption:
        testId: gathering-shop-vote-select
        purpose: gathering-shop-vote-select
        requiredOutcome: >-
          Activating it toggles this shop's inclusion in this
          participant's approved set and immediately calls setShopVotes
          with the complete updated approvedShopIds (every currently-
          checked gathering-shop-vote-question among those rendered) --
          not a pending/submit model (Vote.dc.html: "選ぶとその場で保存
          されます", no separate submit button, unlike the organizer's
          shortlistSelection above). data-your-approval updates to
          "true"/"false" immediately. Re-activating any option updates the
          sent set again (TDR-GTH-30: always changeable).
      tally:
        testId: gathering-shop-vote-tally
        attributes:
          approvalCount: data-approval-count
          respondedCount: data-responded-count
        presenceRule: >-
          Present within a given gathering-shop-vote-question exactly when
          that question's data-your-approval is not "UNANSWERED"
          (product-brief.md §2's "answer first, then see others" rule,
          applied per shop -- TDR-GTH-29; independent of
          scheduleQuestion.tally's own per-candidate-date gating). Once
          present, mirrors this same shop's organizer-facing
          ShortlistedShop.approvalCount/respondedParticipantCount exactly.
    progress:
      testId: gathering-participant-progress
      presenceRule: >-
        Absent once ParticipantView.decision is non-null (adr/0042) -- no
        more days to answer once the decision is shown (Final.dc.html B-3
        has no progress counter).
      attributes:
        totalCandidateDates: data-total-candidate-dates
        answeredCandidateDates: data-answered-candidate-dates
      requirement: >-
        data-total-candidate-dates equals the count of
        ParticipantView.scheduleQuestions; data-answered-candidate-dates
        equals the count among them whose yourResponse is non-null.
        Corresponds to Answer.dc.html's "日程 2 / 3" counter and progress
        bar; this contract fixes only the counts, not the visible wording or
        bar rendering.
    finalizedView:
      description: >-
        B-3 (Final.dc.html) -- the same signed-link URL, now showing the
        decision only (D1, 2026-08-30) plus this participant's own
        retrospective record (P5, 2026-09-03, adr/0041/adr/0042).
      requiredTestIds:
        decision: gathering-participant-decision
      presenceRule: Present exactly when ParticipantView.decision is non-null (phase FINALIZED).
      decision:
        testId: gathering-participant-decision
        attributes:
          confirmedCandidateDate: data-confirmed-candidate-date
          shopId: data-shop-id
          yourScheduleResponse: data-your-schedule-response
        yourScheduleResponseValues: [GOING, MAYBE, NOT_GOING, UNANSWERED]
        requirement: >-
          data-confirmed-candidate-date/data-shop-id mirror
          decision.confirmedCandidateDate/decision.shop.shopId exactly.
          data-your-schedule-response is "UNANSWERED" exactly when
          decision.yourScheduleResponse is null, otherwise the exact
          ScheduleResponseStatus string (Final.dc.html's "あなたの回答"
          line: "行ける").
        approvedShop:
          testId: gathering-participant-decision-approved-shop
          cardinality: zero-or-more-elements-sharing-this-test-id
          attributes:
            shopId: data-shop-id
          requirement: >-
            One element per decision.yourApprovedShops entry (Final.dc.html's
            "あなたが『行ってもいい』と選んだ店" list). Never carries
            another participant's shopId or any aggregate count --
            decision.yourApprovedShops is this participant's own data only
            (P5's explicit "他人の票は出さない" constraint, enforced at the
            schema level by gathering-scheduling-api.yaml adr/0041).
      replacesQuestionSurfaces: >-
        gathering-schedule-question, gathering-shop-vote-question, and
        gathering-participant-progress are all absent once
        ParticipantView.decision is non-null (see each element's own
        presenceRule above) -- Final.dc.html's B-3 does not repeat any
        per-candidate-date/per-shop breakdown, only the flat
        gathering-participant-decision summary.
      noOperations: >-
        No gathering-schedule-response-option, gathering-shop-vote-select,
        or gathering-participant-name-open/submit is present once
        ParticipantView.decision is non-null (Final.dc.html B-3: "この画面
        に操作はありません") -- setScheduleResponse and setShopVotes both
        reject with GATHERING_FINALIZED at the API layer regardless, but
        this contract additionally requires the controls themselves to be
        absent from the DOM, not merely disabled (mirrors
        organizerDashboard.finalizedSummary's stronger absence rule for
        revoke).
    linkError:
      testId: gathering-participant-link-error
      attribute: data-link-error-code
      values: [LINK_NOT_FOUND, LINK_EXPIRED, LINK_REVOKED, LINK_RATE_LIMITED]
      requirement: >-
        Present exactly when the participant-facing API call underlying this
        page load returned the correspondingly named ProblemResponse.code
        (gathering-scheduling-api.yaml). `LINK_REVOKED` (added 2026-08-30,
        ADR-0036 decision 7) is present exactly when the organizer has
        revoked this token via revokeParticipantLink -- TDR-GTH-19. Its
        visible text must not disclose the gathering's title, any
        participant's name or response, or any other gathering content
        (mirrors authentication-browser-interface.yaml's disclosure
        discipline for its own failure surfaces). Unlike authentication's
        account-enumeration protection, this contract does not require
        LINK_NOT_FOUND/LINK_EXPIRED/LINK_REVOKED to be indistinguishable from
        each other -- possessing a link already implies the holder was
        invited, so which of these three failure reasons applies is not
        equivalent to leaking whether an unrelated account exists.

browserActions:
  openGatheringFromList:
    inputs: [gathering-list-item-open]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringList.list.item.open.requiredOutcome
  openGatheringCreate:
    inputs: [gathering-create-open]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringList.createOpen.requiredOutcome
  createGathering:
    inputs: [gathering-create-name-input, gathering-create-candidate-date-row,
             gathering-create-candidate-date-input, gathering-create-submit]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringCreate.submit.requiredOutcome
  cancelGatheringCreate:
    inputs: [gathering-create-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringCreate.cancel.requiredOutcome
  addCandidateDateInline:
    inputs: [gathering-add-candidate-date-open, gathering-add-candidate-date-input,
             gathering-add-candidate-date-submit]
    success:
      present: [gathering-candidate-date]
      unaffected: [gathering-phase-indicator]
      requiredOutcome: browserControlSurface.organizerDashboard.candidateDateList.addCandidateDateForm.submit.requiredOutcome
  cancelAddCandidateDateInline:
    inputs: [gathering-add-candidate-date-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.candidateDateList.addCandidateDateForm.cancel.requiredOutcome
  copyParticipantLink:
    inputs: [gathering-participant-link-copy]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.participantLinkCopy.requiredOutcome
  recopyParticipantLink:
    inputs: [gathering-participant-link-recopy]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.participantLinkList.item.recopy.requiredOutcome
  revokeParticipantLink:
    inputs: [gathering-participant-link-revoke]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.participantLinkList.item.revoke.requiredOutcome
  tentativelySelectCandidateDate:
    inputs: [gathering-candidate-date]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.tentativeSelectionAndPreview.trigger.requiredOutcome
  confirmDate:
    inputs: [gathering-confirm-date-select]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.confirmDate.requiredOutcome
  toggleShortlistCandidate:
    inputs: [gathering-open-shop-select]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistSelection.list.item.select.requiredOutcome
  submitShortlist:
    inputs: [gathering-open-shop-select, gathering-shortlist-submit]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistSelection.submit.requiredOutcome
  openShortlistReplace:
    inputs: [gathering-shortlist-open]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.replaceOpen.requiredOutcome
  selectFinalizeShop:
    inputs: [gathering-finalize-shop-select]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.list.item.finalizeSelect.requiredOutcome
  finalizeGathering:
    inputs: [gathering-finalize-shop-select, gathering-finalize-submit]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.finalizeSubmit.requiredOutcome
  answerScheduleQuestion:
    inputs: [gathering-schedule-response-option]
    success:
      requiredOutcome: browserControlSurface.participantAnswer.scheduleQuestion.responseOptions.requiredOutcome
  answerShopVote:
    inputs: [gathering-shop-vote-select]
    success:
      requiredOutcome: browserControlSurface.participantAnswer.shopVoteQuestion.selectOption.requiredOutcome
  attachDisplayName:
    inputs: [gathering-participant-name-open, gathering-participant-name-input,
             gathering-participant-name-submit]
    success:
      requiredOutcome: browserControlSurface.participantAnswer.nameControl.submit.requiredOutcome
  rateLimitedScheduleResponse:
    inputs: [gathering-schedule-response-option]
    rateLimited:
      present: [gathering-participant-link-error]
      attribute: {name: data-link-error-code, value: LINK_RATE_LIMITED}
      priorAnswersRetained: >-
        Every previously recorded data-your-response and
        gathering-schedule-tally value present before the rate-limited
        request is unchanged after it (mirrors
        candidate-search-browser-interface.yaml's priorDisplayRetained
        convention, adr/0023-era human decision applied to this scope: a
        throttled request must never erase already-recorded state).

disclosureObservations:
  bodyMustNotContain:
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.privateSearchOrigin
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.providerInternals
  bodyMustNotExposeTestIds:
    [private-search-origin, candidate-origin-marker, candidate-map-marker]
  participantTokenHandling:
    requirement: >-
      The participant-link token (the `token` path segment) must never be
      written to localStorage, a cookie, or any storage surviving page
      navigation other than the current URL itself. This keeps the token a
      per-visit bearer credential rather than letting client-side code turn
      it into a durable, device-bound participant identity -- consistent
      with product-brief.md §5's "no participant accounts" decision and
      distinct from organizerSession's own cookie, which this requirement
      does not affect. Extends to gathering-participant-link-list (ADR-0036
      decision 7): that list's items never carry a token/URL attribute at
      all (see gathering-scheduling-api.yaml's ParticipantLinkSummary), and
      only recopyParticipantLink's own transient
      data-issued-link-url response attribute, not the list, carries one --
      unaffected by finalization (P4).
  apiSchemaValidation:
    file: contracts/gathering-scheduling-api.yaml
    schemaRef: '#/components/schemas/ProblemResponse'
    appliesTo: [gathering-participant-link-error, gathering-unanswered-summary error paths]

securityObservations:
  organizerGatheringList:
    stateChangingOperations: []
    csrf: not-applicable
    note: >-
      listGatherings is a read-only GET; this screen's only state-changing
      surface is navigation (openGatheringFromList/openGatheringCreate),
      neither of which calls a state-changing operation itself.
  organizerGatheringCreate:
    stateChangingOperations: [createGathering]
    csrf: required
    csrfMechanism: >-
      Reuses gathering-scheduling-api.yaml's CsrfToken parameter and
      organizerSession's same-origin Django session cookie, identical to
      organizerDashboard below.
  organizerDashboard:
    stateChangingOperations:
      [addCandidateDate, issueParticipantLinks, confirmCandidateDate,
       recopyParticipantLink, revokeParticipantLink, setShortlistedShops,
       finalizeGathering]
    csrf: required
    csrfMechanism: >-
      Reuses gathering-scheduling-api.yaml's CsrfToken parameter and
      organizerSession's same-origin Django session cookie, identical to
      candidate-search-browser-interface.yaml's securityObservations.
      recopyParticipantLink is included even though it does not mutate
      persisted state, because it returns a participant-access credential
      -- CSRF protection here also prevents a cross-site page from
      exfiltrating that credential through a forged authenticated request
      (ADR-0036 decision 7). setShortlistedShops/finalizeGathering are
      added 2026-09-04 (adr/0042) with no new CSRF design judgment beyond
      reusing this same mechanism.
  participantAnswer:
    stateChangingOperations: [setScheduleResponse, setParticipantDisplayName, setShopVotes]
    csrf: not-required
    csrfRationale: >-
      CSRF protects against a browser's *ambient* credential (a cookie) being
      ridden by a cross-site request the victim did not intend. The
      participant surface carries no ambient credential -- the token itself,
      supplied explicitly in the URL, is the credential, and forging a
      state-changing request requires already knowing that token. An
      attacker who knows the token already has the same access a legitimate
      link-holder has; CSRF's threat model (attacker exploits a credential it
      does not know) does not apply here. This is a security design judgment
      made by architect (ADR-0036 design judgment 5) and is available for
      human review; product-brief.md §5 does not itself decide this.
      setShopVotes (added 2026-09-04, adr/0042) is covered by the same
      rationale -- no new judgment was needed.
    rateLimit:
      requiredOutcome: rejected-429-with-linkError
      thresholdFixedInContract: false
      note: >-
        Same convention as candidate-search-api.yaml's ProposalRateLimited
        and authentication.feature's TDR-AUTH-07: this contract requires the
        429/Retry-After/gathering-participant-link-error behavior to exist
        but does not fix the numeric threshold (adr/0035 decision 4 records
        an implementation-guidance value, not a contract Must).
