  cancelFinalizeGathering:
    inputs: [gathering-finalize-shop-select, gathering-finalize-open, gathering-finalize-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.finalizeCancel.requiredOutcome
  openDeleteGathering:
    inputs: [gathering-delete-open]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.open.requiredOutcome
  deleteGathering:
    inputs: [gathering-delete-open, gathering-delete-confirm]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.confirm.requiredOutcome
  cancelDeleteGathering:
    inputs: [gathering-delete-open, gathering-delete-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.cancel.requiredOutcome
  answerScheduleQuestion:
