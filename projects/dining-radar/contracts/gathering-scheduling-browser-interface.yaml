#   人間裁定に依存しない「参加者の並び順」1点に限定した——三段階の投票・地図と店の情報の観測面は
#   designerがまだ描いていない画面に依存するため、今回は起草しない、ADR-0013の順序どおり):
# - **`participantAnswer.shopVoteQuestion`へ`orderingInvariant`を新設した**（唯一の実質的な追加）。
