  openShopSelectionEntry:
    inputs: [gathering-shortlist-open]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shopSelectionEntry.open.requiredOutcome
  selectFinalizeShop:
    inputs: [gathering-finalize-shop-select]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.list.item.finalizeSelect.requiredOutcome
  openFinalizeGathering:
    inputs: [gathering-finalize-shop-select, gathering-finalize-open]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.finalizeOpen.requiredOutcome
  finalizeGathering:
    inputs: [gathering-finalize-shop-select, gathering-finalize-open, gathering-finalize-confirm]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.finalizeConfirm.requiredOutcome
  cancelFinalizeGathering:
    inputs: [gathering-finalize-shop-select, gathering-finalize-open, gathering-finalize-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.shortlistedShopVotes.finalizeCancel.requiredOutcome
  openDeleteGathering:
    inputs: [gathering-delete-open]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.open.requiredOutcome
  deleteGathering:
    inputs: [gathering-delete-open, gathering-delete-confirm]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.confirm.requiredOutcome
  cancelDeleteGathering:
    inputs: [gathering-delete-open, gathering-delete-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerDashboard.deleteGathering.cancel.requiredOutcome
  answerScheduleQuestion:
    inputs: [gathering-schedule-response-option]
    success:
      requiredOutcome: browserControlSurface.participantAnswer.scheduleQuestion.responseOptions.requiredOutcome
  answerShopVote:
    inputs: [gathering-shop-vote-option]
    success:
      requiredOutcome: browserControlSurface.participantAnswer.shopVoteQuestion.voteOptions.requiredOutcome
  attachDisplayName:
