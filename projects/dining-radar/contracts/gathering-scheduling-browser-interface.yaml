  rateLimitedScheduleResponse:
    inputs: [gathering-schedule-response-option]
    rateLimited:
      present: [gathering-participant-link-error]
      attribute: {name: data-link-error-code, value: LINK_RATE_LIMITED}
      priorAnswersRetained: >-
        Every previously recorded data-your-response and
        gathering-schedule-tally value present before the rate-limited
        request is unchanged after it (mirrors
        candidate-search-browser-interface.yaml's priorDisplayRetained
        convention, adr/0023-era human decision applied to this scope: a
        throttled request must never erase already-recorded state).

disclosureObservations:
  bodyMustNotContain:
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.privateSearchOrigin
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.providerInternals
  bodyMustNotExposeTestIds:
    [private-search-origin, candidate-origin-marker, candidate-map-marker]
  participantTokenHandling:
    requirement: >-
      The participant-link token (the `token` path segment) must never be
      written to localStorage, a cookie, or any storage surviving page
      navigation other than the current URL itself. This keeps the token a
      per-visit bearer credential rather than letting client-side code turn
      it into a durable, device-bound participant identity -- consistent
      with product-brief.md §5's "no participant accounts" decision and
      distinct from organizerSession's own cookie, which this requirement
      does not affect. Extends to gathering-participant-link-list (ADR-0036
      decision 7): that list's items never carry a token/URL attribute at
      all (see gathering-scheduling-api.yaml's ParticipantLinkSummary), and
      only recopyParticipantLink's own transient
      data-issued-link-url response attribute, not the list, carries one --
      unaffected by finalization (P4).
  apiSchemaValidation:
    file: contracts/gathering-scheduling-api.yaml
    schemaRef: '#/components/schemas/ProblemResponse'
    appliesTo: [gathering-participant-link-error, gathering-unanswered-summary error paths]

securityObservations:
  organizerGatheringList:
    stateChangingOperations: []
    csrf: not-applicable
    note: >-
      listGatherings is a read-only GET; this screen's only state-changing
      surface is navigation (openGatheringFromList/openGatheringCreate),
      neither of which calls a state-changing operation itself.
  organizerGatheringCreate:
    stateChangingOperations: [createGathering]
    csrf: required
    csrfMechanism: >-
      Reuses gathering-scheduling-api.yaml's CsrfToken parameter and
      organizerSession's same-origin Django session cookie, identical to
      organizerDashboard below.
  organizerDashboard:
    stateChangingOperations:
      [addCandidateDates, removeCandidateDate, issueParticipantLinks,
       confirmCandidateDate, recopyParticipantLink, revokeParticipantLink,
       finalizeGathering, deleteGathering]
    csrf: required
    csrfMechanism: >-
      Reuses gathering-scheduling-api.yaml's CsrfToken parameter and
      organizerSession's same-origin Django session cookie, identical to
      candidate-search-browser-interface.yaml's securityObservations.
      recopyParticipantLink is included even though it does not mutate
      persisted state, because it returns a participant-access credential
      -- CSRF protection here also prevents a cross-site page from
      exfiltrating that credential through a forged authenticated request
      (ADR-0036 decision 7). finalizeGathering was added 2026-09-04
      (adr/0042) with no new CSRF design judgment beyond reusing this same
      mechanism. **Changed 2026-09-09**: addCandidateDate is renamed
      addCandidateDates (adr/0049 decision 3, same mechanism, batch shape
      only); setShortlistedShops is removed from this list -- that
      operation is now called from candidate-search-browser-interface.
      yaml's gatheringMode screen instead of from this dashboard (adr/0049
      decision 1), and that file's own security handling governs it; and
      deleteGathering is added (adr/0050 decision 4), reusing this same
      CSRF mechanism with no new design judgment.
  participantAnswer:
    stateChangingOperations: [setScheduleResponse, setParticipantDisplayName, setShopVotes]
    csrf: not-required
    csrfRationale: >-
      CSRF protects against a browser's *ambient* credential (a cookie) being
      ridden by a cross-site request the victim did not intend. The
      participant surface carries no ambient credential -- the token itself,
      supplied explicitly in the URL, is the credential, and forging a
      state-changing request requires already knowing that token. An
      attacker who knows the token already has the same access a legitimate
      link-holder has; CSRF's threat model (attacker exploits a credential it
      does not know) does not apply here. This is a security design judgment
      made by architect (ADR-0036 design judgment 5) and is available for
      human review; product-brief.md §5 does not itself decide this.
      setShopVotes (added 2026-09-04, adr/0042; request shape changed to the
      three-tier `votes` array 2026-09-04, adr/0044, same operationId) is
      covered by the same rationale -- no new judgment was needed either
      time. answerLater/peekResults (2026-09-09, adr/0050 decision 1) call
      no public operation at all, so this rationale does not need to be
      extended for them.
    rateLimit:
      requiredOutcome: rejected-429-with-linkError
      thresholdFixedInContract: false
      note: >-
        Same convention as candidate-search-api.yaml's ProposalRateLimited
        and authentication.feature's TDR-AUTH-07: this contract requires the
        429/Retry-After/gathering-participant-link-error behavior to exist
        but does not fix the numeric threshold (adr/0035 decision 4 records
        an implementation-guidance value, not a contract Must).
