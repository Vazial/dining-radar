openapi_note: >-
  This file is not an OpenAPI document; it is test infrastructure. The
  `contractVersion`/`kind` header below follows the same convention as
  candidate-search-browser-interface.yaml and authentication-browser-interface.yaml.
contractVersion: '0.24.1'
kind: acceptance-browser-interface
scope: gathering-scheduling
renderModel: >-
  browserControlSurface.organizerDashboard, organizerGatheringList,
  organizerGatheringCreate, and participantAnswer are all verified by a
  JS-capable browser automation DSL, the same execution model
  candidate-search-browser-interface.yaml uses for TDR-CS (ADR-0009 decision
  4), not authentication-browser-interface.yaml's plain-HTTP DSL for
  TDR-AUTH. Every requiredOutcome in this contract (tentative selection
  revealing a preview, a schedule response revealing its tally, a display
  name attaching, a link list refreshing after recopy/revoke, an inline
  add-date form staying open after a successful submit, a calendar day cell
  toggling pending selection without a network call, a shop-vote option
  immediately calling setShopVotes, a shortlisted-shop list's counts
  refreshing after finalizeGathering, a delete confirmation dialog opening
  before deleteGathering is called) describes a
  client-side DOM change that a plain-HTTP, server-response-only DSL cannot
  observe -- none of this contract's interactions are specified as requiring
  a full page navigation except where explicitly noted (e.g. opening a
  gathering from the list, or leaving the creation screen after submit, or
  navigating to candidate-search-browser-interface.yaml's gatheringMode for
  shop selection, adr/0049 decision 1). A
  control this contract requires present must exist in the DOM once the
  relevant JS-executing render completes; unlike authentication-browser-
  interface.yaml's renderModel, this contract does not additionally require
  presence in the raw server-rendered HTML response, because no TDR-GTH
  scenario depends on a non-JS client (this stated explicitly per the FR-004
  lesson: a browser-interface contract must declare its execution-model
  assumption at authoring time, not leave it for tester to discover at L4).
profiles:
  localAcceptance:
    transport: HTTP
    publicDeployment: false
    verifiesScenarios:
      [TDR-GTH-01, TDR-GTH-02, TDR-GTH-03, TDR-GTH-04, TDR-GTH-05, TDR-GTH-06,
       TDR-GTH-07, TDR-GTH-08, TDR-GTH-09, TDR-GTH-10, TDR-GTH-11,
       TDR-GTH-12, TDR-GTH-14, TDR-GTH-15, TDR-GTH-16, TDR-GTH-17,
       TDR-GTH-18, TDR-GTH-19, TDR-GTH-20, TDR-GTH-21, TDR-GTH-22,
       TDR-GTH-23, TDR-GTH-24, TDR-GTH-25, TDR-GTH-26, TDR-GTH-27,
       TDR-GTH-28, TDR-GTH-29, TDR-GTH-30, TDR-GTH-31, TDR-GTH-32,
       TDR-GTH-33, TDR-GTH-34, TDR-GTH-35, TDR-GTH-36, TDR-GTH-37,
       TDR-GTH-38, TDR-GTH-39, TDR-GTH-40, TDR-GTH-41, TDR-GTH-42,
       TDR-GTH-43, TDR-GTH-44, TDR-GTH-45, TDR-GTH-46, TDR-GTH-47,
       TDR-GTH-48, TDR-GTH-49, TDR-GTH-50, TDR-GTH-51, TDR-GTH-52,
       TDR-GTH-53, TDR-GTH-54, TDR-GTH-55, TDR-GTH-56, TDR-GTH-57,
       TDR-GTH-58, TDR-GTH-59, TDR-GTH-60, TDR-GTH-61, TDR-GTH-62,
       TDR-GTH-63, TDR-GTH-64, TDR-GTH-65, TDR-GTH-66]
    verifiesScenariosNoteAdr0062: >-
      TDR-GTH-57 through TDR-GTH-64 were added to gathering-scheduling.
      feature by ADR-0060/ADR-0061 but never registered in this array --
      the same class of registration miss ADR-0061 decision 6 found and
      closed for allowedPurposes, found here independently while drafting
      ADR-0062 (architect technical judgment, no new human decision,
      meta/adr/0064's convention). TDR-GTH-65/66 are this round's own new
      scenarios (ADR-0062 decision 4).
    notVerifiedHere:
      - scenario: TDR-GTH-13
        reason: >-
          "Guessing another participant's token" is a security property
          best exercised by direct API-level fuzzing (constructing an
          unissued token value and calling the public API), not by a
          browser click-through. This contract's disclosureObservations
          section still governs what the error surface may and may not
          reveal when a browser does reach an invalid link.
    invariant:
      - The profile is isolated and must never be selected by a public deployment.
      - Gathering, candidate-date, and participant-link state is supplied only through a future test-support-api.yaml extension for TDR-GTH (adr/0035 未決事項, not yet drafted); this contract does not itself define that extension.
      - Browser actions use only the public organizerSession and signed-participant-link boundaries defined by gathering-scheduling-api.yaml.
      - No real provider, configured search origin, credential, or provider response is used.
    syntheticDisclosureCanaries:
      privateSearchOrigin: synthetic-private-origin-never-disclose.invalid
      providerInternals: synthetic-provider-internals-never-disclose
      description: >-
        Reuses the exact canary values candidate-search-browser-interface.yaml
        and authentication-browser-interface.yaml already define, so a single
        shared set of forbidden strings applies across every TDR-* browser
        contract.

browserEntry:
  organizerGatheringList:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/gatherings/'
    note: >-
      The organizer's entry point (Entry.dc.html E-1/E-1b, adr/0038) --
      reachable immediately after sign-in. This contract does not fix
      whether this is also the same URL sign-in redirects to; it fixes only
      that it is reachable under the same base URL and same-origin session
      as every other organizer surface.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome, same as browserEntry.organizerDashboard below.
  organizerGatheringCreate:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    note: >-
      Reachable by activating gathering-create-open from
      organizerGatheringList (Entry.dc.html E-2, adr/0038). This contract
      does not fix its literal route.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome, same as browserEntry.organizerDashboard below.
  organizerDashboard:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/gatherings/{gatheringId}/'
    note: >-
      `{gatheringId}` comes from the response of a prior createGathering call
      or an equivalent test-support seam (adr/0035 未決事項5); this contract
      does not fix the literal route, only that it is reachable under the
      same base URL and same-origin session used by
      candidate-search-browser-interface.yaml and
      authentication-browser-interface.yaml. Also reachable by activating
      gathering-list-item-open from organizerGatheringList (adr/0038). The
      same URL and same screen renders across all three phases
      (Organizer.dc.html's own framing: "同じ1画面が3つの顔を持つ") -- see
      shopSelectionEntry/shortlistedShopVotes/finalizedSummary below for
      the phase-dependent parts of that one screen.
    unauthenticatedOutcome: >-
      Delegates to authentication-browser-interface.yaml's existing
      unauthenticatedOutcome (present: auth-sign-in-form; absent:
      authenticated-application-shell) -- this contract adds no new
      unauthenticated-visitor behavior. Every requiredTestIds entry below is
      additionally absent for an unauthenticated visitor.
  participantAnswer:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/participant-links/{token}/'
    note: >-
      `{token}` is a signed participant-link token from a prior
      issueParticipantLinks call or an equivalent test-support seam. This
      route requires no organizerSession cookie and no sign-in -- the token
      itself is the sole credential (gathering-scheduling-api.yaml's
      ParticipantToken parameter). Opening this URL never requires or
      accepts an authenticated organizer session; if a signed-in organizer's
      browser opens it, this contract makes no special-case requirement --
      the token still governs access on its own.
    validLinkOutcome:
      present: [gathering-participant-header]
      absent: [gathering-participant-link-error]
      conditionalPresence: >-
        Fixed 2026-09-04 (adr/0043, resolving a self-contradiction developer
        found during implementation, FR-028). This entry originally also
        listed gathering-schedule-question as unconditionally present (the
        2026-08-30 draft, written before decision/finalizedView existed);
        once scheduleQuestion.presenceRule was added (2026-09-04, adr/0042)
        to make it absent whenever ParticipantView.decision is non-null, the
        two entries contradicted each other for any finalized gathering.
        This entry is now narrowed to only what holds unconditionally for
        any valid link: the header is present and the error surface is
        absent. Which decision/phase-dependent surface is present instead
        (gathering-schedule-question while decision is null,
        gathering-participant-decision once decision is non-null,
        gathering-shop-vote-question once voting has started and decision
        is still null) is governed entirely by each element's own
        presenceRule elsewhere in this contract (scheduleQuestion.
        presenceRule, shopVoteQuestion.presenceRule, finalizedView.
        presenceRule) -- deliberately not restated here a second time, so
        that a future change to one of those conditions cannot silently
        re-introduce the same drift by leaving a stale copy in this entry.
        developer's implementation (treating the newer, more specific
        presenceRule as authoritative -- no schedule question once
        finalized) is confirmed correct by this fix and by Final.dc.html
        B-3 itself, which does not repeat the per-candidate-date breakdown
        once the decision is shown.
    invalidLinkOutcome:
      present: [gathering-participant-link-error]
      absent: [gathering-participant-header, gathering-schedule-question,
                gathering-participant-name-open]
    unexpectedLoadFailureOutcome:
      present: [gathering-participant-load-error]
      absent: [gathering-participant-header, gathering-schedule-question,
                gathering-participant-name-open, gathering-participant-link-error,
                gathering-shop-vote-question, gathering-participant-decision]
      requirement: >-
        Added 2026-09-06 (adr/0047, TDR-GTH-42; human chat decision;
        developer-found gap: this screen's JavaScript had no error handling
        at all, so an unrecognized response left the page blank -- no
        question, no error surface, no explanation). This is a **distinct**
        condition from invalidLinkOutcome above: invalidLinkOutcome covers a
        *meaningful* rejection the participant-facing API explicitly
        returned (one of linkError's four recognized ProblemResponse
        codes); this entry covers every other case -- a network failure
        that never reaches the server, a response the client cannot parse,
        or a server-side failure that carries none of those four codes.
        validLinkOutcome and invalidLinkOutcome above and this entry are
        mutually exclusive and, together with each element's own
        presenceRule elsewhere in this contract, exhaustive: opening a
        participant link always yields exactly one of the three. See
        browserControlSurface.participantAnswer.loadFailure below for what
        gathering-participant-load-error itself requires.

unavailableControls:
  allGatheringScreenFormControlsMustDeclarePurpose: true
  purposeAttribute: data-gathering-control-purpose
  forbiddenFormControlCategories:
    [select, input, textarea, checkbox, radio, range, combobox, listbox,
     slider, spinbutton, button]
  forbiddenFormControlCategoriesNote: >-
    Added 2026-09-02 (ADR-0039) -- this contract had required purpose
    declaration since drafting but had never explicitly enumerated which
    element categories the requirement scans, unlike
    candidate-search-browser-interface.yaml. This is the same enumeration
    that file uses, matching the shared tester DSL's FORM_CONTROL_SELECTOR
    (activeContext.md's 2026-08-25 record). See operationalControlScope
    below for the boundary this enumeration is now read against. Note that
    this enumeration, like candidate-search-browser-interface.yaml's own
    forbiddenFormControlCategories, does not include a plain anchor
    (`<a>`) -- see formControlExemptTestIds below for the elements this
    round adds that rely on that fact.
  operationalControlScope: >-
    Added 2026-09-02 (ADR-0039, FR-028 gap developer confirmed while
    implementing organizerGatheringCreate and
    candidateDateList.addCandidateDateForm). The purpose-declaration
    requirement above applies to *operational* controls -- an element whose
    own activation is itself a requiredOutcome trigger somewhere in this
    contract. Every entry in allowedPurposes below names exactly one such
    control (open/submit/cancel/select/toggle/recopy/revoke-style
    activations -- this now also includes checkbox/radio controls whose
    activation only changes client-side pending state without an
    immediate public operation call, e.g. the calendar day-cell select
    purpose below, 2026-09-09, adr/0049: pending-vs-immediate is not the
    distinction this clause draws; "does this contract's own
    requiredOutcome fire on activation" is). It does not apply to
    *value-entry* controls -- a native `input` (of type
    text/date/time/datetime-local/number) or `textarea` whose own
    activation (typing into it) is not itself a requiredOutcome trigger; it
    only holds a value that a separately-declared operational control
    (typically a `submit`) consumes when that control is activated. This
    distinction is not a blanket exemption for "any input someone decides
    not to label": a value-entry control is exempt from declaring a
    data-gathering-control-purpose value **only if** both of the following
    hold, so that every value-entry control remains individually traceable
    to exactly one declared operation --
      1. its test id appears in valueEntryControlTestIds below, and
      2. browserControlSurface documents, by test id, which operational
         control's requiredOutcome names this field as a value it consumes
         (e.g. organizerGatheringCreate.nameInput is consumed by
         organizerGatheringCreate.submit.requiredOutcome;
         participantAnswer.nameControl.input is consumed by
         nameControl.submit.requiredOutcome).
    A native input/textarea meeting forbiddenFormControlCategories above
    that is *not* listed in valueEntryControlTestIds, or whose consuming
    operational control this contract does not document, remains subject to
    the general requirement and must declare a purpose from allowedPurposes
    like any other control -- this is what keeps an unaccounted, silently
    added input from escaping the audit this requirement exists for (ADR-0013
    origin: "全フォームコントロールのpurposeをallowedPurposesと突き合わせる").
    This clause does not exempt select/checkbox/radio/combobox/listbox/
    range/slider/spinbutton/button elements, or any interactive ARIA role --
    those represent a bounded choice-from-known-options or an operation in
    their own right and continue to require a declared purpose exactly as
    before (e.g. every existing allowedPurposes entry that is a *-select or
    *-toggle purpose remains unaffected by this clause; this is why every
    checkbox/radio this contract defines -- gathering-add-candidate-date-day
    (2026-09-09, adr/0049), gathering-create-candidate-date-day (2026-09-09,
    adr/0051, replacing the retired gathering-create-candidate-date-row/
    addRow/removeRow), gathering-finalize-shop-select,
    gathering-shop-vote-option -- has its own allowedPurposes entry below
    rather than being treated as a value-entry control).
  valueEntryControlTestIds:
    [gathering-create-name-input, gathering-participant-name-input]
  valueEntryControlTestIdsNote: >-
    Two value-entry controls are exempt under operationalControlScope
    above, each traceable to exactly one consuming operational control's
    requiredOutcome: gathering-create-name-input
    (organizerGatheringCreate.submit) and gathering-participant-name-input
    (participantAnswer.nameControl.submit). **gathering-add-candidate-date-
    input is retired 2026-09-09 (adr/0049 decision 3)** along with the
    single-date addCandidateDateForm it belonged to -- the replacement
    calendar's day cells (gathering-add-candidate-date-day) are operational
    controls, not value-entry controls (each activation toggles pending
    selection state, the same "pending-vs-immediate is not the distinction
    this clause draws" precedent gathering-open-shop-select already
    established before its own 2026-09-09 retirement), so they declare the
    new gathering-add-candidate-date-day-select purpose instead of
    appearing in this list. **gathering-create-candidate-date-input is
    retired the same day, by a second, later round of chat decisions
    (adr/0051)**, for the identical reason -- organizerGatheringCreate's own
    replacement calendar day cells (gathering-create-candidate-date-day)
    declare gathering-create-candidate-date-day-select instead.
    gathering-participant-name-input existed since this contract's original
    2026-08-30 draft but had no structured browserControlSurface entry of
    its own (only prose mentioning it) -- ADR-0039 brought it under the
    same discipline retroactively rather than leaving it "not yet caught by
    the cross-cutting check" by accident. Any future value-entry control
    this contract adds must be listed here and traced to its consuming
    operational control the same way, or it remains subject to the general
    purpose-declaration requirement.
  formControlExemptTestIds:
    [gathering-shop-vote-map, gathering-shop-vote-map-marker,
     gathering-search-origin-marker,
     gathering-shop-vote-question-provider-page-link,
     gathering-shortlisted-shop-map, gathering-shortlisted-shop-map-marker,
     gathering-shortlisted-shop-page-link,
     gathering-participant-decision-map,
     gathering-participant-decision-map-marker,
     gathering-participant-decision-origin-marker,
     gathering-participant-decision-page-link,
     gathering-decision-shop-page-link]
  formControlExemptTestIdsNoteAdr0062: >-
    One display-only element added (ADR-0062 decision 4, 2026-09-17):
    gathering-decision-shop-page-link (organizerDashboard.finalizedSummary.
    decisionBanner.providerPageLink), a plain `<a href>` anchor outside
    forbiddenFormControlCategories' scan, the same precedent
    gathering-participant-decision-page-link already establishes for the
    participant's own finalized-view page link. gathering-decision-
    shop-map/-map-marker/-map-origin-marker are plain `<div>`/SVG elements
    outside forbiddenFormControlCategories' scan the same way
    gathering-shortlisted-shop-map/-map-marker already are, and carry no
    purpose either -- but this project's convention only lists anchor
    elements in this specific array (formControlExemptTestIdsNote above
    already explains why plain map/marker `<div>`s need no entry here at
    all), so only the page-link entry is added.
  formControlExemptTestIdsNote2026_09_12: >-
    Seven display-only elements added (this file's own 2026-09-12
    revision, ADR-0055 decision 5 / ADR-0056 decision 5 and ADR-0056
    decision 10): gathering-shortlisted-shop-map/-map-marker/-page-link
    (organizerDashboard.shortlistedShopVotes.list.item.detailFields) and
    gathering-participant-decision-map/-map-marker/-origin-marker/
    -page-link (participantAnswer.finalizedView.decision). Same precedent
    as the four elements formControlExemptTestIdsNote above already
    documents -- plain `<div>`/SVG map/marker elements outside
    forbiddenFormControlCategories' scan, and plain `<a href>` anchors
    (forbiddenFormControlCategories does not include anchors). None of
    these seven test ids appears in allowedPurposes, and none needs to.
  formControlExemptTestIdsNote: >-
    Added 2026-09-05 (adr/0044/0045/0046); narrowed 2026-09-09 (adr/0049
    decision 1) when organizerDashboard.shortlistSelection and its own map/
    marker/provider-page-link elements (gathering-open-shop-map/-marker,
    gathering-open-shop-list-item-provider-page-link) were retired along
    with that whole section -- shop selection's map/detail observation now
    lives entirely in candidate-search-browser-interface.yaml's gatheringMode
    instead. The four remaining elements sit entirely outside
    forbiddenFormControlCategories' scan -- the map container and marker are
    plain `<div>`/SVG elements carrying no interactive role (the same
    "display-only, no purpose" precedent candidate-origin-marker and
    candidate-map-open already establish in candidate-search-browser-
    interface.yaml), and the provider-page-link entry is a plain `<a href>`
    element (forbiddenFormControlCategories does not include a plain anchor,
    and activeContext.md's 2026-08-25 record confirms the tester DSL's
    FORM_CONTROL_SELECTOR does not capture one either -- the same precedent
    candidate-gathering-entry and candidate-search-browser-interface.yaml's
    candidate-card-provider-page-link already establish). None of these four
    test ids appears in allowedPurposes below, and none needs to. See
    browserControlSurface.participantAnswer.shopVoteQuestion below for each
    element's own requirement text.
  allowedPurposes:
    [gathering-add-candidate-date-open, gathering-add-candidate-date-submit,
     gathering-add-candidate-date-cancel, gathering-add-candidate-date-day-select,
     gathering-add-candidate-date-month-navigate,
     gathering-add-candidate-date-remove-selected,
     gathering-participant-link-copy,
     gathering-candidate-date-tentative-select, gathering-confirm-date-select,
     gathering-schedule-response-select, gathering-participant-name-open,
     gathering-participant-name-submit, gathering-participant-link-recopy,
     gathering-participant-link-revoke, gathering-create-open,
     gathering-list-item-open, gathering-create-candidate-date-day-select,
     gathering-create-candidate-date-month-navigate,
     gathering-create-candidate-date-remove-selected,
     gathering-candidate-date-remove,
     gathering-create-submit,
     gathering-create-cancel, gathering-shortlist-open,
     gathering-finalize-shop-select, gathering-finalize-open,
     gathering-finalize-confirm, gathering-finalize-cancel,
     gathering-shop-vote-select, gathering-delete-open,
     gathering-delete-confirm, gathering-delete-cancel,
     gathering-create-review-open, gathering-create-review-cancel,
     gathering-create-review-month-navigate,
     gathering-participant-answer-skip, gathering-participant-answer-previous,
     gathering-participant-day-navigate,
     gathering-participant-link-issue-dialog-copy,
     gathering-participant-link-issue-dialog-close,
     gathering-participant-day-list-open, gathering-participant-day-list-close,
     gathering-decision-answers-open, gathering-decision-links-open]
  allowedPurposesNote2026_09_12: >-
    Eight purposes added, one removed (this file's own 2026-09-12 revision,
    ADR-0054/ADR-0055/ADR-0056, contracts/REVISION-PLAN.md 2節). Added:
    gathering-create-candidate-date-month-navigate/
    gathering-add-candidate-date-month-navigate (each shared by that
    screen's own previous/next month-navigation pair, ADR-0054 decision 3 /
    ADR-0056 decision 3, the same one-purpose-shared-by-siblings pattern
    gathering-schedule-response-select already establishes);
    gathering-create-candidate-date-remove-selected/
    gathering-add-candidate-date-remove-selected (the selected-day removal
    control, same ADRs); gathering-candidate-date-remove
    (removeCandidateDate, ADR-0056 decision 2); gathering-finalize-open/
    gathering-finalize-confirm/gathering-finalize-cancel (replacing the
    single-activation gathering-finalize-submit with the same
    open-then-confirm shape gathering-delete-open/-confirm/-cancel already
    established, ADR-0054 decision 5). Removed: gathering-finalize-submit
    (superseded by the three purposes above -- no screen calls
    finalizeGathering from a single activation any longer).
  allowedPurposesNote2026_09_04: >-
    Six purposes added (adr/0042): gathering-open-shop-select
    (PickFive.dc.html's checkbox, organizerDashboard.shortlistSelection),
    gathering-shortlist-submit (its "この◯件で投票する" button),
    gathering-shortlist-open (Organizer.dc.html state②'s "店を絞りなおす"/
    "5件を差し替える", shared -- see this file's header comment's FR-028
    note on why these two labels are not distinguished),
    gathering-finalize-shop-select (the per-shop radio in
    shortlistedShopVotes) and gathering-finalize-submit (its confirm
    button), and gathering-shop-vote-select (the participant's per-shop
    vote purpose). No purpose is added or removed by the three-tier
    restructure (2026-09-04/05, adr/0044) -- gathering-shop-vote-select is
    now shared by three sibling option elements per shop (voteOptions
    below) instead of a single toggling checkbox, the same way
    gathering-schedule-response-select is already shared by three sibling
    gathering-schedule-response-option elements per candidate date.
    **gathering-open-shop-select and gathering-shortlist-submit, both
    introduced by this note, were retired 2026-09-09 (adr/0049 decision 1)
    along with shortlistSelection itself -- see allowedPurposesNote2026_09_09
    below.**
  allowedPurposesNote2026_09_09: >-
    Six purposes changed (adr/0049/adr/0050). Removed: gathering-open-shop-
    select and gathering-shortlist-submit (shortlistSelection's own picker
    and submit, both retired along with that whole section, adr/0049
    decision 1 -- shop selection now happens in candidate-search-browser-
    interface.yaml's gatheringMode instead). Added:
    gathering-add-candidate-date-day-select (the replacement calendar's day
    cell, adr/0049 decision 3, shared by every gathering-add-candidate-date-
    day the same way gathering-schedule-response-select is already shared
    by three sibling options); gathering-delete-open/-confirm/-cancel (the
    new two-step gathering-deletion control, adr/0050 decision 4);
    gathering-participant-answer-later/-peek-results (the two
    previously-decorative participant buttons this round makes functional,
    adr/0050 decision 1). gathering-shortlist-open itself is unchanged as a
    purpose name, but is hoisted out of shortlistedShopVotes into the new
    organizerDashboard.shopSelectionEntry (adr/0049 decision 1) and its
    requiredOutcome now navigates to candidate-search-browser-interface.
    yaml's gatheringMode instead of reopening the retired shortlistSelection.
  allowedPurposesNoteAdr0051: >-
    Two purposes changed (adr/0051, 2026-09-09, a second, later round of
    chat decisions on the same date). Removed:
    gathering-create-add-candidate-date-row and
    gathering-create-remove-candidate-date-row (organizerGatheringCreate's
    own retired row-based add/remove controls). Added:
    gathering-create-candidate-date-day-select (organizerGatheringCreate's
    own replacement calendar day cell -- a distinct test id and purpose
    from addCandidateDateForm's gathering-add-candidate-date-day-select --
    see organizerGatheringCreate.calendar below for why the two screens do
    not share one test id despite sharing the same input shape).
  allowedPurposesNoteAdr0061: >-
    Six purposes added, two removed (ADR-0061, 2026-09-17). Removed:
    gathering-participant-answer-later and gathering-participant-peek-results
    (both controls retired entirely, decision 3 -- see
    participantAnswer.dayNavigationNote below for why). Added:
    gathering-participant-answer-skip/-previous (the new one-at-a-time
    schedule flow's per-day navigation, decision 3),
    gathering-participant-day-navigate (shared by every
    gathering-participant-day-item the same way
    gathering-schedule-response-select is already shared by three sibling
    options), gathering-participant-link-issue-dialog-copy/-close (the new
    two-step link issuance dialog, decision 1). Also added:
    gathering-create-review-open, gathering-create-review-cancel,
    gathering-create-review-month-navigate -- these three purposes were
    already declared by organizerGatheringCreate.reviewDialog (ADR-0060
    decision 5) but never registered in this array; closed here as a
    drafting gap this round happens to touch this same list to fix
    (architect technical judgment, no new human decision, decision 6),
    not a new business decision.
  allowedPurposesNoteAdr0061Addendum: >-
    Two purposes added (ADR-0061 追補, 2026-09-18, closing a drafting gap
    this contract's own dayList (ADR-0061 decision 3) left open --
    developer's ADR-0020 decision 4 keyboard-reachability/44px audit
    surfaced it while implementing dayList's own narrow-width bottom-sheet
    presentation). Added: gathering-participant-day-list-open/-close
    (dayList.sheetOpen/sheetClose below, the control that discloses/hides
    dayList when it presents as a bottom sheet). Not a new business
    decision -- the same architect-technical-judgment gap-closing
    allowedPurposesNoteAdr0061 above already performed once for
    gathering-create-review-open/-cancel/-month-navigate.
  allowedPurposesNoteAdr0062Addendum: >-
    Two purposes added (2026-09-19 追補22, orchestrator's confirmation of
    ADR-0062 未決事項2 -- an entrance with no testId/purpose cannot be
    measured against ADR-0020 decision 4's tap-target/keyboard-
    reachability invariants, the same reasoning allowedPurposesNoteAdr0061
    Addendum above already applied once for gathering-participant-day-
    list-open/-close). Added: gathering-decision-answers-open,
    gathering-decision-links-open (organizerDashboard.finalizedSummary.
    answersOpen/linksOpen below, the entrance to responseTable/
    participantLinkList once phase is FINALIZED). Not a new business
    decision.
  forbiddenPurposes:
    - manual-ordering
    - secondary-condition
  forbiddenPurposesNote: >-
    `manual-ordering` is the same abstract category
    candidate-search-browser-interface.yaml already forbids (ADR-0023
    decision 4's ban on organizer-chosen sort order), reused here rather than
    redefined. It currently constrains
    browserControlSurface.organizerDashboard.candidateDateList (fixed
    goingCount-descending order, ties broken by startAt ascending, adr/0048,
    no sort toggle), participantLinkList (fixed
    issuedAt-ascending order, ties broken by id ascending, adr/0048, no sort
    toggle -- ADR-0036 decision 7),
    organizerGatheringList.list (fixed createdAt-descending order, ties
    broken by id ascending, adr/0048, no sort
    toggle -- adr/0038), and shortlistedShopVotes.list (fixed
    `wantToGoCount + okToGoCount`-descending order, ties broken by distance
    from the search origin ascending then shopId ascending, adr/0048, no
    sort toggle --
    adr/0042/adr/0044; this is the shop-vote-tally list ADR-0036 design
    judgment 3 already anticipated when it generalized this category ahead
    of the list existing; gathering-scheduling-api.yaml renamed this
    ordering key from the retired single `approvalCount` to
    `wantToGoCount + okToGoCount` 2026-09-04, adr/0044, and this list's own
    orderingInvariant below is now updated to match) and is written as a
    category -- not tied to any specific existing test id -- so any future
    list this contract adds is covered without a new allowedPurposes/
    forbiddenPurposes edit. participantAnswer.shopVoteQuestion is likewise
    covered by this same category (its orderingInvariant is nearest-first
    by distance from the search origin, ascending -- changed 2026-09-05 from
    an in-progress draft's addedAt-ascending basis to match
    gathering-scheduling-api.yaml's own 2026-09-04 fix, adr/0044 decision
    2, and 2026-09-06 to add a shopId-ascending tie-break for the raw
    distance itself, adr/0048 -- a fixed order with no sort toggle either
    way, same as every other
    list here). `secondary-condition` is reused from the same source
    contract for the same reason: this product's existing "no auxiliary
    condition controls beyond the declared filter/sort model" principle
    (ADR-0005 decision 4) applies here too -- this slice still defines no
    filter controls of its own (P3, 2026-09-03, confirms the shortlist/vote
    surfaces this round add none either).
  forbiddenTestIds:
    [candidate-origin-marker, candidate-map, private-search-origin]
  forbiddenTestIdsNote: >-
    No gathering screen may reuse candidate-search's own map/origin element
    (candidate-map, candidate-origin-marker) or the private-search-origin
    canary -- this list forbids those specific test ids, not the concept of
    a map on a gathering screen. Any shop information a gathering screen
    shows remains a live, non-persisted projection
    (gathering-scheduling-api.yaml's ShortlistedShop/ParticipantShopVoteOption,
    adr/0034 decision 6; OpenShopPreviewItem itself was retired 2026-09-09,
    adr/0049 decision 2). **Defined 2026-09-05 (adr/0044/0045)**: this
    contract defines its own, differently implemented gathering-scoped map
    element -- participantAnswer.shopVoteQuestion's shopVoteMap
    (gathering-shop-vote-map/-marker, plus gathering-search-origin-marker
    for the participant screen only, adr/0045) -- showing each shop's own
    pin and the search origin, never the candidate-search-specific test ids
    this list forbids and never the walking-radius rings candidate-search-
    browser-interface.yaml defines. **organizerDashboard.shortlistSelection's
    own map (gathering-open-shop-map/-marker) was retired 2026-09-09
    (adr/0049 decision 1)** along with the rest of that section -- shop
    selection's map now lives entirely in candidate-search-browser-
    interface.yaml's existing candidate-map, reused unchanged rather than
    duplicated (that screen was never subject to this file's own
    forbidden-test-id list in the first place). See each remaining
    element's own requirement text below for what it does and does not
    show.
  crossFileSharedNavigation: >-
    Added 2026-09-16 (ADR-0059). candidate-search-browser-interface.yaml's
    gatheringEntry.menuToggle/menuPanel/menuDestinationSearch/
    menuDestinationGathering (desktop, twoColumnLayout) and
    gatheringEntry.mobileBar and its three children (mobile,
    mapPrimaryTouchLayout) are present, unconditionally, on every one of
    this file's own organizerGatheringList/organizerGatheringCreate/
    organizerDashboard screens -- the same "no test id of its own, one
    normative source elsewhere" pattern this file's own header note already
    established for candidate-gathering-entry (ADR-0054 decision 1). These
    elements declare candidate-search-browser-interface.yaml's own
    data-candidate-control-purpose attribute, not this file's
    data-gathering-control-purpose -- neither
    allGatheringScreenFormControlsMustDeclarePurpose's scan above nor this
    file's own allowedPurposes list applies to them, and no entry for them
    is added here. Their disclosure includes, for the first time, a way to
    reach authentication-browser-interface.yaml's auth-sign-out and
    auth-password-change-open from any of these three screens -- previously
    reachable only from the candidate-search screen.

browserControlSurface:
  organizerGatheringList:
    description: >-
      The organizer's entry point (Entry.dc.html E-1/E-1b, adr/0038). Fills
      the gap the human found in production ("幹事画面への入口が無い").
      Supports TDR-GTH-21/22.
    requiredTestIds:
      list: gathering-list
      createOpen: gathering-create-open
    list:
      testId: gathering-list
      orderingInvariant: >-
        DOM order of gathering-list-item children equals
        GatheringListResponse.gatherings' order (createdAt descending,
        新しい順, ties broken by id ascending, adr/0048,
        gathering-scheduling-api.yaml) at all times. No control in
        this list may claim the forbidden manual-ordering purpose (see
        unavailableControls above).
      item:
        testId: gathering-list-item
        cardinality: zero-or-more-elements-sharing-this-test-id
        attributes:
          id: data-gathering-id
          title: data-gathering-title
          phase: data-gathering-phase
          confirmedCandidateDate: data-confirmed-candidate-date
          respondedCount: data-responded-count
          activeIssuedLinks: data-active-issued-links
        requirement: >-
          One element per Gathering in the response. data-gathering-title
          (added 2026-09-04, adr/0042, closing ADR-0040 未決事項2's
          audit-flagged gap: this list previously had no machine-observable
          attribute for the gathering's own name) equals Gathering.title
          exactly. data-gathering-phase uses the same three-value
          vocabulary as organizerDashboard.phaseIndicatorAttributes
          (SCHEDULING, SELECTING_SHOP, FINALIZED). data-confirmed-
          candidate-date is an ISO-8601 date-time string equal to the
          CandidateDate.startAt whose id matches
          Gathering.confirmedCandidateDateId, or absent when
          confirmedCandidateDateId is null (Entry.dc.html's "候補日 4つ"
          case) -- this contract does not fix whether a candidate-date-count
          is separately exposed when there is no confirmed date; the DOM
          text content is not asserted, only these attributes. data-responded-
          count and data-active-issued-links mirror
          Gathering.respondedParticipantCount /
          Gathering.activeParticipantLinkCount exactly, using the same
          attribute names organizerDashboard's denominatorAttributes already
          establish (D2's two-denominator distinction applies here too).
        open:
          testId: gathering-list-item-open
          purpose: gathering-list-item-open
          requiredOutcome: >-
            Activating it navigates to browserEntry.organizerDashboard for
            this item's data-gathering-id (TDR-GTH-21).
    empty:
      testId: gathering-list-empty
      presenceRule: >-
        Present exactly when GatheringListResponse.gatherings is empty;
        absent otherwise. When present, no gathering-list-item exists in the
        DOM (TDR-GTH-22). This is the "input素が無い" gap the human found in
        production -- Entry.dc.html E-1b is this contract's answer.
      containsCreateOpen: >-
        A second gathering-create-open instance may appear inside
        gathering-list-empty in addition to the one in the persistent header
        (Entry.dc.html E-1b duplicates the entry point). See createOpen
        below for why this test id's cardinality allows more than one
        simultaneous element.
    createOpen:
      testId: gathering-create-open
      purpose: gathering-create-open
      cardinality: >-
        one-or-more-elements-sharing-this-test-id -- at least one instance
        (the persistent header entry point) is always present on this
        screen; a second instance may coexist inside gathering-list-empty
        when the list is empty (Entry.dc.html shows both at once in that
        state). Every instance shares the same purpose and requiredOutcome.
      requiredOutcome: >-
        Activating any instance navigates to browserEntry.
        organizerGatheringCreate (TDR-GTH-22).
  organizerGatheringCreate:
    description: >-
      The gathering-creation screen (Entry.dc.html E-2, adr/0038). Fills the
      second gap the human found in production ("会をつくる画面が無い").
      Supports TDR-GTH-01 (now browser-verifiable), TDR-GTH-23, and
      TDR-GTH-47 (adr/0051: this screen's calendar also enforces 明日以降
      のみ, the same rule addCandidateDateForm.calendar.dayCell.disabledState
      already enforces there).
    requiredTestIds:
      nameInput: gathering-create-name-input
      calendar: gathering-create-candidate-date-calendar
      reviewOpen: gathering-create-review-open
      cancel: gathering-create-cancel
    nameInput:
      testId: gathering-create-name-input
      requirement: >-
        A text input whose value becomes CreateGatheringRequest.title on
        submit. Present unconditionally on this screen.
      valueEntryControl: >-
        Exempt from allGatheringScreenFormControlsMustDeclarePurpose per
        unavailableControls.operationalControlScope (ADR-0039) -- its value
        is consumed by submit.requiredOutcome below, which is this field's
        documented consuming operational control.
    calendar:
      testId: gathering-create-candidate-date-calendar
      description: >-
        **Replaces candidateDateRow 2026-09-09 (adr/0051, a second,
        same-day human chat decision following this file's own 2026-09-09
        追補8 note, which had left this screen's row-based input
        unresolved)**: the row-based add/remove-row input this screen
        previously exposed (candidateDateRow, its per-row dateInput,
        addRow, removeRow) is retired. This screen now uses a multi-select
        calendar of the same shape addCandidateDateForm.calendar below
        already defines (adr/0049 decision 3) -- same day-cell attributes,
        same "明日以降のみ" disabled-day rule, same "12:00始まり" UI aid --
        but as this screen's own, distinct element (its own test id, not
        shared with addCandidateDateForm.calendar). See dayCell below for
        why the two screens do not share one test id despite sharing one
        input shape.
      note: >-
        This contract does not fix the calendar's rendered month range,
        week-start convention, markup, or specific library, mirroring
        addCandidateDateForm.calendar.note above -- library selection
        remains developer's choice (adr/0049 decision 3, adr/0051 decision
        1). It fixes only the day-cell surface below (including its
        weekend/holiday exclusion, added 2026-09-16, ADR-0060 decision 1/2),
        monthNavigation below (added 2026-09-12, ADR-0054 decision 3 /
        ADR-0056 decision 3), rangeSelection below (added 2026-09-12,
        ADR-0054 decision 3), and review.confirm.requiredOutcome's
        consumption of the resulting selected-day set. **The selected-day
        list this note previously named here as "removeSelected below"
        moved out of this calendar block entirely on 2026-09-16 (ADR-0060
        decision 5) -- see review.dialog.item below.**
      monthNavigation:
        description: >-
          Added 2026-09-12 (ADR-0054 decision 3 / ADR-0056 decision 3,
          human decision: the calendar is rebuilt as a developer's own
          component, no longer vendoring flatpickr, so it can go back to a
          single-month display -- FR-033's root cause was this contract
          never declaring a month-navigation control as an operational
          control in the first place, which is what this entry now fixes).
        previous:
          testId: gathering-create-candidate-date-month-previous
          purpose: gathering-create-candidate-date-month-navigate
        next:
          testId: gathering-create-candidate-date-month-next
          purpose: gathering-create-candidate-date-month-navigate
        requiredOutcome: >-
          Activating either control changes only which month's days
          gathering-create-candidate-date-day cells currently render for --
          the month shown moves back/forward by exactly one. Calls no
          public operation. Does not change any cell's data-selected value,
          including for a selected day in a month not currently shown (see
          removeSelected below for how such a day can still be
          deselected).
      # removeSelected moved 2026-09-16 to review.dialog.item below
      # (ADR-0060 decision 5, same testId gathering-create-candidate-date-
      # remove-selected, requirement rewritten for the dialog's own month
      # paging) -- see that entry's description for why.
      rangeSelection:
        description: >-
          Added 2026-09-12 (ADR-0054 decision 3, human decision). An
          additional input method for selecting more than one
          gathering-create-candidate-date-day at once, alongside the
          existing one-at-a-time toggle (dayCell.select below), which this
          addition does not replace or disable.
        requirement: >-
          This contract requires that at least one of the following input
          methods be supported, each producing the identical end state --
          every day between two chosen endpoints (inclusive) carrying
          data-selected="true" -- as toggling each of those same days
          individually would: press-and-drag across multiple enabled day
          cells; click one enabled day cell then Shift+click a second,
          selecting every enabled day between them; or click one enabled
          day cell to mark it as a range anchor, then click a second to
          close the range. This contract does not fix which of these
          methods is implemented, how many, or the exact interaction
          affordance -- only the resulting data-selected state, which
          dayCell's own attributes below already define and this addition
          does not change the shape of.
      dayCell:
        testId: gathering-create-candidate-date-day
        cardinality: one-or-more-elements-sharing-this-test-id
        attributes:
          date: data-date
          selected: data-selected
          holiday: data-holiday
        requirement: >-
          Same shape as addCandidateDateForm.calendar.dayCell above:
          data-date is an ISO-8601 date string (YYYY-MM-DD, no time
          component) identifying the calendar day this cell represents;
          data-selected is "true"/"false", reflecting this cell's current
          pending-selection state (client-side only, not yet submitted).
          Multiple cells may simultaneously carry data-selected="true"
          (multi-select, TDR-GTH-01's "2つ以上の候補日"). This is a
          distinct test id from gathering-add-candidate-date-day
          (architect design judgment, adr/0051 decision 1) -- the two
          screens render separate DOM elements (an independent creation
          screen versus an inline dashboard form) whose post-submit
          behavior differs (this screen's submit creates the gathering and
          leaves the screen per review.confirm.requiredOutcome below;
          addCandidateDateForm's submit stays open for another entry), so
          sharing one test id across both would attach two different
          requiredOutcome contracts to the same observed element.
          **data-holiday added 2026-09-16 (ADR-0060 decision 2)**:
          "true"/"false", equal to whether this cell's data-date is a
          Japan public holiday per this product's own bundled holiday data
          (never fetched from an external service at request time; the
          product does not judge holidays anywhere else -- see
          gathering-scheduling-api.yaml's CandidateDateInput.startAt for
          the authoritative server-side rejection this attribute mirrors).
          Independent of the day-of-week -- a day may be a weekday holiday
          (data-holiday="true", not a weekend) or a weekend non-holiday
          (data-holiday="false").
        disabledState: >-
          Carries the native disabled state for any day whose data-date is
          today or earlier by the server's clock (adr/0049 decision 3's
          "明日以降のみ" rule, mirrored client-side here exactly as
          addCandidateDateForm.calendar.dayCell.disabledState mirrors it
          there; the API's CANDIDATE_DATE_NOT_IN_FUTURE rejection remains
          the authoritative enforcement, TDR-GTH-47). **Also carries the
          native disabled state for any day that is a Saturday or Sunday,
          or whose data-holiday above is "true" (added 2026-09-16, ADR-0060
          decision 1/2, human decision: 土日は地色は残すが押せない、祝日も
          押せず「祝」の印を持つ -- this partially reverses ADR-0054
          decision 3's "土日に地色を敷いて押せる", keeping only the coloring,
          not the clickability; ADR-0035 decision 6's shop-open-day
          matching, a separate feature, is unchanged by this). The API's
          new CANDIDATE_DATE_NOT_A_BUSINESS_DAY rejection remains the
          authoritative enforcement, TDR-GTH-57/58.** A disabled day cell
          can never carry data-selected="true", regardless of which of
          these conditions caused the disabling.
        select:
          purpose: gathering-create-candidate-date-day-select
          requiredOutcome: >-
            Activating an enabled gathering-create-candidate-date-day
            toggles its own data-selected between "true" and "false".
            This is client-side pending selection only -- it calls no
            public operation (createGathering has not been called yet).
            submit.disabledState below reflects the current count of
            "true" day cells.
    review:
      description: >-
        Added 2026-09-16 (ADR-0060 decision 5, human decision: 「つくる」を
        押すとモーダルが開き、そこで確認してから作る). Replaces this
        screen's single-activation gathering-create-submit (which
        previously called createGathering directly) with an open-then-
        confirm shape -- not the same open/confirmDialog/confirm/cancel
        naming this file already uses for gathering-delete-*/gathering-
        finalize-* (ADR-0054 decision 5), because those two guard an
        irreversible operation with a single confirmation screen, while
        this dialog additionally lets the organizer remove individual
        selected days before confirming (see item/monthNavigation below) --
        a review surface, not a plain yes/no confirmation.
      requiredTestIds:
        open: gathering-create-review-open
        dialog: gathering-create-review-dialog
        confirm: gathering-create-submit
        cancel: gathering-create-review-cancel
      open:
        testId: gathering-create-review-open
        purpose: gathering-create-review-open
        disabledState: >-
          Carries the native disabled state whenever gathering-create-name-
          input is empty, or fewer than 1 gathering-create-candidate-date-day
          currently has data-selected="true" (ADR-0035 decision 1's "候補日
          1つ以上" requirement / D10, mirrored client-side the same way
          addCandidateDateForm.submit.disabledState mirrors
          AddCandidateDatesRequest's minItems: 1, adr/0051 decision 2 --
          the API itself is the authoritative enforcement, this disabledState
          is a UX affordance, not a substitute for server-side validation).
          **Moved 2026-09-16 from gathering-create-submit's own disabledState
          (ADR-0060 decision 5)** -- this control, not confirm below, is now
          the one gating on name/day-count, because confirm below is only
          ever reachable after this control's activation has already passed
          this same check once.
        requiredOutcome: >-
          Activating it (while not disabled) reveals gathering-create-
          review-dialog. Calls no public operation -- createGathering has
          not been called yet. An implementation may show a running count
          of currently-selected days near this control (e.g. "選んだ日
          20件", ADR-0060 decision 9); this contract does not fix that
          wording, only the underlying gathering-create-candidate-date-day
          selection state it would be drawn from.
      dialog:
        testId: gathering-create-review-dialog
        presenceRule: >-
          Absent until gathering-create-review-open is activated. Present
          after activation, until either a successful confirm (see below,
          which also leaves this screen entirely per confirm.requiredOutcome)
          or cancel (see below) makes it absent again.
        item:
          testId: gathering-create-candidate-date-remove-selected
          purpose: gathering-create-candidate-date-remove-selected
          description: >-
            **This element and its testId/purpose are unchanged from their
            original 2026-09-12 addition (ADR-0056 decision 3); only their
            home in the DOM and cardinality/requirement change, 2026-09-16
            (ADR-0060 decision 5).** Until this decision this was an
            always-all-visible sidebar list, independent of any month
            paging ("regardless of which month is currently displayed"). It
            now lives exclusively inside this dialog and is paged by
            monthNavigation below, one month at a time. Keeping every
            month's rows hidden-but-present in the DOM instead (so the
            original "regardless of which month" wording could stay
            literally true) was considered and rejected -- an unreachable-
            but-present operational control is the same class of gap this
            contract's keyboard-reachability and 44px-floor attention
            already treats as a defect elsewhere (adr/0020).
          cardinality: zero-or-more-elements-sharing-this-test-id
          attributes:
            date: data-date
          requirement: >-
            One instance per day currently carrying gathering-create-
            candidate-date-day's data-selected="true" **whose month is the
            one this dialog's own monthNavigation below is currently
            displaying** (narrowed 2026-09-16, ADR-0060 decision 5, from
            this element's original "regardless of which month is currently
            displayed" scope -- that original scope described the outer
            calendar's own month state above, which this element's presence
            still does not depend on; what changed is that this element now
            has its own, additional month-scoping state it did not have
            before). This instance's own data-date carries the same
            ISO-8601 value, same format, as dayCell.attributes.date for the
            day it corresponds to (unchanged from this element's original
            2026-09-13 addition).
          requiredOutcome: >-
            Activating the instance for a given day makes that day's
            gathering-create-candidate-date-day data-selected "false" (the
            same effect as re-activating that cell directly) and removes
            this instance from the DOM. Calls no public operation. This
            contract does not fix this dialog's behavior when the instance
            removed was the last one in the currently-displayed month (e.g.
            whether the dialog advances to an adjacent month with remaining
            items, or shows an empty state for the current month) -- only
            confirm.disabledState below's day-count gate is fixed.
        monthNavigation:
          description: >-
            Added 2026-09-16 (ADR-0060 decision 5). An independent paging
            state, scoped to this dialog alone -- distinct from
            organizerGatheringCreate.calendar.monthNavigation above, which
            moves a different state (which month's day cells the calendar
            itself renders for selection). Moving this dialog's month
            forward or backward never changes calendar.monthNavigation's
            own state, and vice versa. Initial position is the earliest
            month containing a currently-selected day.
          previous:
            testId: gathering-create-review-month-previous
            purpose: gathering-create-review-month-navigate
          next:
            testId: gathering-create-review-month-next
            purpose: gathering-create-review-month-navigate
          requiredOutcome: >-
            Activating either control moves this dialog's own currently-
            displayed month to the nearest adjacent month (earlier for
            previous, later for next) that contains at least one day
            currently carrying data-selected="true" -- a month with no
            selected day is skipped entirely, never shown. Calls no public
            operation. Changes only which item instances above are present;
            never changes any day cell's data-selected value. This contract
            does not fix how this dialog indicates the current position
            among the months with selected days (e.g. dots, per designer's
            board) -- a rendering detail, not a Must. Nor does it fix the
            exact scroll behavior when a single month has enough selected
            days to overflow the dialog's visible area (designer's board
            keeps the month-navigation controls and the dialog's footer
            fixed while only the item list scrolls) -- a layout detail.
        confirm:
          testId: gathering-create-submit
          purpose: gathering-create-submit
          description: >-
            **Moved 2026-09-16 into this dialog (ADR-0060 decision 5)** --
            same test id and purpose this control has always had; only its
            home in the DOM, presenceRule, and disabledState change. Prior
            to this decision this control sat directly on
            organizerGatheringCreate and was reachable unconditionally; see
            open.requiredOutcome above for what replaced that reachability.
          presenceRule: >-
            Present only while gathering-create-review-dialog is present.
          disabledState: >-
            Carries the native disabled state whenever fewer than 1
            gathering-create-candidate-date-remove-selected instance
            currently exists across every month this dialog can page to
            (i.e. every selected day was removed from within this dialog) --
            the API itself (createGathering's minItems: 1) is the
            authoritative enforcement, this disabledState is a UX
            affordance. An implementation may label this control with the
            current count (e.g. "この20件でつくる", ADR-0060 decision 9);
            this contract does not fix that wording, only the underlying
            selected-day count it would be drawn from.
          requiredOutcome: >-
            Activating it (while not disabled) calls createGathering with
            title (consumed from gathering-create-name-input) and
            candidateDates built from every gathering-create-candidate-date-
            day whose data-selected is "true" (each producing one
            CandidateDateInput; this contract does not fix or require a way
            to edit each selected day's time-of-day separately from the
            calendar's own default, adr/0049 decision 3's "12:00始まり" UI
            aid -- same non-fixed treatment as addCandidateDateForm.submit.
            requiredOutcome's identical clause). On success, the new
            gathering subsequently appears in organizerGatheringList.list
            (createdAt descending places it first), and the browser
            navigates to browserEntry.organizerDashboard for the newly
            created gathering (ADR-0054 decision 2, unchanged by this
            round's move into this dialog). On a whole-batch
            DUPLICATE_CANDIDATE_DATE rejection (adr/0038), a whole-batch
            CANDIDATE_DATE_NOT_IN_FUTURE rejection (TDR-GTH-47), or a
            whole-batch CANDIDATE_DATE_NOT_A_BUSINESS_DAY rejection (new
            2026-09-16, ADR-0060 decision 4, TDR-GTH-57/58): this dialog
            remains present with every gathering-create-candidate-date-
            remove-selected instance unchanged, every day cell's
            data-selected unchanged, and the name input's value intact --
            no gathering is created.
        cancel:
          testId: gathering-create-review-cancel
          purpose: gathering-create-review-cancel
          requiredOutcome: >-
            Activating it makes gathering-create-review-dialog absent.
            Calls no public operation. Does not change any day cell's
            data-selected value or the name input's value -- the organizer
            returns to organizerGatheringCreate exactly as it was before
            gathering-create-review-open was activated.
    cancel:
      testId: gathering-create-cancel
      purpose: gathering-create-cancel
      requiredOutcome: >-
        Activating it navigates back to organizerGatheringList without
        calling createGathering.
  organizerDashboard:
    requiredTestIds:
      phaseIndicator: gathering-phase-indicator
      respondedSummary: gathering-responded-summary
      unansweredSummary: gathering-unanswered-summary
      candidateDateList: gathering-candidate-date-list
      candidateDate: gathering-candidate-date
      addCandidateDateOpen: gathering-add-candidate-date-open
      participantLinkCopy: gathering-participant-link-copy
      participantLinkList: gathering-participant-link-list
      confirmDate: gathering-confirm-date-select
    phaseIndicatorAttributes:
      testId: gathering-phase-indicator
      attribute: data-gathering-phase
      values: [SCHEDULING, SELECTING_SHOP, FINALIZED]
      requirement: >-
        Exact string match with the current Gathering.phase
        (gathering-scheduling-api.yaml). Present unconditionally whenever the
        organizer dashboard renders. Corresponds to the phase progress
        display Organizer.dc.html's dw-ph header and Flow.dc.html's 会の状態
        row both show; this element is what carries that concept into the
        approved screens actually observed by this contract (F itself has no
        observable surface -- see this file's header comment). Amended
        2026-09-01 (D10, adr/0038): the value set was already exactly these
        three values (no DRAFT) from drafting time; D10 confirms this was
        correct rather than changing it. Amended 2026-09-03 (P6, adr/0041):
        this value set does not gain a fourth value when voting starts --
        see shopSelectionEntry/shortlistedShopVotes below for how that
        sub-state is represented instead.
    denominatorAttributes:
      description: >-
        D2 (2026-08-30): two distinct denominators must be separately
        machine-observable on the same dashboard, matching Gathering's
        activeParticipantLinkCount and respondedParticipantCount
        (gathering-scheduling-api.yaml), which are never the same value and
        must never be conflated into one attribute. Amended 2026-08-30
        (ADR-0036 decision 7): the unanswered denominator now nets out
        revoked links, not just totalIssuedParticipantLinks.
      respondedSummary:
        testId: gathering-responded-summary
        attributes:
          respondedCount: data-responded-count
          anonymousRespondedCount: data-anonymous-responded-count
        requirement: >-
          data-responded-count equals response.respondedParticipantCount
          exactly; data-anonymous-responded-count equals
          response.anonymousRespondedParticipantCount exactly (both decimal
          integer strings). Supports the visible disclosure "8人が回答（うち
          2人は名前なし）" (Organizer.dc.html) without itself fixing that
          wording.
      unansweredSummary:
        testId: gathering-unanswered-summary
        attributes:
          totalIssuedLinks: data-total-issued-links
          revokedLinks: data-revoked-links
          activeIssuedLinks: data-active-issued-links
          unansweredCount: data-unanswered-count
        requirement: >-
          data-total-issued-links equals
          response.totalIssuedParticipantLinks exactly (lifetime count,
          audit only -- ADR-0036 decision 7). data-revoked-links equals
          response.totalRevokedParticipantLinks exactly. data-active-issued-links
          equals response.activeParticipantLinkCount exactly
          (totalIssuedParticipantLinks - totalRevokedParticipantLinks).
          data-unanswered-count equals
          activeParticipantLinkCount minus respondedParticipantCount exactly
          -- this is the D2 denominator ("まだn人が未回答", amended
          2026-08-30 so a revoked link no longer counts as outstanding,
          TDR-GTH-18), and it must never be computed from or equal to any
          per-candidate-date tally, and must never be computed from
          data-total-issued-links directly (that would reintroduce the
          pre-amendment bug of counting a revoked link as still
          unanswered).
    candidateDateList:
      testId: gathering-candidate-date-list
      orderingInvariant: >-
        DOM order of gathering-candidate-date children equals
        Gathering.candidateDates' order (startAt ascending, 開催日の早い順,
        gathering-scheduling-api.yaml) at all times. **Changed 2026-09-16
        (ADR-0060 decision 6, human decision: 候補日の並びを日付順へ)**: this
        entry previously ordered by goingCount descending with startAt
        ascending as a tie-break (adr/0048, fixing a 2026-09-06 production
        defect where the tie-break was undocumented and non-deterministic).
        This round replaces goingCount as the primary key with startAt
        itself. No tie-break is needed for this key -- within a given
        gathering, startAt is always unique among currently-present
        candidate dates (DUPLICATE_CANDIDATE_DATE rejects any addition that
        would duplicate an existing candidate date's startAt), so two
        elements sharing this order key can never occur. No control in this
        list may claim the forbidden manual-ordering purpose (see
        unavailableControls above).
      candidateDate:
        testId: gathering-candidate-date
        attributes:
          id: data-candidate-date-id
          goingCount: data-going-count
          maybeCount: data-maybe-count
          notGoingCount: data-not-going-count
          isConfirmed: data-confirmed
          tentativelySelected: data-tentative-selected
          currentLeader: data-current-leader
        requirement: >-
          One element per CandidateDate, each attribute an exact-match
          projection of the same-named CandidateDate field (data-confirmed
          and data-tentative-selected are "true"/"false" strings). At most
          one gathering-candidate-date carries data-confirmed="true" at a
          time, and it is exactly Gathering.confirmedCandidateDateId's
          target once phase is SELECTING_SHOP or FINALIZED. At most one
          carries data-tentative-selected="true" at a time (see
          tentativeSelectionAndPreview below); tentative selection is
          client-side UI state only, never sent to or reflected by
          gathering-scheduling-api.yaml (adr/0035 decision 1 item 1). This
          list and its items remain present unconditionally across all
          three phases (Final.dc.html A③'s "日程の記録" panel is this same
          element, frozen as a record once FINALIZED, adr/0042) -- only the
          tentative-select interactivity retires (see
          tentativeSelectionAndPreview.trigger below). **data-current-leader
          added 2026-09-16 (ADR-0060 decision 7, human decision: "○が多い日
          を優先。同票なら△が多いほう。それでも同票ならすべてつける")**:
          for a candidate date whose goingCount + maybeCount + notGoingCount
          equals 0 (nobody has responded to this date at all),
          data-current-leader is unconditionally "false" (same 0-response
          exclusion gathering-shortlisted-shop-item's own data-current-
          leader established, ADR-0055 decision 6). Among candidate dates
          whose responded count is not 0: find the maximum goingCount among
          them. If exactly one candidate date carries that maximum
          goingCount, its data-current-leader is "true" and every other
          candidate date's is "false". If more than one candidate date
          ties on that maximum goingCount, narrow to whichever of those
          tied candidate dates has the maximum maybeCount among just that
          tied subset; if exactly one remains, only that one carries
          data-current-leader="true"; if more than one remains (tied on
          both goingCount and maybeCount), every one of those remaining
          tied candidate dates carries data-current-leader="true". This is
          a two-level cascade (goingCount first, maybeCount only ever
          consulted to break a goingCount tie, never combined with it) --
          distinct from gathering-shortlisted-shop-item's own single summed
          value (wantToGoCount + okToGoCount, ADR-0055 decision 6).
      removeCandidateDate:
        testId: gathering-candidate-date-remove
        purpose: gathering-candidate-date-remove
        description: >-
          Added 2026-09-12 (ADR-0056 decision 2, human decision). Lets the
          organizer remove a previously added candidate date while still
          scheduling -- addCandidateDates could add one but nothing could
          take one away until now.
        presenceRule: >-
          Present once per gathering-candidate-date whose data-confirmed is
          "false", and only while phase is SCHEDULING; absent entirely once
          phase is SELECTING_SHOP or FINALIZED (rejected with
          GATHERING_NOT_IN_SCHEDULING_PHASE) -- a request to remove an
          already-confirmed candidate date is rejected the same way,
          because confirming a candidate date moves phase off SCHEDULING in
          the same operation and there is no operation that moves it back
          (gathering-scheduling-api.yaml v0.13.0 追補10 removed the
          unreachable CANDIDATE_DATE_CONFIRMED code that previously named
          this case separately) -- expressed here as presence rather than
          disabledState, the same shift this file's own
          participantLinkList.item.revoke makes 2026-09-12 (ADR-0055
          decision 2), not the disable-at-the-boundary convention
          addCandidateDateOpen above still uses for its own,
          weaker-boundary case.
        requiredOutcome: >-
          Activating it (only reachable per presenceRule above) calls
          removeCandidateDate for this gathering-candidate-date's
          data-candidate-date-id. On success, this gathering-candidate-date
          element no longer appears in gathering-candidate-date-list, and
          every gathering-schedule-question this candidate date had (see
          participantAnswer.scheduleQuestion above) no longer appears for
          any participant -- removing a candidate date deletes its
          schedule responses along with it (gathering-scheduling-api.yaml's
          Gathering.candidateDates description, ADR-0056 decision 2,
          settling product-brief.md §8's open question about what happens
          to a removed candidate date's existing responses). This contract
          does not fix the immediate post-removal focus/scroll state of
          gathering-candidate-date-list.
      addCandidateDateOpen:
        testId: gathering-add-candidate-date-open
        purpose: gathering-add-candidate-date-open
        presenceRule: >-
          Present only while phase is SCHEDULING; absent once phase is
          SELECTING_SHOP or FINALIZED (addCandidateDates has been rejected
          outside SCHEDULING since ADR-0035, but this contract had not
          previously stated the control's own presence rule -- stated here
          while closing the FINALIZED observation gap, adr/0042;
          Organizer.dc.html state② already omits this control).
        disabledState: >-
          This contract does not require a disabled state for this control
          while present (unlike gathering-create-submit) -- adding a
          further candidate date has no lower-bound precondition the way
          creating a gathering does (ADR-0035 decision 1 already requires
          >=1 at creation time).
        requiredOutcome: >-
          Activating it reveals gathering-add-candidate-date-form inline
          within gathering-candidate-date-list (案A "その場で開く", human
          decision 2026-09-01, adr/0038) -- resolving what was, at drafting
          time, an undefined destination (Organizer.dc.html showed only this
          button's entry point). See addCandidateDateForm below for the
          form itself (TDR-GTH-02, reviewer audit Major#1's positive
          surface).
      addCandidateDateForm:
        testId: gathering-add-candidate-date-form
        description: >-
          **Replaced 2026-09-09 (adr/0049 decision 3, 2026-09-08 human
          decision: 候補日はカレンダーで複数選択する)**: the single
          value-entry date-time input this form previously exposed
          (gathering-add-candidate-date-input, calling the now-retired
          singular addCandidateDate) is replaced by a multi-select calendar
          (Calendar.dc.html) calling the new batch addCandidateDates. See
          calendar below for the day-cell surface and submit below for the
          batch call.
        presenceRule: >-
          Absent until gathering-add-candidate-date-open is activated.
          Present after activation, and **remains present after a
          successful submit** -- ready for another entry without
          re-opening (human decision 2026-09-01, AddDate.dc.html 案A: "足した
          あとフォームは閉じない"). Absent again only after
          gathering-add-candidate-date-cancel is activated.
        calendar:
          testId: gathering-add-candidate-date-calendar
          note: >-
            This contract does not fix the calendar's rendered month range,
            week-start convention, markup, or specific library (adr/0049
            decision 3: "カレンダーライブラリの選定" is explicitly left to
            developer). It fixes only the day-cell surface below,
            monthNavigation/removeSelected below (added 2026-09-12,
            ADR-0054 decision 3 / ADR-0056 decision 3), rangeSelection
            below (added 2026-09-12, ADR-0054 decision 3), and the batch
            submit behavior.
          monthNavigation:
            description: >-
              Added 2026-09-12 (ADR-0054 decision 3 / ADR-0056 decision 3,
              human decision) -- same rationale as
              organizerGatheringCreate.calendar.monthNavigation above,
              applied to this screen's own independent calendar instance.
            previous:
              testId: gathering-add-candidate-date-month-previous
              purpose: gathering-add-candidate-date-month-navigate
            next:
              testId: gathering-add-candidate-date-month-next
              purpose: gathering-add-candidate-date-month-navigate
            requiredOutcome: >-
              Activating either control changes only which month's days
              gathering-add-candidate-date-day cells currently render for
              -- the month shown moves back/forward by exactly one. Calls
              no public operation. Does not change any cell's
              data-selected value, including for a selected day in a month
              not currently shown (see removeSelected below).
          removeSelected:
            testId: gathering-add-candidate-date-remove-selected
            purpose: gathering-add-candidate-date-remove-selected
            description: >-
              Added 2026-09-12 (ADR-0056 decision 3) -- same rationale as
              organizerGatheringCreate.calendar.removeSelected above.
            cardinality: zero-or-more-elements-sharing-this-test-id
            attributes:
              date: data-date
            requirement: >-
              One instance per day currently carrying data-selected="true",
              regardless of which month is currently displayed. This
              instance's own data-date carries the same ISO-8601 value,
              same format, as dayCell.attributes.date above for the day
              it corresponds to (added 2026-09-13, spec .spec/11-b -- same
              rationale as organizerGatheringCreate.calendar.removeSelected
              above, closing 独立監査 audit-gathering-redesign-steps.md's
              Minor finding on TDR-GTH-46's fragility).
            requiredOutcome: >-
              Activating the instance for a given day makes that day's
              gathering-add-candidate-date-day data-selected "false" (the
              same effect as re-activating that cell directly) and removes
              this instance from the DOM. Calls no public operation.
          rangeSelection:
            description: >-
              Added 2026-09-12 (ADR-0054 decision 3) -- same rationale and
              same set of acceptable input methods as
              organizerGatheringCreate.calendar.rangeSelection above,
              applied to gathering-add-candidate-date-day cells.
            requirement: >-
              Same requirement as organizerGatheringCreate.calendar.
              rangeSelection.requirement above, applied to
              gathering-add-candidate-date-day.
          dayCell:
            testId: gathering-add-candidate-date-day
            cardinality: one-or-more-elements-sharing-this-test-id
            attributes:
              date: data-date
              selected: data-selected
              holiday: data-holiday
            requirement: >-
              data-date is an ISO-8601 date string (YYYY-MM-DD, no time
              component) identifying the calendar day this cell represents.
              data-selected is "true"/"false", reflecting this cell's
              current pending-selection state (client-side only, not yet
              submitted). Multiple cells may simultaneously carry
              data-selected="true" (multi-select, TDR-GTH-46 -- the
              population of *how many* may be simultaneously selected is
              not capped by this contract, mirroring addCandidateDates'
              own uncapped `candidateDates` array). **data-holiday added
              2026-09-16 (ADR-0060 decision 2)**: same meaning as
              organizerGatheringCreate.calendar.dayCell.attributes.holiday
              above -- this product's own bundled Japan public holiday
              data, never an external service call.
            disabledState: >-
              Carries the native disabled state for any day whose data-date
              is today or earlier by the server's clock (adr/0049 decision
              3's "明日以降のみ" rule mirrored client-side; the API's
              CANDIDATE_DATE_NOT_IN_FUTURE rejection remains the
              authoritative enforcement -- this disabledState is a UX
              affordance only, same disable-at-the-boundary convention as
              review.confirm.disabledState). **Also carries the native
              disabled state for any day that is a Saturday or Sunday, or
              whose data-holiday above is "true" (added 2026-09-16,
              ADR-0060 decision 1/2) -- same rule and same rationale as
              organizerGatheringCreate.calendar.dayCell.disabledState
              above. The API's new CANDIDATE_DATE_NOT_A_BUSINESS_DAY
              rejection remains the authoritative enforcement,
              TDR-GTH-57/58.** A disabled day cell can never carry
              data-selected="true", regardless of which of these
              conditions caused the disabling.
            select:
              purpose: gathering-add-candidate-date-day-select
              requiredOutcome: >-
                Activating an enabled gathering-add-candidate-date-day
                toggles its own data-selected between "true" and "false"
                (TDR-GTH-46's multi-select). This is client-side pending
                selection only -- it calls no public operation (the same
                pending-toggle precedent gathering-open-shop-select
                established before its own 2026-09-09 retirement,
                unavailableControls.operationalControlScope). submit.
                disabledState below reflects the current count of "true"
                day cells.
        submit:
          testId: gathering-add-candidate-date-submit
          purpose: gathering-add-candidate-date-submit
          disabledState: >-
            Carries the native disabled state whenever fewer than 1
            gathering-add-candidate-date-day currently has
            data-selected="true" (adr/0049 decision 3:
            AddCandidateDatesRequest.candidateDates has minItems: 1).
          requiredOutcome: >-
            Activating it (while not disabled) calls addCandidateDates
            (adr/0049 decision 3, replacing the retired singular
            addCandidateDate) with candidateDates built from every
            gathering-add-candidate-date-day whose data-selected is "true"
            (each producing one CandidateDateInput; this contract does not
            fix or require a way to edit each selected day's time-of-day
            separately from the calendar's own default, adr/0049 decision
            3's "12:00始まり" UI aid). On success, exactly one new
            gathering-candidate-date appears in gathering-candidate-date-list
            per newly added candidate date (ordering per
            candidateDateList.orderingInvariant), the gathering's phase is
            unchanged, every gathering-add-candidate-date-day's
            data-selected resets to "false", and
            gathering-add-candidate-date-form remains present for the next
            entry. On a whole-batch DUPLICATE_CANDIDATE_DATE rejection
            (adr/0049 decision 3: any one selected day duplicating an
            existing candidate date or another selected day rejects the
            entire batch, no partial success -- TDR-GTH-46), the form
            remains present with every day cell's data-selected unchanged
            and no new gathering-candidate-date appears. On a whole-batch
            CANDIDATE_DATE_NOT_IN_FUTURE rejection (TDR-GTH-47), the same:
            the form remains present with selections unchanged and no new
            gathering-candidate-date appears.
        cancel:
          testId: gathering-add-candidate-date-cancel
          purpose: gathering-add-candidate-date-cancel
          requiredOutcome: >-
            Activating it makes gathering-add-candidate-date-form absent
            (discarding every gathering-add-candidate-date-day's pending
            data-selected state) and gathering-add-candidate-date-open
            reachable again, without calling addCandidateDates.
    tentativeSelectionAndPreview:
      description: >-
        The "simultaneous decision" flow (同時決め, human addition
        2026-08-30, adr/0035 decision 1 item 1). Tentatively selecting a
        candidate-date never calls confirmCandidateDate and never changes
        Gathering.phase; it only reveals a preview and toggles
        data-tentative-selected.
      trigger:
        testId: gathering-candidate-date
        purpose: gathering-candidate-date-tentative-select
        presenceRuleForPurpose: >-
          This purpose is only activatable while phase is SCHEDULING;
          once phase is SELECTING_SHOP or FINALIZED, the
          gathering-candidate-date element remains present (as a record,
          see candidateDate.requirement above) but no longer accepts this
          activation (Organizer.dc.html state② shows the confirmed-date
          panel with no tentative-select affordance -- stated explicitly
          here while closing the FINALIZED observation gap, adr/0042).
        requiredOutcome: >-
          While phase is SCHEDULING, exactly one gathering-candidate-date's
          data-tentative-selected becomes "true" (any previously "true"
          element becomes "false"); gathering-open-shop-preview becomes
          present, scoped to that same candidate date; Gathering.phase is
          unchanged; no request to confirmCandidateDate is made.
      preview:
        testId: gathering-open-shop-preview
        attributes:
          candidateDateId: data-candidate-date-id
          openShopCount: data-open-shop-count
        requirement: >-
          **Narrowed 2026-09-09 (adr/0049 decision 2, 2026-09-08 human
          decision: 日程を聞いている段階の店は件数だけ)**: this element no
          longer carries any item/list sub-structure -- the previously
          required gathering-open-shop-preview-item list (and its name/
          genre/capacityTier/nonSmokingStatus/dinnerBudgetTier fields) is
          retired along with the OpenShopPreviewItem schema it projected
          (gathering-scheduling-api.yaml). data-open-shop-count equals
          CandidateDateOpenShopPreview.openShopCount exactly (TDR-GTH-08:
          "その日に開いている店の件数が示される。店名やその他の店舗情報は
          示されない") -- no shop name or other shop attribute is present
          anywhere inside gathering-open-shop-preview, a stronger
          prohibition than this file previously stated (which permitted an
          optional name/detail list).
    shopSelectionEntry:
      description: >-
        **Replaces shortlistSelection 2026-09-09 (adr/0049 decision 1,
        2026-09-08 human decision: "1枚目の画面の存在価値がなくなってない？
        （重複しているように思える）")**. This contract previously defined a
        separate, narrower shop-checklist screen here (PickFive.dc.html 案A)
        duplicating candidate-search's filters/map/walking-radius rings in a
        degraded form; the organizer now performs shop selection exclusively
        from candidate-search-browser-interface.yaml's gatheringMode, which
        this single entry point reaches. This section defines only the
        entry point itself -- the shop-picking surface it navigates to is
        entirely owned by that other contract file (see its gatheringMode
        section for the band, per-card toggle, and 5-shop-cap disabling this
        file no longer duplicates).
      requiredTestIds:
        open: gathering-shortlist-open
      presenceRule: >-
        Present exactly while phase is SELECTING_SHOP (absent while
        SCHEDULING or FINALIZED, matching finalizedSummary's removal of
        every remaining operational control). Unlike this file's original
        shortlistSelection/shortlistedShopVotes.replaceOpen split, this is
        now the dashboard's **only** entry point into shop selection --
        reachable both before any shop has ever been added to this
        gathering (Gathering.shortlistedShops empty, votingStartedAt null,
        Organizer.dc.html's very first state② render) and afterward (D7
        replace, votingStartedAt non-null, Organizer.dc.html state②'s "店を
        絞りなおす"/"5件を差し替える"). shortlistedShopVotes below (the
        vote-tally view) remains independently gated on votingStartedAt
        being non-null and is simply absent, not replaced by this element,
        before the first shop is ever added.
      open:
        testId: gathering-shortlist-open
        purpose: gathering-shortlist-open
        cardinality: >-
          one-or-more-elements-sharing-this-test-id -- Organizer.dc.html
          state② shows two differently-labeled buttons ("店を選ぶ"/"店を
          絞りなおす"/"5件を差し替える" depending on whether any shop has
          been added yet) in the same panel; this contract does not
          distinguish them and treats all as instances of the same entry
          point (architect design judgment, FR-028 -- carried over unchanged
          from this purpose's original shortlistedShopVotes.replaceOpen
          treatment, flagged for human confirmation there since
          2026-09-04).
        requiredOutcome: >-
          **Changed 2026-09-09 (adr/0049 decision 1)**: activating it no
          longer reopens this file's own (now-retired) shortlistSelection
          list. It navigates to candidate-search-browser-interface.yaml's
          gatheringMode, carrying this gathering's id (that contract's own
          gatheringMode section, adr/0049 decision 1's cross-file
          navigation target) -- this contract does not fix the exact
          navigation mechanism (e.g. a URL query parameter), the same way
          candidate-search-browser-interface.yaml's own gatheringMode
          description does not fix it from the other direction. Every shop
          toggled "in"/"out" on that screen calls setShortlistedShops
          exactly as this file's own retired shortlistSelection.submit
          used to (gathering-scheduling-api.yaml's operation and its
          1-to-5-entry, complete-replacement shape are unchanged, adr/0049
          decision 1) -- only the screen making that call moved. On return
          to this dashboard, shortlistedShopVotes.list (below) reflects the
          gathering's current shortlistedShops.
    shortlistedShopVotes:
      description: >-
        The vote-tally view once voting has started (Organizer.dc.html
        state②, "お店の候補" panel). Present once Gathering.votingStartedAt
        is non-null -- reached via shopSelectionEntry above (which replaced
        this file's own now-retired shortlistSelection picker, adr/0049
        decision 1). Supports TDR-GTH-31/32/33/40 (this round's map/detail
        additions below also anticipate TDR-GTH-38/39 once
        gathering-scheduling.feature's own text is rewritten to include
        this view -- contracts/REVISION-PLAN.md 5節 item 4 -- not done in
        this round; those scenarios' current Given/When still name only
        the open-shop selection surface, so this contract does not yet
        claim to satisfy them from this view). **Changed 2026-09-12
        (ADR-0055 decision 5 / ADR-0056 decision 5, human decision)**: this
        view now shows each shop's name, walking-time estimate, a map, and
        a link to the shop's provider page -- see item.detailFields below.
        This reverses this contract's own 2026-09-05 decision to exclude
        them (adr/0044 decision 4 / adr/0046 decision 2, recorded then as
        "a designer decision this contract reflects, not an oversight"):
        product-brief.md §2/§3 already document this view as showing map
        and shop information the same way the shop-selection screen and
        the participant's vote screen do; the human, looking at the actual
        screen with this asymmetry in it, judged it looked wrong
        ("ぱっと見違和感ない" 判断の裏返し) and this ADR reverses the
        earlier exclusion -- the explanation document is treated as
        correct and the contract as having been in error (ADR-0055
        decision 5).
      requiredTestIds:
        list: gathering-shortlisted-shop-list
      presenceRule: >-
        Present whenever Gathering.votingStartedAt is non-null AND
        Gathering.finalizedShopId is null (i.e. phase is SELECTING_SHOP;
        absent again once phase is FINALIZED). **Changed 2026-09-17
        (ADR-0062 decision 4, human decision, board D4: 「決まった店と集まる
        場所だけ」)**: until this decision, list/item remained present
        without finalizeSelect once FINALIZED, as a frozen "vote record"
        panel (adr/0042). The human has now seen the finalized organizer
        dashboard in its real-machine board form and chosen the same
        simplification ADR-0061 decision 5 made for the participant's
        equivalent screen -- only the decided shop remains, not the other
        four shops' names/tallies. See finalizedSummary.decisionBanner below
        for the decided shop's own name/map/page-link, which do not
        duplicate this list's data but are populated from the same
        Gathering.shortlistedShops entry (matched by shopId ==
        finalizedShopId) this list itself has always read. Absent before
        the first successful setShortlistedShops call (see
        shopSelectionEntry above for the only entry point into making that
        first call).
      list:
        testId: gathering-shortlisted-shop-list
        orderingInvariant: >-
          DOM order of gathering-shortlisted-shop-item children equals
          Gathering.shortlistedShops' order (`wantToGoCount + okToGoCount`
          descending, Organizer.dc.html: "並び: 許容が多い順（行きたい＋
          行ってもいい）"). **Fixed 2026-09-05 (adr/0044 decision 3)**: this
          contract previously described this order as a single
          `approvalCount` descending, matching a since-retired API field;
          gathering-scheduling-api.yaml now sums two three-tier tiers
          (`wantToGoCount + okToGoCount`, human decision: a shop someone is
          merely "OK with" should count toward "how many people can make
          it" the same as an enthusiastic "want to go" -- an in-progress
          draft had instead ordered by `wantToGoCount` alone, which this
          revision corrects). **Ties broken 2026-09-06 (adr/0048)** by
          distance from the private search origin ascending (near-first,
          matching participantAnswer.shopVoteQuestion's own basis below),
          then by shopId ascending -- `addedAt`, this list's earlier
          implicit tie-break, is not usable alone because every shop set by
          the same setShortlistedShops call shares one identical `addedAt`
          value. No control in this list may claim the
          forbidden manual-ordering purpose (already generalized to cover
          this list without a contract edit, ADR-0036 design judgment 3 /
          this file's forbiddenPurposesNote).
        item:
          testId: gathering-shortlisted-shop-item
          cardinality: zero-to-five-elements-sharing-this-test-id
          attributes:
            shopId: data-shop-id
            name: data-shop-name
            walkingTimeMinutes: data-walking-time-minutes
            wantToGoCount: data-want-to-go-count
            okToGoCount: data-ok-to-go-count
            notGoingCount: data-not-going-count
            respondedCount: data-responded-count
            currentLeader: data-current-leader
          requirement: >-
            One element per Gathering.shortlistedShops entry.
            **data-shop-name/data-walking-time-minutes added 2026-09-12**
            (ADR-0055 decision 5 / ADR-0056 decision 5, human decision):
            equal to ShortlistedShop.name/walkingTimeMinutes exactly -- both
            fields already existed on this schema (adr/0044); this round
            adds only the DOM observation of them here, no API change (see
            this section's own description above for why this view now
            shows them at all). data-want-to-go-count/data-ok-to-go-count/
            data-not-going-count/data-responded-count mirror
            ShortlistedShop.wantToGoCount/okToGoCount/notGoingCount/
            respondedParticipantCount exactly (D7's per-shop denominator --
            these counts may differ between items, e.g. a newly
            replaced-in shop showing a smaller data-responded-count than
            the others, TDR-GTH-31/32). **Fixed 2026-09-05 (adr/0044)**:
            this contract previously exposed a single, since-retired
            `approvalCount`/data-approval-count; the three attributes above
            replace it, matching gathering-scheduling-api.yaml's
            goingCount/maybeCount/notGoingCount-shaped three-tier tally
            (TDR-GTH-40: "店ごとに『行きたい／行ってもいい／むり』の内訳が、
            その店に回答した人数を分母にして示される").
            `wantToGoCount + okToGoCount + notGoingCount` always equals
            data-responded-count for the same item. **data-current-leader
            corrected 2026-09-12 (ADR-0055 decision 6, human decision,
            overturning the 2026-09-09 original, adr/0050 decision 5)**:
            when data-responded-count is "0" for a given item, that item's
            data-current-leader is "false" regardless of DOM position --
            the original rule made the first item in this list's own
            orderingInvariant order "true" unconditionally, which produced
            a false signal for an entirely unanswered shop ("誰も答えて
            いないのに票がいちばん多い", the human's own report). Among
            items whose data-responded-count is not "0", data-current-
            leader is "true" for every item whose
            `wantToGoCount + okToGoCount` equals the highest such value
            among all items in this list (a tie produces more than one
            "true" item, all of them), and "false" for every other item --
            the list's existing tie-break (distance from the search origin
            ascending, then shopId ascending, adr/0044/adr/0048) continues
            to govern this list's own DOM order only and is not used to
            single out one winner among tied leaders. This is independent
            of finalizeSelect below (the shop the organizer is currently
            choosing to finalize) -- the two need not agree, since votes
            and the organizer's own decision are separate signals.
            **data-added-after-voting-started retired 2026-09-17** (ADR-0062
            decision 1, human decision, board D1: 「あとから入りました」は
            出さない). This attribute (added 2026-09-12, ADR-0056 decision
            6, and mirrored to the participant side 2026-09-13 the same
            decision) is removed from this element -- the human, looking at
            the real-machine board for this row, judged the badge
            unnecessary; the mirrored participant-facing attribute and the
            underlying `ParticipantShopVoteOption.addedAfterVotingStarted`
            API field are retired the same round (see
            participantAnswer.shopVoteQuestion.attributes below and
            gathering-scheduling-api.yaml's own ADR-0062 diff). This also
            closes the pending question activeContext.md had recorded
            ("会モードの候補画面のカードに「あとから入りました」の印を出す
            か") -- the answer is no, on neither screen. See detailFields
            below for the map/provider-page-link/walking-time/genre/
            capacity/non-smoking/dinner-budget surfaces this section's own
            description above introduces.
          detailFields:
            description: >-
              Added 2026-09-12 (ADR-0055 decision 5 / ADR-0056 decision 5,
              human decision) -- see gathering-shortlisted-shop-item's own
              requirement above for data-shop-name/data-walking-time-
              minutes. The map and provider-page-link surfaces below are
              this section's remaining new observation surfaces, mirroring
              participantAnswer.shopVoteQuestion.shopVoteMap/detailFields'
              own shape and the same "検索基点は出さない" constraint
              (adr/0046 decision 2) -- this view is an authenticated
              organizer screen where the search origin is already disclosed
              elsewhere, so the constraint here narrows the map's role to
              "shops' own relative position" rather than protecting
              non-disclosure. **Extended 2026-09-17 (ADR-0062 decision 1,
              human decision, board D1 lists ジャンル・席・禁煙・予算・
              徒歩約◯分 among this row's visible fields)**: walkingTime/
              genre/capacityTier/nonSmokingStatus/dinnerBudgetTier below are
              this round's own additions, mirroring
              participantAnswer.shopVoteQuestion.detailFields' equivalent
              fields exactly for capacityTier/nonSmokingStatus/
              dinnerBudgetTier -- except genre, which this view now
              requires where the participant-facing view still does not (a
              deliberate, scoped-to-this-round asymmetry; see ADR-0062
              "検討した代替案").
            walkingTime:
              testId: gathering-shortlisted-shop-walking-time
              formControl: false
              requirement: >-
                Visible text must include both an approximation marker
                (mirrors candidate-search-browser-interface.yaml's
                walkingTimeEstimateWording, adr/0025 decision 2) and the
                word 徒歩, e.g. 「徒歩 約12分」 (human decision 2026-09-17,
                board D1: 「◯分」→「徒歩◯分」). This is a content
                requirement layered on the same value item.attributes.
                walkingTimeMinutes (data-walking-time-minutes) above
                already fixes -- this element carries no data attribute of
                its own, only the visible-text constraint (same division of
                labor candidate-search-browser-interface.yaml's own
                walkingTimeEstimateWording establishes between a raw
                attribute and the wording decorating it).
            genre:
              testId: gathering-shortlisted-shop-genre
              formControl: false
            capacityTier:
              testId: gathering-shortlisted-shop-capacity-tier
              formControl: false
            nonSmokingStatus:
              testId: gathering-shortlisted-shop-non-smoking
              formControl: false
            dinnerBudgetTier:
              testId: gathering-shortlisted-shop-dinner-budget
              formControl: false
            requirement: >-
              Each of genre/capacityTier/nonSmokingStatus/dinnerBudgetTier
              above has its test id present for every
              gathering-shortlisted-shop-item currently rendered (no
              data-value-state attribute required -- same convention
              participantAnswer.shopVoteQuestion.detailFields already uses
              for its own capacityTier/nonSmokingStatus/dinnerBudgetTier).
            map:
              testId: gathering-shortlisted-shop-map
              formControl: false
              presenceRule: >-
                Same presenceRule as gathering-shortlisted-shop-list itself
                (present whenever Gathering.votingStartedAt is non-null).
              scope: >-
                Shows only each currently rendered gathering-shortlisted-
                shop-item's own pin -- never the private search origin and
                never a walking-radius ring (same scope restriction
                organizerDashboard.shopSelectionEntry's own now-retired map
                observed, adr/0049 decision 1, for the shop-selection
                screen this dashboard no longer owns).
              marker:
                testId: gathering-shortlisted-shop-map-marker
                formControl: false
                attributes:
                  shopId: data-shop-id
                cardinality: zero-to-five-elements-sharing-this-test-id
                requirement: >-
                  One marker per gathering-shortlisted-shop-item currently
                  rendered, correlated by data-shop-id. Positioned from
                  ShortlistedShop.location. Display-only.
            providerPageLink:
              testId: gathering-shortlisted-shop-page-link
              formControl: false
              requirement: >-
                An `<a href>` whose href equals ShortlistedShop.
                providerPageUrl for this same item. Implemented as a plain
                anchor -- outside forbiddenFormControlCategories' scan
                (unavailableControls.formControlExemptTestIds), the same
                precedent participantAnswer.shopVoteQuestion.detailFields.
                providerPageLink already establishes.
          finalizeSelect:
            testId: gathering-finalize-shop-select
            purpose: gathering-finalize-shop-select
            attribute: data-finalize-selected
            presenceRule: >-
              Present while phase is SELECTING_SHOP; absent once phase is
              FINALIZED -- moot once FINALIZED regardless, since the whole
              gathering-shortlisted-shop-list/-item this control lived
              inside is itself absent by then (**changed 2026-09-17,
              ADR-0062 decision 4** -- see shortlistedShopVotes.
              presenceRule above; superseding this line's earlier
              "Final.dc.html A③'s vote-record panel has no radio controls"
              framing, which assumed the list/item remained present
              without this control).
            requiredOutcome: >-
              Activating it makes this item's data-finalize-selected "true"
              and every other gathering-shortlisted-shop-item's
              data-finalize-selected "false" (at most one true at a time,
              Organizer.dc.html's radio group). Client-side pending
              selection only -- calls no public operation.
              gathering-finalize-open's disabledState below reflects
              whether any item currently has data-finalize-selected="true"
              (renamed 2026-09-12 from gathering-finalize-submit, ADR-0054
              decision 5 -- see shortlistedShopVotes.finalizeOpen below).
      finalizeOpen:
        testId: gathering-finalize-open
        purpose: gathering-finalize-open
        presenceRule: >-
          Present while phase is SELECTING_SHOP and
          Gathering.shortlistedShops is non-empty; absent once phase is
          FINALIZED.
        disabledState: >-
          Carries the native disabled state whenever no
          gathering-shortlisted-shop-item currently has
          data-finalize-selected="true".
        requiredOutcome: >-
          **Restructured 2026-09-12 (ADR-0054 decision 5, human decision:
          confirmation follows the same open-then-confirm, two-step
          pattern this contract already establishes for deleteGathering)**:
          activating it (while not disabled) reveals
          gathering-finalize-confirm-dialog. Calls no public operation --
          finalizeGathering itself is called only by finalizeConfirm below,
          replacing this contract's original single-activation
          finalizeSubmit.
      finalizeConfirmDialog:
        testId: gathering-finalize-confirm-dialog
        presenceRule: >-
          Absent until gathering-finalize-open is activated. Present after
          activation. Absent again after gathering-finalize-cancel is
          activated, or after a successful gathering-finalize-confirm.
        confirmSummary:
          description: >-
            **Replaced 2026-09-17 (ADR-0062 decision 3, human decision, board
            D3: 「日時とお店があればいい。参加者は書かなくていい」)**: this
            dialog no longer shows a three-row before/after changes table
            (ADR-0054 decision 5 / ADR-0056 decision 11, this file's own
            gathering-finalize-confirm-changes) -- it shows the two facts
            board D3 asked for and nothing else: the candidate date about to
            be confirmed, and the shop about to be finalized. Neither the
            participant-link-issuance nor participant-screen rows' before/
            after prose survives this decision, nor does any "before" state
            for date/shop (this dialog opens only from SELECTING_SHOP, where
            no date/shop has been finalized yet, so a "before" state was
            always the fixed string "未確定" -- board D3 judged this fixed,
            uninformative value not worth a row).
          date:
            testId: gathering-finalize-confirm-date
            formControl: false
            attributes:
              confirmedCandidateDate: data-confirmed-candidate-date
            requirement: >-
              Present whenever gathering-finalize-confirm-dialog is present.
              data-confirmed-candidate-date equals the same confirmed
              candidate date confirmDate.requiredOutcome already fixed when
              phase advanced past SCHEDULING (unchanged by this dialog --
              confirming a date and finalizing a shop are different
              operations, ADR-0041 P6).
          shop:
            testId: gathering-finalize-confirm-shop
            formControl: false
            attributes:
              shopId: data-shop-id
              name: data-shop-name
            requirement: >-
              Present whenever gathering-finalize-confirm-dialog is present.
              Equals the gathering-shortlisted-shop-item that carried
              data-finalize-selected="true" at the moment gathering-
              finalize-open was activated (the same item finalizeConfirm
              below will call finalizeGathering with) -- shopId/name mirror
              that item's own data-shop-id/data-shop-name exactly. This
              contract does not define behavior for changing the pending
              selection while this dialog is itself open, since no control
              for doing so exists within the dialog.
      finalizeConfirm:
        testId: gathering-finalize-confirm
        purpose: gathering-finalize-confirm
        requiredOutcome: >-
          Activating it (while gathering-finalize-confirm-dialog is
          present) calls finalizeGathering with the selected item's shopId.
          On success, phase becomes FINALIZED (TDR-GTH-33);
          gathering-finalize-confirm-dialog, gathering-finalize-open, every
          finalizeSelect, gathering-shortlist-open,
          gathering-add-candidate-date-open, gathering-confirm-date-select,
          gathering-candidate-date-remove, gathering-participant-link-copy,
          and every gathering-participant-link-item's revoke control all
          become absent (see finalizedSummary below). gathering-delete-open
          is unaffected -- deletion remains available regardless of phase
          (see deleteGathering below).
      finalizeCancel:
        testId: gathering-finalize-cancel
        purpose: gathering-finalize-cancel
        requiredOutcome: >-
          Activating it makes gathering-finalize-confirm-dialog absent
          without calling finalizeGathering. Every gathering-shortlisted-
          shop-item's data-finalize-selected is unaffected (the organizer's
          pending selection survives cancellation, so re-opening
          gathering-finalize-open shows the same selection).
    confirmDate:
      testId: gathering-confirm-date-select
      purpose: gathering-confirm-date-select
      description: >-
        The "この日にする" operation (product-brief.md §2, one of the two
        phase-advancing operations; amended 2026-09-03, P6/adr/0041, from
        an earlier draft that described three -- gathering-scheduling-
        api.yaml's confirmCandidateDate).
      presenceRule: >-
        Present only while phase is SCHEDULING; absent once phase is
        SELECTING_SHOP or FINALIZED (confirmCandidateDate has been rejected
        outside SCHEDULING since ADR-0035, but this contract had not
        previously stated the control's own presence rule -- stated here
        while closing the FINALIZED observation gap, adr/0042;
        Organizer.dc.html state②'s footer replaces this button entirely
        with shopSelectionEntry.open/shortlistedShopVotes.finalizeSubmit).
      disabledState: >-
        While present, carries the native disabled state whenever no
        gathering-candidate-date currently has data-tentative-selected="true"
        (mirrors candidate-search-browser-interface.yaml's
        deckNavigation.disabledState convention for a boundary condition
        rather than removing the control).
      requiredOutcome: >-
        Activating it while a candidate date is tentatively selected calls
        confirmCandidateDate with that date's id. On success,
        gathering-phase-indicator's data-gathering-phase becomes
        SELECTING_SHOP, the confirmed gathering-candidate-date's
        data-confirmed becomes "true", and every other
        gathering-candidate-date's data-confirmed remains "false".
        gathering-open-shop-preview and every gathering-candidate-date's
        data-tentative-selected are unaffected by this call itself (adr/0035
        decision 1 item 1: tentative selection is independent client state).
    participantLinkCopy:
      testId: gathering-participant-link-copy
      purpose: gathering-participant-link-copy
      designNote: >-
        Organizer.dc.html shows one "回答リンクをコピー" control, not a
        count input, while issueParticipantLinks accepts a batch `count`.
        This contract adopts the "1クリック=1本" operating model: each
        activation issues exactly one new link (count: 1), which the
        organizer copies and hands to one participant individually (e.g. via
        Slack or email, outside this product). Confirmed by human decision
        2026-08-30 (ADR-0036 decision 4, option A) -- this is not an
        unresolved gap between the screen and the API; the API's `count`
        parameter remains able to accept a larger value as schema headroom
        for a possible future bulk-issuance screen, but this slice's screen
        and this contract only ever call it with count: 1.
      presenceRule: >-
        Present while phase is SCHEDULING or SELECTING_SHOP; absent once
        phase is FINALIZED (P4, 2026-09-03, adr/0041/adr/0042: Final.dc.html
        A③'s header no longer shows this control at all, unlike
        recopy/revoke's finer-grained treatment below -- "もう発行しない
        （会が締まっている）"). Contrast with participantLinkList.item.recopy
        below, which remains present and enabled regardless of phase.
      requiredOutcome: >-
        Activating it calls issueParticipantLinks with count: 1.
        Gathering.totalIssuedParticipantLinks and activeParticipantLinkCount
        each increase by exactly 1. A new gathering-participant-link-item
        also appears in gathering-participant-link-list (see
        participantLinkList below), since issuing and listing share the
        same underlying data. **Changed 2026-09-17 (ADR-0061 decision 1,
        human decision: 「発行で小窓が開き、そこでコピー」)**: this
        activation no longer writes to the clipboard itself and no longer
        exposes data-issued-link-url on this element. Instead it reveals
        issueDialog below, which carries the returned
        IssuedParticipantLink.url value. ADR-0058's original "must also
        write that same URL to the browser clipboard" requirement quoted
        below described the single-step design this decision replaces, not
        the current one -- that Must is superseded by issueDialog.
        dialogCopy's own requiredOutcome, not removed; it only moves.
        Because acceptance automation cannot reliably read the OS clipboard
        (ADR-0058's original rationale, unchanged), correctness is still
        asserted via a data-issued-link-url attribute -- see issueDialog
        below for exactly where that attribute now lives.
      issueDialog:
        testId: gathering-participant-link-issue-dialog
        presenceRule: >-
          Added 2026-09-17 (ADR-0061 decision 1). Absent until
          participantLinkCopy above is activated. Present immediately after
          that activation, carrying a data-issued-link-url attribute equal
          to the exact IssuedParticipantLink.url value that activation's
          call to issueParticipantLinks returned. Absent again once
          dialogCopy or dialogClose below is activated -- either one closes
          this dialog; this contract does not require both to be offered,
          only that activating whichever the implementation provides closes
          it.
        dialogCopy:
          testId: gathering-participant-link-issue-dialog-copy
          purpose: gathering-participant-link-issue-dialog-copy
          requiredOutcome: >-
            Activating it writes issueDialog's own data-issued-link-url
            value to the browser clipboard (e.g.
            navigator.clipboard.writeText) -- **this is where the Must
            ADR-0058 established for participantLinkCopy's own activation
            now lives** (2026-09-17, ADR-0061 decision 1, reassigning
            rather than retracting that Must). Same silent-failure handling
            ADR-0058 established: if the browser rejects the call or lacks
            the Clipboard API, this contract requires no visible notice,
            retry affordance, or other on-screen text about that failure
            (FR-034: no explanatory prose in shipped screens); the write is
            best-effort, its failure is silent, and data-issued-link-url
            remains the attribute this contract requires L4 to assert
            against regardless of whether the clipboard write succeeded.
            This does not itself make issueDialog absent -- see dialogClose
            below for the only activation this contract requires to close
            it. This contract does not fix the visible text a successful
            write may show (e.g. 「✓ コピーしました」) -- same non-binding
            wording latitude as this file's "N件" precedent (ADR-0060
            decision 9).
        dialogClose:
          testId: gathering-participant-link-issue-dialog-close
          purpose: gathering-participant-link-issue-dialog-close
          requiredOutcome: >-
            Activating it makes issueDialog absent. Calls no public
            operation, and does not affect data-issued-link-url,
            Gathering.totalIssuedParticipantLinks, or
            activeParticipantLinkCount. This contract does not fix whether
            an implementation offers one control or two redundant controls
            for this outcome (the board's separate 「閉じる」 text control
            and 「×」 icon control) -- only that activating whichever is
            offered yields this outcome.
    participantLinkList:
      description: >-
        The link-management surface (ADR-0036 decision 7, human concern
        2026-08-30: "リンクがわからなくなったら管理されなくなっちゃうかもね").
        Supports TDR-GTH-16 through TDR-GTH-20, and TDR-GTH-36 (P4,
        recopy remains available post-FINALIZED).
      testId: gathering-participant-link-list
      issuanceClosed:
        testId: gathering-participant-link-issuance-closed
        presenceRule: >-
          Added 2026-09-12 (ADR-0056 decision 11, human decision). Present
          exactly when phase is FINALIZED (the same condition under which
          gathering-participant-link-copy becomes absent,
          participantLinkCopy.presenceRule above) -- a short badge inside
          this panel's own heading marking that issuance itself has ended,
          distinct from participantLinkCopy's own absence, which by itself
          carried no visible signal that it was gone on purpose rather
          than a bug.
        requirement: >-
          This contract does not fix the visible text, only that this
          element exists exactly when phase is FINALIZED and does not
          exist otherwise.
      orderingInvariant: >-
        DOM order of gathering-participant-link-item children equals
        listParticipantLinks' response order (issuedAt ascending, 発行順,
        ties broken by id ascending, adr/0048,
        gathering-scheduling-api.yaml). Revoked links remain present in this
        list (see item.attributes.revoked below) -- they are never removed
        from the DOM by this contract, only marked. No control in this list
        may claim the forbidden manual-ordering purpose (see
        unavailableControls above). This list itself remains present
        regardless of phase, including FINALIZED (Final.dc.html A③'s "発行
        済みリンク" panel is this same list, read-only except for recopy,
        adr/0042).
      item:
        testId: gathering-participant-link-item
        attributes:
          id: data-participant-link-id
          issuedAt: data-issued-at
          hasResponded: data-has-responded
          revoked: data-revoked
          named: data-participant-named
        requirement: >-
          One element per ParticipantLinkSummary. data-participant-link-id
          equals its `id` (the organizer-facing linkId, never the
          participant token -- ADR-0036 decision 7's ParticipantLinkId
          design). data-issued-at is an ISO-8601 string equal to `issuedAt`.
          data-has-responded and data-revoked are "true"/"false" strings
          equal to `hasResponded`/`revoked`. data-participant-named is
          "false" exactly when `displayName` is null, "true" otherwise (same
          vocabulary as nameControl.status below); this element does not
          require the name's exact text to be machine-asserted (TDR-GTH-16
          only requires "名無しを含む" distinguishability, not text
          equality), though an implementation may additionally show the
          name's visible text inside this item without contract obligation.
          Never carries a token or URL attribute (see this file's header
          comment and gathering-scheduling-api.yaml's ParticipantLinkSummary
          -- token/URL re-exposure is scoped to recopy alone).
        recopy:
          testId: gathering-participant-link-recopy
          purpose: gathering-participant-link-recopy
          disabledState: >-
            Carries the native disabled state whenever this item's
            data-revoked is "true" (a revoked link has nothing left to
            re-copy). Not gated by data-has-responded -- recopy is allowed
            for answered and unanswered links alike (ADR-0036 decision 7).
            **Not gated by phase either** (P4, 2026-09-03, adr/0041/adr/0042):
            this remains the only disabledState condition even once phase
            is FINALIZED -- recopy stays reachable so a lost link can still
            be used to see the decision (Final.dc.html A③'s "決定を見せ直す
            ためだけに残しています").
          requiredOutcome: >-
            Activating it (while not disabled) calls recopyParticipantLink
            for this item's linkId. Exposes the returned URL via a
            data-issued-link-url attribute on this same recopy element
            (same convention as participantLinkCopy above). Does not change
            data-has-responded, data-revoked, data-issued-at, or
            Gathering.totalIssuedParticipantLinks/activeParticipantLinkCount
            (TDR-GTH-17: "そのリンクの回答状況は変わらない"; TDR-GTH-36:
            this also holds once phase is FINALIZED). A participant
            re-visiting with the re-copied URL after FINALIZED reaches
            participantAnswer.finalizedView below. **Must also write that
            same URL to the browser clipboard** (2026-09-14 addendum 17,
            ADR-0058: real-machine feedback 2026-09-14 found this element
            called recopyParticipantLink and set data-issued-link-url but
            never wrote to the clipboard, in any phase, so a person
            pressing it found nothing to paste): same convention and the
            same silent-failure handling as participantLinkCopy.
            requiredOutcome above, including once phase is FINALIZED
            (TDR-GTH-36).
        revoke:
          testId: gathering-participant-link-revoke
          purpose: gathering-participant-link-revoke
          presenceRule: >-
            Present only for a row whose data-has-responded is "false" and
            data-revoked is "false", and only while phase is SCHEDULING or
            SELECTING_SHOP (absent once phase is FINALIZED, P4, 2026-09-03,
            adr/0041/adr/0042: Final.dc.html A③ shows only a re-copy button
            per row, no revoke). **Changed 2026-09-12 (ADR-0055 decision 2,
            human decision, overturning this file's original disable-at-
            the-boundary treatment for this control specifically)**: an
            answered or already-revoked row no longer carries a disabled
            revoke control -- the element itself is absent from that row's
            DOM, not merely disabled. The organizer's link-management table
            (ADR-0056 decision 1, organizerDashboard.responseTable) reshapes
            this list into one row per person and one column per candidate
            date; a disabled revoke control sitting in every already-
            answered row filled that table with unusable noise (the
            human's own reasoning, ADR-0055 decision 2). This departure
            from the "disable, don't remove" convention this contract
            otherwise follows (confirmDate.disabledState,
            gathering-add-candidate-date-open and other boundary
            conditions) is deliberate and scoped to this control alone --
            it does not change any other element's presence/disable
            treatment.
          requiredOutcome: >-
            Activating it (only reachable per presenceRule above) calls
            revokeParticipantLink for this item's linkId. On success, this
            item's data-revoked becomes "true" (and, per presenceRule
            above, this same revoke control becomes absent from this row);
            gathering-unanswered-summary's data-revoked-links,
            data-active-issued-links, and data-unanswered-count all refresh
            to reflect one fewer active link (TDR-GTH-18) without requiring
            a full page reload (renderModel).
    responseTable:
      description: >-
        Added 2026-09-12 (ADR-0056 decision 1, human decision: 行が人、列が
        候補日の表). Realizes the individual-response visibility ADR-0055
        decision 4 opened -- until now the organizer could see only
        aggregate per-candidate-date counts (candidateDateList above) and
        per-link summaries with no link to which candidate date they
        answered (participantLinkList above); this table is the first
        place those two are joined.
      requiredTestIds:
        table: gathering-response-table
        header: gathering-response-table-header
        leaderSummary: gathering-response-table-leader-summary
      presenceRule: >-
        Present whenever organizerDashboard.participantLinkList is present
        (i.e. unconditionally, all three phases, mirroring that list's own
        presence).
      table:
        testId: gathering-response-table
        header:
          testId: gathering-response-table-header
          description: >-
            Added 2026-09-16 (ADR-0060 decision 7, human decision: 日付の順
            のまま、いちばん有力な日の列を塗る). Until this decision this
            table had no element representing a column at all -- cells only
            carried data-candidate-date-id, and this contract explicitly did
            not fix column order or layout (see scope below, unchanged).
            This header makes "column" a real, orderable DOM concept for
            the first time.
          headerCell:
            testId: gathering-response-table-header-cell
            cardinality: one-per-currently-present-CandidateDate
            attributes:
              candidateDateId: data-candidate-date-id
            orderingInvariant: >-
              DOM order of gathering-response-table-header-cell children
              equals candidateDateList.orderingInvariant's own order
              (startAt ascending, ADR-0060 decision 6) -- this is what fixes
              「候補日は日付の順に並ぶ」for this table's own column
              structure, not only for candidateDateList above.
            requirement: >-
              One header cell per CandidateDate currently in
              Gathering.candidateDates (the same set candidateDateList
              renders). This element does not itself carry a
              data-current-leader attribute -- whether the column this
              header cell represents is the leading candidate date is read
              from the corresponding gathering-candidate-date element's own
              data-current-leader (same data-candidate-date-id value, see
              candidateDateList.candidateDate above), not duplicated here
              (architect design judgment, ADR-0060 -- avoids two sources of
              truth for the same fact, the same reasoning ADR-0059 decision
              6 applied to this file's relationship with the shared
              navigation elements).
        row:
          testId: gathering-response-table-row
          cardinality: zero-or-more-elements-sharing-this-test-id
          attributes:
            participantLinkId: data-participant-link-id
          requirement: >-
            One row per ParticipantLinkSummary, correlated to
            gathering-participant-link-item by the same
            data-participant-link-id value (participantLinkList.item.
            attributes above). Revoked links remain present as a row here,
            mirroring participantLinkList's own "never removed, only
            marked" rule.
          cell:
            testId: gathering-response-table-cell
            cardinality: zero-or-more-elements-sharing-this-test-id
            attributes:
              candidateDateId: data-candidate-date-id
              status: data-response-status
            requirement: >-
              One cell per entry in this row's own ParticipantLinkSummary.
              scheduleResponses array -- a candidate date this participant
              slot has not answered has no cell in this row at all
              (mirroring scheduleResponses' own "unanswered candidate
              dates are not included" shape, gathering-scheduling-
              api.yaml). data-response-status equals that entry's status
              exactly (the same ScheduleResponseStatus vocabulary
              scheduleQuestion.yourResponseValues already uses, minus
              "UNANSWERED" -- an unanswered candidate date is absent as a
              cell, never present with an UNANSWERED status string). This
              contract does not fix this table's visual layout (e.g.
              whether an absent cell renders as an empty grid cell or is
              simply not laid out) -- it fixes only which (row, candidate
              date) pairs have a cell and what that cell's
              data-response-status is.
      leaderSummary:
        testId: gathering-response-table-leader-summary
        purpose: gathering-response-table-leader-summary
        description: >-
          Added 2026-09-16 (ADR-0060 decision 7, human decision: 表の上に
          「有力 ◯/◯（◯）」を出す). This element declares no activatable
          behavior -- it is purely observational; the purpose entry above
          exists only so tooling that scans by purpose can find it.
        cardinality: zero-or-more-elements-sharing-this-test-id
        attributes:
          candidateDateId: data-candidate-date-id
        requirement: >-
          One instance per CandidateDate currently carrying
          data-current-leader="true" on its own gathering-candidate-date
          element (candidateDateList.candidateDate above, ADR-0060 decision
          7) -- zero instances when no candidate date has any response yet
          (TDR-GTH-59), more than one instance when tied (TDR-GTH-62). The
          specific counts a visible "有力 ◯/◯（◯）" badge would show
          (行ける人数・たぶんの人数・全体人数) are not duplicated onto this
          element -- they are already fixed elsewhere (this candidate
          date's own data-going-count/data-maybe-count, and
          gathering-unanswered-summary's data-active-issued-links for the
          total). This contract does not fix this badge's exact wording
          (ADR-0060 decision 9, the "N件" convention) or visual position,
          only which candidate date(s) it names.
      scope: >-
        This table carries schedule responses only (ADR-0056 decision 1's
        own scope limit) -- it does not carry shop votes. Whether a future
        round extends it to also show each person's shop vote is an open
        question ADR-0056 left to human confirmation (ADR-0056 未決事項1);
        this contract does not anticipate that extension.
    deleteGathering:
      description: >-
        The organizer's explicit, irreversible gathering-deletion operation
        (Organizer.dc.html A-del, adr/0050 decision 4, 2026-09-09 human
        decision, replacing this file's original "no delete operation"
        design, D4, 2026-08-30). Present regardless of phase (SCHEDULING,
        SELECTING_SHOP, FINALIZED) -- the underlying deleteGathering API
        operation is accepted in every phase, and this is, if anything, the
        one organizerDashboard control this contract does not gate by
        phase at all. Confirmation follows the same open-then-confirm,
        two-step pattern this contract already establishes for
        candidateDateList.addCandidateDateForm (open reveals a form/dialog;
        a separate control performs the operation) -- a single click can
        never call deleteGathering. Supports TDR-GTH-48.
      requiredTestIds:
        open: gathering-delete-open
        confirmDialog: gathering-delete-confirm-dialog
        confirm: gathering-delete-confirm
        cancel: gathering-delete-cancel
      open:
        testId: gathering-delete-open
        purpose: gathering-delete-open
        presenceRule: Present unconditionally, across all three phases.
        requiredOutcome: >-
          Activating it reveals gathering-delete-confirm-dialog. Calls no
          public operation.
      confirmDialog:
        testId: gathering-delete-confirm-dialog
        presenceRule: >-
          Absent until gathering-delete-open is activated. Present after
          activation. Absent again after gathering-delete-cancel is
          activated, or after a successful gathering-delete-confirm (at
          which point the whole organizer dashboard for this gathering is
          moot, since the gathering no longer exists -- see confirm below).
      confirm:
        testId: gathering-delete-confirm
        purpose: gathering-delete-confirm
        requiredOutcome: >-
          Activating it (while gathering-delete-confirm-dialog is present)
          calls deleteGathering for this gathering. On success, the
          browser navigates to browserEntry.organizerGatheringList
          (**fixed 2026-09-12, ADR-0054 decision 6, human decision** --
          this contract previously did not fix the immediate post-delete
          destination screen; the list is the only destination that still
          makes sense once this specific gathering no longer exists). This
          contract requires that this gathering subsequently no longer
          appears in organizerGatheringList.list (TDR-GTH-48), and that
          opening any participant link previously issued for it thereafter
          yields participantAnswer.linkError with data-link-error-code
          "LINK_NOT_FOUND" (the same existing code an unissued token also
          produces -- gathering-scheduling-api.yaml introduces no new
          public error code for this case, and this contract introduces no
          new value here either).
      cancel:
        testId: gathering-delete-cancel
        purpose: gathering-delete-cancel
        requiredOutcome: >-
          Activating it makes gathering-delete-confirm-dialog absent
          without calling deleteGathering. The gathering, and every
          gathering-scheduling-api.yaml record derived from it, is
          unaffected.
    finalizedSummary:
      description: >-
        The FINALIZED-phase view of the same organizer dashboard. Closed
        the "FINALIZED局面の観測面ギャップ" activeContext.md had recorded
        since the first slice (adr/0042). **Restructured 2026-09-17
        (ADR-0062 decision 4, human decision, board D4: PC案1「パネルに
        全部」・スマホ案2ベースで畳む、店を選び中と同じ骨組み=地図いっぱい+
        浮かせたパネル)**: until this decision this section's only new
        observation surface was decisionBanner (confirmedCandidateDate/
        finalizedShopId), leaning on shortlistedShopVotes.list/item
        remaining present as a frozen "vote record" panel for the decided
        shop's own name/map/link. The human has now seen this screen in
        its real-machine board form and chosen the same simplification
        ADR-0061 decision 5 made for the participant's equivalent screen.
        decisionBanner below now carries the decided shop's own name
        directly, and gains its own map/page-link (mirroring
        participantAnswer.finalizedView.decision's shape exactly, adr/0056
        decision 10's precedent applied to the organizer for the first
        time).
      requiredTestIds:
        decisionBanner: gathering-decision-banner
        decidedShopMap: gathering-decision-shop-map
        decidedShopPageLink: gathering-decision-shop-page-link
      presenceRule: Present exactly when phase is FINALIZED.
      decisionBanner:
        testId: gathering-decision-banner
        attributes:
          confirmedCandidateDate: data-confirmed-candidate-date
          finalizedShopId: data-finalized-shop-id
          finalizedShopName: data-finalized-shop-name
        requirement: >-
          data-confirmed-candidate-date equals the startAt of the
          gathering-candidate-date whose data-confirmed is "true"
          (unchanged since SELECTING_SHOP). data-finalized-shop-id equals
          Gathering.finalizedShopId exactly. **data-finalized-shop-name
          added 2026-09-17 (ADR-0062 decision 4)**: equals the name field of
          the Gathering.shortlistedShops entry whose shopId equals
          finalizedShopId, exactly -- the same array
          shortlistedShopVotes.list.item already reads while phase is
          SELECTING_SHOP (item.attributes.name, data-shop-name); this
          contract does not require the API response to stop returning the
          other four entries once FINALIZED, only that this dashboard's own
          gathering-shortlisted-shop-list/-item DOM elements become absent
          (see shortlistedShopVotes.presenceRule above) -- decisionBanner's
          own attributes are computed from the same already-available data,
          not from a new API field. This contract does not require a
          regular-holiday attribute here -- LiveProjectedShop carries no
          such field (architect decision, adr/0046, 2026-09-05): Final.dc.
          html's decided-shop banner shows "定休 日曜・祝日", but
          regularHoliday exists nowhere in gathering-scheduling-api.yaml's
          shop projections (ShortlistedShop/ParticipantShopVoteOption/
          LiveProjectedShop all omit it). Adding it would require an API
          schema change this round's browser-interface-only scope does not
          include; this contract does not require an implementation to
          render that line.
        map:
          testId: gathering-decision-shop-map
          formControl: false
          presenceRule: >-
            Present whenever gathering-decision-banner itself is present
            (i.e. whenever phase is FINALIZED).
          scope: >-
            Shows exactly two points: the finalized shop's own pin (marker
            below) and this organizer's own configured search origin
            (originMarker below) -- mirrors participantAnswer.finalizedView.
            decision.map's own scope and rationale exactly (adr/0056
            decision 10): draws no line connecting them and no
            walking-radius ring, since this product does not query a
            routing service and does not assert a walking path it cannot
            back with real routing data.
          attributes:
            overlayMarkerCount: data-overlay-marker-count
            overlayLineCount: data-overlay-line-count
            overlayRingCount: data-overlay-ring-count
          requirement: >-
            Same three-attribute shape and the same MUST-equal-"2"/"0"/"0"
            rule participantAnswer.finalizedView.decision.map.requirement
            already fixes for the participant side (2026-09-13, closing
            独立監査 audit-gathering-redesign-steps.md's Major 1 the same
            way) -- applied here to the organizer's own finalized map for
            the first time.
          marker:
            testId: gathering-decision-shop-map-marker
            formControl: false
            attributes:
              shopId: data-shop-id
            requirement: >-
              Positioned from the finalized Gathering.shortlistedShops
              entry's location. Display-only.
          originMarker:
            testId: gathering-decision-shop-map-origin-marker
            formControl: false
            requirement: >-
              Positioned from the organizer's own configured search
              origin. Display-only. A distinct test id from
              gathering-shortlisted-shop-map-marker (unavailableControls.
              forbiddenTestIds forbids reusing that one) and from every
              participant-facing origin marker this file or
              candidate-search-browser-interface.yaml defines -- this is a
              separate element on a separate screen.
        providerPageLink:
          testId: gathering-decision-shop-page-link
          formControl: false
          requirement: >-
            An `<a href>` whose href equals the finalized
            Gathering.shortlistedShops entry's providerPageUrl. Implemented
            as a plain anchor -- outside forbiddenFormControlCategories'
            scan (unavailableControls.formControlExemptTestIds), the same
            precedent gathering-participant-decision-page-link already
            establishes.
      answersOpen:
        description: >-
          Added 2026-09-19 (orchestrator's own confirmation of this ADR's
          未決事項2, the same escalation path ADR-0059 decision 5/ADR-0060
          decision 5 already used for geometry this contract otherwise
          leaves open -- applied here because an entrance with no
          testId/purpose cannot be measured against ADR-0020 決定4's
          tap-target/keyboard-reachability invariants, the same reason
          addendum 21 above named dayList.sheetOpen/sheetClose). The
          entrance to organizerDashboard.responseTable above, paired with
          linksOpen below.
        testId: gathering-decision-answers-open
        purpose: gathering-decision-answers-open
        presenceRule: >-
          Present exactly when finalizedSummary itself is present (i.e.
          whenever phase is FINALIZED), same condition as linksOpen below.
        requirement: >-
          On the tab-shaped presentation (board G1, PC), this and
          linksOpen below are two mutually exclusive tabs; exactly one
          carries aria-selected="true" at any time, and this one starts
          selected (板G1: 回答のタブが最初に選ばれている). On the
          disclosure-row-shaped presentation (board G2, narrow viewport),
          this is one of two independent rows (paired with linksOpen
          below) that each carry aria-expanded reflecting their own
          open/closed state independently of the other; this one starts
          aria-expanded="false" (板G2: 「回答を見る N人」の行は最初は閉じて
          いる). This contract does not name these two presentations as
          render modes and does not fix which viewport width selects
          which one (this file's existing no-renderModes convention,
          ADR-0062 decision 4's own 検討した代替案).
        requiredOutcome: >-
          Activating it makes organizerDashboard.responseTable above
          currently visible (on the tab-shaped presentation this also
          makes linksOpen's own aria-selected false and
          organizerDashboard.participantLinkList above currently not
          visible; on the disclosure-row-shaped presentation it affects
          only this row's own aria-expanded and does not change linksOpen
          below). Calls no public operation -- it only discloses the
          already-required responseTable above; responseTable's own
          presenceRule/fields (above) are unchanged by this control's
          existence.
      linksOpen:
        description: >-
          Added 2026-09-19, same origin as answersOpen above. The entrance
          to organizerDashboard.participantLinkList above, symmetric with
          answersOpen above.
        testId: gathering-decision-links-open
        purpose: gathering-decision-links-open
        presenceRule: >-
          Present exactly when finalizedSummary itself is present (i.e.
          whenever phase is FINALIZED), same condition as answersOpen
          above.
        requirement: >-
          On the tab-shaped presentation (board G1, PC), this and
          answersOpen above are two mutually exclusive tabs; exactly one
          carries aria-selected="true" at any time, and answersOpen above
          -- not this one -- starts selected (板G1: 回答のタブが最初に選ば
          れている). On the disclosure-row-shaped presentation (board G2,
          narrow viewport), this is one of two independent rows (paired
          with answersOpen above) that each carry aria-expanded reflecting
          their own open/closed state independently of the other; this
          one starts aria-expanded="false" (板G2: 「回答リンク N本」の行も
          最初は閉じている).
        requiredOutcome: >-
          Activating it makes organizerDashboard.participantLinkList
          above currently visible (on the tab-shaped presentation this
          also makes answersOpen's own aria-selected false and
          organizerDashboard.responseTable above currently not visible;
          on the disclosure-row-shaped presentation it affects only this
          row's own aria-expanded and does not change answersOpen above).
          Calls no public operation -- it only discloses the already-
          required participantLinkList above; participantLinkList's own
          presenceRule/fields (above) are unchanged by this control's
          existence.
      unchangedRecords: >-
        gathering-phase-indicator, gathering-responded-summary,
        gathering-unanswered-summary, gathering-candidate-date-list/
        gathering-candidate-date (schedule record), organizerDashboard.
        responseTable, and organizerDashboard.participantLinkList all
        remain present once FINALIZED, continuing to reflect their same
        fields. **Changed 2026-09-17 (ADR-0062 decision 4)**:
        gathering-shortlisted-shop-list/gathering-shortlisted-shop-item
        (the former "vote record") no longer remain present once
        FINALIZED -- see shortlistedShopVotes.presenceRule above;
        decisionBanner above's own name/map/page-link now carry the record
        of "which shop won" that this list used to carry. This contract
        does not require these values to stop changing on the server side;
        it requires only that no organizer-facing control remains that
        could cause them to change (see the various presenceRule entries
        above this section removing every remaining operational control
        once FINALIZED). "行ける N人" (board D4's headline count) is not a
        new attribute -- it is the same gathering-candidate-date whose
        data-confirmed is "true"'s own data-going-count (ADR-0060 decision
        7), already required above, read directly rather than duplicated
        onto decisionBanner (architect design judgment, same
        no-duplication reasoning ADR-0059 decision 6 and ADR-0060 decision
        7 already apply elsewhere in this file). Likewise, "回答◯人"/
        "回答リンク◯本" (the two tabs board D4's panel groups the
        remaining sections under) read gathering-responded-summary.
        data-responded-count and gathering-unanswered-summary.
        data-active-issued-links respectively -- both already required
        above, unchanged by this decision. **Changed 2026-09-19 (追補22,
        orchestrator's confirmation of this ADR's own 未決事項2)**: this
        contract now names the entrance to each of responseTable/
        participantLinkList above -- answersOpen/linksOpen above --
        because an entrance with no testId/purpose cannot be measured
        against ADR-0020 決定4's tap-target/keyboard-reachability
        invariants (the same reasoning addendum 21 above already applied
        to dayList.sheetOpen/sheetClose). Neither responseTable's nor
        participantLinkList's own presenceRule changes (both remain
        unconditionally present in the DOM across all three phases, as
        fixed above) -- only whether either is currently *visible* once
        phase is FINALIZED now depends on answersOpen/linksOpen's own
        aria-selected/aria-expanded state (see those two above); before
        FINALIZED, neither entrance control exists (their own
        presenceRule above), and both sections remain directly visible
        exactly as before, unaffected by this decision.
      linkManagement: >-
        See participantLinkCopy.presenceRule and participantLinkList.item.
        recopy/revoke above for the read-only-except-recopy rule this
        section's "発行済みリンク" panel embodies (P4).
      deletionAvailable: >-
        gathering-delete-open (see organizerDashboard.deleteGathering above)
        remains present and functional once FINALIZED -- deletion is
        accepted by deleteGathering regardless of phase (adr/0050 decision
        4), unlike every other control this section discusses becoming
        absent.
  participantAnswer:
    requiredTestIds:
      header: gathering-participant-header
      nameStatus: gathering-participant-name-status
      scheduleQuestion: gathering-schedule-question
    headerAttributes:
      testId: gathering-participant-header
      attribute: data-gathering-phase
      values: [SCHEDULING, SELECTING_SHOP, FINALIZED]
      requirement: >-
        Exact string match with ParticipantView.phase
        (gathering-scheduling-api.yaml), mirroring
        organizerDashboard.phaseIndicatorAttributes' same vocabulary and
        value set. Present unconditionally whenever a valid link is opened
        (see browserEntry.participantAnswer.validLinkOutcome). Lets
        TDR-GTH-11 ("開催日確定後も局面は「店を選び中」のまま変わらない") be
        asserted from the participant page alone, without also opening the
        organizer dashboard in the same acceptance run.
    nameControl:
      status:
        testId: gathering-participant-name-status
        attribute: data-participant-named
        values: ['true', 'false']
        requirement: >-
          "false" exactly when ParticipantView.displayName is null; "true"
          otherwise (D5, 2026-08-30). Present unconditionally on the
          participant screen, including once FINALIZED (the name itself
          does not disappear; only the open/submit controls below do).
      open:
        testId: gathering-participant-name-open
        purpose: gathering-participant-name-open
        presenceRule: >-
          Absent once ParticipantView.decision is non-null (Final.dc.html
          B-3: "名前を変える操作も置かない", adr/0042).
        requiredOutcome: >-
          Activating it reveals gathering-participant-name-input (text
          field) and gathering-participant-name-submit.
      input:
        testId: gathering-participant-name-input
        requirement: >-
          A text input whose value becomes setParticipantDisplayName's name
          parameter on submit. Absent until gathering-participant-name-open
          is activated (see open.requiredOutcome above).
        valueEntryControl: >-
          Added 2026-09-02 (ADR-0039) -- this test id existed in this
          contract's prose since 2026-08-30 (open.requiredOutcome
          mentioned it) but had no structured browserControlSurface entry
          of its own until now. Exempt from
          allGatheringScreenFormControlsMustDeclarePurpose per
          unavailableControls.operationalControlScope -- its value is
          consumed by submit.requiredOutcome below, its documented
          consuming operational control.
      submit:
        testId: gathering-participant-name-submit
        purpose: gathering-participant-name-submit
        presenceRule: >-
          Absent once ParticipantView.decision is non-null, matching open
          above (adr/0042).
        requiredOutcome: >-
          Submitting a non-empty name (consumed from
          gathering-participant-name-input) calls setParticipantDisplayName.
          data-participant-named becomes "true" and remains "true" for the
          rest of the session, including for schedule responses recorded
          before the name was attached (TDR-GTH-05) -- this contract does
          not require or forbid a way to remove a name once attached
          (product-brief.md §2/§5 describe only self-reporting and change,
          never removal).
    scheduleQuestion:
      testId: gathering-schedule-question
      presenceRule: >-
        Absent once ParticipantView.decision is non-null (adr/0042) --
        Final.dc.html B-3 does not repeat the per-candidate-date
        breakdown, only finalizedView.decision below. This resolves
        gathering-scheduling-api.yaml's own previously-open note ("left to
        that later contract, ADR-0013 order") in favor of full
        replacement, not coexistence. **This is the sole authority for
        this element's presence** -- browserEntry.participantAnswer.
        validLinkOutcome does not separately restate this condition (fixed
        2026-09-04, adr/0043, after the two entries were found to
        contradict each other post-FINALIZED).
      orderingInvariant: >-
        Added 2026-09-06 (adr/0048), **changed 2026-09-16 (ADR-0060 decision
        6, human decision: 候補日の並びを日付順へ)**. The order in which each
        gathering-schedule-question becomes reachable (whether all render
        simultaneously or one at a time) equals ParticipantView.
        scheduleQuestions' order -- startAt ascending (開催日の早い順,
        gathering-scheduling-api.yaml), the same order and the same
        no-tie-break-needed reasoning candidateDateList.orderingInvariant
        above now uses (startAt is unique among a gathering's currently-
        present candidate dates, so two elements sharing this order key can
        never occur). This entry previously ordered by goingCount
        descending with startAt ascending as a tie-break, fixing a
        2026-09-06 production defect (candidate dates sharing an
        undocumented, non-deterministic tie-break); that defect-fix
        reasoning is superseded by this round's switch of the primary key
        itself.
      cardinality: >-
        **Changed 2026-09-17 (ADR-0061 decision 3, human decision: 「答えると
        自動で次の日へ」)**: exactly one gathering-schedule-question is
        reachable in the DOM at a time -- the simultaneous-render
        alternative this paragraph permitted through 2026-09-16 is no
        longer permitted; this contract now requires the one-at-a-time flow
        it previously only allowed. Which candidate date is the
        currently-reachable one changes only via responseOptions' own
        auto-advance (below), daySkip, dayPrevious, or dayList's own
        navigation (all below) -- never simultaneously with another
        gathering-schedule-question. The gathering-participant-progress
        element (see below) always reflects the true total regardless of
        which single candidate date is currently rendered.
      attributes:
        candidateDateId: data-candidate-date-id
        yourResponse: data-your-response
      yourResponseValues: [GOING, MAYBE, NOT_GOING, UNANSWERED]
      requirement: >-
        **Narrowed 2026-09-13 (ADR-0055 decision 1, closing a contradiction
        this file carried since gathering-scheduling-api.yaml removed
        ParticipantScheduleQuestion.openShopCount at v0.11.0: this
        requirement kept demanding an attribute equal a value that no
        longer exists)**: this element carries no data-open-shop-count
        attribute at all (see the corrected attributes list above). The
        observation for TDR-GTH-09 (gathering-scheduling.feature: 「その
        候補日に開いている店の件数は示されない」「店名やその他の店舗情報も
        示されない」) is a negative one -- for every gathering-schedule-
        question currently reachable, no data-open-shop-count attribute and
        no shop name or other shop attribute is present anywhere inside it,
        regardless of data-your-response's value. data-your-response is
        "UNANSWERED" exactly when ParticipantScheduleQuestion.yourResponse
        is null; otherwise it is the exact ScheduleResponseStatus string.
        This asymmetry with organizerDashboard's gathering-open-shop-preview
        (TDR-GTH-08, unchanged, still carries data-open-shop-count for
        whichever candidate date the organizer has tentatively selected) is
        intentional, not an oversight -- ADR-0055 decision 1 removed the
        count from the participant's screen only.
      responseOptions:
        testId: gathering-schedule-response-option
        purpose: gathering-schedule-response-select
        attribute: data-response-value
        values: [GOING, MAYBE, NOT_GOING]
        cardinality: exactly-three-per-gathering-schedule-question
        requiredOutcome: >-
          Activating the option whose data-response-value is V calls
          setScheduleResponse with status: V for this
          gathering-schedule-question's candidate date. data-your-response
          updates to V. Re-activating a different option updates
          data-your-response again (TDR-GTH-06: always changeable).
          **Added 2026-09-17 (ADR-0061 decision 3, human decision: 「答えると
          自動で次の日へ」)**: if a next candidate date exists in
          scheduleQuestion.orderingInvariant order after this one, that next
          date's gathering-schedule-question becomes the currently reachable
          one immediately after this call succeeds (auto-advance). This
          contract does not fix what becomes reachable when the
          just-answered candidate date was the last in order (e.g.
          remaining on it, or dayList becoming the primary view) -- only
          that no other candidate date's data-your-response value changes
          as a result of this auto-advance itself.
      tally:
        testId: gathering-schedule-tally
        attributes:
          goingCount: data-going-count
          maybeCount: data-maybe-count
          notGoingCount: data-not-going-count
          currentLeader: data-current-leader
        presenceRule: >-
          **Changed 2026-09-09 (adr/0050 decision 2, 2026-09-08/09 human
          decision: "約束は覆してもよい")**: always present within a given
          gathering-schedule-question, regardless of whether that
          question's data-your-response is "UNANSWERED" -- this reverses
          this contract's original "answer first, then see others" rule
          (product-brief.md §2's original wording, applied per candidate
          date from drafting through contractVersion 0.9.0, TDR-GTH-12,
          which was rewritten to test the reversal instead of the original
          rule). The original rule's rationale -- an early answer could
          bias later ones -- is not retracted; the human explicitly chose
          to let participants see how others are answering so they can
          converge on a date the group is already leaning toward. Its
          three attributes mirror the organizer-facing
          gathering-candidate-date's goingCount/maybeCount/notGoingCount for
          the same candidate date exactly, unconditionally. **Added
          2026-09-16 (ADR-0060 decision 8, human decision: 参加者の画面にも
          有力の印を出す)**: data-current-leader mirrors gathering-candidate-
          date's own data-current-leader (candidateDateList.candidateDate
          above, ADR-0060 decision 7) exactly -- computed by the same
          two-level cascade (goingCount, then maybeCount as a tie-break
          only; 0件は除外・同点はすべてtrue) across this participant's own
          full ParticipantView.scheduleQuestions array, which already
          carries every candidate date's goingCount/maybeCount (no API
          change needed, the same no-new-field reasoning ADR-0056 decision 6
          used mirroring data-added-after-voting-started to the participant
          side). Presentation (emphasis, position) is left provisional
          pending a human decision when a later round redesigns this
          screen (ADR-0060 未決事項4).
      respondentList:
        description: >-
          Added 2026-09-17 (ADR-0061 decision 2, human decision: 束C
          レイアウト案F2「空いた所にだれが何と答えたかを名前つきで並べる」).
          A second, later widening of the same peer-to-peer visibility
          boundary adr/0050 decision 2 opened for aggregate counts --
          extended here to each respondent's own name and answer, mirroring
          on the participant side what ADR-0056 decision 1 already opened
          for the organizer (organizerDashboard.responseTable). Scoped to
          the schedule-answer screen only; whether shopVoteQuestion below
          gets the same treatment is left to a later round (this file's own
          open questions).
        testId: gathering-schedule-respondent-list
        item:
          testId: gathering-schedule-respondent-item
          formControl: false
          cardinality: >-
            One element per entry in this candidate date's own
            ParticipantScheduleQuestion.respondents array (gathering-
            scheduling-api.yaml) -- i.e. one per participant link that has
            answered this candidate date, including this viewer's own entry
            if this viewer has answered. This contract does not fix the DOM
            order of these items.
          attributes:
            response: data-response-value
            named: data-participant-named
          requirement: >-
            data-response-value equals that respondent's own `response`
            exactly (the same GOING/MAYBE/NOT_GOING vocabulary
            responseOptions above uses -- never "UNANSWERED", since an
            unanswered participant simply has no entry here, the same
            "absence means unanswered" convention
            organizerDashboard.responseTable.row.cell already establishes).
            data-participant-named is "false" exactly when that
            respondent's `displayName` is null, "true" otherwise (same
            vocabulary as participantLinkList.item.attributes.named above);
            this element does not require the name's exact visible text to
            be machine-asserted, the same latitude
            participantLinkList.item.requirement above already takes for
            the identical reason (TDR-GTH-16's own "名無しを含む"
            distinguishability, not text equality) -- though an
            implementation may additionally show the name's visible text
            (e.g. 「あおい」/「名無し」) inside this item without contract
            obligation. No allowedPurposes/formControlExemptTestIds entry is
            needed -- a display-only element, the same reasoning this
            file's confirmationEchoNote (retired alongside answerLater
            below) already established for its own echo elements.
    dayNavigationNote: >-
      **Retired 2026-09-17 (ADR-0061 decision 3, human decision:
      「結果をのぞく」「あとで答える」とその確認の面は無くす, overturning
      adr/0050 decision 1 and adr/0055 decision 3)**: this file previously
      defined answerLater and peekResults here (testIds
      gathering-participant-answer-later/-peek-results and their
      confirmation echo, scheduleItem/shopItem). Both are removed entirely,
      not merely re-scoped -- decision 2's tally always being present
      already made peekResults's own reveal-what's-already-visible behavior
      moot, and this round's one-at-a-time flow (scheduleQuestion.
      cardinality above) makes leaving mid-way always safe without a
      dedicated control: every answer already saves itself the moment it is
      submitted (the same "1問ごとにその場で保存する" design answerLater's
      own requiredOutcome rested on), so a participant may simply close the
      page at any candidate date, answered or not, and return later to find
      every prior answer intact and every answer still changeable
      (TDR-GTH-06). dayList below now carries the "自分の答えの一覧" role
      answerLater's confirmation echo used to.
    daySkip:
      testId: gathering-participant-answer-skip
      purpose: gathering-participant-answer-skip
      description: >-
        Added 2026-09-17 (ADR-0061 decision 3, board's 「とばす」, bottom
        right). Lets a participant move past the currently reachable
        candidate date without answering it.
      presenceRule: >-
        Present exactly when ParticipantView.decision is null (same gating
        scheduleQuestion above uses).
      requiredOutcome: >-
        Activating it, while some gathering-schedule-question is currently
        reachable, makes the next candidate date in scheduleQuestion.
        orderingInvariant order the currently reachable one, without
        changing the skipped date's own data-your-response (remains
        whatever it was, including "UNANSWERED"). Calls no public
        operation. This contract does not fix what becomes reachable when
        the currently-focused candidate date is the last in order.
    dayPrevious:
      testId: gathering-participant-answer-previous
      purpose: gathering-participant-answer-previous
      description: >-
        Added 2026-09-17 (ADR-0061 decision 3, board's 「前の日」, bottom
        left).
      presenceRule: >-
        Present exactly when ParticipantView.decision is null (same gating
        scheduleQuestion above uses).
      disabledState: >-
        Carries the native disabled state whenever the currently reachable
        candidate date is the first in scheduleQuestion.orderingInvariant
        order (no earlier candidate date exists).
      requiredOutcome: >-
        Activating it (while not disabled) makes the immediately preceding
        candidate date in order the currently reachable one. Calls no
        public operation. Does not change any data-your-response value.
    dayList:
      description: >-
        Added 2026-09-17 (ADR-0061 decision 3, board's 「日の一覧」 -- a
        bottom sheet on narrow widths, an always-present panel on wide
        widths; this contract fixes neither presentation, only the
        elements below). Lets a participant jump directly to any candidate
        date instead of only stepping day by day, and, once every candidate
        date has a non-null data-your-response, doubles as the "自分の答え
        の一覧" the retired answerLater confirmation used to show (see
        dayNavigationNote above) -- both roles read the same item list;
        this contract requires no separate "all answered" element (a test
        may derive that state from gathering-participant-progress's own
        data-total-candidate-dates == data-answered-candidate-dates, both
        already required above).
      testId: gathering-participant-day-list
      presenceRule: >-
        Present exactly when ParticipantView.decision is null (same gating
        scheduleQuestion above uses).
      item:
        testId: gathering-participant-day-item
        purpose: gathering-participant-day-navigate
        cardinality: one-per-currently-present-CandidateDate
        orderingInvariant: >-
          DOM order equals scheduleQuestion.orderingInvariant's own order
          (startAt ascending, ADR-0060 decision 6) -- the same order
          candidateDateList.orderingInvariant and responseTable.header.
          headerCell already share.
        attributes:
          candidateDateId: data-candidate-date-id
          yourResponse: data-your-response
        requirement: >-
          One item per CandidateDate in ParticipantView.scheduleQuestions
          (every one, regardless of which single date is currently the
          reachable gathering-schedule-question). data-your-response uses
          the same GOING/MAYBE/NOT_GOING/UNANSWERED vocabulary
          scheduleQuestion.attributes above uses. This element does not
          duplicate goingCount/maybeCount/notGoingCount/currentLeader --
          those remain sourced from the corresponding
          gathering-schedule-tally/gathering-schedule-question via the same
          data-candidate-date-id value (the same no-duplication judgment
          ADR-0060 decision 7 applied to responseTable.header.headerCell).
        requiredOutcome: >-
          Activating the item whose data-candidate-date-id is D makes that
          candidate date's gathering-schedule-question the currently
          reachable one (scheduleQuestion.cardinality above's one-at-a-time
          requirement). Calls no public operation. Does not change any
          data-your-response value.
      sheetOpen:
        description: >-
          Added 2026-09-18 (ADR-0061 追補, developer's ADR-0020 decision 4
          keyboard-reachability/44px audit surfaced this gap while
          implementing dayList's own narrow-width bottom-sheet
          presentation, named in dayList.description above -- this
          contract had never named a control to disclose that sheet).
          Opens dayList as a bottom sheet.
        testId: gathering-participant-day-list-open
        purpose: gathering-participant-day-list-open
        presenceRule: >-
          Present only on whichever render mode presents dayList as a
          bottom sheet (dayList.description above's narrow-width case) --
          absent on the render mode where dayList is an always-present
          panel (that mode's dayList needs no separate control to reach
          it). Also gated by the same ParticipantView.decision-is-null
          condition dayList.presenceRule above uses (this control cannot
          exist while dayList itself is absent).
        requiredOutcome: >-
          Activating it discloses dayList as a bottom sheet (any
          implementation-chosen mechanism; this contract does not fix
          modal/drawer/bottom-sheet shape, mirroring candidate-search-
          browser-interface.yaml's menuToggle/menuPanel precedent). Calls
          no public operation. Does not change any data-your-response
          value.
      sheetClose:
        description: >-
          Added 2026-09-18 (ADR-0061 追補, same origin as sheetOpen
          above). Closes the bottom sheet sheetOpen discloses.
        testId: gathering-participant-day-list-close
        purpose: gathering-participant-day-list-close
        presenceRule: >-
          Present only while the bottom sheet sheetOpen discloses is
          currently open -- the same render mode sheetOpen above is
          present on. This contract does not fix whether activating a
          dayList.item (above) while the sheet is open also closes it --
          that remains an implementation choice.
        requiredOutcome: >-
          Activating it hides the bottom sheet sheetOpen discloses. Calls
          no public operation. Does not change any data-your-response
          value.
    shopVoteMap:
      description: >-
        Added 2026-09-05 (adr/0044/adr/0045, TDR-GTH-39/41, Vote.dc.html's
        `.rib`). One shared map showing every currently rendered
        gathering-shop-vote-question as a marker, plus the search origin
        adr/0045 adds. A new, gathering-scoped, participant-facing element
        -- see unavailableControls.forbiddenTestIdsNote above for why it
        does not conflict with that list's ban on reusing candidate-
        search's own map/origin test ids.
      testId: gathering-shop-vote-map
      presenceRule: >-
        Present exactly when ParticipantView.shopVoteQuestions is non-null
        (i.e. once Gathering.votingStartedAt is non-null) -- absent while
        phase is SCHEDULING. **Changed back 2026-09-17 (ADR-0061 decision 5,
        human decision: 「他の候補の店と票は出さない」, reversing ADR-0055
        decision 8 a second time)**: also absent once ParticipantView.
        decision is non-null, the same gating shopVoteQuestion.presenceRule
        below uses again after its own reversal. finalizedView.decision.map
        below (a distinct element, decided-shop-plus-origin only, no other
        shop's pin) is what a finalized participant screen shows instead.
      scope: >-
        Unlike organizerDashboard.shopSelectionEntry (which owns no map of
        its own -- that surface now lives entirely in candidate-search-
        browser-interface.yaml's gatheringMode, adr/0049), this map also
        shows the private search origin (adr/0045) in addition to shops'
        own pins -- it never shows a walking-radius ring (ADR-0025's rings
        are not extended to this screen, adr/0045 decision 3).
      marker:
        testId: gathering-shop-vote-map-marker
        attributes:
          shopId: data-shop-id
        cardinality: zero-or-more-elements-sharing-this-test-id
        requirement: >-
          One marker per gathering-shop-vote-question currently rendered,
          correlated by data-shop-id. Positioned from
          ParticipantShopVoteOption.location. Display-only
          (unavailableControls.formControlExemptTestIds).
      searchOriginMarker:
        testId: gathering-search-origin-marker
        formControl: false
        presenceRule: >-
          Added 2026-09-05 (adr/0045, TDR-GTH-41: "地図には検索基点の位置も
          示される"). Present exactly when ParticipantView.searchOrigin is
          non-null (same gating as shopVoteMap/shopVoteQuestion themselves
          -- Gathering.votingStartedAt non-null) -- remains present once
          FINALIZED (searchOrigin does not reset to null, adr/0045
          decision 1). Display-only -- no data-gathering-control-purpose
          is required, mirroring candidate-origin-marker's own precedent
          in candidate-search-browser-interface.yaml -- but this is a
          **distinct** test id from candidate-origin-marker
          (unavailableControls.forbiddenTestIds forbids reusing that one).
          This contract does not fix which data attribute, if any, carries
          the coordinate value, mirroring candidate-origin-marker's own
          precedent of not fixing this either.
    shopVoteQuestion:
      description: >-
        The vote surface (Vote.dc.html B-2). Supports TDR-GTH-28/29/30/39.
        **Restructured 2026-09-05 (adr/0044)** from the retired boolean
        approve/exclude model (adopted adr/0040, replaced adr/0044) to a
        three-tier selection mirroring scheduleQuestion.responseOptions
        above; map/detail fields added the same round (TDR-GTH-38/39).
      testId: gathering-shop-vote-question
      presenceRule: >-
        Present exactly when ParticipantView.shopVoteQuestions is non-null
        (i.e. once Gathering.votingStartedAt is non-null) -- absent while
        phase is SCHEDULING. **Changed back 2026-09-17 (ADR-0061 decision 5,
        human decision: 「他の候補の店と票は出さない」, reversing ADR-0055
        decision 8 a second time)**: this element becomes absent once
        ParticipantView.decision is non-null, the same gating
        scheduleQuestion above uses. ADR-0055 decision 8 (2026-09-12) had
        made this element remain present post-finalization to resolve a
        self-contradiction between this presenceRule and finalizedView.
        replacesQuestionSurfaces below; the human has now seen the finalized
        participant screen in its real-machine board form and chosen to
        hide other shops and their votes there, restoring the "absent once
        finalized" behavior this file's own TDR-GTH-34 text ("他の参加者の
        回答・投票、店ごとの回答の一覧は示されない") had asserted all along
        without this presenceRule ever having been brought into agreement
        with it (see finalizedView.replacesQuestionSurfaces below, updated
        the same round). Voting itself already stopped being possible once
        finalized regardless (see noOperations below) -- what changes with
        this reversal is that the element carrying the live tally
        disappears too, not only its controls. finalizedView's decision
        element below is the only record of "what happened" a finalized
        participant screen carries.
      orderingInvariant: >-
        Added 2026-09-04 (adr/0044, fixing a production defect where this
        list re-sorted itself after every vote -- the human's report:
        「行ってもいい店選ぶたびにソートがかかってるぽい」). DOM order of
        gathering-shop-vote-question children equals
        ParticipantView.shopVoteQuestions' order -- **nearest-first: each
        shop's distance from the private search origin, ascending
        (2026-09-05 fix, adr/0044 decision 2, matching gathering-
        scheduling-api.yaml's own 2026-09-04 correction; an in-progress
        draft of this contract had instead described this order as
        addedAt-ascending, which also achieves the "does not change when a
        vote is cast" property this order needs but not the human-specified
        near-order -- this revision replaces that basis with distance so
        both properties hold at once, exactly mirroring the API schema's
        own shopVoteQuestions description)** -- deliberately *not* any
        vote-count order. This order **must not change** for any reason
        attributable to a vote being cast, changed, or left unanswered --
        by this participant or by any other participant, since a shop's
        distance from the search origin never varies during a gathering. A
        shop only moves within this order when the organizer's own
        setShortlistedShops replaces it with a newly reset addedAt (D7);
        `addedAt` remains the basis for `yourVote`'s "not yet answered"
        gating (D7) -- only this order's basis changed, not that gating.
        **A tie in the raw distance itself is broken by shopId ascending
        (2026-09-06, adr/0048)**, mirroring gathering-scheduling-api.yaml's
        own ParticipantView.shopVoteQuestions description -- no such tie
        has been observed in practice, but this closes the same class of
        gap adr/0048 closes for every other tie-prone ordering in this
        contract. No control in this list may claim the forbidden manual-ordering
        purpose (see unavailableControls above). TDR-GTH-37 verifies this
        directly: recording this list's shopId order, then casting a vote,
        then asserting the order is unchanged.
      cardinality: >-
        One element per ParticipantShopVoteOption currently in
        ParticipantView.shopVoteQuestions (up to 5). This contract does not
        fix whether all are rendered simultaneously (mirrors
        scheduleQuestion's own cardinality note).
      attributes:
        shopId: data-shop-id
        yourVote: data-your-vote
      yourVoteValues: ['WANT_TO_GO', 'OK_TO_GO', 'NOT_GOING', 'UNANSWERED']
      requirement: >-
        **Fixed 2026-09-05 (adr/0044)**: this contract previously exposed a
        boolean `data-your-approval` (mirroring the since-retired
        ParticipantShopVoteOption.yourApproval); data-your-vote above
        replaces it. data-your-vote is "UNANSWERED" exactly when
        ParticipantShopVoteOption.yourVote is null (D7's "まだ答えて
        いません", Vote.dc.html); otherwise it is the exact ShopVoteStatus
        string (WANT_TO_GO/OK_TO_GO/NOT_GOING, displayed as 「行きたい」/
        「行ってもいい」/「むり」, adr/0044 decision 1 -- deliberately a
        different vocabulary from scheduleQuestion.yourResponseValues'
        GOING/MAYBE/NOT_GOING/「行ける」/「たぶん」/「むり」, since a shop
        vote expresses preference for a shop, not schedule availability).
        No shop attribute beyond shopId is required to be machine-asserted
        by this specific attribute mapping (name/genre mirror
        ParticipantShopVoteOption's schema but this contract does not fix
        their DOM representation here, same convention as
        organizerDashboard's preview) -- see detailFields below for the
        fields TDR-GTH-39 does assert. **data-added-after-voting-started
        retired 2026-09-17** (ADR-0062 decision 1, human decision, board
        D1: 「あとから入りました」は出さない): this attribute (added
        2026-09-13, ADR-0056 decision 6, mirroring
        organizerDashboard.shortlistedShopVotes.list.item's own attribute
        of the same name) is removed from this element the same round its
        organizer-facing counterpart is retired -- see that element's own
        requirement text above for the human decision this closes.
        `ParticipantShopVoteOption.addedAfterVotingStarted` is retired from
        gathering-scheduling-api.yaml the same round, since no DOM
        observation reads it any longer.
      detailFields:
        description: >-
          Added 2026-09-05 (adr/0044, TDR-GTH-39: "位置を示す地図と、徒歩の
          目安・席数の目安・禁煙対応・予算感の目安・店のページへのリンクが
          示される"). This is the only organizer- or participant-facing
          detail-field surface this contract still owns directly -- the
          organizer's equivalent (formerly organizerDashboard.
          shortlistSelection.list.item.detailFields) was retired 2026-09-09
          along with that whole section (adr/0049 decision 1); the
          organizer now sees the same kind of detail via
          candidate-search-browser-interface.yaml's gatheringMode instead.
        walkingTime: {testId: gathering-shop-vote-question-walking-time}
        capacityTier: {testId: gathering-shop-vote-question-capacity-tier}
        nonSmokingStatus: {testId: gathering-shop-vote-question-non-smoking}
        dinnerBudgetTier: {testId: gathering-shop-vote-question-dinner-budget}
        providerPageLink:
          testId: gathering-shop-vote-question-provider-page-link
          formControl: false
          requirement: >-
            An `<a href>` whose href equals
            ParticipantShopVoteOption.providerPageUrl. Implemented as a
            plain anchor -- outside forbiddenFormControlCategories' scan
            (unavailableControls.formControlExemptTestIds, adr/0046).
        requirement: >-
          Each field's test id is present for every
          gathering-shop-vote-question currently rendered (no
          data-value-state attribute required; genre stays outside this
          contract's required fields).
      voteOptions:
        testId: gathering-shop-vote-option
        purpose: gathering-shop-vote-select
        attribute: data-vote-value
        values: [WANT_TO_GO, OK_TO_GO, NOT_GOING]
        cardinality: exactly-three-per-gathering-shop-vote-question
        requiredOutcome: >-
          **Restructured 2026-09-05 (adr/0044)** to mirror
          scheduleQuestion.responseOptions above exactly, replacing this
          contract's retired single-checkbox selectOption (the 2026-09-04
          draft's boolean toggle) now that gathering-scheduling-api.yaml's
          SetShopVotesRequest/ParticipantShopVoteOption.yourVote are
          three-tier. Activating the option whose data-vote-value is V
          immediately calls setShopVotes with a votes array containing
          `{shopId, status: V}` for this shop plus this participant's
          currently-held vote for every other currently-rendered shop
          (SetShopVotesRequest's own "resend the complete current answer
          set on every call" requirement, the same shape the retired
          approvedShopIds model already used) -- not a pending/submit model
          (Vote.dc.html: "選ぶとその場で保存されます", no separate submit
          button, unlike the organizer's shopSelectionEntry above).
          data-your-vote updates to V immediately. Re-activating a
          different option for the same shop updates the sent set again
          (TDR-GTH-30: always changeable). No new allowedPurposes entry is
          required -- this three-tier selection still shares
          gathering-shop-vote-select across all three option instances,
          the same purpose the 2026-09-04 draft already anticipated
          reusing (this file's allowedPurposesNote2026_09_04).
      tally:
        testId: gathering-shop-vote-tally
        attributes:
          wantToGoCount: data-want-to-go-count
          okToGoCount: data-ok-to-go-count
          notGoingCount: data-not-going-count
          respondedCount: data-responded-count
          totalActiveParticipantCount: data-total-active-participant-count
        presenceRule: >-
          **Changed 2026-09-09 (adr/0050 decision 2)**: always present
          within a given gathering-shop-vote-question, regardless of
          whether that question's data-your-vote is "UNANSWERED" -- the
          same reversal scheduleQuestion.tally's presenceRule above
          documents, applied per shop instead of per candidate date
          (TDR-GTH-29, rewritten the same way TDR-GTH-12 was; independent
          of scheduleQuestion.tally's own gating, which reverses
          identically but is tracked separately).
        requirement: >-
          **Fixed 2026-09-05 (adr/0044)**: this contract previously exposed
          this shop's tally as a single data-approval-count; the three
          attributes above replace it, mirroring this same shop's
          organizer-facing ShortlistedShop.wantToGoCount/okToGoCount/
          notGoingCount/respondedParticipantCount exactly. **data-total-
          active-participant-count added 2026-09-13** (ADR-0056 decision 9,
          human decision: 票の帯は全員の人数で固定する, TDR-GTH-56): mirrors
          ParticipantView.totalActiveParticipantCount exactly, the same
          value on every gathering-shop-vote-tally within one participant's
          view (this is a per-participant-view constant, not a per-shop
          count, unlike the other four attributes above) -- lets the vote
          bar's length be sized against the whole group rather than only
          data-responded-count's respondents-so-far denominator, so a
          lightly-voted shop's bar reads as short rather than merely
          "short among few responses". Whether this value is also shown on
          the schedule-answer screen (before voting starts) remains open
          (ADR-0056 未決事項4) -- this contract requires it only here, on
          the shop-vote tally. No allowedPurposes/formControlExemptTestIds
          entry is needed -- a display-only attribute on an already-
          declared element, the same reason data-added-after-voting-started
          above needed neither.
    progress:
      testId: gathering-participant-progress
      presenceRule: >-
        Absent once ParticipantView.decision is non-null (adr/0042) -- no
        more days to answer once the decision is shown (Final.dc.html B-3
        has no progress counter).
      attributes:
        totalCandidateDates: data-total-candidate-dates
        answeredCandidateDates: data-answered-candidate-dates
      requirement: >-
        data-total-candidate-dates equals the count of
        ParticipantView.scheduleQuestions; data-answered-candidate-dates
        equals the count among them whose yourResponse is non-null.
        Corresponds to Answer.dc.html's "日程 2 / 3" counter and progress
        bar; this contract fixes only the counts, not the visible wording or
        bar rendering.
    finalizedView:
      description: >-
        B-3 (Final.dc.html) -- the same signed-link URL, now showing the
        decision only (D1, 2026-08-30) plus this participant's own
        retrospective schedule answer (P5, 2026-09-03, adr/0041/adr/0042).
        **The per-shop retrospective this section exposed from P5 through
        contractVersion 0.9.0 (extended to the three-tier vote 2026-09-05,
        adr/0044, and to include a never-voted-on shop 2026-09-05, adr/0046
        open item 3) was retired 2026-09-09 (adr/0050 decision 3, human
        decision: "あなたの回答は見れても別に意味ないかも")** -- see
        decision.requirement below for what remains.
      requiredTestIds:
        decision: gathering-participant-decision
      presenceRule: Present exactly when ParticipantView.decision is non-null (phase FINALIZED).
      decision:
        testId: gathering-participant-decision
        attributes:
          confirmedCandidateDate: data-confirmed-candidate-date
          shopId: data-shop-id
          walkingTimeMinutes: data-walking-time-minutes
        requirement: >-
          data-confirmed-candidate-date/data-shop-id mirror
          decision.confirmedCandidateDate/decision.shop.shopId exactly.
          data-walking-time-minutes (added 2026-09-12, ADR-0056 decision
          10) equals decision.shop.walkingTimeMinutes exactly -- this value
          already existed on LiveProjectedShop (decision.shop's schema,
          adr/0044 decision 4); this round adds only the DOM observation of
          it here, no API change. **data-your-schedule-response/
          yourScheduleResponse removed 2026-09-12 (ADR-0055 decision 7,
          human decision, the same person who chose adr/0050 decision 3's
          simplification on 2026-09-09 taking it one step further:
          「あなたの回答は見れても別に意味ないかも」再確認)** -- this
          contract no longer requires this attribute anywhere within
          gathering-participant-decision; a decided gathering's own
          confirmed date/shop are the only record this element carries
          about "what happened", never a retrospective of this
          participant's own past answer. This contract does not require a
          regular-holiday attribute here either -- same reasoning as
          organizerDashboard.finalizedSummary.decisionBanner.requirement
          above (adr/0046): LiveProjectedShop (decision.shop's schema)
          carries no regularHoliday field, so Final.dc.html's "定休
          日曜・祝日" line on this phone-sized decision card is likewise
          not required to be rendered by this contract. **No per-shop
          breakdown is required anywhere within gathering-participant-
          decision** (adr/0050 decision 3, 2026-09-09) -- the retired
          gathering-participant-decision-shop-vote test id and
          decision.yourShopVotes/ParticipantDecisionShopVote it projected
          are both gone; TDR-GTH-34's simplified assertion ("他の参加者の
          回答や投票、店ごとの回答の一覧は示されない") is what this
          contract now enforces here. **Changed back 2026-09-17 (ADR-0061
          decision 5, human decision: 「他の候補の店と票は出さない」)**: a
          participant can no longer see any other shop's live tally once
          finalized -- gathering-shop-vote-question/gathering-shop-vote-
          tally/gathering-shop-vote-map are all absent once
          ParticipantView.decision is non-null (see each element's own
          presenceRule, and replacesQuestionSurfaces below, all updated the
          same round). ADR-0055 decision 8 (2026-09-12) had kept them
          visible to resolve a self-contradiction between this file's
          presenceRule and TDR-GTH-34's own text; this reversal restores
          agreement the other way, matching what TDR-GTH-34 asserted all
          along. This section shows only the confirmed decision plus the
          decided shop's own location (see map below), never any other
          shop.
        map:
          testId: gathering-participant-decision-map
          formControl: false
          presenceRule: >-
            Added 2026-09-12 (ADR-0056 decision 10). Present whenever
            gathering-participant-decision itself is present (i.e.
            whenever ParticipantView.decision is non-null).
          scope: >-
            Shows exactly two points: the decided shop's own pin (marker
            below) and this participant's search origin (originMarker
            below, from ParticipantView.searchOrigin, which remains
            non-null post-finalization, adr/0045 decision 1). **Draws no
            line connecting them and no walking-radius ring** -- this
            product does not query a routing service and does not assert a
            walking path it cannot back with real routing data (ADR-0056
            decision 10's own rationale, mirroring product-brief.md §3's
            existing "徒歩経路と現在地は表示しない" boundary).
          attributes:
            overlayMarkerCount: data-overlay-marker-count
            overlayLineCount: data-overlay-line-count
            overlayRingCount: data-overlay-ring-count
          requirement: >-
            Added 2026-09-13 (spec .spec/11-a, closing 独立監査
            audit-gathering-redesign-steps.md's Major 1: scope above's
            「経路の線も徒歩の範囲の輪も描かない」claim had no DOM
            observation, so a routing-line or walking-radius overlay drawn
            without an assigned test id could not be detected). These
            three attributes live on this gathering-participant-decision-
            map element itself, not on any node internal to whichever
            mapping library renders it -- this contract does not fix or
            assume a particular library's DOM shape, the same developer's-
            choice boundary calendar.note elsewhere in this file draws for
            the calendar library. Each is the product's own running count
            of overlay objects it has drawn on this map, by kind,
            independent of whether that kind additionally carries its own
            test id. overlayMarkerCount MUST equal exactly "2" whenever
            this map is present -- marker and originMarker below already
            each require their own single instance; this count
            additionally forbids a third, untagged marker existing
            alongside them. overlayLineCount and overlayRingCount MUST
            both equal exactly "0" -- this is the DOM-observable form of
            scope above's "描かない" requirement. All three are
            decimal-integer strings ("0", "1", "2", ...); no fourth
            overlay kind is anticipated, so no fourth attribute is
            required.
          marker:
            testId: gathering-participant-decision-map-marker
            formControl: false
            attributes:
              shopId: data-shop-id
            requirement: >-
              Positioned from decision.shop.location. Display-only.
          originMarker:
            testId: gathering-participant-decision-origin-marker
            formControl: false
            requirement: >-
              Positioned from ParticipantView.searchOrigin. Display-only.
              A distinct test id from both candidate-origin-marker
              (unavailableControls.forbiddenTestIds forbids reusing that
              one) and this file's own gathering-search-origin-marker
              (participantAnswer.shopVoteQuestion.shopVoteMap above) --
              this is a separate element on a separate screen (the
              finalized view, not the vote view), even though both project
              the same underlying searchOrigin value.
        providerPageLink:
          testId: gathering-participant-decision-page-link
          formControl: false
          requirement: >-
            Added 2026-09-12 (ADR-0056 decision 10). An `<a href>` whose
            href equals decision.shop.providerPageUrl. Implemented as a
            plain anchor -- outside forbiddenFormControlCategories' scan
            (unavailableControls.formControlExemptTestIds).
      replacesQuestionSurfaces: >-
        gathering-schedule-question, gathering-participant-progress,
        gathering-participant-day-list, gathering-shop-vote-question (and
        its own gathering-shop-vote-tally), and gathering-shop-vote-map are
        all absent once ParticipantView.decision is non-null (see each
        element's own presenceRule above). **Changed back 2026-09-17
        (ADR-0061 decision 5, human decision: 「他の候補の店と票は出さない」)
        **: ADR-0055 decision 8 (2026-09-12) had excluded
        gathering-shop-vote-question from this list to resolve a
        self-contradiction between this entry and decision.requirement
        above (which, until this round, documented that a participant could
        still see every shop's live tally post-finalization) -- the human
        has now seen the finalized screen in its real-machine board form
        and chosen to hide other shops there, so this round reverses that
        exclusion and restores the original list, this time keeping
        decision.requirement above in agreement with it (both updated the
        same round) rather than repeating the earlier contradiction. Only
        the confirmed decision (gathering-participant-decision) and its own
        map/providerPageLink remain once finalized.
      noOperations: >-
        No gathering-schedule-response-option, gathering-shop-vote-option,
        or gathering-participant-name-open/submit is present once
        ParticipantView.decision is non-null (Final.dc.html B-3: "この画面
        に操作はありません") -- setScheduleResponse and setShopVotes both
        reject with GATHERING_FINALIZED at the API layer regardless, but
        this contract additionally requires the controls themselves to be
        absent from the DOM, not merely disabled (mirrors
        organizerDashboard.finalizedSummary's stronger absence rule for
        revoke).
    linkError:
      testId: gathering-participant-link-error
      attribute: data-link-error-code
      values: [LINK_NOT_FOUND, LINK_EXPIRED, LINK_REVOKED, LINK_RATE_LIMITED]
      requirement: >-
        Present exactly when the participant-facing API call underlying this
        page load returned the correspondingly named ProblemResponse.code
        (gathering-scheduling-api.yaml). `LINK_REVOKED` (added 2026-08-30,
        ADR-0036 decision 7) is present exactly when the organizer has
        revoked this token via revokeParticipantLink -- TDR-GTH-19.
        `LINK_NOT_FOUND` is also present when the token's gathering was
        deleted (adr/0050 decision 4, TDR-GTH-48) -- the same code an
        unissued token already produces, since no new value distinguishes
        the two causes (gathering-scheduling-api.yaml introduces none). Its
        visible text must not disclose the gathering's title, any
        participant's name or response, or any other gathering content
        (mirrors authentication-browser-interface.yaml's disclosure
        discipline for its own failure surfaces). Unlike authentication's
        account-enumeration protection, this contract does not require
        LINK_NOT_FOUND/LINK_EXPIRED/LINK_REVOKED to be indistinguishable from
        each other -- possessing a link already implies the holder was
        invited, so which of these three failure reasons applies is not
        equivalent to leaking whether an unrelated account exists.
    loadFailure:
      testId: gathering-participant-load-error
      presenceRule: >-
        Present exactly per
        browserEntry.participantAnswer.unexpectedLoadFailureOutcome above;
        absent whenever validLinkOutcome or invalidLinkOutcome instead
        applies.
      requirement: >-
        Added 2026-09-06 (adr/0047, TDR-GTH-42, human chat decision
        2026-09-06: 「短いお知らせを出す」). Its visible text must convey
        only that loading failed and that reopening the link later may
        work (the human's own wording, "うまく読み込めませんでした。時間を
        おいて開き直してください", or an equivalent paraphrase -- this
        contract does not fix the exact Japanese string, only its meaning).
        It must not disclose any technical or internal detail -- an HTTP
        status code, an exception message or stack trace, a request/trace
        identifier, a hostname, or any of
        profiles.localAcceptance.syntheticDisclosureCanaries' values --
        mirroring linkError's own disclosure discipline above (this
        element's disclosure risk is higher than linkError's, since it is
        shown precisely when something on the server failed in a way this
        contract had not already named).
      noRetryControl: >-
        This element contains no purpose-declared control, and no
        allowedPurposes entry exists for one -- human ruling (2026-09-06
        chat, presented alongside a "add a retry button" alternative that
        was not chosen): the notice alone is the required behavior
        (「やり直すボタンは置かない」). Reopening the participant link (a
        fresh page load of the same URL) is the only way to retry; this
        contract does not require a dedicated shortcut for that.

browserActions:
  openGatheringFromList:
    inputs: [gathering-list-item-open]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringList.list.item.open.requiredOutcome
  openGatheringCreate:
    inputs: [gathering-create-open]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringList.createOpen.requiredOutcome
  createGathering:
    inputs: [gathering-create-name-input, gathering-create-candidate-date-day,
             gathering-create-submit]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringCreate.submit.requiredOutcome
  cancelGatheringCreate:
    inputs: [gathering-create-cancel]
    success:
      requiredOutcome: browserControlSurface.organizerGatheringCreate.cancel.requiredOutcome
  addCandidateDateInline:
    inputs: [gathering-add-candidate-date-open, gathering-add-candidate-date-day,
             gathering-add-candidate-date-submit]
