# 2026-09-04 追補2 (architect、ADR-0043。developerが実装中に発見した契約の自己矛盾、FR-028):
# - **矛盾の内容**: `browserEntry.participantAnswer.validLinkOutcome`は2026-08-30起草時点から
#   `present: [gathering-participant-header, gathering-schedule-question]`と書いており、有効な
#   リンクを開けば常に`gathering-schedule-question`が存在すると要求していた。一方、
#   `scheduleQuestion.presenceRule`（本ファイル2026-09-04追補、adr/0042）は「`ParticipantView.
#   decision`が非nullなら`gathering-schedule-question`は不在」と明記した。確定後
#   （`decision`が非null）の状態で両者は文字どおり矛盾する——これはarchitect自身がadr/0042起草時に
#   見落としていた、`validLinkOutcome`という古い記述との整合確認漏れである。developerが実装中に
#   発見し、FR-028の流儀（解消せず報告）でそのまま報告した。
# - **修正方針**: developerの実装判断（新しく具体的な`presenceRule`を正とし、確定後は設問を
#   出さない）を追認する——`Final.dc.html`B-3自体がこの読みを裏づけている（決定後は
#   per-candidate-date/per-shopの内訳を再掲しない）。`validLinkOutcome`の文面を、有効なリンクに
#   ついて無条件に成り立つことだけ（ヘッダーの存在・エラー面の不在）に狭め、局面・`decision`に
#   依存する要素（`gathering-schedule-question`・`gathering-participant-decision`等）の生死は、
#   それぞれの`presenceRule`だけに委ね、`validLinkOutcome`側では二重に記述しない——同じ条件を
#   2箇所に書くと、今回のように片方だけ更新されて食い違う再発を防ぐための設計判断である。
