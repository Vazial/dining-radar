# Dining Radar authentication browser acceptance interface
#
# This is test infrastructure, not a new public API. It is the machine-readable
# control-surface and observation SSoT for local authentication acceptance work.
# Developer and tester must read it verbatim (meta/adr/0008). It projects the
# human resolution recorded by ADR-0007 and does not change TDR-AUTH outcomes.
#
# 2026-08-06 amendment: adds browserControlSurface.authenticated.renderModel,
# which makes explicit that TDR-AUTH's plain-HTTP DSL (ADR-0009 decision 4)
# observes server-rendered HTML only. This was needed because
# candidate-search-browser-interface.yaml now allows grouping auth-sign-out
# and auth-password-change-open behind a menu-style disclosure control
# (projects/dining-radar/adr/0013), and an implementation that
# inserted those controls purely via client-side JavaScript would silently
# break this file's existing plain-HTTP observation. No scenario, test id,
# or security observation changed. This amendment becomes durable when its
# PR merges (meta/adr/0035 method (i)).
contractVersion: '0.2'
kind: acceptance-browser-interface
scope: authentication
profiles:
  localAcceptance:
    transport: HTTP
    publicDeployment: false
    verifiesScenarios:
      [TDR-AUTH-01, TDR-AUTH-02, TDR-AUTH-03, TDR-AUTH-04, TDR-AUTH-05, TDR-AUTH-07]
    sessionCookie:
      secure: false
      httpOnly: true
      sameSiteAllowed: [Lax, Strict]
    invariant:
      - This profile is isolated and must never be selected by a public deployment.
      - Its Secure=false cookie exception exists only so a local HTTP browser can exercise session behaviour.
      - CSRF protection, same-origin use, HttpOnly, and SameSite remain required.
    syntheticDisclosureCanaries:
      privateSearchOrigin: synthetic-private-origin-never-disclose.invalid
      providerInternals: synthetic-provider-internals-never-disclose
      description: >-
        Public browser and API response bodies must not contain these exact
        synthetic values. They stand in for the private-origin and provider
        internals named by TDR-AUTH; no real value is used by acceptance work.
  deployment:
    transport: HTTPS
    publicDeployment: true
    verifiesScenarios: [TDR-AUTH-06]
    sessionCookie:
      secure: true
      httpOnly: true
      sameSiteAllowed: [Lax, Strict]
    invariant:
      - Actual HTTPS transport, certificate, redirect, and real-origin checks are deferred to the deployment slice.
      - No real origin, certificate material, allowlist, secret, or account may appear in this repository.

browserEntry:
  localAcceptanceRunner:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
      description: >-
        Supplied by the isolated acceptance runner; it is a local runtime value,
        never a committed origin. The runner must not discover an entry URL from
        implementation source or a developer-specific server port.
    startPath: /
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/'
    unauthenticatedOutcome:
      present: [auth-sign-in-form]
      absent: [authenticated-application-shell]
    authenticatedOutcome:
      present: [authenticated-application-shell]
      absent: [auth-sign-in-form]

browserControlSurface:
  unauthenticated:
    requiredTestIds:
      signInForm: auth-sign-in-form
      loginIdentifier: auth-login-identifier
      password: auth-password
      submit: auth-sign-in-submit
      administratorAssistance: auth-administrator-assistance
    forbiddenTestIds:
      - authenticated-application-shell
      - auth-sign-out
      - auth-password-change-open
      - candidate-proposal-content
      - candidate-map
      - candidate-reproposal-lenses
      - private-search-origin
    absenceCheck:
      entry: localAcceptanceRunner
      states: [initial, genericFailure, throttledFailure]
  authenticated:
    requiredTestIds:
      applicationShell: authenticated-application-shell
      signOut: auth-sign-out
      passwordChangeOpen: auth-password-change-open
      individualAccountGuidance: auth-individual-account-guidance
    renderModel: >-
      TDR-AUTH is verified by the plain-HTTP DSL (ADR-0009 decision 4): it
      parses the server's HTTP response body and does not execute
      client-side JavaScript. Every control this file requires present --
      including auth-sign-out and auth-password-change-open when an
      implementation groups them behind a disclosure control (for example
      candidate-search-browser-interface.yaml's auth-account-menu-toggle
      purpose, added by projects/dining-radar/adr/0013) -- must exist
      in the server-rendered HTML markup returned by that response. A
      control that only client-side JavaScript inserts into the DOM after
      load is absent for this profile's purposes, even though a JS-capable
      browser would later render it. Hiding an already-present control with
      the HTML hidden attribute, a CSS class, or an equivalent markup-level
      technique is permitted -- presence means DOM existence, not
      visibility, exactly as semanticObservations.individualAccountGuidance
      below already establishes for that control. Only client-JS-only
      insertion (the control does not exist in the raw HTTP response at
      all) is forbidden by this profile.
    semanticObservations:
      individualAccountGuidance:
        testId: auth-individual-account-guidance
        requiredDataAttributes:
          data-auth-account-use: individual-only
          data-auth-credential-sharing: not-requested
        description: >-
          This semantic state records the approved individual-account outcome:
          the signed-in organizer uses an individual account and is not asked
          to share credentials. It deliberately does not prescribe visible
          wording, layout, or a new public operation.
    forbiddenTestIds:
      - auth-sign-in-form
  passwordChange:
    requiredTestIds:
      form: auth-password-change-form
      currentPassword: auth-current-password
      newPassword: auth-new-password
      confirmation: auth-new-password-confirmation
      submit: auth-password-change-submit
  unavailablePublicOperations:
    forbiddenTestIds:
      - auth-public-sign-up
      - auth-email-password-reset
    absenceCheck:
      entry: localAcceptanceRunner
      states: [initial, genericFailure, throttledFailure]
    routeProbes:
      publicSignUp:
        path: /sign-up
        requiredStatus: 404
      emailPasswordReset:
        path: /password-reset
        requiredStatus: 404
        responseBodyForbiddenKeys: [token, resetToken, email]

browserActions:
  signIn:
    inputs: [auth-login-identifier, auth-password, auth-sign-in-submit]
    success:
      present:
        [authenticated-application-shell, auth-sign-out,
         auth-password-change-open, auth-individual-account-guidance]
      absent: [auth-sign-in-form]
      requiredSemanticObservations:
        - browserControlSurface.authenticated.semanticObservations.individualAccountGuidance
      sessionPersistenceProof:
        action: reopen-localAcceptanceRunner-with-same-browser-cookie-jar
        present: [authenticated-application-shell]
        absent: [auth-sign-in-form]
    genericFailure:
      present: [auth-sign-in-failure]
      forbiddenDisclosure: [account-exists, account-disabled, private-search-origin, credential, provider-internals]
      accountStateProof:
        normalizedPublicContentMustMatchFor: [unknown-account, disabled-account]
    throttledFailure:
      present: [auth-sign-in-throttled]
      forbiddenDisclosure: [account-exists, account-disabled, private-search-origin, credential, provider-internals]
      accountStateProof:
        normalizedPublicContentMustMatchFor: [unknown-account, disabled-account]
  signOut:
    inputs: [auth-sign-out]
    success:
      present: [auth-sign-in-form]
      absent: [authenticated-application-shell, auth-sign-out]
  changePassword:
    inputs:
      [auth-password-change-open, auth-current-password, auth-new-password,
       auth-new-password-confirmation, auth-password-change-submit]
    success:
      observable: subsequent-sign-in-accepts-new-password
  protectedCandidateAccess:
    unauthenticated:
      browser:
        present: [auth-sign-in-form]
        absent:
          [authenticated-application-shell, candidate-proposal-content,
           candidate-map, candidate-reproposal-lenses, private-search-origin]
      apiContract:
        file: contracts/candidate-search-api.yaml
        schemaRef: '#/components/schemas/ProblemResponse'
        response: {status: 401, code: AUTHENTICATION_REQUIRED}
    deactivatedSession:
      requiredSequence:
        - establish-authenticated-session
        - deactivate-account-through-setAuthenticationAcceptanceAccount
        - send-candidate-proposal-request-with-existing-browser-cookie-jar
        - assert-api-response
        - reopen-localAcceptanceRunner-and-assert-browser-state
      firstPostDeactivationOperation: candidate-proposal-request-with-existing-browser-cookie-jar
      browser:
        present: [auth-sign-in-form]
        absent:
          [authenticated-application-shell, candidate-proposal-content,
           candidate-map, candidate-reproposal-lenses, private-search-origin]
      apiContract:
        file: contracts/candidate-search-api.yaml
        schemaRef: '#/components/schemas/ProblemResponse'
        response: {status: 401, code: AUTHENTICATION_REQUIRED}

disclosureObservations:
  responseSurfaces:
    [initial-browser-entry, generic-sign-in-failure, throttled-sign-in-failure,
     unauthenticated-candidate-api, deactivated-session-candidate-api]
  bodyMustNotContain:
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.privateSearchOrigin
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.providerInternals
    - source: submitted-login-password
  bodyMustNotExposeTestIds:
    [auth-account-exists, auth-account-disabled, private-search-origin]
  accountStateComparison:
    genericFailure: normalized-public-content-identical-for-unknown-and-disabled
    throttledFailure: normalized-public-content-identical-for-unknown-and-disabled
  apiSchemaValidation:
    file: contracts/candidate-search-api.yaml
    schemaRef: '#/components/schemas/ProblemResponse'
    appliesTo: [unauthenticated-candidate-api, deactivated-session-candidate-api]

securityObservations:
  stateChangingOperations:
    - signIn
    - signOut
    - changePassword
    - candidateProposal
  invalidOrAbsentCsrf:
    requiredOutcome: rejected-4xx
  arbitraryCredentialedOrigin:
    requiredOutcome: not-allowed
  browserBearerTokenStorage:
    requiredOutcome: absent
  acceptanceProfileObservation:
    testSupportOperation: getAuthenticationAcceptanceSecurityBoundary
    contract: contracts/test-support-api.yaml
    responseMustReflect: effective-running-acceptance-configuration
  deploymentTransport:
    requiredOutcome: deferred-to-deployment-slice
