# この追補を反映する (v1.5.0 -> v1.6.0):
# designerがMobile.dc.htmlで報告した契約の穴を塞ぐ。人間裁定2026-08-29により、1024px未満の幅も
# 地図主体になり、「地図で見る」帯・全画面シート・戻るバー（listPrimaryLayoutの2要素、
# candidate-map-open・candidate-map-sheet-close）を廃し、デッキの送りは指のスワイプで行う
# （送りボタンは置かない）。
# - renderModes.listPrimaryLayoutを退役させる。どの幅でもこの2要素を選ばなくなったため、この
#   契約はもう定義しない。代わりにrenderModes.mapPrimaryTouchLayoutを新設し、
#   renderModes.mapPrimaryLayout（従来のデスクトップ・送りボタン版）と互いに排他な、名前付き
#   モードを引き続き2つ保つ——両方とも地図主体になり、違いはデッキの送り方（ボタンかスワイプか）
#   だけになる (adr/0033 決定1)。designerが板で挙げた2案（案あ=新モード新設／案い=送りボタンを
#   DOM上に残し視覚的に隠す）のうち、人間は案あを選んだ——理由はテストが押せるボタンを人間が
#   押せない状態を自ら作らないため (adr/0033 決定1、検討した代替案)。
# - candidate-deck-position（件数カウンタ）を、どちらか一方のモード専有ではなく、現在名前を
#   持つ2モードいずれでも共通に存在する要素として扱う。renderModesの各モードのtestIds配列からは
#   外し、deckNavigation.position.presenceRule自身がその条件を直接述べる形にした (adr/0033 決定2)。
# - deckNavigation.swipeSurfaceを新設する（candidate-deck-swipe-surface、mapPrimaryTouchLayout
#   専有）。ボタンではなくコンテナ要素であり、allCandidateScreenFormControlsMustDeclarePurpose
#   の対象外——新しいallowedPurposesは要らない (adr/0033 決定2)。
# - browserActionsにpageDeckSwipeForward・pageDeckSwipeBackwardを新設する。合成のポインタ/タッチ
#   ジェスチャで検証し、`unaffected`は既存のpageDeckNext/Previousと同じ6項目（pendingFiltersを
#   含む）を保つ。L4検証がactiveContext.mdのG1（合成クリックは人間の指の到達可能性を証明しない）
#   と同種の限界をドラッグ操作へ初めて広げることを明記した (adr/0033 決定3)。
# - deckNavigation.disabledStateはmapPrimaryLayout（ボタンのある側）専有のまま無変更。
#   mapPrimaryTouchLayoutには対応するnative disabled状態が無いため、両端での挙動は
#   pageDeckSwipeForward/Backwardのboundaryovershoot条項が別途定める (adr/0033 決定4)。
# - selectMarker.deckVisibilityの適用条件を、mapPrimaryLayout専有からmapPrimaryLayout/
#   mapPrimaryTouchLayoutいずれでも適用される形へ一般化する (adr/0033 決定5)。
# - adr/0032決定1(f)の本文は編集しない(P-06)が、本追補により(f)の狭幅側の期待値の意味が
#   listPrimaryLayoutからmapPrimaryTouchLayoutへ変わる。renderModes.verificationAllocation.L5に
#   その旨を明記した (adr/0033 決定6)。
# - 徒歩圏リングラベルの集合比較の穴（F1b）・可視ラベルのdata-testid欠落・デッキ送りの
#   pendingFilters不変性が未検証である件（activeContext.md）は、いずれも起源が異なる別件として
#   本改訂に含めない (adr/0033 決定7)。
# - contractVersionを1.5.0から1.6.0へ上げる。`candidate-search.feature`は無変更——adr/0031と同じ
#   理由（デッキの送り方はTDR-CS-02のUI実装詳細であり、新しい業務能力を語っていない）による。
#
# 2026-09-01 追補 (architect、dining-radar/adr/0038。未承認。人間裁定「ランチ候補画面から会への
# 導線」への最小限の対応):
# 実機フィードバック「幹事画面ってあるの？新機能が見て取れない」を受け、designerがHandoff.dc.htmlで
# 3案を示し、人間が案B（ヘッダーに「会」ボタン＋進行中件数バッジ）を選んだ。この画面（TDR-CSの候補
# 提案画面）が会スコープ（TDR-GTH）の情報を初めて持つ——2つの機能が結合する（designerの指摘どおり）。
# - authenticatedInitialOutcome.presentへ`candidate-gathering-entry`を追加する。
# - 新規トップレベル節`gatheringEntry`を新設する（下記）。
# - `candidate-gathering-entry`はHandoff.dc.htmlの設計判断を踏襲し、`<button>`・`role="button"`を
#   使わない素の`<a href>`（またはtabindex付きの素の`<div>`）として実装できる——
#   `allCandidateScreenFormControlsMustDeclarePurpose`の走査対象
#   （`forbiddenFormControlCategories`が拾う`<button>`/`<input>`/`<select>`/`<textarea>`/一部の
#   ARIA role）に該当しないため、`allowedPurposes`へ新しいpurposeを追加する必要がない
#   （`candidate-origin-marker`・`candidate-map-open`と同じ「表示専用/ナビゲーションのみのdiv・a」
#   様式の再利用、activeContext.md 2026-08-25の記録が確認済みの走査挙動に基づく）。この要素は
#   候補提案の状態（提案・選択・絞り込み・基点・探索範囲）を一切変えない、ページ間の移動だけを
#   行う要素である。
# - バッジの件数（`data-in-progress-gathering-count`）は`gathering-scheduling-api.yaml`の
#   `getInProgressGatheringCount`から得る——本ファイルの`apiObservations.publicContract`
#   （`candidate-search-api.yaml`）とは別の契約への参照であり、このファイルが初めて他プロジェクト
#   内の別契約を参照する。件数は候補提案の応答そのものには含めない（`candidate-search-api.yaml`は
#   無変更）。
# - 候補画面deckの見た目3件（PCカード高さ場所確保・件数ページャー・スマホ高さ削減、2026-09-01人間
#   裁定4〜6）はdesignerが契約条件を確認済みで契約影響なし——唯一の制約（PCカード案Bの空き場所に
#   `candidate-card-payment-caution`のtest idを付けないこと）は、cardDataAttributes.
#   cardPaymentCautionの既存presenceRule（cardPaymentAvailableがfalseの場合にだけ存在する）が
#   既に強制しており、本ファイルの変更を要しない。
# - contractVersionを1.6.0から1.7.0へ上げる。
#
# 2026-09-09 追補 (architect、adr/0049。2026-09-08の人間裁定8件のうち画面構成に関わる3件
# （裁定1・裁定6・裁定7）への対応。前段のarchitectがADR本体で確定させた仕様を、本段が本ファイルへ
# 反映した。contractVersionを1.7.0から1.8.0へ上げる):
# - **会モードの観測面を新設する**（adr/0049決定1、2026-09-08人間裁定「1枚目の画面の存在価値が
#   なくなってない？」への対応）: 新規トップレベル節`gatheringMode`を新設する（下記）。会モードは
#   `candidate-search-api.yaml`の`proposeCandidates`が`gatheringId`を受け取り、応答の
#   `gatheringContext`が非nullになったときに成立する——本ファイルはこの成立条件をpresenceRuleとして
#   観測する。カードへ「この会に入れる」トグル（新規purpose`candidate-card-gathering-toggle`、
#   `allowedPurposes`へ追加）を追加し、`gathering-scheduling-api.yaml`の`setShortlistedShops`を
#   直接呼ぶ——新しい書き込みエンドポイントは本ファイル側に増やさない（書き込みは会の契約が持つと
#   いう決定1の原則）。5件到達後の未選択カードのトグルは非活性にする（決定8）。旧
#   `organizerDashboard.shortlistSelection`（`gathering-scheduling-browser-interface.yaml`側）は
#   全廃されるため、この画面が店選びの唯一の入口になる。
# - **PCを2カラムへ戻す**（adr/0049決定4、2026-09-08人間裁定「微妙。右に地図で一覧左とかじゃ
#   なかったっけ」）: `renderModes.mapPrimaryLayout`（送りボタン・件数カウンタを伴う地図全面デッキ、
#   adr/0031）を退役させ、専有のtest idを持たない`twoColumnLayout`へ置き換える——adr/0023が
#   TDR-CS-07の再提案test idを死んだモードとして残さず削除したのと同じ流儀で、
#   `candidate-deck-previous`/`-next`とそれらのbrowserActions（pageDeckPrevious/Next）を完全に
#   削除する（非推奨のまま残さない）。`unavailableControls.allowedPurposes`から
#   `candidate-deck-page-previous`/`-next`を削除する。`candidate-deck-position`は
#   `mapPrimaryTouchLayout`（モバイル）専有として残る。カードの圧縮を戻す件（決定4後段）は契約
#   変更を要しない——`cardDataAttributes.cardPaymentCaution`の既存presenceRuleが唯一の関連Mustで
#   あり、この規則自体は2カラムでも変わらず適用される（架空の新Mustを追加しない、adr/0049決定4）。
# - **モバイルのカードは1枚ずつきっちり止まる**（adr/0049決定5、2026-09-08人間裁定「スワイプが
#   途中で止まって見切れる症状を直す」）: `deckNavigation.swipeSurface`へ、指を離した位置によらず
#   常にちょうど1枚のカードが完全に見える状態で止まることを要求する記述を追加する。実装手段
#   （scroll-snap等）は契約として固定しない——結果だけを固定する。`deckNavigation.position`の
#   `data-deck-visible-start`/`-end`が、`mapPrimaryTouchLayout`が保持する限り常に等しい
#   （`visibleStart == visibleEnd`）という新しい制約をこの属性の記述へ加える——「1枚だけが見えて
#   いる」ことを間接的に示す既存の仕組みを維持する。
#
# 2026-09-12 追補 (architect、adr/0054・0055・0056。会の画面群の構成・導線と、この製品にまだ
# 存在しない値・観測面の追加のうち、この画面(candidate-search)に集まる決定への対応。
# contractVersionを1.8.0から1.9.0へ上げる):
# - **candidate-gathering-entryを会の画面群でも常設にする**（ADR-0054決定1）: gatheringEntry.
#   entry.requirementへ、gathering-scheduling-browser-interface.yamlの
#   organizerGatheringList・organizerGatheringCreate・organizerDashboard各画面でも同じ要素が
#   常設されることを明記し、狭幅でもラベル文字を消してはならないというMustを追加した
#   （participantAnswerはADR-0054決定7の例外のまま対象外）。
# - **candidate-gathering-entryへ会モード時のdata-active-gathering-idを追加する**（ADR-0056
#   決定8）。
# - **candidate-map-markerへdata-gathering-shortlistedを追加する**（ADR-0056決定4）:
#   markerDataAttributesとgatheringMode.mapMarkerを新設し、cardToggleと同じ値をピン側にも
#   持たせた。
# - **帯（candidate-gathering-mode-band）へdata-shortlist-limit-reachedを追加し、帯自体を会へ
#   戻るナビゲーションと定める**（ADR-0056決定7・ADR-0054決定4）: 新規browserAction
#   returnToGatheringFromBandを追加した。独立した「確定して戻る」操作は置かない——店は押した瞬間に
#   保存されるため。
# - **会モードのカードへの「あとから入りました」印（data-added-after-voting-started）は本改訂に
#   含めない**——REVISION-PLAN.md第3節項目6はこれをcandidate-cardへ追加すると計画したが、
#   candidate-search-api.yamlのCandidateスキーマにこの値の裏付け（いつ・どのタイミングで追加
#   されたかを示すフィールド）が無く、同計画第4節が「API層の変更は不要」と結論した前提と矛盾する。
#   この一件は実行せず、人間へ申し送る。
# - 帯の日付表示の書式（曜日を含めるか）・帯のスマホでの貼り付け表示は、いずれもREVISION-PLAN.md
#   第3節の6項目にもADR-0054/0056の決定本文にも見当たらない——rendered-geometry/文言の実装選択
#   として既存のwalkingTimeEstimateWording等と同じ扱いのまま、本改訂でも固定しない。

contractVersion: '1.9.0'
kind: acceptance-browser-interface
scope: candidate-search
profiles:
  localAcceptance:
    transport: HTTP
    publicDeployment: false
    verifiesScenarios:
      [TDR-CS-00, TDR-CS-01, TDR-CS-02, TDR-CS-03, TDR-CS-04, TDR-CS-05,
       TDR-CS-06, TDR-CS-08, TDR-CS-09, TDR-CS-10, TDR-CS-11, TDR-CS-12,
       TDR-CS-13, TDR-CS-14, TDR-CS-15, TDR-CS-16, TDR-CS-17, TDR-CS-18,
       TDR-CS-19]
    invariant:
      - The profile is isolated and must never be selected by a public deployment.
      - Candidate state is supplied only through contracts/test-support-api.yaml.
      - Browser actions use only the public same-origin authentication and candidate-proposal boundaries.
      - No real provider, configured search origin, credential, provider identifier, or provider response is used.
    syntheticDisclosureCanaries:
      privateSearchOrigin: synthetic-private-origin-never-disclose.invalid
      providerInternals: synthetic-provider-internals-never-disclose

browserEntry:
  localAcceptanceRunner:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startPath: /
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/'
  unauthenticatedOutcome:
    present: [auth-sign-in-form]
    absent:
      [candidate-proposal-content, candidate-map, candidate-filter-open,
       candidate-filter-panel, candidate-search-again,
       candidate-budget-tier-note, candidate-manual-ordering,
       private-search-origin]
  authenticatedInitialOutcome:
    present: [candidate-proposal-content, candidate-proposal-cards, candidate-map,
              candidate-provider-credit, candidate-filter-open,
              candidate-search-again, candidate-origin-marker,
              candidate-gathering-entry]
    absent: [candidate-budget-tier-note, candidate-filter-genre-overflow,
             candidate-filter-pending-note,
             candidate-filter-apply, candidate-filter-revert,
             candidate-manual-ordering, candidate-gathering-mode-band,
             candidate-card-gathering-toggle]
    note: >-
      This is the ordinary (non-gathering) authenticated entry, reached
      without a gatheringId (see gatheringMode below for the distinct
      gathering-mode entry, reached instead from
      gathering-scheduling-browser-interface.yaml's
      gathering-shortlist-open, adr/0049 decision 1) -- gatheringMode's
      test ids are therefore absent here, added to this outcome's absent
      list by adr/0049.

renderModes:
  description: >-
    Some application-authored test ids exist only under one of two mutually
    exclusive implementation-chosen rendering conditions, and never under
    the other. This contract does not fix the condition's threshold
    (mirrors how it already leaves viewport width, breakpoints, and column
    counts unfixed elsewhere, e.g. authenticatedInitialOutcome above) -- it
    fixes only that exactly one named mode holds at a time, and which test
    ids belong to each. adr/0031 introduced this section with two modes:
    listPrimaryLayout (a pre-adr/0031 list-primary mobile layout with an
    open/close map sheet, candidate-map-open / candidate-map-sheet-close)
    and mapPrimaryLayout (a map-primary desktop layout with a button-paged
    card deck). adr/0033 retired listPrimaryLayout: the human decision that
    made mobile widths map-primary too (2026-08-29) means no width selects
    listPrimaryLayout's two test ids any longer, so this contract no longer
    defines them (mirrors how TDR-CS-07's reproposal test ids were removed
    outright, not kept as a dead mode, when adr/0023 retired that feature).
    adr/0033 added mapPrimaryTouchLayout in listPrimaryLayout's place, so
    this section named exactly two mutually exclusive modes -- both
    map-primary, differing only in how their deck was paged (buttons vs a
    swipe gesture). adr/0049 decision 4 (2026-09-08 human decision: "微妙。
    右に地図で一覧左とかじゃなかったっけ") retires mapPrimaryLayout in turn,
    for the same reason and in the same style adr/0033 retired
    listPrimaryLayout -- the desktop deck's paged, map-primary layout is
    replaced by twoColumnLayout (a plain side-by-side list-and-map layout
    with no deck paging, since all up to 5 cards fit in one column at
    once). This section still names exactly two mutually exclusive modes --
    twoColumnLayout (desktop, no deck) and mapPrimaryTouchLayout (mobile,
    swipe-paged deck, unchanged by this revision) -- but they are no longer
    both map-primary: twoColumnLayout shows the full card list beside the
    map rather than overlaying a deck on top of it (see
    browserControlSurface.proposal.deckNavigation below for what
    twoColumnLayout no longer needs).
  twoColumnLayout:
    exclusiveWith: mapPrimaryTouchLayout
    testIds: []
    note: >-
      The desktop, side-by-side list-and-map layout (adr/0049 decision 4,
      2026-09-08 human decision, replacing mapPrimaryLayout's map-primary,
      button-paged deck). This mode owns no test id of its own -- unlike
      mapPrimaryLayout before it, which owned candidate-deck-previous/-next
      -- because showing all up to 5 cards as a plain list needs no paging
      control and no swipe surface. Its testIds array is empty by design;
      renderModes.invariant's mutual-exclusivity property still holds for
      this mode (vacuously for its own, empty test id set, and
      non-vacuously in requiring mapPrimaryTouchLayout's
      candidate-deck-swipe-surface to be absent while this mode holds).
      candidate-deck-position is likewise absent while this mode holds (see
      deckNavigation.position.presenceRule below) -- it is no longer common
      to both named modes as it was under adr/0033, because a plain list
      has nothing for a position counter to describe.
  mapPrimaryTouchLayout:
    exclusiveWith: twoColumnLayout
    testIds: [candidate-deck-swipe-surface]
    note: >-
      The touch-driven mobile layout (adr/0033; human decision 2026-08-29:
      mobile widths become map-primary, replacing the prior list-primary
      layout, and their deck is paged by a horizontal swipe gesture rather
      than buttons). orchestrator presented two options for this gap --
      adding this new named mode, or keeping candidate-deck-previous/-next
      in the DOM but visually minimized -- and the human chose the former
      because the latter would leave a button in the DOM that an automated
      test can press but an organizer cannot (see adr/0033's 検討した代替案
      for the full reasoning). Unchanged by adr/0049 -- decision 4 (PC
      two-column) and decision 5 (mobile deck stops on exactly one card,
      see deckNavigation.swipeSurface below) both leave this mode's own
      name, exclusivity, and testIds untouched; adr/0049 decision 4's
      "mapPrimaryTouchLayout" mentions above are only for contrast with
      the retired desktop mode.
  invariant: >-
    Exactly one of the two named modes holds for the current render at any
    time. A test id listed under one mode is present only while that mode
    holds, and absent while the other mode holds. Each present test id
    separately obeys its own requirements elsewhere in this contract
    (allowedPurposes, requiredOutcome, presenceRule, etc.) while its mode
    holds; renderModes adds only the mutual-exclusivity property, not new
    per-element behavior. candidate-deck-position is present only while
    mapPrimaryTouchLayout holds (deckNavigation.position.presenceRule) --
    unlike under adr/0033, it is not a member of twoColumnLayout's testIds
    array, and twoColumnLayout's own testIds array may be empty (adr/0049
    decision 4): a mode with no exclusive test ids of its own still
    participates in this exclusivity property, which then holds vacuously
    for that mode's own (empty) set and non-vacuously for the other mode's
    test ids being absent while this mode holds.
  verificationAllocation:
    L4: >-
      Acceptance drives the browser at this contract's single fixed test
      viewport and asserts that whichever named mode's test ids are
      present, every test id of the other mode is absent. L4 does not
      itself switch viewport width or otherwise force a mode transition;
      dispatching the swipe gesture to verify pageDeckSwipeForward/
      Backward's own requiredOutcome is a separate concern covered by
      those actions' own verificationAllocation, not by this exclusivity
      check.
    L5: >-
      Rendered-geometry invariants (adr/0020) are the layer that varies
      viewport width, and adr/0032 -- agreed in the same slice as
      adr/0031's revision (human ruling 2026-08-28: add the width gate now
      rather than after the layout ships) -- adds invariant (f) to
      adr/0020 decision 4's frozen set for exactly this: that the correct
      mode holds at each tested width, originally using listPrimaryLayout
      as the narrow-width expectation and mapPrimaryLayout as the
      wide-width expectation. adr/0033 does not edit adr/0032's text (P-06),
      but changed what (f)'s narrow-width expectation meant in practice
      once listPrimaryLayout no longer existed: the narrow-width member of
      (f)'s developer-maintained viewport set must expect
      mapPrimaryTouchLayout's test ids present and the wide-width member's
      test ids absent, mirroring the same present/absent structure (f)
      already had -- only which named mode narrow widths expect changed.
      adr/0049 decision 4 (2026-09-08) changes (f)'s wide-width expectation
      in the same way, without editing adr/0032's or adr/0033's text
      (P-06): the wide-width member of (f)'s viewport set must now expect
      twoColumnLayout (no deck test ids at all) rather than
      mapPrimaryLayout's candidate-deck-previous/-next present. The width
      value itself still lives in that L5 test, not in this contract
      (adr/0032 decision 2, unchanged). Each tested width is still checked
      on an independent page load; the implementation is not required to
      switch modes on a live resize without a re-render (adr/0032 decision
      3, unchanged).

browserControlSurface:
  proposal:
    requiredTestIds:
      content: candidate-proposal-content
      cards: candidate-proposal-cards
      card: candidate-card
      map: candidate-map
      mapMarker: candidate-map-marker
      searchOriginMarker: candidate-origin-marker
      providerCredit: candidate-provider-credit
      filterOpen: candidate-filter-open
      searchAgain: candidate-search-again
      izakayaBarFallbackNotice: candidate-izakaya-bar-fallback-notice
      budgetTierNote: candidate-budget-tier-note
    cardDataAttributes:
      candidateRef: data-candidate-ref
      requiredFields:
        name: {testId: candidate-card-name}
        genre: {testId: candidate-card-genre}
        description: {testId: candidate-card-description}
        regularHoliday: {testId: candidate-card-regular-holiday}
        totalSeats: {testId: candidate-card-total-seats, rawValueAttribute: data-raw-value}
        nonSmokingStatus: {testId: candidate-card-non-smoking, rawValueAttribute: data-raw-value}
        dinnerBudgetTier: {testId: candidate-card-dinner-budget, rawValueAttribute: data-raw-value}
        walkingTimeMinutes: {testId: candidate-card-walking-time}
        providerPageLink: {testId: candidate-card-provider-page-link}
      labelObservation:
        semanticAttribute: data-field-label
        requirement: non-empty-accessible-or-visible-label-for-every-required-field
      valueStateAttribute: data-value-state
      valueStates: [provided, unavailable]
      nullBehavior: >-
        Every required field has its stated label. A nullable API value uses
        data-value-state=unavailable and an implementation-neutral visible
        unavailable value. A non-null API value uses data-value-state=provided.
        A required field whose requiredFields entry declares
        rawValueAttribute (totalSeats, nonSmokingStatus, dinnerBudgetTier)
        additionally carries that attribute on the same element when
        provided, equal as an exact string to the returned raw API value
        (for totalSeats, its canonical decimal string, e.g. 38 -> "38"; for
        nonSmokingStatus and dinnerBudgetTier, the exact enum string, e.g.
        "FULL" or "MID"); the acceptance test asserts this attribute for
        exact equality, and the field's visible value may instead show an
        implementation-chosen coarse label derived from a different response
        field or a fixed per-enum-value label (totalSeats's visible value
        reflects capacityTier's label, e.g. "少なめ"/"標準"/"多め" for
        SMALL/MEDIUM/LARGE, not the raw number; nonSmokingStatus's visible
        value reflects a fixed label per its own enum value, e.g.
        "全席禁煙"/"一部禁煙"/"禁煙席なし" for FULL/PARTIAL/NONE;
        dinnerBudgetTier's visible value reflects a fixed tier-word label
        per its own enum value -- "低"/"中"/"高" for LOW/MID/HIGH -- and
        must NOT itself restate a yen range or the word "ディナー"; the
        dinner-basis disclosure lives only in the expanded filter panel's
        candidate-budget-tier-note (adr/0023 decision 10, as amended
        2026-08-11) without itself being checked for exact equality against
        the raw value. The attribute is absent when that field is
        unavailable, since data-value-state=unavailable already expresses
        its state. Every other required field's visible value equals the
        returned value exactly. providerPageLink is always provided, is
        exempt from rawValueAttribute because its href is already the exact
        machine-readable value, and its href equals providerPageUrl.
        walkingTimeMinutes is likewise always provided -- never
        data-value-state=unavailable, per candidate-search-api.yaml's
        Candidate.walkingTimeMinutes description (adr/0025 decision 2) -- and,
        like providerPageLink, carries no rawValueAttribute, because its
        visible value and the raw response value are the same number and
        there is no coarse-label translation to check separately. Unlike
        providerPageLink, its visible value is not exempt from a content
        requirement: see walkingTimeEstimateWording below for the
        estimate-wording Must adr/0025 decision 2 requires.
      cardPaymentCaution:
        testId: candidate-card-payment-caution
        attribute: data-card-payment-available
        presenceRule: >-
          Present, with data-card-payment-available="false", only when the
          response's cardPaymentAvailable is false for that candidate.
          Absent (no test id in the DOM) when cardPaymentAvailable is true
          or null -- a caution about a confirmed unavailability is not
          itself an unavailable-field display. Where present, its visible
          text must state only that credit-card payment is not accepted; it
          must not claim the shop is cash-only or state any other payment
          method. **This existing rule is the sole constraint the
          2026-09-01 desk-visual changes (adr/0038, human decisions 4-6)
          must respect: the spare space a PC card-layout variant creates
          must not be labeled with this test id unless cardPaymentAvailable
          is actually false for that candidate** -- no new contract text is
          needed to enforce this, since this presenceRule already does.
          **The same holds for the 2026-09-08 card-density restoration**
          (adr/0049 decision 4, twoColumnLayout no longer compresses card
          density the way mapPrimaryLayout's map-primary deck did) -- this
          presenceRule is again the sole relevant constraint and again
          needs no new text to keep applying (adr/0049 decision 4).
      cardPaymentValueState:
        attribute: data-card-payment-value-state
        values: [provided, unavailable]
        presenceRule: >-
          Present on every card, unconditionally (unlike cardPaymentCaution,
          which is conditional). "unavailable" exactly when the response's
          cardPaymentAvailable is null for that candidate; "provided"
          otherwise (true or false). This is the observable signal
          TDR-CS-13's ordering assertion uses for the cardPaymentOnly
          filter, since cardPaymentCaution alone cannot distinguish
          cardPaymentAvailable=null from cardPaymentAvailable=true (both are
          absent).
      walkingTimeEstimateWording:
        testId: candidate-card-walking-time
        requirement: >-
          The element's visible text must include an approximation marker
          (e.g. 約, 推定, or another implementation-chosen wording that reads
          as an estimate) and must not read as a measured or guaranteed
          time (adr/0025 decision 2). This is a content requirement on the
          same element as the walkingTimeMinutes requiredFields entry above,
          not a separate element -- there is no coarse/raw split for this
          field the way there is for totalSeats/nonSmokingStatus/
          dinnerBudgetTier (the raw response minutes and the visible number
          are the same value; only the surrounding wording carries the
          estimate signal). The exact wording is an implementation choice
          this contract does not fix, mirroring how the dinner-basis
          disclosure's exact phrasing is also left to implementation.
    markerDataAttributes:
      candidateRef: data-candidate-ref
      selectionState: data-selection-state
      gatheringShortlisted: data-gathering-shortlisted
    selectionStates: [selected, unselected]
    displayOrdering:
      invariant: >-
        Cards are always ordered nearest-first (data-candidate-ref order
        matches the response's candidates array order, which is
        nearest-first within each group below), except that when the
        request's filters included nonSmokingOnly=true, cardPaymentOnly=true,
        or a non-empty budgetTiers, every card that is "unconfirmed" for at
        least one of those active filters is placed after every card that is
        "confirmed" for all of them, before the nearest-first order is
        applied within each group. A card is "unconfirmed" for
        nonSmokingOnly when its nonSmokingStatus requiredFields entry has
        data-value-state=unavailable; for cardPaymentOnly when its
        data-card-payment-value-state is "unavailable"; for budgetTiers when
        its dinnerBudgetTier requiredFields entry has
        data-value-state=unavailable. When no such filter is active, this
        invariant reduces to plain nearest-first (adr/0023 decision 4;
        TDR-CS-13). `walkingTimeMaxMinutes` never participates in this
        unconfirmed/confirmed grouping: it is applied as a hard pre-filter
        (adr/0025 decision 3) before this ordering step runs, so every card
        that reaches this ordering already satisfies it (or the filter was
        unset/null) -- there is no "unconfirmed for walkingTimeMaxMinutes"
        card, because `Candidate.walkingTimeMinutes` is never null. This
        ordering invariant governs the display order of
        whichever 5 candidates selection returns; it is unaffected by
        shownPoolPriority's selection-stage partitioning (adr/0024), which
        happens before this re-ordering, not after it. Deck paging
        (deckNavigation below, adr/0033, mapPrimaryTouchLayout only as of
        adr/0049 decision 4) never changes this order -- it only windows
        which already-ordered cards are currently visible.
      verificationAllocation:
        L1: >-
          Pure recommendation tests independently prove that each confirmed
          or unavailable group is ordered by ascending synthetic internal
          distance before and after selection. These inputs and distances
          never cross the public API boundary.
        L3: >-
          Boundary tests prove that serialization preserves the pipeline
          candidate order exactly and that origin, range, distance, route,
          walking-time, and internal ordering evidence are absent from the
          public response and logs, except for the fields adr/0025
          deliberately makes public (`searchOrigin`,
          `Candidate.walkingTimeMinutes`, `PopulationAttribute.walkingTimeBand`)
          -- see candidate-search-api.yaml for what those fields do and do
          not carry.
        L4: >-
          Browser acceptance proves that card and marker order matches the
          public response and that confirmed candidates precede unavailable
          candidates. It deliberately does not reconstruct nearest-first from
          a private origin or expose distance solely to make that assertion.
    shownPoolPriority:
      invariant: >-
        Let "unseen" be the members of the request's eligible (filtered)
        population absent from its shownProviderPageUrls, and "seen" be the
        remaining eligible members (adr/0024 decision 4). (1) When unseen has
        at least 5 members, every returned candidate is a member of unseen.
        (2) When unseen has 1-4 members, every unseen member is among the
        returned candidates, and the remaining slots are filled from seen.
        (3) When unseen is empty, the response's shownPoolExhausted is true
        and the returned candidates are drawn from the full eligible
        population without regard to shownProviderPageUrls. These three
        set-membership properties hold for every randomSeed and do not
        depend on the distance-weighting formula (adr/0024 decision 3),
        which is a separate, statistically-verified property (see
        proposal.distanceWeightedSelection below). shownCandidateMemory's
        expiry pruning (adr/0024 decision 4 item 8) can only shrink
        shownProviderPageUrls before it is sent, which can only enlarge
        "unseen"; it never violates these three properties.
      verificationAllocation:
        L1: >-
          Pure recommendation tests independently prove all three
          set-membership properties using synthetic population and
          shown-set fixtures, without pinning any particular random seed or
          weighting formula.
        L3: >-
          Boundary tests prove shownProviderPageUrls and shownPoolExhausted
          round-trip through the schema exactly and that the server neither
          logs nor retains shownProviderPageUrls beyond the current
          request's processing.
        L4: >-
          Browser acceptance drives contracts/test-support-api.yaml's
          SHOWN_POOL_PRIORITY population through the public API only,
          asserting the same three set-membership properties from public
          response data, and separately asserts shownCandidateMemory's
          sessionStorage key updates per its updateRule after each
          successful response, and its expiry.rule when a stale entry is
          seeded directly (see shownCandidateMemory.expiry.verificationNote).
    distanceWeightedSelection:
      invariant: >-
        Selection among a partition (unseen or, when needed, seen) draws
        with a distance-based weight that is monotonically non-increasing in
        distance from the search origin (closer candidates are never less
        likely to be drawn than farther ones in the same partition) and
        strictly positive for every member of the partition (no eligible
        candidate has a structurally zero selection probability), replacing
        the fixed near-distance pool that adr/0023 decision 4 originally
        specified (adr/0024 decision 3). The exact weighting function is a
        non-binding implementation choice; this contract requires only the
        two statistically observable properties above.
      verificationAllocation:
        L1: >-
          Pure recommendation tests run many trials (not seed-pinned) against
          a synthetic population with known distances and assert that
          empirical per-candidate selection frequency is non-increasing in
          distance within a stated statistical tolerance, and that the
          single farthest candidate is selected at least once across the
          trials. This mirrors the methodology used to measure this
          project's real duplication-rate improvement (adr/0024's cited
          measurement) but runs against synthetic, not real, data.
        L3 / L4: not applicable to this statistical property; L3/L4 verify
          only the deterministic set-membership properties in
          shownPoolPriority and the seed-pinned reproducibility already
          required by test-support-api.yaml's randomSeed.
    deckNavigation:
      description: >-
        Applies while renderModes.mapPrimaryTouchLayout holds (adr/0033;
        narrowed from also applying to mapPrimaryLayout by adr/0049 decision
        4, which retired that mode's button-paged deck in favor of
        twoColumnLayout's plain, unpaged list -- see renderModes above). The
        paging control and position counter for the card deck overlaid on
        the map in the touch-driven mobile layout only (mapPrimaryTouchLayout:
        swipeSurface, human decision 2026-08-29: mobile is map-primary and
        its deck is paged by a horizontal swipe gesture). Card content,
        order, and count are otherwise governed by displayOrdering and
        cardDataAttributes above; this section adds only the
        windowing/paging observation the mobile deck needs. twoColumnLayout
        needs no such observation -- it shows every card of the response at
        once (adr/0049 decision 4).
      swipeSurface:
        testId: candidate-deck-swipe-surface
        presenceRule: >-
          Present exactly once whenever renderModes.mapPrimaryTouchLayout
          holds; absent whenever renderModes.twoColumnLayout holds
          (retitled from mapPrimaryLayout by adr/0049 decision 4; the
          presence/absence rule itself is unchanged by that retitling). It
          is a container element that bounds where a paging swipe gesture
          may begin (see browserActions.pageDeckSwipeForward/Backward
          below), not a form control -- it carries no button/input role and
          is not itself subject to
          unavailableControls.allCandidateScreenFormControlsMustDeclarePurpose,
          unlike a form-control-shaped element would be. It needs no
          allowedPurposes entry for this reason.
        stopBehavior: >-
          Regardless of where the user's finger leaves the surface, the
          gesture always settles with exactly one full card centered and
          completely visible within the surface -- never a partial card at
          either edge (adr/0049 decision 5, 2026-09-08 human decision:
          "スワイプが途中で止まって見切れる症状を直す"). This is a Must on
          the observable result only; the implementation technique (e.g. CSS
          scroll-snap, a JavaScript settle animation, or any other means) is
          an implementation choice this contract does not fix, mirroring
          how the gesture's direction-reading and step size are already left
          unfixed below. See deckNavigation.position's valueShape below for
          how this result is expressed through
          data-deck-visible-start/-end, and pageDeckSwipeForward/Backward's
          requiredOutcome for how a completed gesture's before/after window
          reflects it.
      position:
        testId: candidate-deck-position
        attributes:
          visibleStart: data-deck-visible-start
          visibleEnd: data-deck-visible-end
          total: data-deck-total
        valueShape: >-
          Each attribute carries a decimal integer string. visibleStart and
          visibleEnd are the 1-based inclusive range, within the current
          response's displayed candidates in displayOrdering order, of the
          cards currently within the deck's visible window; total equals the
          number of currently displayed candidate-card elements (the
          post-selection display count, at most 5 -- independent of
          filterPanel.matchCountObservation's pending-population count).
          1 <= visibleStart <= visibleEnd <= total always holds while
          candidate-deck-position is present. Because
          deckNavigation.swipeSurface's stopBehavior always settles on
          exactly one full card (adr/0049 decision 5), visibleStart always
          equals visibleEnd while candidate-deck-position is present (it is
          present only while renderModes.mapPrimaryTouchLayout holds, see
          presenceRule below) -- this equality is the machine-observable,
          indirect proof that "exactly one card is visible", since this
          contract does not otherwise measure rendered card geometry
          (mirrors how deckNavigation.orderingInvariant already keeps L5's
          rendered-geometry concerns out of L4).
        presenceRule: >-
          Present exactly once whenever renderModes.mapPrimaryTouchLayout
          holds; absent whenever renderModes.twoColumnLayout holds (adr/0049
          decision 4 retired the desktop paged deck this element used to
          also describe under mapPrimaryLayout -- a plain, unpaged list of
          up to 5 cards has no position within a window to count. This
          mirrors how the retired list-primary layout, before adr/0033,
          never needed a position counter either, since its full card list
          was likewise visible without paging).
      orderingInvariant: >-
        Paging changes only which already-ordered cards are within the
        visible window; it never changes displayOrdering's card order,
        never removes or adds a data-candidate-ref, and is not a
        manual-ordering capability within the meaning of
        unavailableControls.forbiddenPurposes (adr/0023) -- the near-first
        order remains fixed and organizer-unchangeable, exactly as before
        this revision. Selecting a card or marker does not page the deck by
        itself except as required by browserActions.selectMarker's
        deckVisibility clause. pageDeckSwipeForward/Backward (adr/0033)
        obey the same restriction (the button-driven pageDeckNext/Previous
        obeyed it too while they existed, adr/0031-0033; adr/0049 decision 4
        retired them along with mapPrimaryLayout, since twoColumnLayout has
        no deck to page).
    mapObservations:
      fitStateAttribute: {testId: candidate-map, attribute: data-map-fit-state, value: displayed-candidates}
      tileProviderAttribute: {testId: candidate-map, attribute: data-map-tile-provider, value: openstreetmap-standard}
      attribution:
        testId: candidate-map-attribution
        href: https://www.openstreetmap.org/copyright
        text: '© OpenStreetMap contributors'
      markerSet: every-candidate-card-has-exactly-one-marker-with-same-data-candidate-ref
      candidateRefUniqueness: every-current-card-has-a-unique-non-empty-data-candidate-ref
      searchOriginMarker:
        testId: candidate-origin-marker
        positionAttributes: {latitude: data-origin-latitude, longitude: data-origin-longitude}
        presenceRule: >-
          Present exactly once whenever candidate-map is present (adr/0025
          decision 1). Its two positionAttributes each carry a decimal
          string that, when parsed as a number, is numerically equal --
          within an absolute tolerance of 1e-9 degrees -- to the current
          response's `searchOrigin.latitude` and `searchOrigin.longitude`
          respectively. Equality is numeric, not lexical: the response and
          the DOM attribute are produced by different language runtimes
          (`response.searchOrigin` is serialized server-side in Python;
          positionAttributes are set client-side by candidate.js), and IEEE
          754 doubles have more than one valid decimal-string spelling for
          the same value (e.g. Python's `str(0.0)` is `"0.0"`, JavaScript's
          `String(0.0)` is `"0"`) -- there is no single canonical spelling
          both runtimes produce without extra, unenforceable implementation
          discipline (amended 2026-08-24, second addendum, after a language-
          dependent string mismatch on exactly this value shape reached L4;
          see adr/0025's 2026-08-24 second addendum for the discarded
          alternatives). This intentionally departs from
          cardDataAttributes.rawValueAttribute's string-equality style,
          which remains correct there because it compares integers and
          closed enum strings (totalSeats, nonSmokingStatus,
          dinnerBudgetTier) -- values with exactly one canonical spelling;
          latitude/longitude are floating-point measurements, for which the
          property presenceRule actually needs to prove -- that the
          marker's position derives from `searchOrigin` and not from an
          independently known constant -- is numeric identity, not string
          identity. Acceptance parses both sides to a number before
          comparing; it does not need to read the marker's rendered pixel
          position to do so. This does not add a new disclosure:
          `response.searchOrigin` is already an unobfuscated, approved
          public field (adr/0025 decision 1, candidate-search-api.yaml's
          SearchOriginLocation), so positionAttributes only makes that
          already-disclosed value additionally readable from the DOM
          instead of only from the network response (FR-022(1)).
        interactivity: >-
          A read-only display element. It may carry an accessible name/
          visible label identifying itself as the search origin (e.g. 検索
          基点) -- see
          unavailableControls.locationRangeControlProhibition's
          displayOnlyOriginException, which scopes that prohibition to
          controls that can change the origin or search range, not to
          labeling a read-only marker. Activating it (by any input --
          pointer, or Enter/Space while focused, if the underlying map
          library makes it focusable) must change no proposal request, no
          displayed candidate, marker, or condition summary, and no
          configured origin/range.
      walkingRadiusRings:
        testId: candidate-walking-radius-ring
        cardinality: zero-or-more-elements-sharing-this-test-id
        presenceRule: >-
          When present, each ring is centered on candidate-origin-marker's
          position and represents a walking-time band (adr/0025 decision
          1); the exact count and radii are an implementation choice this
          contract does not fix. Rings are the same kind of read-only
          display element as candidate-origin-marker and are subject to the
          same interactivity requirement.
        bandAttribute: data-walking-radius-minutes
        bandLabel:
          requirement: >-
            bandAttribute carries the ring's walking-time band as a decimal
            integer string of minutes. Each ring must also expose a
            non-empty visible or accessible text label -- on the ring
            itself or an element it owns -- whose leading digits, parsed as
            an integer, equal that same bandAttribute value (mirroring
            cardDataAttributes' rawValueAttribute pattern: the raw value is
            machine-exact, the visible wording is an implementation
            choice). A ring whose band is exposed only through the
            non-visible bandAttribute does not satisfy this Must (human
            decision 2026-08-24: production shipped four rings with
            bandAttribute set but no visible indication of which band each
            represented, and an organizer could not tell which range each
            ring meant -- designer's report, adr/0030). The exact wording,
            unit spelling (分 / 分圏 / min), and visual placement remain
            implementation choices this contract does not fix, mirroring
            walkingTimeEstimateWording. Whether this check proves a correct
            per-ring pairing (as opposed to only a matching set of values)
            is tracked separately (activeContext.md F1b, 2026-08-27) and is
            not resolved by this contract revision -- see adr/0031's 帰結
            for the design sketch a follow-up ADR is expected to adopt.
      forbiddenTestIds:
        [candidate-route, candidate-current-location, private-search-origin]
    providerCreditObservation:
      testId: candidate-provider-credit
      element: anchor
      text: response.providerCredit.text
      href: response.providerCredit.url
    izakayaBarFallbackNoticeObservation:
      testId: candidate-izakaya-bar-fallback-notice
      presenceRule: >-
        Present exactly when the response's izakayaBarFallbackApplied is
        true; absent otherwise. Where present, its visible text must
        disclose both that the default izakaya/bar exclusion was set aside
        for this response and that the lunch service of the included shops
        is not confirmed (adr/0023 decision 6).
    budgetTierNoteObservation:
      testId: candidate-budget-tier-note
      presenceRule: >-
        Present exactly once only while candidate-filter-panel is present;
        absent on the collapsed authenticated screen and after the panel is
        closed. Its one-line visible text must disclose that the budget tiers
        are based on the provider's dinner-budget figure and do not state or
        imply a lunch price (adr/0023 decision 10, as amended 2026-08-11).
        It must not contain a yen amount, price range, or tier-to-yen mapping.
        No per-card element restates this disclosure.
  filterPanel:
    requiredTestIds:
      panel: candidate-filter-panel
      includeIzakayaBar: candidate-filter-include-izakaya-bar
      nonSmokingOnly: candidate-filter-non-smoking-only
      cardPaymentOnly: candidate-filter-card-payment-only
      budgetTierOption: candidate-filter-budget-tier-option
      budgetTierNote: candidate-budget-tier-note
      walkingTimeMaxOption: candidate-filter-walking-time-max-option
    conditionalTestIds:
      genreOption: candidate-filter-genre-option
      genreOverflow: candidate-filter-genre-overflow
      pendingNote: candidate-filter-pending-note
      apply: candidate-filter-apply
      revert: candidate-filter-revert
    optionDataAttributes:
      genreValue: data-genre-value
      budgetTierValue: data-budget-tier-value
      walkingTimeMaxValue: data-walking-time-max-value
    controlGrouping:
      genreGroup:
        members:
          [candidate-filter-genre-option, candidate-filter-genre-overflow,
           candidate-filter-include-izakaya-bar]
        requirement: >-
          These controls render inside one shared panel section/DOM group
          (the existing "ジャンル" section), and no member of any other
          group renders inside it. candidate-filter-include-izakaya-bar
          moved here from preferenceGroup (adr/0024 decision 2) because it
          changes the scope of the genre category rather than expressing a
          value-confirmation preference; this is a DOM/visual placement
          change only. Its allowedPurposes entry
          (candidate-filter-izakaya-bar-toggle) and its
          data-candidate-control-category value ("button") are both
          unchanged (adr/0023). It is present whenever this group is
          present, regardless of genrePresentation's compact/preview/
          expanded state; it is never counted toward genreOptionCount, never
          subject to previewLimit collapsing, and never a
          candidate-filter-genre-overflow member.
        overflowPlacement:
          leadingMember: candidate-filter-genre-overflow
          requirement: >-
            When candidate-filter-genre-overflow is present (genrePresentation's
            preview or expanded responseCountStates), it renders as the
            first element in genreGroup's DOM order, before every
            candidate-filter-genre-option and
            candidate-filter-include-izakaya-bar (human decision 2026-08-23,
            design/wireframes/GenreRow.dc.html option (c) -- fixing the only
            entry point to hidden genres at a stable position, independent
            of the row's own horizontal scroll position; a 390px measurement
            found this entry point off-screen when it instead trailed the
            row). This requirement is about DOM order and container
            structure, not about a particular CSS/visual mechanism (sticky
            positioning, a separate flex child, etc.).
          scrollableSubgroup:
            members: [candidate-filter-genre-option, candidate-filter-include-izakaya-bar]
            requirement: >-
              These members share one horizontally-scrollable DOM container
              distinct from candidate-filter-genre-overflow's own container,
              so that container's horizontal scroll offset does not move
              candidate-filter-genre-overflow.
          verificationAllocation:
            L4: >-
              Acceptance asserts candidate-filter-genre-overflow's DOM
              position precedes every scrollableSubgroup member within
              genreGroup, and that it is not a descendant of
              scrollableSubgroup's shared scrollable container.
            L5: >-
              Whether the fixed position remains visually stable while the
              scrollable sub-container is scrolled, and how many
              scrollableSubgroup members remain visible alongside it, are
              rendered-geometry properties this contract does not measure
              (measured only by orchestrator per activeContext.md's
              rendered-geometry rule; design/wireframes/README.md already
              records both numbers as 未実測).
      preferenceGroup:
        members: [candidate-filter-non-smoking-only, candidate-filter-card-payment-only]
        requirement: >-
          These controls render inside one shared panel section/DOM group
          (the existing "こだわり" section), separate from genreGroup and
          budgetGroup.
      budgetGroup:
        members: [candidate-filter-budget-tier-option]
        requirement: >-
          These controls render inside one shared panel section/DOM group
          (the existing budget section), separate from genreGroup and
          preferenceGroup.
      walkingTimeGroup:
        members: [candidate-filter-walking-time-max-option]
        requirement: >-
          These controls render inside one shared panel section/DOM group,
          separate from genreGroup, preferenceGroup, and budgetGroup
          (adr/0025 decision 3: walking-time-max is its own filter
          condition, not a member of any existing group).
    genrePresentation:
      source: response.availableGenres
      populationSource: response.populationAttributes
      presentationOrder: descending-population-count-then-ascending-string-length-then-ja-locale-collation
      populationCountRule: >-
        For each response.availableGenres genre string, its count is the
        number of response.populationAttributes rows whose genre field
        equals that string, restricted to rows where defaultExcluded is
        false, or to every row when the response's effective
        includeIzakayaBar was true (the same population scoping
        availableGenres itself already uses, adr/0023 decision 9; adr/0024
        decision 1). The count, and therefore the order, is computed once
        from the response that produced the currently applied proposal and
        does not change while a pending includeIzakayaBar edit is unapplied
        -- the offered genre set itself already does not shrink or reorder
        as the organizer narrows other pending filters (adr/0023 decision 9
        preserved). Ties (equal counts) fall back to ascending string length,
        then ja-locale collation, exactly as adr/0023 decision 12 originally
        specified as the sole ordering rule; adr/0024 reuses this unchanged
        as the tie-break rather than introducing a new rule.
      previewLimit: 4
      responseCountStates:
        empty:
          when: response.availableGenres-count-equals-zero
          genreOptionCount: 0
          genreOverflow: absent
        compact:
          when: response.availableGenres-count-between-one-and-four-inclusive
          genreOptionCount: exactly-response.availableGenres-count
          genreOptionOrder: presentationOrder
          genreOverflow: absent
        preview:
          when: response.availableGenres-count-at-least-five-and-overflow-collapsed
          genreOptionCount: 4
          genreOptionOrder: first-four-in-presentationOrder
          genreOverflow: {presentExactlyOnce: true, visibleLabel: 'ほか N件…', N: response-count-minus-four}
        expanded:
          when: response.availableGenres-count-at-least-five-and-overflow-expanded
          genreOptionCount: exactly-response.availableGenres-count
          genreOptionOrder: presentationOrder
          genreOverflow: {presentExactlyOnce: true, visibleLabel: '閉じる'}
    matchCountObservation:
      testId: candidate-filter-apply
      attribute: data-match-count
      value: >-
        Exact decimal count obtained by applying pending filters to every
        response.populationAttributes row with the public filter semantics,
        before selection. For a pending walkingTimeMaxMinutes value, the
        predicate is response.populationAttributes' walkingTimeBand for that
        row being less than or equal to (in the offered preset order) the
        pending value (adr/0025 decision 3; see
        candidate-search-api.yaml's PopulationAttribute.walkingTimeBand).
      zeroState: >-
        While pending differs from applied and the count is zero,
        candidate-filter-apply remains present with data-match-count="0" and
        is disabled. Activating it cannot start a public operation.
      visibleCountWording:
        requirement: >-
          Where candidate-filter-apply's visible text incorporates the
          data-match-count value (human decision 2026-08-23: a match-count
          preview appears only here, never as an always-visible element),
          it must not read as a promise of how many candidate cards this
          action will display -- the display cap remains 5
          (candidate-search-api.yaml's selection behavior is unchanged by
          this observation). Phrasing that reads as "this many candidates
          match the pending condition" (e.g. 対象、該当、絞り込み後の件数)
          is compliant; phrasing that reads as "this many candidates will
          be shown/displayed" (e.g. 件表示されます、件出ます) is not. The
          exact wording is an implementation choice this contract does not
          fix, mirroring walkingTimeEstimateWording and
          budgetTierNoteObservation's existing content-only Musts.
    stateModel:
      applied: >-
        The filters that produced the currently displayed proposal and the
        condition summary. They change only after candidate-filter-apply
        starts its proposal request.
      pending: >-
        A working copy initialized from applied when a proposal is rendered.
        Controls in the expanded panel edit only this copy.
      dirty: >-
        Pending differs from applied. The visible candidate-filter-pending-note
        must make clear that a search has not happened yet. It is absent when
        pending equals applied.
    constraints:
      - The panel is absent until candidate-filter-open is activated and opens without document navigation or URL change.
      - Each visible candidate-filter-genre-option carries its response.availableGenres genre string as data-genre-value. The browser must use genrePresentation's order, not the response order.
      - candidate-filter-include-izakaya-bar renders inside genreGroup, not preferenceGroup (adr/0024 decision 2; see controlGrouping).
      - One candidate-filter-budget-tier-option element exists per LOW/MID/HIGH, each carrying that enum string as data-budget-tier-value, and its visible label must use the same 低/中/高 terminology as candidate-card-dinner-budget (adr/0023 decision 10).
      - One candidate-filter-walking-time-max-option element exists per implementation-chosen preset integer value (adr/0025 decision 3; see candidate-search-api.yaml's CandidateFilters.walkingTimeMaxMinutes), each carrying that integer as a string in data-walking-time-max-value. At most one such option carries selected state at a time; none selected corresponds to a pending walkingTimeMaxMinutes of null (no restriction). The preset set and its count are UI-implementation-owned and not fixed by this contract, mirroring how genres' offered vocabulary is UI/response-owned rather than schema-enumerated.
      - Exactly one candidate-budget-tier-note exists inside candidate-filter-panel. It is the one-line dinner-basis disclosure defined by budgetTierNoteObservation and contains no yen amount, range, or tier-to-yen mapping.
      - Changing any control inside the panel changes pending only: it makes the state dirty, does not perform a search, and does not change the displayed cards, markers, condition summary, or applied filters.
      - When pending equals applied, candidate-filter-pending-note, candidate-filter-revert, and candidate-filter-apply are all absent. The open panel therefore has no batch action for unchanged controls.
      - When pending differs from applied, candidate-filter-pending-note, candidate-filter-revert, and candidate-filter-apply are each present. candidate-filter-apply carries data-match-count for the identity-free pending-population count and is disabled exactly when that count is zero; otherwise it is enabled.
      - candidate-filter-revert replaces pending with applied, keeps the panel open, changes neither the currently displayed candidates nor applied filters, and performs no public operation.
      - candidate-search-again is disabled while pending differs from applied, and is re-enabled only after candidate-filter-revert or a completed proposal rendering makes pending equal applied.
      - No free-text input control exists for genre, budget, walking-time-max, or any other filter; every filter control is a closed selection (checkbox or toggle) over a server-supplied or fixed enum vocabulary.
  gatheringMode:
    description: >-
      The consolidated shop-selection surface for a gathering (adr/0049
      decision 1, 2026-09-08 human decision: "1枚目の画面の存在価値が
      なくなってない？（重複しているように思える）" -- retiring
      gathering-scheduling-browser-interface.yaml's
      organizerDashboard.shortlistSelection, a separate, narrower
      shop-checklist screen, in favor of this already-full-featured screen).
      This screen is reached in gathering mode by navigating from
      gathering-scheduling-browser-interface.yaml's
      gathering-shortlist-open (the organizer's "店を絞りなおす"/"5件を
      差し替える" action) carrying a gatheringId; this contract does not fix
      the exact navigation mechanism (e.g. a URL query parameter) the same
      way it does not fix viewport breakpoints elsewhere. Whichever
      mechanism is used, the resulting initialProposal (and every
      applyFilters/searchAgain while this screen remains in gathering mode)
      carries that same gatheringId in its request (see
      candidate-search-api.yaml's CandidateProposalRequest.gatheringId).
      Gathering mode is observable exactly through response.gatheringContext
      being non-null (candidate-search-api.yaml) -- every test id below is
      gated on that same condition, not on a separate contract-level "mode"
      flag.
    requiredTestIds:
      band: candidate-gathering-mode-band
      cardToggle: candidate-card-gathering-toggle
    band:
      testId: candidate-gathering-mode-band
      attributes:
        shortlistedCount: data-gathering-shortlisted-count
        maxShortlisted: data-gathering-max-shortlisted
        limitReached: data-shortlist-limit-reached
      presenceRule: >-
        Present exactly once when response.gatheringContext is non-null;
        absent when it is null (the ordinary, non-gathering screen -- see
        authenticatedInitialOutcome.absent above, which adr/0049 adds this
        test id to). This is the always-on, non-togglable "いまの条件"
        condition line (adr/0049 decision 1: "8/27 (水) に開いている店")
        -- unlike every filterPanel control, it has no pending/applied
        state and no control to turn it off, because gathering mode's
        open-on-the-confirmed-date restriction is not one of the organizer's
        optional filters. Its visible text must disclose
        response.gatheringContext.confirmedCandidateDate in a
        human-readable form; the exact wording/date format is an
        implementation choice this contract does not fix, mirroring
        walkingTimeEstimateWording and budgetTierNoteObservation's existing
        content-only Musts. Its shortlistedCount/maxShortlisted attributes
        are decimal integer strings equal to
        response.gatheringContext.shortlistedShopCount and
        .maxShortlistedShops respectively (the "入れた店 3 / 5" band); all
        three attributes update after every successful
        toggleCardGatheringShortlist call (below), since that call's
        response carries a fresh gatheringContext. limitReached is the
        string "true" exactly when shortlistedShopCount is greater than or
        equal to maxShortlistedShops, and "false" otherwise (ADR-0056
        decision 7) -- the same boundary cardToggle.disabledState already
        computes per card, exposed here once at the band level so an
        organizer (or acceptance) can tell why the remaining cards' toggles
        are disabled without inspecting every card individually.
      navigation: >-
        candidate-gathering-mode-band is also this screen's sole return
        path back to the gathering while in gathering mode (ADR-0054
        decision 4, 2026-09-12 human ruling: no separate "戻る" button is
        added, because a shop already saves the instant its toggle is
        activated -- a later, separate "confirm and return" action would
        falsely imply an unsaved state that does not exist). Activating the
        band (by any input) is a pure navigation to
        gathering-scheduling-browser-interface.yaml's
        browserEntry.organizerDashboard for
        response.gatheringContext.gatheringId; see
        browserActions.returnToGatheringFromBand below for its
        requiredOutcome. Like candidate-gathering-entry, it is implemented
        as a plain link/navigation element rather than a `<button>` or an
        interactive-ARIA-role element, keeping it outside
        unavailableControls.allCandidateScreenFormControlsMustDeclarePurpose's
        scan and requiring no new allowedPurposes entry (the same
        precedent gatheringEntry.entry.requirement already documents).
        This navigability does not change the "no control to turn it off"
        property the presenceRule above states -- that property scopes
        only the open-on-the-confirmed-date filter condition the band
        displays, not whether the band itself can be activated to
        navigate.
    cardToggle:
      testId: candidate-card-gathering-toggle
      purpose: candidate-card-gathering-toggle
      attribute: data-gathering-shortlisted
      values: [true, false]
      presenceRule: >-
        Present on every candidate-card exactly when response.
        gatheringContext is non-null; absent on every card when it is null
        (adr/0049 decision 1). Its attribute value equals that card's
        Candidate.isShortlisted exactly ("true" or "false" as a string) --
        this is the observable signal for the "この会に入れました"/"この会
        に入れる" toggle-label distinction; the exact visible label wording
        is an implementation choice this contract does not fix.
      disabledState: >-
        Disabled exactly when data-gathering-shortlisted="false" and
        response.gatheringContext.shortlistedShopCount is greater than or
        equal to .maxShortlistedShops (adr/0049 decision 8: the organizer
        has already reached the 5-shop cap, and this card is not one of the
        5). A card whose data-gathering-shortlisted="true" remains enabled
        regardless of the count, so removing a shortlisted shop to choose a
        different one is never blocked. This mirrors deckNavigation.
        disabledState's established convention elsewhere in this contract's
        history and gathering-scheduling-browser-interface.yaml's own
        gathering-schedule-response-select precedent: boundary conditions
        disable, they do not remove the element.
    mapMarker:
      testId: candidate-map-marker
      attribute: data-gathering-shortlisted
      values: [true, false]
      presenceRule: >-
        Present on every candidate-map-marker exactly when response.
        gatheringContext is non-null; absent on every marker when it is
        null (ADR-0056 decision 4, mirroring cardToggle immediately above).
        Its attribute value equals that marker's Candidate.isShortlisted
        exactly ("true" or "false" as a string), the same value cardToggle's
        own data-gathering-shortlisted carries for the same
        data-candidate-ref -- a card and its marker always agree. This
        gives the existing card/marker mutual-highlight convention
        (markerDataAttributes, selectionState above) a gathering-membership
        counterpart, so an organizer can tell which pins are already in the
        gathering without opening each card. Updates in lockstep with
        cardToggle's own attribute after every successful
        toggleCardGatheringShortlist call.
    toggleRequiredOutcome: >-
      See browserActions.toggleCardGatheringShortlist below for what
      activating cardToggle does.
  unavailableControls:
    forbiddenFormControlCategories:
      [select, input, textarea, checkbox, radio, range, combobox, listbox,
       slider, spinbutton, button]
    semanticAttributes:
      controlCategory: data-candidate-control-category
      controlPurpose: data-candidate-control-purpose
    allCandidateScreenFormControlsMustDeclarePurpose: true
    allowedPurposes:
      [candidate-card-selection, candidate-map-marker-selection,
       candidate-filter-open, candidate-no-results-open-filter,
       candidate-filter-genre-selection,
       candidate-filter-genre-overflow-toggle,
       candidate-filter-izakaya-bar-toggle, candidate-filter-non-smoking-toggle,
       candidate-filter-card-payment-toggle, candidate-filter-budget-tier-selection,
       candidate-filter-walking-time-max-selection,
       candidate-filter-apply, candidate-filter-revert, candidate-search-again,
       candidate-card-gathering-toggle,
       auth-sign-out, auth-password-change-open, auth-account-menu-toggle]
    forbiddenPurposes:
      [sort, manual-ordering, free-text-search, search-origin,
       search-location, current-location, search-range, radius, distance]
    locationRangeControlProhibition:
      invariant: >-
        No application-authored interactive control may enter, choose,
        derive, request, or change the private search origin or configured
        search range. Leaflet viewport pan/zoom controls inside candidate-map
        may change only the visible map viewport; they must not change a
        proposal request or the configured origin/range.
      displayOnlyOriginException:
        scope: [candidate-origin-marker, candidate-walking-radius-ring]
        invariant: >-
          adr/0025 permits the search origin and walking-time rings to be
          displayed on the map (decision 1). This scoped exception lets
          exactly these two display elements carry an otherwise-forbidden
          token (e.g. 検索基点, 起点) in their accessible name or visible
          label, for the sole purpose of identifying what they show. **The
          exception is defined by behavior, not by markup or element
          identity**: an element qualifies for it only while activating it
          -- by any input (pointer, keyboard, or assistive technology) --
          produces no change to a proposal request, the configured search
          origin, or the configured search range. The moment an element's
          activation could change any of those three things, it is a
          control within the general prohibition below, and this exception
          does not apply to it, regardless of its test id, tabindex, DOM
          tag, or ARIA role. This exception does not narrow the underlying
          property the general prohibition protects (adr/0008 decision 4's
          browser-facing Must, as amended by adr/0025 decision 7): an
          organizer must still be unable to enter, choose, derive, request,
          or change the origin or search range from the browser. A mapping
          library's own default behavior (e.g. Leaflet giving a marker icon
          tabindex="0") may make a display-only element focusable;
          focusability alone does not remove it from this exception -- only
          actual state-changing behavior on activation does.
      machineObservation:
        forbiddenTestIds:
          [candidate-search-origin, candidate-search-location,
           candidate-current-location-control, candidate-search-range,
           candidate-search-radius, candidate-search-distance]
        forbiddenControlPurposes:
          [search-origin, search-location, current-location, search-range,
           radius, distance]
        normalizedAccessibleNameTokens:
          [検索地点, 検索場所, 検索基点, 起点, 現在地, 探索範囲, 検索範囲,
           半径, 距離, search-location, search-origin, current-location,
           search-range, radius, distance]
        identifierAttributes:
          [id, name, data-testid, data-candidate-control-purpose]
        requirement: >-
          For every application-authored button, input, select, textarea,
          contenteditable element, or element with an interactive ARIA role,
          acceptance enumerates its declared purpose, normalized accessible
          name/visible label, and identifier attributes. None may equal or
          contain a forbidden purpose or token, **except an element within
          displayOnlyOriginException's scope while its behavior satisfies
          that exception's invariant** (adr/0025). Provider/detail/credit
          links are observations, not controls; Leaflet viewport controls
          are the scoped exception above.
      verificationAllocation:
        L4: >-
          the machineObservation above denies a location/range control,
          except within displayOnlyOriginException's scope; for
          candidate-origin-marker and candidate-walking-radius-ring,
          acceptance separately drives every available activation (pointer,
          and Enter/Space while focused if focusable) and asserts no
          proposal request is sent and no displayed candidate, marker, or
          condition summary changes -- proving the exception's behavioral
          condition holds rather than assuming it from the element's
          identity or test id.
        L3: >-
          CandidateProposalRequest's strict public schema is independently
          checked to contain no origin, location, range, radius, distance, or
          route input property.
    invariant: >-
      No form control may provide a manual sort/ordering capability or a
      free-text search input, whether or not it has a test id. Filters
      (genre, izakaya/bar inclusion, non-smoking, card payment, budget tier,
      walking-time maximum) are allowed purposes as of adr/0023 and adr/0025
      -- this reverses the prior contract's forbiddenPurposes entries
      "secondary-condition" and "filter", which adr/0015 relied on to
      justify representing IZAKAYA_BAR_INCLUDED as a "concept" rather than a
      toggle. That reasoning no longer applies once filters are the primary
      operation. Deck paging (deckNavigation, adr/0033, mapPrimaryTouchLayout
      only as of adr/0049 decision 4) is likewise not a manual-ordering
      capability -- see deckNavigation.orderingInvariant. Toggling a
      candidate onto or off a gathering's shortlist (gatheringMode.cardToggle,
      adr/0049 decision 1) is likewise not a manual-ordering capability --
      it changes gathering membership, not display order.
  empty:
    requiredTestIds: [candidate-no-results]
    absent: [candidate-proposal-cards, candidate-map]
    reviseFiltersControl:
      testId: candidate-no-results-revise-filters
      requirement: >-
        candidate-no-results contains exactly one pressable element
        carrying this test id (human decision 2026-08-24: TDR-CS-05's
        "絞り込み条件を変更するよう案内される" must be actionable, not only
        textual -- the contract previously required only that the guidance
        be shown, and the shipped implementation rendered a plain sentence
        with no control at all). Activating it produces exactly
        openFilterPanel's requiredOutcome for the current pending/applied
        state; it is a second recognized input for that behavior alongside
        candidate-filter-open. candidate-filter-open itself remains
        present and reachable in this render state too, since it is not a
        member of empty.absent -- this test id exists so the guidance text
        carries its own actionable element, not only a pointer to a
        distant toolbar control.
      controlPurpose: candidate-no-results-open-filter
  problem:
    requiredTestIds: [candidate-proposal-problem, candidate-proposal-problem-guidance]
    codeAttribute: data-problem-code
    guidance:
      testId: candidate-proposal-problem-guidance
      text: response.message
      minimumLength: 1
    forbiddenTestIds: [private-search-origin, candidate-provider-internals]

browserActions:
  initialProposal:
    trigger: open-authenticated-browserEntry
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: >-
        {} when shownCandidateMemory is empty after expiry pruning (a fresh
        sign-in, a fresh tab, or a tab that has sat idle past maxAge);
        otherwise {shownProviderPageUrls: <the surviving shownCandidateMemory
        url values>} (adr/0024 decision 4, decision 4 item 8) -- for example
        after a same-tab reload that already accumulated shown candidates.
        `filters` is always omitted or empty on this trigger. When this
        screen was reached in gathering mode (gatheringMode above, adr/0049
        decision 1), the request additionally carries the same `gatheringId`
        the navigation into this screen supplied.
      normalizedAppliedFilters:
        {genres: [], includeIzakayaBar: false, nonSmokingOnly: false,
         cardPaymentOnly: false, budgetTiers: [], walkingTimeMaxMinutes: null}
    success:
      present: [candidate-proposal-content, candidate-proposal-cards, candidate-map,
                candidate-provider-credit, candidate-filter-open, candidate-search-again,
                candidate-origin-marker]
      absent: [candidate-filter-panel, candidate-budget-tier-note,
               candidate-filter-genre-overflow,
               candidate-filter-pending-note, candidate-filter-apply,
               candidate-filter-revert]
      shownCandidateMemoryUpdate: satisfies-shownCandidateMemory.updateRule-for-this-response
    gatheringModeErrors: >-
      When the initial request carries a `gatheringId` that
      candidate-search-api.yaml rejects (404 GATHERING_NOT_FOUND, 409
      GATHERING_NOT_IN_SELECTING_SHOP_PHASE, or 409 GATHERING_FINALIZED,
      adr/0049 decision 1), this contract does not fix a distinct render
      state beyond problem above -- the same candidate-proposal-problem/
      candidate-proposal-problem-guidance surface applies, carrying that
      response's code and message.
  selectCard:
    input: candidate-card
    requiredOutcome:
      selectedCardAttribute: {attribute: data-selection-state, value: selected}
      matchingMarkerAttribute: {attribute: data-selection-state, value: selected}
      allOtherCardsAndMarkers: {attribute: data-selection-state, value: unselected}
  selectMarker:
    input: candidate-map-marker
    requiredOutcome:
      selectedMarkerAttribute: {attribute: data-selection-state, value: selected}
      matchingCardAttribute: {attribute: data-selection-state, value: selected}
      allOtherCardsAndMarkers: {attribute: data-selection-state, value: unselected}
      deckVisibility: >-
        While renderModes.mapPrimaryTouchLayout holds, the selected
        candidate's card is within candidate-deck-position's visible window
        (visibleStart <= its 1-based displayOrdering position <= visibleEnd)
        immediately after this action -- the deck pages itself to reveal it
        if it was previously outside the window. While
        renderModes.twoColumnLayout holds (adr/0049 decision 4, replacing
        mapPrimaryLayout), every card is simultaneously visible in the
        single unpaged list, so this clause is trivially satisfied -- there
        is no window to page. This closes a gap decision5 (no separate
        map-side info panel; the deck/list itself is the only place
        candidate detail is shown, human decision 2026-08-28 keeps this
        conclusion, reconfirmed for twoColumnLayout by adr/0049 decision 4)
        did not need to state under the original side-panel layout, and is
        what keeps decision5's conclusion true under both the touch-deck
        layout (adr/0033) and the two-column layout (adr/0049).
  pageDeckSwipeForward:
    input: candidate-deck-swipe-surface
    precondition: renderModes.mapPrimaryTouchLayout-holds
    gesture: >-
      A horizontal drag/swipe (pointer or touch) that begins inside
      candidate-deck-swipe-surface's bounding box and completes (release)
      after moving in the implementation-chosen "forward" horizontal
      direction (adr/0033 does not fix which screen-relative direction --
      e.g. leftward -- reads as forward; it fixes only that exactly one of
      the two horizontal directions is forward and pageDeckSwipeBackward's
      is the opposite direction). The distance threshold that counts as a
      completed paging gesture, as opposed to a tap or an aborted drag, is
      an implementation choice this contract does not fix.
    requiredOutcome:
      visibleWindow: >-
        data-deck-visible-start strictly increases by exactly the same
        amount data-deck-visible-end strictly increases by, so the two
        remain equal to each other afterward, per deckNavigation.position's
        one-card-visible invariant (adr/0049 decision 5: the gesture always
        settles on exactly one full card, never a partial one); neither
        value exceeds data-deck-total afterward. Applies only when the
        gesture completes while data-deck-visible-end is less than
        data-deck-total before the gesture; see boundaryOvershoot for the
        other case.
      boundaryOvershoot: >-
        When data-deck-visible-end already equals data-deck-total before
        the gesture, completing the gesture is a no-op on the visible
        window: it must not error, must not start a public operation, and
        start/end/total must be unchanged afterward. mapPrimaryTouchLayout
        has no disabled-button affordance to observe (there is no
        deckNavigation.previousControl/nextControl in this contract; the
        desktop button-paged deck those elements belonged to, mapPrimaryLayout,
        was retired by adr/0049 decision 4), so this no-op requirement is
        the continuous-gesture's own boundary rule.
      unaffected: [cardsAndMarkersSet, dataCandidateRefValues,
                   dataSelectionStateValues, appliedFilters, pendingFilters,
                   conditionSummary]
      publicOperation: none
    verificationAllocation:
      L4: >-
        Acceptance dispatches this gesture as a synthetic pointer/touch
        sequence (e.g. a pointer/mouse down-move-up sequence, or an
        equivalent touch-event dispatch) at coordinates inside
        candidate-deck-swipe-surface's bounding box, then asserts
        requiredOutcome through a before/after DOM comparison. **This is a
        synthetic gesture dispatched directly into the browser's input
        pipeline, not contact from a real touchscreen or a human finger**
        -- it proves the code path that pages the deck fires; it does not
        prove a human finger can physically perform the gesture on a real
        device (e.g. past an occluding element, or with a hit target too
        small to reliably start a drag on). activeContext.md's G1 (a
        synthetic click on candidate-map-marker proves the code path fires,
        not that a human finger can reach and activate the real element)
        already accepts this class of limitation for click-style
        activation; adr/0033 extended the identical, already-accepted
        limitation to a drag-style gesture for the first time in this
        contract, and this remains unchanged by adr/0049's later retirement
        of the button-driven pageDeckNext/Previous actions that used to be
        cited alongside this gesture. This does not narrow or widen G1's
        existing scope for click-style activation, and it does not claim to
        close G1 for gestures either.
  pageDeckSwipeBackward:
    input: candidate-deck-swipe-surface
    precondition: renderModes.mapPrimaryTouchLayout-holds
    gesture: >-
      The horizontal drag/swipe in the direction opposite
      pageDeckSwipeForward's gesture (adr/0033) -- see its gesture entry for
      what is and is not fixed.
    requiredOutcome:
      visibleWindow: >-
        data-deck-visible-end strictly decreases by exactly the same amount
        data-deck-visible-start strictly decreases by, so the two remain
        equal to each other afterward, per deckNavigation.position's
        one-card-visible invariant (adr/0049 decision 5); data-deck-visible-start
        never falls below 1 afterward. Applies only when the gesture
        completes while data-deck-visible-start is greater than "1" before
        the gesture; see boundaryOvershoot for the other case.
      boundaryOvershoot: >-
        When data-deck-visible-start already equals "1" before the gesture,
        completing the gesture is a no-op on the visible window, for the
        same reason pageDeckSwipeForward's boundaryOvershoot states.
      unaffected: [cardsAndMarkersSet, dataCandidateRefValues,
                   dataSelectionStateValues, appliedFilters, pendingFilters,
                   conditionSummary]
      publicOperation: none
    verificationAllocation:
      L4: >-
        Same synthetic-gesture method, and the same explicit extension of
        G1's known limitation, as pageDeckSwipeForward's
        verificationAllocation states.
  openFilterPanel:
    input: candidate-filter-open-or-candidate-no-results-revise-filters
    stateVariants:
      clean:
        when: pending-equals-applied
        present: [candidate-filter-panel, candidate-filter-include-izakaya-bar,
                  candidate-filter-non-smoking-only,
                  candidate-filter-card-payment-only, candidate-filter-budget-tier-option,
                  candidate-budget-tier-note, candidate-filter-walking-time-max-option]
        absent: [candidate-filter-pending-note, candidate-filter-apply,
                 candidate-filter-revert]
      dirty:
        when: pending-differs-from-applied
        present: [candidate-filter-panel, candidate-filter-include-izakaya-bar,
                  candidate-filter-non-smoking-only,
                  candidate-filter-card-payment-only, candidate-filter-budget-tier-option,
                  candidate-budget-tier-note, candidate-filter-walking-time-max-option,
                  candidate-filter-pending-note,
                  candidate-filter-apply, candidate-filter-revert]
    genrePresence: satisfies-filterPanel.genrePresentation.responseCountStates-for-current-response-and-overflow-state
    navigation: {document: unchanged, url: unchanged}
  toggleGenreOverflow:
    input: candidate-filter-genre-overflow
    stateVariants:
      expand:
        precondition: genre-preview-collapsed-and-response-availableGenres-count-greater-than-four
        requiredOutcome:
          visibleGenreOptions: every-response-availableGenres-entry-in-genrePresentation-order
          overflowLabel: '閉じる'
      collapse:
        precondition: genre-preview-expanded
        requiredOutcome:
          visibleGenreOptions: at-most-first-four-response-availableGenres-entries-in-genrePresentation-order
          overflowLabel: 'ほか N件…'
    invariant:
      pendingAndApplied: unchanged
      dirty: unchanged
      cardsMarkersAndConditionSummary: unchanged
      publicOperation: none
  changePendingFilter:
    input: any-candidate-filter-genre-option-or-toggle-or-budget-tier-option-or-walking-time-max-option
    precondition: candidate-filter-panel-present-and-pending-equals-applied
    requiredOutcome:
      pending: differs-from-applied
      applied: unchanged
      cardsAndMarkers: unchanged
      conditionSummary: unchanged
      batchActions: [candidate-filter-revert, candidate-filter-apply]
      pendingNote: candidate-filter-pending-note-present
      searchAgain: disabled
      publicOperation: none
  applyFilters:
    input: candidate-filter-apply
    precondition: pending-differs-from-applied-and-pending-match-count-is-positive
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: >-
        filters-object-reflecting-pending-panel-control-state, plus
        shownProviderPageUrls from the surviving (post-expiry-pruning)
        shownCandidateMemory set (omitted when empty) (adr/0024 decision 4,
        decision 4 item 8), plus the same `gatheringId` initialProposal
        carried when this screen is in gathering mode (adr/0049 decision 1
        -- filtering does not leave or re-enter gathering mode).
    success:
      requiredOutcome:
        cards: exactly-current-success-response-candidates
        markers: exactly-one-per-current-success-response-candidate
        removed: all-prior-card-and-marker-candidateRefs-not-in-current-response
        panel: absent
        applied: equals-former-pending
        pending: equals-applied
        ordering: satisfies-proposal.displayOrdering.invariant
        shownCandidateMemoryUpdate: satisfies-shownCandidateMemory.updateRule-for-this-response
    emptyResult:
      present: [candidate-no-results]
    rateLimited:
      present: [candidate-proposal-problem]
      apiResponse: {status: 429, code: PROPOSAL_RATE_LIMITED}
      priorDisplayRetained: >-
        Every candidate-card and candidate-map-marker present immediately
        before this request remains present afterward, with unchanged
        data-candidate-ref values, unchanged card<->marker
        data-selection-state correspondence, and unchanged applied filters
        and condition summary (human decision 2026-08-23, TDR-CS-16).
        candidate-proposal-problem and candidate-proposal-problem-guidance
        render in addition to, not instead of, the retained cards and map;
        candidate-proposal-cards and candidate-map are not removed the way
        the `empty` render state removes them. This requirement applies
        only when a prior successful proposal was already displayed, which
        applyFilters presupposes by precondition. It is verified through
        this rate-limited path only (contracts/test-support-api.yaml's
        RATE_LIMITED_AFTER_INITIAL_SUCCESS); it is not separately restated
        for a provider-unavailable (503) cause, which has no matching
        deterministic Given.
  revertPendingFilters:
    input: candidate-filter-revert
    requiredOutcome:
      panel: remains-present
      pending: equals-applied
      applied: unchanged
      cardsAndMarkers: unchanged
      conditionSummary: unchanged
      batchActions: absent
      publicOperation: none
  closeFilterPanel:
    input: candidate-filter-open
    precondition: candidate-filter-panel-present
    requiredOutcome:
      panel: absent
      pendingAndApplied: unchanged
      cardsAndMarkers: unchanged
      publicOperation: none
  searchAgain:
    input: candidate-search-again
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: >-
        filters-object-semantically-equal-after-default-normalization-to-the-currently-applied-one,
        plus shownProviderPageUrls from the surviving (post-expiry-pruning)
        shownCandidateMemory set (omitted when empty) (adr/0024 decision 4,
        decision 4 item 8), plus the same `gatheringId` initialProposal
        carried when this screen is in gathering mode (adr/0049 decision 1).
      defaultEquivalence: >-
        When the applied conditions are the defaults, the initial `{}` body,
        `{filters: {}}`, and a fully expanded default filters object are
        equivalent under candidate-search-api.yaml's x-default-normalization;
        exact JSON-object or byte equality is not required.
        shownProviderPageUrls is independent of this equivalence (adr/0024
        decision 4): it always reflects the current (post-expiry-pruning)
        shownCandidateMemory state regardless of whether filters changed.
    success:
      requiredOutcome:
        cards: exactly-current-success-response-candidates
        markers: exactly-one-per-current-success-response-candidate
        removed: all-prior-card-and-marker-candidateRefs-not-in-current-response
        panel: absent
        ordering: satisfies-proposal.displayOrdering.invariant
        shownCandidateMemoryUpdate: satisfies-shownCandidateMemory.updateRule-for-this-response
      randomness: >-
        The candidates array may differ from the immediately prior response
        even though the normalized applied filters are unchanged (adr/0023
        decisions 4 and 13, adr/0024 decisions 3 and 4): the
        server draws up to 5 candidates by distance-weighted random selection
        that prioritizes not-yet-shown candidates (per shownPoolPriority) on
        every request. Acceptance testing observes plain seed-reproducibility
        by pinning contracts/test-support-api.yaml's randomSeed to two
        different values across two searchAgain calls against a synthetic
        population larger than the display cap and asserting the returned
        candidate sets differ; a third call with the same randomSeed as the
        first must reproduce the first response's candidates exactly, in the
        same order. The stronger not-yet-shown guarantee (TDR-CS-14) is
        observed separately through shownPoolPriority, independent of any
        particular randomSeed.
    emptyResult:
      present: [candidate-no-results]
    rateLimited:
      present: [candidate-proposal-problem]
      apiResponse: {status: 429, code: PROPOSAL_RATE_LIMITED}
      priorDisplayRetained: >-
        Every candidate-card and candidate-map-marker present immediately
        before this request remains present afterward, with unchanged
        data-candidate-ref values, unchanged card<->marker
        data-selection-state correspondence, and unchanged applied filters
        and condition summary (human decision 2026-08-23, TDR-CS-16).
        candidate-proposal-problem and candidate-proposal-problem-guidance
        render in addition to, not instead of, the retained cards and map;
        candidate-proposal-cards and candidate-map are not removed the way
        the `empty` render state removes them. searchAgain is reachable only
        from an already-displayed proposal, so this requirement always
        applies. It is verified through this rate-limited path only
        (contracts/test-support-api.yaml's
        RATE_LIMITED_AFTER_INITIAL_SUCCESS); it is not separately restated
        for a provider-unavailable (503) cause, which has no matching
        deterministic Given.
  openGatheringEntry:
    input: candidate-gathering-entry
    requiredOutcome:
      navigation: navigates-to-the-organizer-gathering-list-screen
      unaffected: [cardsAndMarkersSet, dataCandidateRefValues,
                   dataSelectionStateValues, appliedFilters, pendingFilters,
                   conditionSummary, mapViewport]
      publicOperation: none
    note: >-
      This action never calls /candidate-proposals or any of its request
      fields; it is a pure navigation to
      gathering-scheduling-browser-interface.yaml's
      browserEntry.organizerGatheringList (adr/0038).
  toggleCardGatheringShortlist:
    input: candidate-card-gathering-toggle
    precondition: >-
      response.gatheringContext-is-non-null-and-cardToggle-is-not-disabled
      (gatheringMode.cardToggle.disabledState above)
    publicOperation:
      crossContractReference:
        file: contracts/gathering-scheduling-api.yaml
        operationId: setShortlistedShops
        method: PUT
        path: /gatherings/{gatheringId}/shortlisted-shops
      requestBody: >-
        The complete replacement shopIds array (adr/0049 decision 1): the
        gathering's current shortlistedShops' shopId values (as reflected by
        every candidate-card's data-gathering-shortlisted="true" at the
        moment of activation) with this card's Candidate.shopId added (if it
        was "false") or removed (if it was "true"). This action never calls
        candidate-search-api.yaml's own /candidate-proposals -- it is the
        first browserAction in this contract whose publicOperation targets a
        different contract's endpoint (mirrors gatheringEntry's
        crossContractReference for reads, extended here to a write).
    requiredOutcome:
      cardToggle: >-
        This card's data-gathering-shortlisted flips to the opposite value
        (adr/0049 decision 1); every other currently-displayed card's
        data-gathering-shortlisted is unaffected by this call, since
        setShortlistedShops' response reflects only this gathering's
        shortlist membership, not this screen's own candidate population.
      band: >-
        gatheringMode.band's shortlistedCount/maxShortlisted attributes
        update to reflect the response gathering's new
        shortlistedShops.length/5 (adr/0049 decision 1).
      unaffected: [cardsAndMarkersSet, dataCandidateRefValues,
                   dataSelectionStateValues, appliedFilters, pendingFilters,
                   conditionSummary, mapViewport]
    errorOutcome: >-
      A rejected call (400 INVALID_SHOP_SELECTION, 401
      AUTHENTICATION_REQUIRED, 404 GATHERING_NOT_FOUND, or 409
      GATHERING_NOT_IN_SELECTING_SHOP_PHASE/GATHERING_FINALIZED,
      gathering-scheduling-api.yaml) leaves cardToggle and band unchanged
      from their pre-activation values; this contract does not fix a
      distinct visible error surface for this action beyond that
      no-op-on-failure guarantee.
  returnToGatheringFromBand:
    input: candidate-gathering-mode-band
    precondition: response.gatheringContext-is-non-null
    requiredOutcome:
      navigation: >-
        navigates-to-gathering-scheduling-browser-interface.yaml's
        browserEntry.organizerDashboard-for-response.gatheringContext.gatheringId
      unaffected: [cardsAndMarkersSet, dataCandidateRefValues,
                   dataSelectionStateValues, appliedFilters, pendingFilters,
                   conditionSummary, mapViewport]
      publicOperation: none
    note: >-
      This is gatheringMode's sole return path (ADR-0054 decision 4) --
      there is no separate "戻る"/confirm control, because
      toggleCardGatheringShortlist above already persists shortlist
      membership on activation, one card at a time; the band merely
      surfaces the count that makes clear the organizer's choices already
      count as "done" (gatheringMode.band.limitReached, ADR-0056 decision
      7, is the machine-observable half of this same "the number itself is
      the signal" design). This action never calls /candidate-proposals or
      any of its request fields, mirroring openGatheringEntry above.

disclosureObservations:
  responseSurfaces:
    [unauthenticated-browser-entry, initial-proposal, filter-apply, search-again,
     no-results, provider-unavailable, rate-limited]
  bodyMustNotContain:
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.privateSearchOrigin
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.providerInternals
  bodyMustNotExposeTestIds:
    [private-search-origin, candidate-provider-internals,
     candidate-route, candidate-current-location]

apiObservations:
  publicContract: contracts/candidate-search-api.yaml
  unauthenticated:
    response: {status: 401, code: AUTHENTICATION_REQUIRED}
  noResults:
    response: {status: 200, candidates: []}
  providerUnavailable:
    response: {status: 503, code: PROVIDER_UNAVAILABLE, guidance: non-empty-safe-message}
  rateLimited:
    response: {status: 429, code: PROPOSAL_RATE_LIMITED, guidance: non-empty-safe-message}

gatheringEntry:
  description: >-
    The candidate-search screen's entry point into the gathering feature
    (Handoff.dc.html option B, human decision 2026-09-01, adr/0038). This is
    the first point where this screen's contract references a resource
    (in-progress gathering count) that is not part of
    candidate-search-api.yaml -- see crossContractReference below. Distinct
    from gatheringMode above: this section is the ordinary screen's entry
    point into the gathering feature (list of gatherings); gatheringMode is
    what this same screen becomes once already inside one gathering's shop
    selection (adr/0049 decision 1).
  requiredTestIds:
    entry: candidate-gathering-entry
  entry:
    testId: candidate-gathering-entry
    formControl: false
    requirement: >-
      Present unconditionally on the authenticated candidate-search screen
      (see browserEntry.authenticatedInitialOutcome.present above), and
      also unconditionally present on every one of gathering-scheduling-
      browser-interface.yaml's organizer-facing screens
      (organizerGatheringList, organizerGatheringCreate, organizerDashboard)
      -- ADR-0054 decision 1 (2026-09-12 human ruling: "会に入ると出られない"
      -- this common navigation element must not disappear once inside the
      gathering feature). gathering-scheduling-browser-interface.yaml
      itself declares no test id of its own for this cross-screen presence
      (see that file's own header note on this point); this paragraph is
      the sole normative source for it. The participant screen
      (participantAnswer, reached only through a signed link) is exempt
      from this presence requirement (ADR-0054 decision 7: that screen is a
      standalone, non-navigating one-page experience by design, not a
      member of the "screen with a parent to go back to" set this element
      otherwise serves). Implemented as a plain link/navigation element (an
      `<a href>`, or a
      tabindex-carrying `<div>` mirroring candidate-map-open's existing
      style) rather than a `<button>` or an element with an interactive ARIA
      role -- this keeps it outside
      unavailableControls.allCandidateScreenFormControlsMustDeclarePurpose's
      scan (forbiddenFormControlCategories does not include a plain anchor
      or a purposeless div; activeContext.md's 2026-08-25 record confirms
      the tester DSL's FORM_CONTROL_SELECTOR does not capture a plain `<a>`
      either), so no new allowedPurposes entry is required (mirrors
      candidate-origin-marker and candidate-map-open's existing
      "display/navigation-only, no purpose declared" precedent). Activating
      it changes no proposal request, no displayed candidate/marker/filter
      state, and no configured origin/range or map viewport -- see
      browserActions.openGatheringEntry. Its visible label text (the
      "ランチ会" wording, not the badge count alone) must remain non-empty
      at every viewport width this contract's acceptance drives, including
      the narrowest -- production had removed this text at narrow widths
      (a CSS rule leaving only an icon), which a first-time user could not
      read as navigation (ADR-0054 decision 1, designer's report on this
      screen). The exact width thresholds, font size, and icon remain
      rendered-geometry/visual choices this contract does not fix (mirrors
      how viewport breakpoints are left unfixed elsewhere, e.g. renderModes
      above) -- only that some non-empty label text is present at every
      width is a Must.
    badge:
      testId: candidate-gathering-entry-badge
      attribute: data-in-progress-gathering-count
      presenceRule: >-
        Present exactly when the count is greater than zero; absent when it
        is zero (designer's judgment, Handoff.dc.html: "0のときはバッジを
        出さない"). When present, the attribute is a decimal integer string
        equal to the count.
    activeGathering:
      testId: candidate-gathering-entry
      attribute: data-active-gathering-id
      presenceRule: >-
        Present, with the current gathering's opaque id as its exact
        string value, exactly when this screen was reached in gathering
        mode (response.gatheringContext is non-null, see gatheringMode
        above); absent (the attribute itself is missing, not merely empty)
        on the ordinary, non-gathering screen this same entry element also
        serves (ADR-0056 decision 8) -- mirroring gatheringMode.cardToggle's
        own non-null-only-in-gathering-mode convention elsewhere in this
        contract. This attribute lives on the same candidate-gathering-entry
        element entry.badge above describes; badge's own presenceRule
        (in-progress count) is unaffected and independent of this
        attribute.
  crossContractReference:
    file: contracts/gathering-scheduling-api.yaml
    operationId: getInProgressGatheringCount
    schemaRef: '#/components/schemas/InProgressGatheringCountResponse'
    note: >-
      This is the first place candidate-search-browser-interface.yaml reads
      a value from a different business contract (gathering-scheduling-
      api.yaml) rather than only candidate-search-api.yaml
      (apiObservations.publicContract above, unchanged). The candidate-
      search screen calling this operation is the coupling point
      Handoff.dc.html and gathering-scheduling-browser-interface.yaml's
      2026-09-01 header comment both flag; candidate-search-api.yaml itself
      is not modified by this addition.
