# Toyama Dining Radar candidate-search browser acceptance interface
#
# Test infrastructure only. This is the machine-readable control-surface and
# observation SSoT for TDR-CS acceptance work. It neither creates a public API
# nor changes the browser-facing candidate-proposal API.
#
# Status: human content-approved in chat (2026-08-03 original approval, PR
# #76). 2026-08-05 amendment: human ruling resolved a conflict between this
# file's totalSeats equality rule and the already-approved screen design
# (PR #66) by adding a machine-readable raw-value attribute for totalSeats;
# see projects/toyama-dining-radar/adr/0011. All other content is unchanged
# from the 2026-08-03 approval.
# 2026-08-06 amendment: human real-device review of the authenticated
# header (the individual-account guidance banner, the password-change/
# sign-out arrangement, and the re-proposal button's position) directed
# developer to fix all three, and the human stated a standing policy for
# this project -- an approved screen direction may drive this file's
# control-surface allowlist rather than the reverse; see
# projects/toyama-dining-radar/adr/0013. This amendment adds one new allowed
# purpose, auth-account-menu-toggle, so an implementation may group
# auth-sign-out and auth-password-change-open behind a single disclosure
# control (a menu bar entry, a dropdown, a hamburger toggle, or equivalent).
# It neither mandates nor forbids that specific UI shape, and no other
# control, scenario, or business API changed. All prior content is
# unchanged.
# 2026-08-08 amendment (adr/0016): a second real-device review found the
# reproposal flow required an explicit "submit" click after selecting an
# option, which the human directed to be removed so selecting an option
# itself performs the re-proposal (candidate-search.feature's TDR-CS-03
# already described one-step selection; only this file lagged). The
# candidate-reproposal-submit test id and the reproposal-submit purpose are
# removed; submitReProposal is renamed selectReProposal and now triggers on
# a single input. A new always-available same-lens "try again" control
# (candidate-reproposal-try-again, purpose reproposal-try-again) is added,
# replacing the removed GENRE_VARIETY lens's slot in the comparison-choice
# surface without occupying a reProposalOptions array slot.
# 2026-08-08 amendment #2 (adr/0017): a third real-device review found
# repeat demotion structurally unable to surface a new candidate on
# re-proposal, because adr/0015 already caps every response at exactly 5
# candidates and the browser-only demotion in adr/0008 decision 2 never had
# an unseen candidate to promote. Repeat demotion now happens server-side:
# the browser echoes back, in the re-proposal request body, the
# providerPageUrl values already rendered on this screen. selectReProposal
# and tryAgain's publicOperation.requestBody now include that value, and
# their repeatPriority.invariant no longer states the browser withholds it
# -- it instead requires the echoed value to be exact and to never be
# sourced from storage, a cookie, or the URL. The same review also found
# business hours the largest single contributor to mobile card height, so
# businessHours (candidate-card-business-hours) is removed from
# requiredFields; candidate-search-api.yaml no longer returns this field.
# 2026-08-09 amendment (adr/0019): a field survey of the same live
# candidates found access redundant with the map and total seats not
# useful to compare by as an exact number. access (candidate-card-access)
# is removed from requiredFields. totalSeats (candidate-card-total-seats)
# keeps its rawValueAttribute mechanism, but its visible value now reflects
# the new capacityTier response field's coarse label rather than a raw
# number with a unit suffix. A new requiredFields entry, nonSmokingStatus
# (candidate-card-non-smoking), is added with the same rawValueAttribute
# mechanism, extending it beyond totalSeats for the first time. A new
# conditional element, cardPaymentCaution (candidate-card-payment-caution),
# is added: present only when the response's cardPaymentAvailable is
# false. requestUnavailableEnumLens's synthetic requestBody now references
# NON_SMOKING_REFERENCE instead of the removed AMENITY_REFERENCE enum
# value.
# 2026-08-09 amendment #2 (adr/0019 decision 8, same-day correction): the
# first draft of this amendment carried no dinner-budget field because the
# corresponding API decision rejected any display; the human, on
# re-confirmation after a reasoning error was found in that rejection,
# asked for a coarse staged display instead. A new requiredFields entry,
# dinnerBudgetTier (candidate-card-dinner-budget), is added with the same
# rawValueAttribute mechanism as totalSeats and nonSmokingStatus (now a
# third field using it). Its visible label must always disclose that it is
# a dinner reference.
# Every amendment to this file becomes durable when its PR merges
# (meta/adr/0035 method (i)).
contractVersion: '0.7'
kind: acceptance-browser-interface
scope: candidate-search
profiles:
  localAcceptance:
    transport: HTTP
    publicDeployment: false
    verifiesScenarios:
      [TDR-CS-00, TDR-CS-01, TDR-CS-02, TDR-CS-03, TDR-CS-04, TDR-CS-05,
       TDR-CS-06, TDR-CS-07, TDR-CS-08, TDR-CS-09, TDR-CS-10, TDR-CS-11,
       TDR-CS-12]
    invariant:
      - The profile is isolated and must never be selected by a public deployment.
      - Candidate state is supplied only through contracts/test-support-api.yaml.
      - Browser actions use only the public same-origin authentication and candidate-proposal boundaries.
      - No real provider, configured search origin, credential, provider identifier, or provider response is used.
    syntheticDisclosureCanaries:
      privateSearchOrigin: synthetic-private-origin-never-disclose.invalid
      providerInternals: synthetic-provider-internals-never-disclose

browserEntry:
  localAcceptanceRunner:
    baseUrl:
      environmentVariable: TDR_ACCEPTANCE_BASE_URL
      requiredScheme: http
    startPath: /
    startUrlTemplate: '${TDR_ACCEPTANCE_BASE_URL}/'
  unauthenticatedOutcome:
    present: [auth-sign-in-form]
    absent:
      [candidate-proposal-content, candidate-map, candidate-reproposal-open,
       candidate-reproposal-try-again, candidate-reproposal-dialog,
       candidate-secondary-conditions, candidate-manual-ordering,
       private-search-origin]
  authenticatedInitialOutcome:
    present: [candidate-proposal-content, candidate-proposal-cards, candidate-map,
              candidate-provider-credit, candidate-reproposal-open,
              candidate-reproposal-try-again]
    absent: [candidate-secondary-conditions, candidate-manual-ordering]

browserControlSurface:
  proposal:
    requiredTestIds:
      content: candidate-proposal-content
      conceptTitle: candidate-concept-title
      conceptRationale: candidate-concept-rationale
      cards: candidate-proposal-cards
      card: candidate-card
      map: candidate-map
      mapMarker: candidate-map-marker
      providerCredit: candidate-provider-credit
      reProposalOpen: candidate-reproposal-open
      tryAgain: candidate-reproposal-try-again
    cardDataAttributes:
      candidateRef: data-candidate-ref
      repeatComparisonHref: data-provider-page-href
      repeatStatus: data-repeat-status
      requiredFields:
        name: {testId: candidate-card-name}
        genre: {testId: candidate-card-genre}
        description: {testId: candidate-card-description}
        regularHoliday: {testId: candidate-card-regular-holiday}
        totalSeats: {testId: candidate-card-total-seats, rawValueAttribute: data-raw-value}
        nonSmokingStatus: {testId: candidate-card-non-smoking, rawValueAttribute: data-raw-value}
        dinnerBudgetTier: {testId: candidate-card-dinner-budget, rawValueAttribute: data-raw-value}
        providerPageLink: {testId: candidate-card-provider-page-link}
      labelObservation:
        semanticAttribute: data-field-label
        requirement: non-empty-accessible-or-visible-label-for-every-required-field
      valueStateAttribute: data-value-state
      valueStates: [provided, unavailable]
      nullBehavior: >-
        Every required field has its stated label. A nullable API value uses
        data-value-state=unavailable and an implementation-neutral visible
        unavailable value. A non-null API value uses data-value-state=provided.
        A required field whose requiredFields entry declares
        rawValueAttribute (currently totalSeats, nonSmokingStatus, and
        dinnerBudgetTier) additionally carries that attribute on the same
        element when provided, equal as an exact string to the returned raw
        API value (for totalSeats, its canonical decimal string, e.g. 38 ->
        "38"; for nonSmokingStatus and dinnerBudgetTier, the exact enum
        string, e.g. "FULL" or "MID"); the acceptance test asserts this
        attribute for exact equality, and the field's visible value may
        instead show an implementation-chosen coarse label derived from a
        different response field or a fixed per-enum-value label
        (totalSeats's visible value reflects capacityTier's label, e.g.
        "少なめ"/"標準"/"多め" for SMALL/MEDIUM/LARGE, not the raw number;
        nonSmokingStatus's visible value reflects a fixed label per its own
        enum value, e.g. "全席禁煙"/"一部禁煙"/"禁煙席なし" for
        FULL/PARTIAL/NONE; dinnerBudgetTier's visible value reflects a
        fixed label per its own enum value that always discloses it is a
        dinner reference, e.g. "ディナー目安 〜2,000円"/"ディナー目安
        2,001〜4,000円"/"ディナー目安 4,001円〜" for LOW/MID/HIGH and must
        never state or imply a lunch price, per adr/0019 and, for
        totalSeats, adr/0011) without itself being checked for exact
        equality against the raw value. The attribute is absent when that
        field is unavailable (for totalSeats, when totalSeats is null; for
        nonSmokingStatus, when nonSmokingStatus is null; for
        dinnerBudgetTier, when dinnerBudgetTier is null), since
        data-value-state=unavailable already expresses its state. Every
        other required field's visible value equals the returned value
        exactly. providerPageLink is always provided, is exempt from
        rawValueAttribute because its href is already the exact
        machine-readable value, and its href equals providerPageUrl.
      cardPaymentCaution:
        testId: candidate-card-payment-caution
        attribute: data-card-payment-available
        presenceRule: >-
          Present, with data-card-payment-available="false", only when the
          response's cardPaymentAvailable is false for that candidate.
          Absent (no test id in the DOM) when cardPaymentAvailable is true
          or null -- unlike requiredFields entries, this element does not
          use data-value-state=unavailable for the null case, since a
          caution about a confirmed unavailability is not itself an
          unavailable-field display (adr/0019). Where present, its visible
          text must state only that credit-card payment is not accepted; it
          must not claim the shop is cash-only or state any other payment
          method.
    markerDataAttributes:
      candidateRef: data-candidate-ref
      selectionState: data-selection-state
    selectionStates: [selected, unselected]
    mapObservations:
      fitStateAttribute: {testId: candidate-map, attribute: data-map-fit-state, value: displayed-candidates}
      tileProviderAttribute: {testId: candidate-map, attribute: data-map-tile-provider, value: openstreetmap-standard}
      attribution:
        testId: candidate-map-attribution
        href: https://www.openstreetmap.org/copyright
        text: '© OpenStreetMap contributors'
      markerSet: every-candidate-card-has-exactly-one-marker-with-same-data-candidate-ref
      candidateRefUniqueness: every-current-card-has-a-unique-non-empty-data-candidate-ref
      forbiddenTestIds:
        [candidate-origin-marker, candidate-route, candidate-current-location,
         candidate-walking-time, private-search-origin]
    providerCreditObservation:
      testId: candidate-provider-credit
      element: anchor
      text: response.providerCredit.text
      href: response.providerCredit.url
  reProposal:
    requiredTestIds:
      dialog: candidate-reproposal-dialog
      option: candidate-reproposal-option
      cancel: candidate-reproposal-cancel
    optionDataAttributes:
      kind: data-reproposal-kind
    constraints:
      - The dialog is absent until candidate-reproposal-open is activated and opens without document navigation or URL change.
      - It presents at most three options and excludes the currently displayed concept kind.
      - Selecting an option itself performs the re-proposal; no separate confirmation control exists for this dialog.
      - No secondary-condition or manual-ordering control is present.
  unavailableControls:
    forbiddenFormControlCategories:
      [select, input, textarea, checkbox, radio, range, combobox, listbox,
       slider, spinbutton, button]
    semanticAttributes:
      controlCategory: data-candidate-control-category
      controlPurpose: data-candidate-control-purpose
    allCandidateScreenFormControlsMustDeclarePurpose: true
    allowedPurposes:
      [candidate-card-selection, candidate-map-marker-selection, reproposal-open,
       reproposal-selection, reproposal-try-again, reproposal-cancel, auth-sign-out,
       auth-password-change-open, auth-account-menu-toggle]
    reproposalTryAgainNotes: >-
      reproposal-try-again (added 2026-08-08, projects/toyama-dining-radar/
      adr/0016) is a single always-available control that repeats the
      currently displayed proposal's own kind rather than offering a
      distinct comparison lens; it replaces the removed GENRE_VARIETY lens's
      slot in the comparison-choice surface and does not occupy a
      reProposalOptions array slot or open the reProposal dialog by itself
      (an implementation may surface it inside or outside that dialog; this
      file does not prescribe its layout). It carries the same repeat
      demotion, invalid-lens, and rate-limit outcomes as selectReProposal.
    accountMenuToggleNotes: >-
      auth-account-menu-toggle is a pure disclosure control (added
      2026-08-06, projects/toyama-dining-radar/adr/0013): activating it may
      show or hide a group of controls that already declare their own
      allowed purpose (for example auth-sign-out and
      auth-password-change-open). It triggers no publicOperation of its own
      and grants no new business capability -- forbiddenPurposes below still
      applies to every control inside the group it discloses. No TDR-CS or
      TDR-AUTH scenario currently asserts this control's open or closed
      state directly, so no browserActions entry is required for it. An
      implementation is free to use it, or to leave auth-sign-out and
      auth-password-change-open always visible instead without this
      control; whether it appears at all is a layout choice, not an outcome
      this file requires.
    forbiddenPurposes:
      [secondary-condition, filter, sort, manual-ordering]
    invariant: >-
      No form control may provide a secondary condition, filter, sort, or
      manual ordering capability, whether or not it has a test id.
  empty:
    requiredTestIds: [candidate-no-results]
    absent: [candidate-proposal-cards, candidate-map]
  problem:
    requiredTestIds: [candidate-proposal-problem, candidate-proposal-problem-guidance]
    codeAttribute: data-problem-code
    guidance:
      testId: candidate-proposal-problem-guidance
      text: response.message
      minimumLength: 1
    forbiddenTestIds: [private-search-origin, candidate-provider-internals]

browserActions:
  initialProposal:
    trigger: open-authenticated-browserEntry
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: {}
    success:
      present: [candidate-proposal-content, candidate-proposal-cards, candidate-map,
                candidate-provider-credit, candidate-reproposal-open,
                candidate-reproposal-try-again]
      absent: [candidate-reproposal-dialog, candidate-secondary-conditions,
               candidate-manual-ordering]
  selectCard:
    input: candidate-card
    requiredOutcome:
      selectedCardAttribute: {attribute: data-selection-state, value: selected}
      matchingMarkerAttribute: {attribute: data-selection-state, value: selected}
      allOtherCardsAndMarkers: {attribute: data-selection-state, value: unselected}
  selectMarker:
    input: candidate-map-marker
    requiredOutcome:
      selectedMarkerAttribute: {attribute: data-selection-state, value: selected}
      matchingCardAttribute: {attribute: data-selection-state, value: selected}
      allOtherCardsAndMarkers: {attribute: data-selection-state, value: unselected}
  openReProposal:
    input: candidate-reproposal-open
    success:
      present: [candidate-reproposal-dialog, candidate-reproposal-option,
                candidate-reproposal-cancel]
      navigation: {document: unchanged, url: unchanged}
  selectReProposal:
    input: candidate-reproposal-option
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: selected-data-reproposal-kind-plus-previously-shown-provider-page-urls
    success:
      requiredOutcome:
        cards: exactly-current-success-response-candidates
        markers: exactly-one-per-current-success-response-candidate
        removed: all-prior-card-and-marker-candidateRefs-not-in-current-response
        dialog: absent
      repeatPriority:
        comparisonKey: candidate-card.data-provider-page-href
        repeatedState: {attribute: data-repeat-status, value: repeated}
        newState: {attribute: data-repeat-status, value: new}
        ordering: every-new-card-precedes-every-repeated-card
        invariant:
          - A repeated candidate is not excluded.
          - candidate-card.data-provider-page-href equals its response providerPageUrl href.
          - The request body's previouslyShownProviderPageUrls contains exactly the providerPageUrl values already rendered on this screen (every response shown so far in this screen's lifetime), and nothing else -- it is not invented by the browser and is not sourced from storage, a cookie, or the URL (adr/0017).
          - The browser does not persist this state outside its own current-screen memory; it is never written to storage, a cookie, or the URL.
      reset:
        - Reloading the screen, closing its tab, or signing out clears comparison state.
    invalidLens:
      present: [candidate-proposal-problem]
      apiResponse: {status: 400, code: PROPOSAL_REPROPOSAL_KIND_INVALID}
    rateLimited:
      present: [candidate-proposal-problem]
      apiResponse: {status: 429, code: PROPOSAL_RATE_LIMITED}
  tryAgain:
    input: candidate-reproposal-try-again
    publicOperation:
      method: POST
      path: /candidate-proposals
      requestBody: displayed-proposal-kind-plus-previously-shown-provider-page-urls
    success:
      requiredOutcome:
        cards: exactly-current-success-response-candidates
        markers: exactly-one-per-current-success-response-candidate
        removed: all-prior-card-and-marker-candidateRefs-not-in-current-response
        dialog: absent
      repeatPriority:
        comparisonKey: candidate-card.data-provider-page-href
        repeatedState: {attribute: data-repeat-status, value: repeated}
        newState: {attribute: data-repeat-status, value: new}
        ordering: every-new-card-precedes-every-repeated-card
        invariant:
          - A repeated candidate is not excluded.
          - candidate-card.data-provider-page-href equals its response providerPageUrl href.
          - The request body's previouslyShownProviderPageUrls contains exactly the providerPageUrl values already rendered on this screen (every response shown so far in this screen's lifetime), and nothing else -- it is not invented by the browser and is not sourced from storage, a cookie, or the URL (adr/0017).
          - The browser does not persist this state outside its own current-screen memory; it is never written to storage, a cookie, or the URL.
      reset:
        - Reloading the screen, closing its tab, or signing out clears comparison state.
    invalidLens:
      present: [candidate-proposal-problem]
      apiResponse: {status: 400, code: PROPOSAL_REPROPOSAL_KIND_INVALID}
    rateLimited:
      present: [candidate-proposal-problem]
      apiResponse: {status: 429, code: PROPOSAL_RATE_LIMITED}
  requestUnavailableEnumLens:
    purpose: deterministic-CS-07-observation-without-requiring-a-UI-option
    publicOperation:
      method: POST
      path: /candidate-proposals
      session: authenticated-browser-cookie-jar
      csrf: same-origin-browser-CSRF-token
      requestBody: {reproposalKind: NON_SMOKING_REFERENCE}
    requiredOutcome:
      present: [candidate-proposal-problem, candidate-proposal-problem-guidance]
      apiResponse: {status: 400, code: PROPOSAL_REPROPOSAL_KIND_INVALID}

disclosureObservations:
  responseSurfaces:
    [unauthenticated-browser-entry, initial-proposal, re-proposal, no-results,
     provider-unavailable, invalid-lens, rate-limited]
  bodyMustNotContain:
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.privateSearchOrigin
    - source: profiles.localAcceptance.syntheticDisclosureCanaries.providerInternals
  bodyMustNotExposeTestIds:
    [private-search-origin, candidate-provider-internals, candidate-origin-marker,
     candidate-route, candidate-current-location]

apiObservations:
  publicContract: contracts/candidate-search-api.yaml
  unauthenticated:
    response: {status: 401, code: AUTHENTICATION_REQUIRED}
  noResults:
    response: {status: 200, proposal: null}
  providerUnavailable:
    response: {status: 503, code: PROVIDER_UNAVAILABLE, guidance: non-empty-safe-message}
  invalidLens:
    response: {status: 400, code: PROPOSAL_REPROPOSAL_KIND_INVALID, guidance: non-empty-safe-message}
  rateLimited:
    response: {status: 429, code: PROPOSAL_RATE_LIMITED, guidance: non-empty-safe-message}
