# Dining Radar candidate-search browser acceptance interface
#
# Test infrastructure only. This is the machine-readable control-surface and
# observation SSoT for TDR-CS acceptance work. It neither creates a public API
# nor changes the browser-facing candidate-proposal API.
#
# Status: 承認済み — adr/0024 の改訂は 2026-08-29 にチャットで承認された（同ADRの approved_by 参照）。
# **adr/0025 の改訂は 2026-08-24 に PR #156 のマージをもって承認済み**（ADR-0035 方式(i)）。adr/0031 の
# 追補（v1.5.0）は 2026-08-28 にチャットで承認済み。adr/0033 の追補（v1.6.0）は 2026-08-29
# にチャットで承認済み。**adr/0038 の追補（v1.7.0、gatheringEntry節）と adr/0049 の追補（v1.8.0、
# 会モードの帯とカードごとのトグル／mapPrimaryLayout を twoColumnLayout へ／デッキの送り・件数カウンタの
# 退役）は、2026-09-11 にチャットで承認された**——人間裁定（2026-09-11 チャット選択肢UI）: 会の画面群の
# 仕様と実装を、この場の合意として承認する（meta/adr/0064 決定1）。未承認の改訂は残っていない。
