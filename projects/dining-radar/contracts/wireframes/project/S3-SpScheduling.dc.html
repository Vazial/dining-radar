<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日程を聞き中 決定 案A＋案B スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14614A}a:hover{color:#0E4736}
.bar{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.menu{width:44px;height:44px;box-sizing:border-box;border:1px solid #C6CFC6;border-radius:10px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#17201B;padding:0}
.btn{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid #C6CFC6;background:#FFFFFF;border-radius:10px;font:inherit;font-size:14px;font-weight:500;color:#17201B;text-decoration:none;white-space:nowrap}
.btn.pri{background:#14614A;border-color:#14614A;color:#FFFFFF;font-weight:700}
.btn[disabled]{background:#F2F4F0;color:#77827A;border-color:#DFE4DE}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;background:#FBEFD6;color:#7A4E00}
.muted{color:#5C665F;font-size:12.5px}
.stepc{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.nowtag{font-size:11.5px;font-weight:700;color:#FFFFFF;background:#14614A;border-radius:10px;padding:2px 8px}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700}
.b-done{background:#DDEFE4;color:#14614A}
.b-wait{background:#EDEFEC;color:#3F4A43}
.prog{display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:4px;width:100%}
.prog span{height:8px;border-radius:4px;background:#DFE4DE}
.prog span.on{background:#14614A}
table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:13px}
th,td{text-align:center;padding:0;height:40px;border-bottom:1px solid #EDF0EC}
th{font-weight:500;color:#4B564E;height:52px;line-height:1.3;font-size:12px;vertical-align:middle}
th b{display:block;font-size:13px;color:#17201B}
.nm{text-align:left;padding-left:12px;font-weight:500}
.ld{background:#E6F0EA}
.lt{display:inline-block;font-size:10.5px;font-weight:700;color:#14614A;background:#FFFFFF;border:1px solid #9CC5AE;border-radius:8px;padding:0 6px;margin-bottom:2px}
.o{color:#14614A;font-weight:700}.t{color:#8A5A00}.x{color:#5C665F}
tr.wait td{color:#5C665F;background:#FAFBF9}
tr.wait td.ld{background:#EEF4F0}
.wb{display:inline-block;font-size:11px;font-weight:700;color:#3F4A43;background:#E3E6E2;border-radius:8px;padding:1px 7px;margin-left:6px}
tr.sum td{font-weight:700;border-top:2px solid #C6CFC6;border-bottom:0;background:#F7F8F6;height:52px;vertical-align:middle}
tr.sum td.ld{background:#D3E8DA}
.so{display:block;font-weight:700;color:#14614A}
.st{display:block;font-size:11px;font-weight:500;color:#8A5A00}
.del{width:28px;height:28px;margin:2px auto 0;border:1px solid #E6C9C3;border-radius:14px;background:#FFFFFF;color:#8A2B1E;display:flex;align-items:center;justify-content:center;padding:0}
th.add{border-left:1px dashed #9CC5AE;background:#F4F9F6}
td.add{border-left:1px dashed #9CC5AE;background:#F9FCFA}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center}
.num{width:30px;height:30px;border-radius:15px;box-sizing:border-box;border:2px solid #C6CFC6;background:#FFFFFF;color:#5C665F;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.num.cur{border-color:#14614A;color:#14614A;border-width:3px}
.line{width:2px;flex-grow:1;background:#DFE4DE;min-height:12px}
.body{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.fold{display:flex;align-items:center;gap:10px;min-height:44px;padding-top:4px;padding-bottom:4px}
.nav{height:64px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-top:1px solid #DFE4DE;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#4B564E;text-decoration:none;position:relative}
.nav a.cur{color:#14614A;font-weight:700}
.sp .btn{padding:0 12px}
.sp table{font-size:12.5px}
.sp th,.sp td{height:36px}
.sp th{font-size:11px;height:48px}
.sp th b{font-size:12px}
.sp .nm{padding-left:8px}
.sp .wb{font-size:10px;padding:0 5px;margin-left:4px}
.sp .badge{height:24px;font-size:11.5px;padding:0 8px}
.sp .lt{font-size:9.5px;padding:0 4px}
.sp tr.sum td{height:46px}
.sp .step{grid-template-columns:28px 1fr;gap:10px}
.sp .num{width:26px;height:26px;font-size:12px}
.sp .body{padding:10px 12px}
</style>
</helmet>
<div class="sp" style="width:390px;height:844px;box-sizing:border-box;background:#F2F4F0;color:#17201B;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <main style="flex-grow:1;min-height:0;box-sizing:border-box;padding:6px 14px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden">
    <div>
      <a href="#" style="font-size:13px;text-decoration:none;display:inline-flex;align-items:center;min-height:40px">‹ ランチ会</a>
      <div style="display:flex;align-items:center;gap:8px"><h1 style="margin:0;font-size:20px">10月ランチ会</h1><span class="chip">日程を聞き中</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:8px">
      <section class="stepc" style="border:2px solid #14614A;padding:10px 12px;gap:6px">
        <span style="font-size:13.5px;font-weight:700">日程を選ぶ</span>
        <span style="font-size:20px;font-weight:700">4<span style="font-size:13px;color:#4B564E"> / 6人</span></span>
        <div class="prog" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span></div>
        <div style="display:flex;gap:4px"><span class="badge b-done">答えた 4</span><span class="badge b-wait">まだ 2</span></div>
      </section>
      <section class="stepc" style="background:#F7F8F6;border-style:dashed;padding:10px 12px;gap:6px">
        <span style="font-size:13.5px;font-weight:700;color:#4B564E">店を選ぶ</span>
        <span class="muted" style="font-size:12px">日が決まったら選べます</span>
      </section>
    </div>
    <section style="box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:12px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px"><span style="font-size:14px;font-weight:700">日を決める</span><button class="btn" style="min-height:44px;font-size:12.5px;padding:0 10px">候補日を編集</button></div>
      <table><thead><tr><th class="nm" style="width:96px">回答者</th><th><b>10/13</b>火</th><th><b>10/14</b>水</th><th><b>10/15</b>木</th><th class="ld"><span class="lt">有力</span><b>10/16</b>金</th></tr></thead><tbody>
<tr><td class="nm">あおい</td><td class="o">○</td><td class="x">×</td><td class="t">△</td><td class="ld o">○</td></tr>
<tr><td class="nm">はると</td><td class="o">○</td><td class="o">○</td><td class="x">×</td><td class="ld o">○</td></tr>
<tr><td class="nm">参加者3</td><td class="t">△</td><td class="x">×</td><td class="o">○</td><td class="ld o">○</td></tr>
<tr><td class="nm">ゆい</td><td class="x">×</td><td class="o">○</td><td class="o">○</td><td class="ld o">○</td></tr>
<tr class="wait"><td class="nm">みなと<span class="wb">まだ</span></td><td>−</td><td>−</td><td>−</td><td class="ld">−</td></tr>
<tr class="wait"><td class="nm">参加者6<span class="wb">まだ</span></td><td>−</td><td>−</td><td>−</td><td class="ld">−</td></tr>
<tr class="sum"><td class="nm">合計</td><td><span class="so">○2</span><span class="st">△1</span></td><td><span class="so">○2</span><span class="st">△0</span></td><td><span class="so">○2</span><span class="st">△1</span></td><td class="ld"><span class="so">○4</span><span class="st">△0</span></td></tr>
</tbody></table>
      <span class="muted" style="padding:0 4px;font-size:12px">横に送ると続き（14日）</span>
      <button class="btn" disabled="disabled" style="min-height:48px">日付を押して日を選ぶ</button>
    </section>
  </main>
  <nav class="nav" aria-label="おもな行き先">
    <a href="#" class="cur" aria-current="page"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>ランチ会</a>

    <a href="#"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 18c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/></svg>アカウント</a>
  </nav>
</div>
