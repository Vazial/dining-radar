<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>M-2 PC 右のペイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14614A}a:hover{color:#0E4736}
.bar{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.bar h1{margin:0;font-size:18px;font-weight:700}
.ghost{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:14px;height:150px}
.pane{position:absolute;right:0;top:0;bottom:0;width:360px;box-sizing:border-box;background:#FFFFFF;box-shadow:-10px 0 30px rgba(23,32,27,.18);display:flex;flex-direction:column}
.ph{height:60px;flex-shrink:0;box-sizing:border-box;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px}
.close{width:44px;height:44px;border:0;background:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#17201B}
.item{min-height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;font-size:15px;color:#17201B;text-decoration:none;background:none;border:0;font-family:inherit;text-align:left;width:100%}
.item.cur{background:#EEF6F1;color:#14614A;font-weight:700}
.sub{min-height:52px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:4px 12px 4px 42px;border-radius:8px;text-decoration:none;color:#17201B}
.sub b{font-size:14px}
.sub span{font-size:12px;color:#5C665F}
.sec{font-size:11.5px;font-weight:700;color:#5C665F;letter-spacing:.04em;padding:14px 12px 4px}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F2F4F0;color:#17201B;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <header class="bar"><h1>ランチ会</h1><span style="width:44px"></span></header>
  <main style="width:960px;margin:0 auto;box-sizing:border-box;padding:24px 0;display:flex;flex-direction:column;gap:14px">
    <div style="height:44px"></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px"><div class="ghost"></div><div class="ghost"></div></div>
  </main>
  <div style="position:absolute;inset:0;background:rgba(23,32,27,.36)"></div>
  <nav class="pane" aria-label="メニュー">
    <div class="ph"><span style="font-size:15px;font-weight:700">メニュー</span><button class="close" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div style="padding:8px 10px;display:flex;flex-direction:column;flex-grow:1;overflow:hidden">
      <a class="item cur" href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>ランチ会<span style="margin-left:auto;font-size:11px">いまここ</span></a>
      <a class="sub" href="#"><b>9月のランチ会</b><span>日程を聞き中 ・ 次: 日を決める</span></a>
      <a class="sub" href="#"><b>10月の歓迎ランチ</b><span>店を選び中 ・ 次: 店を決める</span></a>
      <a class="sub" href="#"><b>秋の送別ランチ</b><span>日程を聞き中 ・ 回答を待つ</span></a>
      <a class="item" href="#" style="font-size:13.5px;color:#14614A;padding-left:42px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>ランチ会をつくる</a>
      <div style="height:1px;background:#DFE4DE;margin:6px 4px"></div>
      <a class="item" href="#"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>店を探す</a>
      <span style="flex-grow:1"></span>
      <div class="sec">アカウント</div>
      <button class="item">パスワードを変える</button>
      <button class="item">ログアウト</button>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
