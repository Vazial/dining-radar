<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>店を探す スマホ ナビから開いた</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14614A}a:hover{color:#0E4736}
.btn{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border:1px solid #C6CFC6;background:#FFFFFF;border-radius:10px;font:inherit;font-size:13.5px;font-weight:500;color:#17201B;text-decoration:none;white-space:nowrap}
.muted{color:#5C665F;font-size:12px}
.card{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center}
.no{width:22px;height:22px;border-radius:11px;border:2px solid #14614A;color:#14614A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.sn{font-size:14px;font-weight:700}
.nav{height:64px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-top:1px solid #DFE4DE;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#4B564E;text-decoration:none;position:relative}
.nav a.cur{color:#14614A;font-weight:700}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#14614A;color:#FFFFFF;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F4F0;color:#17201B;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:relative;height:420px;flex-shrink:0;background:#E4E9E2">
    <span style="position:absolute;left:16px;top:14px;font-size:17px;font-weight:700">店を探す</span>
    <div style="position:absolute;right:12px;top:8px;display:flex;gap:6px"><button class="btn">絞り込み</button></div>
    <span style="position:absolute;left:170px;top:200px;width:26px;height:26px;border-radius:13px;background:#14614A;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span>
    <span style="position:absolute;left:240px;top:150px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;border:2px solid #14614A;box-sizing:border-box;color:#14614A;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span>
    <span style="position:absolute;left:14px;top:52px;font-size:10.5px;color:#4B564E">地図（合成）</span>
    <span style="position:absolute;left:8px;bottom:4px;font-size:9.5px;color:#4B564E">© OpenStreetMap ・ Powered by ホットペッパーグルメ Webサービス</span>
  </div>
  <main style="flex-grow:1;min-height:0;box-sizing:border-box;padding:12px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
    <div class="card"><span class="no">1</span><div><div class="sn">つばめ食堂</div><div class="muted">和食 ・ 徒歩 約3分 ・ 全席禁煙 ・ 予算 低</div></div></div>
    <div class="card"><span class="no">2</span><div><div class="sn">こだま珈琲</div><div class="muted">カフェ ・ 徒歩 約4分 ・ 全席禁煙 ・ 予算 低</div></div></div>
    <span class="muted" style="font-size:11.5px">会と関係なく探す。会に入れるボタンは出ない（いまの通常モードのまま）。</span>
  </main>
  <nav class="nav" aria-label="おもな行き先">
    <a href="#"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>ランチ会<span class="badge">3</span></a>
    <a href="#" class="cur" aria-current="page"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>店を探す</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 18c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/></svg>アカウント</a>
  </nav>
</div>
</x-dc>

</html>
