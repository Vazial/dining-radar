<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC 空の状態</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14614A}a:hover{color:#0E4736}
.bar{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.bar h1{margin:0;font-size:18px;font-weight:700}
.menu{width:44px;height:44px;box-sizing:border-box;border:1px solid #C6CFC6;border-radius:10px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#17201B;padding:0}
.btn{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid #C6CFC6;background:#FFFFFF;border-radius:10px;font:inherit;font-size:14px;font-weight:500;color:#17201B;text-decoration:none;white-space:nowrap}
.btn.pri{background:#14614A;border-color:#14614A;color:#FFFFFF;font-weight:700}
.step{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:1 1 0}
.num{width:32px;height:32px;border-radius:16px;background:#DDEFE4;color:#14614A;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.step b{font-size:15px}
.step span{font-size:13px;color:#4B564E;line-height:1.6}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F2F4F0;color:#17201B;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <header class="bar">
    <h1>ランチ会</h1>
    <button class="menu" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </header>
  <main style="width:960px;margin:0 auto;box-sizing:border-box;padding:28px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:15px;font-weight:700">あなたが幹事のランチ会</span>
      <a class="btn" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>ランチ会をつくる</a>
    </div>
    <section style="box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:16px;padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:28px;margin-top:12px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span style="font-size:22px;font-weight:700">まだランチ会がありません</span>
        <span style="font-size:14px;color:#4B564E">ランチ会をつくると、次の3つを順に進められます。</span>
      </div>
      <div style="display:flex;gap:32px;width:100%">
        <div class="step"><span class="num">1</span><b>候補日を出す</b><span>カレンダーで行けそうな日をまとめて選ぶ</span></div>
        <div class="step"><span class="num">2</span><b>回答リンクを配る</b><span>一人に1本。ログインなしで日程に答えてもらう</span></div>
        <div class="step"><span class="num">3</span><b>店を選んで決める</b><span>日が決まったら、その日に開いている店から選ぶ</span></div>
      </div>
      <a class="btn pri" href="#" style="min-height:52px;font-size:16px;padding:0 36px">ランチ会をつくる</a>
      <a href="#" style="font-size:13px">会をつくらずに、店だけ探す</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
