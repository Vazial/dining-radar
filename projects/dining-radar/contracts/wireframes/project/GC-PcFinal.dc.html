body{margin:0}

.bar{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.menu{width:44px;height:44px;box-sizing:border-box;border:1px solid #C6CFC6;border-radius:10px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#17201B;padding:0}

.muted{color:#5C665F;font-size:12.5px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px}

.line{width:2px;flex-grow:1;background:#DFE4DE;min-height:12px}
.line.done{background:#14614A}
.body{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:12px;padding:10px 14px;margin-bottom:10px}

.sn{font-size:14px;font-weight:700}
.votes{font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;gap:8px}
.pin{position:absolute;width:30px;height:30px;border-radius:15px;background:#FFFFFF;border:2px solid #14614A;color:#14614A;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;box-shadow:0 1px 3px rgba(23,32,27,.25)}
