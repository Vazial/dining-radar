<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>KEN-70 案A スマホ 空状態（採用前）</title><style>
:root{--face:#F2F4F0;--card:#FFF;--line:#DFE4DE;--ink:#17201B;--muted:#5C665F;--green:#14614A;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--face);color:var(--ink);font:14px system-ui,sans-serif}main{width:390px;height:844px;padding:8px 16px 14px;display:flex;flex-direction:column;gap:8px}.head{display:flex;align-items:center;gap:8px}.chip{padding:4px 8px;border-radius:12px;background:#DDEFE4;color:var(--green);font-size:11px;font-weight:700}.step{display:grid;grid-template-columns:28px 1fr;gap:10px}.rail{display:flex;flex-direction:column;align-items:center}.num{width:26px;height:26px;border-radius:50%;border:2px solid #C6CFC6;display:grid;place-items:center}.done{background:var(--green);color:white;border-color:var(--green)}.line{width:2px;flex:1;background:var(--line);min-height:10px}.body{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}.current{border:2px solid var(--green)}.cta{display:flex;min-height:44px;align-items:center;justify-content:center;border-radius:10px;background:var(--green);color:white;text-decoration:none;font-weight:700}small{color:var(--muted)}.map{height:150px;border-radius:10px;background:#E4E9E2;display:grid;place-items:center;color:var(--muted);font-size:12px}</style></head><body><main><div><div>‹ ランチ会</div><div class="head"><h1 style="font-size:20px;margin:4px 0">9月のランチ会</h1><span class="chip">店を選び中</span></div></div><div><div class="step"><div class="rail"><span class="num done">✓</span><span class="line"></span></div><div class="body">日程　<b>10/8 (木) 12:00</b></div></div><div class="step"><div class="rail"><span class="num">2</span><span class="line"></span></div><div class="body current"><b>店</b><p><small>開いている店が見つかりません。</small></p><div class="map">候補なし</div><a class="cta" href="#">開いている店から選ぶ</a></div></div><div class="step"><div class="rail"><span class="num">3</span></div><div class="body"><small>決まり　確定すると日と店がここに</small></div></div></div></div></main></body></html>
