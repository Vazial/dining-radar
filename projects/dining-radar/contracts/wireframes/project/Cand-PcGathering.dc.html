<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>店を探す PC 会から開いた</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14614A}a:hover{color:#0E4736}
.bar{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DFE4DE;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.bar h1{margin:0;font-size:18px;font-weight:700}
.menu{width:44px;height:44px;box-sizing:border-box;border:1px solid #C6CFC6;border-radius:10px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#17201B;padding:0}
.btn{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border:1px solid #C6CFC6;background:#FFFFFF;border-radius:10px;font:inherit;font-size:13.5px;font-weight:500;color:#17201B;text-decoration:none;white-space:nowrap}
.btn.on{background:#14614A;border-color:#14614A;color:#FFFFFF;font-weight:700}
.muted{color:#5C665F;font-size:12px}
.card{box-sizing:border-box;background:#FFFFFF;border:1px solid #DFE4DE;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.no{width:24px;height:24px;border-radius:12px;border:2px solid #14614A;color:#14614A;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.sn{font-size:14.5px;font-weight:700}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F2F4F0;color:#17201B;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <header class="bar">
    <h1>店を探す</h1>
    <button class="menu" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </header>
  <div style="flex-shrink:0;box-sizing:border-box;background:#E6F0EA;border-bottom:1px solid #C9DDD0;padding:6px 24px;display:flex;align-items:center;gap:16px">
    <a href="#" style="font-size:13.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;min-height:40px">‹ 9月のランチ会</a>
    <span style="font-size:13.5px">10/8 (木) に開いている店 ・ 入れた店 <b>3 / 5</b></span>
  </div>
  <div style="flex-grow:1;min-height:0;display:grid;grid-template-columns:460px 1fr">
    <div style="box-sizing:border-box;padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
      <div style="display:flex;gap:8px"><button class="btn">絞り込み</button><button class="btn">もう一度探す</button></div>
      <div class="card"><span class="no">1</span><div><div class="sn">つばめ食堂</div><div class="muted">和食 ・ 徒歩 約3分 ・ 全席禁煙 ・ 予算 低</div></div><button class="btn on" aria-pressed="true">入れた</button></div>
      <div class="card"><span class="no">2</span><div><div class="sn">こだま珈琲</div><div class="muted">カフェ ・ 徒歩 約4分 ・ 全席禁煙 ・ 予算 低</div></div><button class="btn" aria-pressed="false">会に入れる</button></div>
      <div class="card"><span class="no">3</span><div><div class="sn">小麦と灯</div><div class="muted">洋食 ・ 徒歩 約6分 ・ 一部禁煙 ・ 予算 中</div></div><button class="btn on" aria-pressed="true">入れた</button></div>
      <div class="card"><span class="no">4</span><div><div class="sn">まるみ食堂</div><div class="muted">和食 ・ 徒歩 約8分 ・ 全席禁煙 ・ 予算 低</div></div><button class="btn on" aria-pressed="true">入れた</button></div>
      <div class="card"><span class="no">5</span><div><div class="sn">かもめ亭</div><div class="muted">中華 ・ 徒歩 約9分 ・ 全席禁煙 ・ 予算 中</div></div><button class="btn" aria-pressed="false">会に入れる</button></div>
    </div>
    <div style="position:relative;background:#E4E9E2">
      <span style="position:absolute;left:14px;top:10px;font-size:11px;color:#4B564E">地図（合成）</span>
      <span style="position:absolute;left:330px;top:250px;width:26px;height:26px;border-radius:13px;background:#14614A;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span>
      <span style="position:absolute;left:420px;top:180px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;border:2px solid #14614A;box-sizing:border-box;color:#14614A;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span>
      <span style="position:absolute;left:10px;bottom:6px;font-size:10.5px;color:#4B564E">© OpenStreetMap ・ Powered by ホットペッパーグルメ Webサービス</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
