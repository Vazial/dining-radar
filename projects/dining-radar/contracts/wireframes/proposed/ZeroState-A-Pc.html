<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>KEN-70 案A PC 空状態（採用前）</title><style>
:root{--face:#F2F4F0;--card:#FFF;--line:#DFE4DE;--line-strong:#C6CFC6;--ink:#17201B;--muted:#5C665F;--green:#14614A;--radius:12px;--space:12px}*{box-sizing:border-box}body{margin:0;background:var(--face);color:var(--ink);font:14px system-ui,sans-serif}.bar{height:60px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.menu{width:44px;height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card)}main{width:1200px;height:840px;margin:auto;padding:12px 0 20px;display:flex;flex-direction:column;gap:12px}.head{display:flex;align-items:center;gap:12px}.chip{padding:4px 10px;border-radius:12px;background:#DDEFE4;color:var(--green);font-weight:700;font-size:12px}.columns{flex:1;display:grid;grid-template-columns:540px 1fr;gap:20px}.step{display:grid;grid-template-columns:36px 1fr;gap:12px}.rail{display:flex;flex-direction:column;align-items:center}.num{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center}.done{background:var(--green);color:white;border-color:var(--green)}.line{width:2px;flex:1;background:var(--line);min-height:12px}.body{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}.current{border:2px solid var(--green)}.cta{display:inline-flex;min-height:44px;align-items:center;padding:0 16px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}.empty-map{border:1px solid var(--line);border-radius:14px;background:#E4E9E2;display:grid;place-items:center;color:var(--muted)}small{color:var(--muted)}</style></head><body><header class="bar"><b>ランチ会</b><button class="menu" aria-label="メニュー">☰</button></header><main><div class="head"><span>‹ ランチ会</span><h1 style="font-size:24px;margin:0">9月のランチ会</h1><span class="chip">店を選び中</span></div><div class="columns"><div><div class="step"><div class="rail"><span class="num done">✓</span><span class="line"></span></div><div class="body">日程　<b>10/8 (木) 12:00 から</b></div></div><div class="step"><div class="rail"><span class="num">2</span><span class="line"></span></div><div class="body current"><b>店</b><p><small>開いている店が見つかりません。条件を変えて探し直せます。</small></p><a class="cta" href="#">開いている店から選ぶ</a></div></div><div class="step"><div class="rail"><span class="num">3</span></div><div class="body"><small>決まり　店を確定するとここに出ます</small></div></div></div><section class="empty-map" aria-label="地図">候補がないため地図には店を表示できません</section></div></main></body></html>
