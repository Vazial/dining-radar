# Dining Radar test-support API — acceptance-test Given seams
#
# This is test infrastructure, not a browser-facing business API.  It is the
# machine-readable SSoT for the acceptance-only seams required by TDR-AUTH,
# TDR-CS, and TDR-GTH.
# Per meta/adr/0008, developer and tester must read this file verbatim rather
# than receiving a paraphrase in a task prompt.
#
# Availability: the endpoints exist only in the isolated acceptance-test
# configuration.  They must not be registered in development, production, or
# any internet-facing deployment.  They operate only on synthetic test data.
# They never reveal or alter a private search origin, provider data or
# credentials, runtime secrets, or any real account.
#
# ステータス: 承認待ち — adr/0024 のドラフト改訂(未マージ・frontmatter は status: 提案中)が重なっている。**adr/0025 の改訂は 2026-08-24 に PR #156 のマージをもって承認済み**（ADR-0035 方式(i)）であり、契約・実装・テストが同一スライスで main に載っている。以下の「未承認」の記述は adr/0024 の分にのみ掛かる。承認方式
#   はいずれもADR-0035の(ii)（記録のみ・承認は後日）。人間は adr/0024 の改訂をまだ承認していない。**TDR-GTH向けの2026-08-30追補（下記）も未承認（ADR-0035方式(ii)、ADR-0037起草）。**
#
# 以下は2026-08-12に承認済み(PR #90、adr/0023)だったv1.0.2の内容である。この上に2026-08-14の
# adr/0024ドラフト差分、続けて2026-08-20のadr/0025ドラフト差分（いずれも下記ブロック）が重なる。
#
# ステータス（v1.0.2、承認済み）: 承認済み(2026-08-12) — approved by merging PR #90 (meta/adr/0035 mode (i)).
# 2026-08-10 起草 (adr/0023): NORMAL_WITH_REPEAT is
# removed (the previously-shown-candidate demotion mechanism it supported is
# retired, adr/0023 decision 5) and replaced by NORMAL_WITH_POOL, which
# supplies a synthetic population large enough to make randomized pool
# sampling observable and includes at least one candidate with a null
# non_smoking/card/budget reference so TDR-CS-13's ordering rule is
# deterministically exercised even though currently measured real data has no
# such null. INVALID_REPROPOSAL_KIND is removed (TDR-CS-07 retired; there is
# no "invalid lens" concept in a filter model). A new randomSeed property on
# CandidateProposalAcceptanceState pins the server's random pool-sampling
# source for subsequent /candidate-proposals calls; it is never exposed on
# the public candidate-search-api.yaml (adr/0023 decision 4).
# DEFAULT_EXCLUSION_VISIBLE and CARD_PAYMENT_CAUTION_VISIBLE provide the two
# deterministic displayed-result Givens required by TDR-CS-09 and TDR-CS-12;
# they remain synthetic acceptance-only population shapes and add no public
# identifier, location, distance, or ordering field (adr/0023 decision 13).
# ZERO_PENDING_MATCH and FALLBACK_PRESERVES_FILTERS provide seed-independent
# public-UI/API evidence for reviewer R5 without adding a public test hook or
# exposing an origin, distance, route, or internal order (adr/0023 decision 14).
#
# 2026-08-14 起草 (adr/0024、未承認):
# - NORMAL_WITH_POOL を NORMAL_WITH_WEIGHTED_SAMPLING へ改称する（テスト
#   インフラ限定の破壊的変更、adr/0024決定3）。近傍プールの固定サイズ
#   （推奨20）という前提が無くなったため、その前提に基づく記述を除き、
#   「母集団が表示上限5件を上回る」という条件へ言い換える。
# - GENRE_ORDER_BY_COUNT を新設する。ジャンルの提示順が件数降順（同数の
#   ときだけ現行の文字数昇順→ja-locale照合順のtie-break）であることを、
#   特定のジャンル文字列やseedに依存せず決定的に観測するためのGiven
#   （adr/0024決定1）。
# - SHOWN_POOL_PRIORITY を新設する。shownProviderPageUrls・
#   shownPoolExhaustedに基づく未表示優先の3つの集合所属性質
#   （candidate-search-browser-interface.yamlのproposal.shownPoolPriority）
#   を決定的に観測可能にする（adr/0024決定4、TDR-CS-14）。
#
# 2026-08-14 追補 (adr/0024 決定4項目8、未承認・本ファイルへの変更なし):
# shownCandidateMemoryの24時間以下の保持期限（Hot Pepper利用規約対応）は、
# 完全にブラウザ側sessionStorageの責務であり、サーバはshownProviderPageUrls
# の各要素がいつ保存されたかを一切知らない。したがって本ファイルへ専用の
# Givenを追加する必要はないと判断した——決定的な観測はL4がブラウザ層へ
# 直接、期限切れ相当のタイムスタンプを持つ既知のproviderPageUrl（例えば
# SHOWN_POOL_PRIORITYモードが返す候補）を注入して行う。判断の理由は
# adr/0024決定4「期限切れの検証」を参照。
#
# 2026-08-20 起草 (adr/0025、未承認、本ファイルはこのドラフトを反映する):
# - candidate-search-api.yaml v1.2.0で`CandidateProposalResponse.searchOrigin`
#   と`Candidate.walkingTimeMinutes`が新規必須フィールドになったため、既存の
#   すべてのmodeが返す合成レスポンスもこれらを満たす必要がある。ただし
#   `searchOrigin`の値そのものをこのGiven APIで選択可能にする必要はないと
#   判断した——L4は「地図上の検索基点マーカーが、その回のレスポンスの
#   `searchOrigin`と一致するか」という自己整合性だけを検証すれば足り
#   （TDR-CS-01・02）、独立に既知の定数と突き合わせる必要が無いため。既存
#   modeの説明文で`walkingTimeMinutes`の具体値まで規定する必要があるのは、
#   新設のWALKING_TIME_LIMIT_EXCLUDESだけである——他の既存TDR-CSシナリオは
#   徒歩時間の値そのものを主張しないため。
#   **2026-08-24 訂正（下記の同日追記を参照）: 「自己整合性だけを検証すれば
#   足りる」という上記の判断は誤りだった。**
# - WALKING_TIME_LIMIT_EXCLUDES を新設する。TDR-CS-15（徒歩の上限による
#   絞り込み、adr/0025決定3）の決定的Given。しきい値ちょうどの境界と、
#   しきい値超過の両方を、任意のrandomSeedで確定的に観測できるようにする。
# - 既存mode（NORMAL_WITH_WEIGHTED_SAMPLING等）の合成`walkingTimeMinutes`
#   値そのものはこのファイルでは規定しない——実装が任意の正の整数を割り
#   当てれば足り、どのTDR-CSシナリオもその具体値を主張しないため。
#
# 2026-08-23 起草 (人間裁定、未承認、本ファイルはこの追補を反映する):
# - RATE_LIMITED_AFTER_INITIAL_SUCCESS を新設する。TDR-CS-16（人間裁定
#   2026-08-23: 候補の取得に失敗しても直前まで表示していた候補を残す）の
#   決定的Given。既存の`mode`は1回のacceptanceシナリオを通じて単一の状態
#   しか表さないため（"lasts only for the current isolated acceptance
#   scenario"）、「最初の1回は成功、以降は失敗」という2段階の挙動には
#   新しい専用modeが要ると判断した——シナリオ実行中に
#   setCandidateProposalAcceptanceStateを2度呼んで状態遷移させる技法は
#   本ファイルに前例がなく、architectが無断で新しい技法を持ち込むより、
#   既存のmode列挙の流儀（1つのmodeで1つの決定的シナリオ形状を表す）を
#   踏襲する方が実装への申し送りとして明確だと判断した。原因は
#   RATE_LIMITED（429）に固定した——TDR-CS-16の業務規則（既に表示中の
#   候補は取得失敗時も残る）は失敗の原因（429/503）に依存せず、
#   429と503を画面で区別するかどうかはproduct-brief.md §8がなお未決と
#   している別の論点である（design/wireframes/README.mdのD1）。
#
# 2026-08-24 追記 (architect、独立監査F1・friction-log FR-022の4回目への対応):
# - `CandidateProposalAcceptanceState`に`searchOrigin`（新規任意プロパティ、
#   nullable、緯度経度）を新設する。省略時（既定）は従来どおり実装が選ぶ
#   合成定数（例: (0.0, 0.0)）を返してよく、既存の全acceptanceシナリオの
#   挙動は無変更のまま保たれる。指定した場合、当該Given状態が有効な間の
#   `/candidate-proposals`応答の`searchOrigin`はこの値と厳密に一致しなければ
#   ならない。
# - mode節の説明文から「`searchOrigin`の値そのものをこのGiven APIで選択可能
#   にする必要はないと判断した…自己整合性だけを検証すれば足り…独立に既知の
#   定数と突き合わせる必要が無い」という記述を削除する。**この記述は
#   誤りだった。** 独立監査
#   （`reviews/audit-tdr-cs-origin-marker-position.md`、F1）が指摘した
#   とおり、`searchOrigin`が全14箇所・全モードで単一の共有定数
#   （`src/dining_radar/suggestions/acceptance_state.py`の
#   `_ORIGIN = Origin(latitude=0.0, longitude=0.0)`）である限り、応答と
#   DOM属性の自己整合性チェックは「正しく配線された実装」と「`0`/`0`を
#   決め打ちした実装」を区別できない——両方とも同じ固定値から来るため常に
#   一致する。`candidate-search-browser-interface.yaml`の
#   `searchOriginMarker.presenceRule`が要求する「マーカーの位置が応答由来
#   であり独立に知られた定数ではないことの証明」は、このGiven APIが
#   `searchOrigin`を選択可能にして初めて成立する——選択せず既定値のまま
#   検証しても、その検証は偽陽性を許す。TDR-CS-01/TDR-CS-02（またはこの
#   性質を検証する既存・新規シナリオ）は、既定値ではない`searchOrigin`を
#   このプロパティで明示的に選び、DOM属性がその値と一致することを検証
#   しなければならない。detailはadr/0027の2026-08-24追記2を参照。
#
# 2026-08-30 追補 (architect、adr/0037。TDR-GTH-01〜20向けのacceptance seam拡張。未承認):
# - **方針**: 会・候補日・参加者リンク・出欠回答のGiven状態は、原則として公開境界
#   （gathering-scheduling-api.yamlのcreateGathering・addCandidateDate・issueParticipantLinks・
#   setScheduleResponse・setParticipantDisplayName・confirmCandidateDate・revokeParticipantLink・
#   recopyParticipantLink・listParticipantLinks）を直接呼んで組み立てる——このために新しい
#   test-support seamは1つも追加しない（meta/verification.md L4詳細:「状態の準備・検証はSUTの
#   公開境界経由で行う。DB直接操作はGiven専用のseamとして明示的に定義した箇所のみ許可」）。
#   TDR-AUTHが公開サインアップの不在ゆえに`setAuthenticationAcceptanceAccount`等の専用seamを
#   要したのと対照的に、TDR-GTHの資源（会・候補日・リンク・回答）はすべて公開APIから作成できる
#   ため、専用seamは真に公開境界で作れないもの（下記の2例外と、母集団の共有）に限定した
#   （adr/0037決定1）。
# - **署名付きリンクのtokenは、issueParticipantLinks/recopyParticipantLinkの応答からそのまま
#   読み取って使う**。test-support側でtokenを予測可能にする、または固定値を割り当てるという
#   設計は採らない——本番のトークン生成経路（推測不能性を要求するadr/0035決定4）を、acceptance
#   用にだけ弱めたり分岐させたりする理由が無いためである（adr/0037決定4）。
# - 例外は2つだけ。(1) 有効期限90日の実際の経過を待てないため、`seedExpiredParticipantLink`で
#   既発行のtokenを即座に期限切れ状態にする——`seedThrottledSignInAttempt`（TDR-AUTH-07）と同じ
#   流儀で、実際の日数・閾値は公開しない。(2) レート制限も同じ理由で
#   `seedRateLimitedParticipantLink`を新設する。**90日という具体的な日数・レート制限の閾値そのもの
#   が正しく設定されているかどうかはL1（developerの単体テスト）の責務であり、本ファイルのseamは
#   「期限切れ／レート制限に達した場合の応答がLINK_EXPIRED/LINK_RATE_LIMITEDになる」という
#   ビヘイビアだけを決定的に検証する**（meta/verification.mdのL1/L4分担、adr/0037決定2）。
# - `resetGatheringSchedulingAcceptanceState`を新設し、TDR-GTH全シナリオの前に呼んでシナリオを
#   独立させる（TDR-AUTH・TDR-CSそれぞれの既存resetと同じ設計、ドメインごとに別々のリセットを持つ）。
# - 「その日に開いている店 N件」（TDR-GTH-08・09）は、gathering-scheduling-api.yaml自身が
#   「openShopCountの母集団はcandidate-search-api.yamlと同じ非公開検索基点の母集団」と明記して
#   いるとおり、既存の`CandidateProposalAcceptanceState`（`setCandidateProposalAcceptanceState`）を
#   再利用する——新しいエンドポイントを立てず、本番で共有されているのと同じ1つの母集団制御経路に
#   相乗りする（adr/0037決定3）。新設mode `GATHERING_OPEN_SHOP_WEEKDAY_MATCH` を追加する——既存の
#   全candidateが一律`regularHoliday="日曜・祝日"`である現行の合成母集団
#   （`src/dining_radar/suggestions/acceptance_state.py`の`_synthetic_candidate`）とは別に、単一
#   曜日・複数曜日・不定休・null（未確認）を作り分けた6件の母集団を新設し、候補日の曜日ごとに
#   厳密な既知件数（月5/火5/水4/木6/金6/土6/日5）を持つ。既存モードの挙動・既存TDR-CSシナリオの
#   観測結果は一切変えない（追加のみ）。曜日照合アルゴリズム自体の網羅的な単体検証（否定表現
#   「水曜以外」等の限界事例を含む）はL1の責務であり、本seamは母集団→API応答の配線を代表的な
#   数ケースで決定的に検証するにとどめる。
#
# 2026-09-04 追補 (architect、ADR-0043。tester報告、軽微・文書の陳腐化のみ):
# - `resetGatheringSchedulingAcceptanceState`・`setCandidateProposalAcceptanceState`・
#   `resetCandidateProposalAcceptanceState`の`x-acceptance-scenarios`が、ADR-0040〜0042で
#   追加したTDR-GTH-26〜36を反映していなかった——これらのシナリオは新しいseamを要さず（ADR-0040
#   決定1・adr/0037決定1の「公開境界経由で組み立てる」方針をそのまま踏襲する）、既存のリセット・
#   母集団seamをそのまま再利用しているだけなので機能的な変更は無い。列挙を最新化し、
#   `info.description`のシナリオ範囲表記も揃えた。TDR-GTH-26/27（5件選定・その日に開いている店
#   だけが選べること）は`GATHERING_OPEN_SHOP_WEEKDAY_MATCH`が定めるのと同じ母集団・同じ
#   `previewOpenShopsForCandidateDate`配線を経由するため、`setCandidateProposalAcceptanceState`/
#   `resetCandidateProposalAcceptanceState`の一覧にも追加した。
#
# 2026-09-04 追補2 (architect、ADR-0044。本番の実機フィードバック3点への対応。TDR-GTH-37〜40の
#   一覧登録のみ——いずれも新しいseamを要さない):
# - TDR-GTH-37（参加者の店の並びは投票しても変わらない）は`resetGatheringSchedulingAcceptanceState`
#   だけに追加した——公開境界（setShortlistedShops・setShopVotes）だけで組み立てられ、
#   `CandidateProposalAcceptanceState`側の特定modeを必要としない。
# - TDR-GTH-38（幹事の選定画面に地図と店の情報が示される）・TDR-GTH-39（参加者の投票画面に
#   同じ情報が示される）は、`gathering-scheduling-api.yaml`が2026-09-04に`OpenShopPreviewItem`・
#   `ShortlistedShop`・`ParticipantShopVoteOption`へ追加した`location`/`walkingTimeMinutes`/
#   `providerPageUrl`を検査する。**これらのフィールドに新しい合成データは要らない**——
#   `candidate-search-api.yaml`はADR-0025以来、すべてのmodeで`Candidate.location`/
#   `walkingTimeMinutes`/`providerPageUrl`を非null・schema準拠で返すことを既に要求しており、
#   `GATHERING_OPEN_SHOP_WEEKDAY_MATCH`を含むどのmodeの合成候補も同じ共有ファクトリ
#   （`acceptance_state.py`の`_synthetic_candidate`）から作られる。TDR-GTH-26/27と同じ population
#   （`GATHERING_OPEN_SHOP_WEEKDAY_MATCH`）を選ぶことで、これらのフィールドの**存在**（具体的な
#   数値・座標そのものではない）を決定的に検査できる。`setCandidateProposalAcceptanceState`/
#   `resetCandidateProposalAcceptanceState`の一覧へ追加し、
#   `resetGatheringSchedulingAcceptanceState`にも追加した。
# - TDR-GTH-40（幹事は店ごとの三段階の内訳を見て確定する店を選ぶ）は参加者の投票結果（票数）を
#   検査するものであり、特定の候補母集団modeには依存しない——`resetGatheringSchedulingAcceptanceState`
#   にのみ追加した。
# - `info.description`のシナリオ範囲表記を「TDR-GTH-01 through TDR-GTH-40」へ揃えた。
openapi: 3.0.3
info:
  title: Dining Radar acceptance test-support API
  version: 1.5.2
  description: >-
    Acceptance-only setup and reset seams for TDR-AUTH-01 through TDR-AUTH-07,
    TDR-CS-00 through TDR-CS-16, and TDR-GTH-01 through TDR-GTH-40.
    Browser actions and outcomes under test must use the public same-origin
    authentication, candidate-search, and gathering-scheduling boundaries;
    these operations are only for deterministic Given state and scenario
    isolation. Most TDR-GTH Given state is built by calling
    gathering-scheduling-api.yaml's own public operations directly (adr/0037
    decision 1) -- this file adds seams only for the handful of states that
    boundary alone cannot reach (link expiry, link rate-limiting) and for the
    population TDR-GTH's open-shop-count feature shares with TDR-CS. This
    also holds for the shortlist/vote/finalize scenarios TDR-GTH-26 through
    TDR-GTH-36 add (ADR-0040/0041/0042) and for TDR-GTH-37 through TDR-GTH-40
    add (adr/0044, a stable participant shop order, a three-tier vote, and
    shop map/detail information) -- none of them required a new seam.
paths:
  /test-support/candidate-proposals/state:
    put:
      operationId: setCandidateProposalAcceptanceState
      summary: Select one deterministic synthetic candidate-proposal state
      description: >-
        Selects the candidate-proposal state, and optionally a random-pool
        seed, that the next public /candidate-proposals operation(s) observe.
        It supplies no provider-format payload and accepts no location,
        coordinate, provider identifier, credential, real URL, or
        browser-visible candidate data. The selected state lasts only for the
        current isolated acceptance scenario and is reset by
        resetCandidateProposalAcceptanceState. Also governs the population
        gathering-scheduling-api.yaml's previewOpenShopsForCandidateDate and
        ParticipantScheduleQuestion.openShopCount read (adr/0037 decision 3)
        -- a TDR-GTH-08/09/26/27/38/39 scenario selects
        GATHERING_OPEN_SHOP_WEEKDAY_MATCH here in addition to any
        gathering-scheduling-api.yaml calls it makes (TDR-GTH-26/27 added
        2026-09-04, adr/0043, documentation freshness only; TDR-GTH-38/39
        added 2026-09-04, adr/0044, to check for the presence of
        OpenShopPreviewItem/ParticipantShopVoteOption's new
        location/walkingTimeMinutes/providerPageUrl fields -- these
        scenarios reuse this same seam and population unchanged, since
        candidate-search-api.yaml has required these fields non-null under
        every mode since adr/0025, well before this round).
      x-acceptance-scenarios:
        [TDR-CS-01, TDR-CS-02, TDR-CS-03, TDR-CS-04, TDR-CS-05, TDR-CS-06,
         TDR-CS-08, TDR-CS-09, TDR-CS-10, TDR-CS-11, TDR-CS-12, TDR-CS-13,
         TDR-CS-14, TDR-CS-15, TDR-CS-16, TDR-GTH-08, TDR-GTH-09,
         TDR-GTH-26, TDR-GTH-27, TDR-GTH-38, TDR-GTH-39]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProposalAcceptanceState'
      responses:
        '204':
          description: The requested synthetic candidate-proposal state is active.
    delete:
      operationId: resetCandidateProposalAcceptanceState
      summary: Reset candidate-proposal state owned by the acceptance harness
      description: >-
        Removes only the selected synthetic candidate-proposal state
        (including any pinned randomSeed) and any scenario-local request
        counter. It does not read, write, or reset a provider, configured
        search origin, credential, runtime secret, browser storage, real
        account, gathering-scheduling data (see
        resetGatheringSchedulingAcceptanceState for that separate domain), or
        production/deployment setting.
      x-acceptance-scenarios:
        [TDR-CS-00, TDR-CS-01, TDR-CS-02, TDR-CS-03, TDR-CS-04, TDR-CS-05,
         TDR-CS-06, TDR-CS-08, TDR-CS-09, TDR-CS-10, TDR-CS-11, TDR-CS-12,
         TDR-CS-13, TDR-CS-14, TDR-CS-15, TDR-CS-16, TDR-GTH-08, TDR-GTH-09,
         TDR-GTH-26, TDR-GTH-27, TDR-GTH-38, TDR-GTH-39]
      responses:
        '204':
          description: Candidate-proposal acceptance state is reset.
  /test-support/authentication-state:
    delete:
      operationId: resetAuthenticationAcceptanceState
      summary: Reset only authentication state owned by the acceptance harness
      description: >-
        Removes every synthetic account created through this contract, all of
        their sessions, and all failed-sign-in/throttle state seeded or produced
        during the acceptance test. It does not read, write, or reset provider
        data, candidate data, private runtime settings, runtime secrets, or
        accounts outside the acceptance configuration. Call before each
        authentication scenario to keep scenarios independent.
      x-acceptance-scenarios:
        [TDR-AUTH-01, TDR-AUTH-02, TDR-AUTH-03, TDR-AUTH-04, TDR-AUTH-05,
         TDR-AUTH-06, TDR-AUTH-07]
      responses:
        '204':
          description: The acceptance authentication state is reset. No response body is returned.
  /test-support/authentication/accounts/{accountRef}:
    put:
      operationId: setAuthenticationAcceptanceAccount
      summary: Create or replace one synthetic organizer account for a Given state
      description: >-
        Sets the exact synthetic account state for accountRef. A missing account
        is created; an existing synthetic account is replaced with the supplied
        login identifier, password, and active state. When isActive is false,
        any session already associated with that synthetic account must cease to
        authorize protected use after this operation completes. Password is
        write-only and must not appear in a response, log, trace, fixture, or
        browser-visible output.
      x-acceptance-scenarios: [TDR-AUTH-02, TDR-AUTH-04, TDR-AUTH-05, TDR-AUTH-07]
      parameters:
        - name: accountRef
          in: path
          required: true
          description: >-
            An opaque synthetic scenario label, not a real name, email address,
            provider identifier, or browser-facing account value.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceAccountState'
            example:
              loginIdentifier: synthetic-organizer-a
              password: synthetic-password-only
              isActive: true
      responses:
        '204':
          description: The requested synthetic account state is now in effect. No response body is returned.
  /test-support/authentication/login-throttle:
    post:
      operationId: seedThrottledSignInAttempt
      summary: Seed a deterministic throttled sign-in Given state
      description: >-
        Seeds failed-sign-in state for loginIdentifier so that the next browser
        sign-in attempt using exactly that identifier is throttled by the
        application's normal sign-in protection, regardless of the supplied
        credential. It does not return the configured attempt count, time
        window, delay, account existence, or account status. This seam lets L4
        verify TDR-AUTH-07 without encoding an operational throttle threshold
        or depending on elapsed time.
      x-acceptance-scenarios: [TDR-AUTH-07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThrottledSignInState'
            example:
              loginIdentifier: synthetic-throttled-visitor
      responses:
        '204':
          description: The next matching browser sign-in attempt will be throttled. No response body is returned.
  /test-support/authentication/security-boundary:
    get:
      operationId: getAuthenticationAcceptanceSecurityBoundary
      summary: Observe the effective acceptance-profile authentication boundary
      description: >-
        Returns the security-relevant values effectively applied by the running
        acceptance configuration. It exists only so L3 can verify the local
        exception and the remaining browser-security invariants without
        representing local HTTP as public HTTPS transport. It must be derived
        from active configuration, not a fixture or a duplicated expected value.
        It never returns a secret, cookie value, account, private origin,
        provider data, or production/deployment configuration.
      x-acceptance-scenarios: [TDR-AUTH-06]
      responses:
        '200':
          description: Effective acceptance-profile security-boundary values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceSecurityBoundary'
              example:
                profile: acceptance
                transport: HTTP_LOCAL_ONLY
                sessionCookie:
                  secure: false
                  httpOnly: true
                  sameSite: Lax
                csrfProtectedOperations:
                  [SIGN_IN, SIGN_OUT, CHANGE_PASSWORD, CANDIDATE_PROPOSAL]
                credentialedArbitraryOriginCorsAllowed: false
                browserLocalStorageBearerTokenUsed: false
  /test-support/gathering-scheduling-state:
    delete:
      operationId: resetGatheringSchedulingAcceptanceState
      summary: Reset only gathering-scheduling state owned by the acceptance harness
      description: >-
        Removes every synthetic gathering, candidate date, participant link
        (including any state seeded by seedExpiredParticipantLink or
        seedRateLimitedParticipantLink), schedule response, shortlisted shop,
        and shop vote created through gathering-scheduling-api.yaml's public
        boundary during acceptance testing. It does not read, write, or
        reset provider data, candidate-search acceptance state (see
        resetCandidateProposalAcceptanceState/setCandidateProposalAcceptanceState
        for that separate domain, which TDR-GTH-08/09/26/27/38/39 also depend
        on), private runtime settings, runtime secrets, or organizer
        accounts. Call before each TDR-GTH scenario to keep scenarios
        independent (mirrors resetAuthenticationAcceptanceState's role for
        TDR-AUTH).
      x-acceptance-scenarios:
        [TDR-GTH-01, TDR-GTH-02, TDR-GTH-03, TDR-GTH-04, TDR-GTH-05,
         TDR-GTH-06, TDR-GTH-07, TDR-GTH-08, TDR-GTH-09, TDR-GTH-10,
         TDR-GTH-11, TDR-GTH-12, TDR-GTH-13, TDR-GTH-14, TDR-GTH-15,
         TDR-GTH-16, TDR-GTH-17, TDR-GTH-18, TDR-GTH-19, TDR-GTH-20,
         TDR-GTH-21, TDR-GTH-22, TDR-GTH-23, TDR-GTH-24, TDR-GTH-25,
         TDR-GTH-26, TDR-GTH-27, TDR-GTH-28, TDR-GTH-29, TDR-GTH-30,
         TDR-GTH-31, TDR-GTH-32, TDR-GTH-33, TDR-GTH-34, TDR-GTH-35,
         TDR-GTH-36, TDR-GTH-37, TDR-GTH-38, TDR-GTH-39, TDR-GTH-40]
      responses:
        '204':
          description: Gathering-scheduling acceptance state is reset. No response body is returned.
  /test-support/gathering-scheduling/participant-links/expire:
    post:
      operationId: seedExpiredParticipantLink
      summary: Force one already-issued participant link into its expired state
      description: >-
        Given a token previously obtained from a public issueParticipantLinks
        or recopyParticipantLink response, marks it expired immediately, as
        if its validity period (adr/0035 decision 4) had already elapsed. It
        does not return, and this request does not need to know, the
        configured validity duration (currently 90 days, adr/0035 decision
        4 -- a value this seam deliberately does not encode, mirroring
        seedThrottledSignInAttempt's refusal to encode TDR-AUTH-07's actual
        threshold). This seam lets L4 verify TDR-GTH-14 (the participant
        view returns LINK_EXPIRED and the browser shows
        gathering-participant-link-error) without waiting for real elapsed
        time; whether the configured duration itself equals the intended
        value is verified independently at L1 against the application's
        actual configuration, not through this seam (meta/verification.md's
        L1/L4 split, adr/0037 decision 2). Does not affect
        Gathering.activeParticipantLinkCount, totalRevokedParticipantLinks,
        or hasResponded -- expiry and revocation are distinct states
        (gathering-scheduling-api.yaml's LINK_EXPIRED vs LINK_REVOKED).
      x-acceptance-scenarios: [TDR-GTH-14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantLinkTokenSeed'
      responses:
        '204':
          description: The named token is now expired for every subsequent participant-facing call. No response body is returned.
  /test-support/gathering-scheduling/participant-links/rate-limit:
    post:
      operationId: seedRateLimitedParticipantLink
      summary: Force the next participant-facing call for one link to be rate-limited
      description: >-
        Given a token previously obtained from a public issueParticipantLinks
        or recopyParticipantLink response, makes the next matching
        participant-facing request (getParticipantView, setScheduleResponse,
        or setParticipantDisplayName) against exactly that token return
        LINK_RATE_LIMITED (429), regardless of the supplied request body. It
        does not return the configured request-frequency threshold or time
        window (adr/0036 decision 7's securityObservations.participantAnswer.
        rateLimit already declares this contract fixes no numeric threshold).
        This seam lets L4 verify TDR-GTH-15's behavior (a rate-limited
        request is rejected and every previously recorded response/tally is
        retained) deterministically, the same way RATE_LIMITED/
        RATE_LIMITED_AFTER_INITIAL_SUCCESS let TDR-CS verify rate-limiting
        without depending on an actual request-frequency threshold. Whether
        the production threshold itself is well-chosen is outside this
        seam's concern (adr/0037 decision 2).
      x-acceptance-scenarios: [TDR-GTH-15]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantLinkTokenSeed'
      responses:
        '204':
          description: The next matching participant-facing request for this token will be rate-limited. No response body is returned.
components:
  schemas:
    CandidateProposalAcceptanceState:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum:
            [NORMAL_WITH_WEIGHTED_SAMPLING, DEFAULT_EXCLUSION_VISIBLE,
             CARD_PAYMENT_CAUTION_VISIBLE, ZERO_PENDING_MATCH,
             FALLBACK_PRESERVES_FILTERS, GENRE_ORDER_BY_COUNT,
             SHOWN_POOL_PRIORITY, WALKING_TIME_LIMIT_EXCLUDES,
             IZAKAYA_BAR_ONLY, NO_RESULTS,
             PROVIDER_UNAVAILABLE, RATE_LIMITED,
             RATE_LIMITED_AFTER_INITIAL_SUCCESS,
             GATHERING_OPEN_SHOP_WEEKDAY_MATCH]
          description: >-
            A closed synthetic state selection. Every mode's synthetic
            response satisfies candidate-search-api.yaml v1.2.0's schema in
            full, including its `searchOrigin` and per-candidate
            `walkingTimeMinutes` (adr/0025) -- these are present and
            well-formed under every mode below even where a mode's own
            description does not discuss their values, because no existing
            TDR-CS-00 through TDR-CS-14 scenario asserts a specific
            `searchOrigin` or `walkingTimeMinutes` value. `searchOrigin`'s
            value defaults to an implementation-chosen synthetic constant
            when the sibling `searchOrigin` property (below) is omitted --
            existing TDR-CS-00 through TDR-CS-14 scenarios that do not
            assert a specific `searchOrigin` value are unaffected by that
            property's existence. A scenario verifying
            candidate-search-browser-interface.yaml's
            searchOriginMarker.presenceRule (TDR-CS-01/TDR-CS-02) must
            instead set the `searchOrigin` property to a value it chooses,
            because a self-consistency check against the response alone
            cannot distinguish a correctly wired implementation from one
            that hardcodes the same fixed synthetic constant every mode
            previously always returned (independent-audit finding F1,
            reviews/audit-tdr-cs-origin-marker-position.md; friction-log
            FR-022's fourth occurrence -- see adr/0027's 2026-08-24
            addendum 2).

            NORMAL_WITH_WEIGHTED_SAMPLING
            (renamed from NORMAL_WITH_POOL, adr/0024 decision 3 -- the fixed
            near-distance pool it was named for no longer exists) supplies at
            least 40 lunch-eligible synthetic candidates in the default
            (non-excluded-genre) population -- comfortably exceeding the
            five-candidate display cap, so distance-weighted selection and
            its reproducibility under a pinned randomSeed are both
            observable. Its default population spans at least 3 distinct
            genre values (each with at least 2 members, so a genres filter
            narrows to a strict, non-trivial subset) and at least 2 distinct
            nonSmokingStatus values; it includes at least one candidate with
            cardPaymentAvailable false and at least one with true; it
            includes at least one candidate with a non-null dinnerBudgetTier
            and, distinctly, at least one candidate with a null value for at
            least one of nonSmokingStatus, cardPaymentAvailable, or
            dinnerBudgetTier, so TDR-CS-13's unconfirmed-information ordering
            rule is deterministically exercised (this null case is not
            currently observed in real Hot Pepper data, per adr/0023's
            measured-facts context, but the synthetic mode must still supply
            it as a safety-net path).

            DEFAULT_EXCLUSION_VISIBLE is the deterministic TDR-CS-09 Given.
            Its synthetic population contains both default-excluded and
            non-excluded genre categories. With semantically default filters,
            every displayed candidate has a genre whose populationAttributes
            rows classify it as defaultExcluded=false. With the otherwise
            same normalized filters and includeIzakayaBar=true, at least one
            displayed candidate has a genre classified as
            defaultExcluded=true. The population and internal relative
            ordering must make both display guarantees hold for every
            randomSeed; no candidate identity or location is added to
            populationAttributes.

            CARD_PAYMENT_CAUTION_VISIBLE is the deterministic TDR-CS-12 Given.
            Its default successful proposal displays at least one candidate
            with cardPaymentAvailable=false and at least one candidate whose
            value is true or null. Its eligible synthetic population is no
            larger than the display cap, so both observable states are
            displayed for every randomSeed rather than merely existing in a
            larger random pool.

            ZERO_PENDING_MATCH is the deterministic dirty-filter count Given.
            Its non-empty, non-excluded default population has no null
            card-payment or dinner-budget value. At least one row matches
            cardPaymentOnly=true and at least one row has dinnerBudgetTier=LOW,
            but no row matches both. Therefore the UI-selectable pending
            combination cardPaymentOnly=true plus budgetTiers=[LOW] has an
            exact population count of zero for every randomSeed, while each
            control is independently meaningful. The public browser must
            expose candidate-filter-apply with data-match-count="0" and keep
            it disabled; this mode does not accept or return a count override.

            FALLBACK_PRESERVES_FILTERS is the deterministic TDR-CS-10 boundary
            Given. Its non-excluded population has no row matching the
            combination nonSmokingOnly=true, cardPaymentOnly=true, and
            budgetTiers=[LOW]. Its default-excluded population has at least
            one confirmed row matching all three and, separately, at least
            one confirmed non-matching row for each active soft filter; none
            of these proof rows has a null soft-filter value. The all-matching
            fallback-eligible set is no larger than the display cap. Thus a
            public request with that combination and includeIzakayaBar=false
            deterministically returns izakayaBarFallbackApplied=true and only
            candidates that match all three selected soft filters, for every
            randomSeed. populationAttributes proves that confirmed
            non-matching default-excluded rows existed but were not admitted;
            no identity join, location, distance, or internal order is
            exposed.

            The same mode also has exactly one non-excluded genre in
            availableGenres, and every candidate of that genre has confirmed
            nonSmokingStatus=NONE. A public request selecting that offered
            genre plus nonSmokingOnly=true deterministically returns an empty
            candidates array with izakayaBarFallbackApplied=false even though
            default-excluded FULL rows exist. This separately proves that the
            fallback does not loosen an explicit genres filter.

            GENRE_ORDER_BY_COUNT is the deterministic genre-presentation-order
            Given (adr/0024 decision 1). Its default (non-excluded) synthetic
            population spans exactly 5 distinct genre values, so
            genrePresentation's preview/overflow mechanics (adr/0023 decision
            12) and the new count-based order (adr/0024 decision 1) are both
            exercised together. Their populationAttributes counts, each
            restricted to defaultExcluded=false rows, are strictly shaped so:

            SHOWN_POOL_PRIORITY is the deterministic TDR-CS-14 Given
            (adr/0024 decision 4). Its default (non-excluded) synthetic
            population has exactly 10 lunch-eligible candidates with 10
            distinct providerPageUrl values and distinct internal distances,
            comfortably below any real population size, so
            shownProviderPageUrls set-membership can be checked exhaustively.
            For every randomSeed: a request with an empty or omitted
            shownProviderPageUrls returns 5 candidates and
            shownPoolExhausted=false; a request whose shownProviderPageUrls
            is exactly the 5 providerPageUrl values from any prior response
            against this mode returns shownPoolExhausted=false and exactly
            the other 5 candidates (those absent from shownProviderPageUrls),
            because the not-yet-shown partition's size exactly equals the
            display cap; a request whose shownProviderPageUrls is the union
            of all 10 providerPageUrl values this mode can return returns
            shownPoolExhausted=true, with candidates drawn from the full
            10-member population without regard to shownProviderPageUrls.
            This mode does not, by itself, exercise the partial case (1-4
            not-yet-shown members); that follows from the same
            set-membership properties
            (candidate-search-browser-interface.yaml's
            proposal.shownPoolPriority invariant) applied to any
            shownProviderPageUrls value the acceptance test constructs from
            previously observed providerPageUrl values, and does not require
            a dedicated fixture. This mode carries no timestamp/expiry
            concept of its own -- retention expiry (adr/0024 decision 4 item
            8) is entirely a browser-side sessionStorage concern
            (candidate-search-browser-interface.yaml's
            shownCandidateMemory.expiry) that this server-side Given does not
            need to model; a test exercising expiry seeds a stale timestamp
            directly into sessionStorage using providerPageUrl values this
            mode already returns.

            WALKING_TIME_LIMIT_EXCLUDES is the deterministic TDR-CS-15 Given
            (adr/0025 decision 3). Its eligible, non-excluded synthetic
            population is no larger than the display cap, so every member is
            displayed for every randomSeed without depending on selection
            (mirroring CARD_PAYMENT_CAUTION_VISIBLE's approach, rather than
            NORMAL_WITH_WEIGHTED_SAMPLING's large-population approach). This
            mode fixes a synthetic walking-time limit value of exactly 12 --
            an arbitrary synthetic minute count chosen only for test
            determinism, not a claim about the real product's eventual
            offered walkingTimeMaxMinutes presets (those remain
            UI-implementation-owned and unfixed by candidate-search-api.yaml,
            see CandidateFilters.walkingTimeMaxMinutes). Against that fixed
            limit, the population supplies: at least one candidate with
            walkingTimeMinutes strictly less than 12; at least one candidate
            with walkingTimeMinutes exactly equal to 12 (the boundary --
            "greater than the maximum" excludes only strictly-greater
            values, so this candidate must remain eligible); and at least
            one candidate with walkingTimeMinutes strictly greater than 12.
            A public request with filters.walkingTimeMaxMinutes=12
            deterministically returns every candidate at or below the limit
            (including the boundary candidate) and excludes every candidate
            above it, for every randomSeed, since the eligible set is no
            larger than the display cap. The same request with
            walkingTimeMaxMinutes omitted or null deterministically returns
            every eligible candidate regardless of walkingTimeMinutes. This
            mode does not exercise PopulationAttribute.walkingTimeBand's
            bucketing beyond what the public schema already requires it to
            carry -- the browser's local match-count prediction accuracy for
            a pending walkingTimeMaxMinutes selection is verified
            independently at L1 against the pure recommendation module, not
            through this acceptance-only seam.

            RATE_LIMITED_AFTER_INITIAL_SUCCESS is the deterministic TDR-CS-16
            Given (human decision 2026-08-23: a fetch failure that follows an
            already-displayed proposal must retain that proposal rather than
            replace or clear it). The first public /candidate-proposals
            request the acceptance test issues under this mode -- whichever
            trigger it uses, including the initial screen open -- returns a
            normal successful proposal from a small, deterministic synthetic
            population no larger than the display cap (mirroring
            CARD_PAYMENT_CAUTION_VISIBLE's approach), so the candidates and
            their card/marker correspondence are known before the failure.
            Every subsequent public /candidate-proposals request against this
            same acceptance state -- from either applyFilters or searchAgain
            -- returns the same problem response RATE_LIMITED already
            defines (429, PROPOSAL_RATE_LIMITED), for every randomSeed. This
            mode fixes the reported cause as rate-limiting only for test
            determinism: TDR-CS-16's business rule (candidates already on
            screen survive a fetch failure) does not depend on which failure
            cause the server reports, and whether 429 and 503 are ever
            distinguished on screen remains a separate, still-open question
            product-brief.md §8 does not answer.

            IZAKAYA_BAR_ONLY supplies only synthetic
            candidates in the default-excluded genre category, so the
            default (includeIzakayaBar=false) request yields izakayaBar
            FallbackApplied=true rather than an empty result (TDR-CS-10);
            this is distinct from NO_RESULTS, which supplies no
            lunch-eligible candidate at all. NO_RESULTS supplies a
            successful empty-candidates result. PROVIDER_UNAVAILABLE and
            RATE_LIMITED each produce the corresponding public problem
            response for every request in the scenario; RATE_LIMITED_AFTER_
            INITIAL_SUCCESS above is the sole exception, where only the
            first request succeeds. Synthetic display
            data is implementation-owned, deterministic (given a fixed
            randomSeed), and must satisfy the candidate-search API schema
            without using real provider data.

            GATHERING_OPEN_SHOP_WEEKDAY_MATCH is the deterministic TDR-GTH-08/
            09/26/27/38/39 Given (adr/0035 decision 6, adr/0037 decision 3;
            TDR-GTH-26/27 reuse it unchanged, adr/0043; TDR-GTH-38/39 reuse
            it unchanged, adr/0044). Every other mode above fixes
            `regularHoliday="日曜・祝日"` for every synthetic candidate (a
            single shared factory in acceptance_state.py) -- adequate for
            TDR-CS, which never reads regularHoliday's text for business
            logic, but insufficient to exercise
            gathering-scheduling-api.yaml's weekday-matching soft filter
            (CandidateDateOpenShopPreview.openShopCount /
            ParticipantScheduleQuestion.openShopCount) across more than one
            weekday and one confirmed-closure shape. This mode instead
            supplies exactly 6 lunch-eligible synthetic candidates, all in
            one non-default-excluded genre (so izakaya/bar fallback logic
            never interferes with the counts below), each with a distinct
            regularHoliday value chosen to exercise a different matching
            shape: one confirmed closed only on 月 (Monday), one confirmed
            closed only on 水 (Wednesday), one confirmed closed on both 火
            and 水 (Tuesday and Wednesday, in one string -- proving the
            matcher scans for any contained weekday character, not only a
            single leading one), one confirmed closed on 日 (Sunday, using
            the same "日曜・祝日" text every other mode already uses, so this
            mode also proves compatibility with that existing shape), one
            with regularHoliday="不定休" (irregular, no weekday character --
            must remain uncounted as closed on every weekday, per ADR-0023
            decision 2's soft-filter philosophy applied to this feature), and
            one with regularHoliday omitted entirely (null -- must likewise
            remain uncounted as closed on every weekday). Distinct latitude
            values (this module's existing proximity-approximation
            convention, longitude fixed at 0.0) give every candidate a
            distinct, deterministic distance from the search origin, so
            CandidateDateOpenShopPreview.previewShops' nearest-first order is
            also deterministic. Against a candidate date whose weekday an
            acceptance test chooses (by constructing
            gathering-scheduling-api.yaml's CandidateDateInput.startAt for a
            known day of the week), this mode's population yields an exact,
            known openShopCount for every day: 5 on Monday (only the 月
            candidate excluded), 5 on Tuesday (only the 火/水 candidate), 4
            on Wednesday (both the 水-only and the 火/水 candidates), 6 on
            Thursday, Friday, and Saturday (no candidate's regularHoliday
            contains 木, 金, or 土), and 5 on Sunday (only the 日 candidate).
            This mode does not itself re-verify the weekday-matching
            algorithm's handling of every possible free-text shape
            (including negated phrasing such as "水曜以外" that a
            substring-only matcher could misread) -- that exhaustive,
            mutation-tested coverage is L1's responsibility
            (meta/verification.md); this seam verifies only that the
            population-to-response wiring for a representative confirmed,
            multi-weekday, and unconfirmed case is correct end to end.
            TDR-GTH-26 (shortlisting from this same population) and
            TDR-GTH-27 (a closed-on-that-day shop must not be selectable)
            read the shopId this mode's candidates carry via
            OpenShopPreviewItem.shopId (gathering-scheduling-api.yaml,
            adr/0042) the same way TDR-GTH-08/09 read their display fields
            -- no additional seed data was needed for this round (adr/0043).
            TDR-GTH-38/39 (adr/0044, 2026-09-04) read this same population's
            `location`/`walkingTimeMinutes`/`providerPageUrl` values via
            OpenShopPreviewItem/ParticipantShopVoteOption -- again no
            additional seed data was needed, since every synthetic candidate
            this shared factory produces has already carried these fields
            (non-null, schema-valid) since adr/0025, for candidate-search-
            api.yaml's own sake, well before gathering-scheduling-api.yaml
            started reusing them this round.
        randomSeed:
          type: integer
          nullable: true
          description: >-
            Pins the server's random selection source (adr/0023 decision 4,
            adr/0024 decision 3) for every /candidate-proposals call made
            while this state is active. Two calls with the same randomSeed,
            the same mode, semantically equivalent filters after
            candidate-search API default normalization, and the same
            shownProviderPageUrls must return byte-identical candidates
            arrays in the same order. Two calls with different randomSeed
            values, the same mode, semantically equivalent normalized
            filters, and the same shownProviderPageUrls must return different
            candidates arrays whenever the eligible not-yet-shown population
            exceeds the five-candidate display cap (guaranteed reachable
            under NORMAL_WITH_WEIGHTED_SAMPLING; this replaces the former
            "exceeds the implementation's pool size" condition now that no
            fixed pool size exists, adr/0024 decision 3). Omit or set to
            null for non-deterministic sampling matching production
            behavior; this property is never exposed on the public
            candidate-search-api.yaml and the production browser has no way
            to send it. GATHERING_OPEN_SHOP_WEEKDAY_MATCH's population is no
            larger than the display cap and its openShopCount counting does
            not involve display-selection sampling, so randomSeed has no
            effect on the counts that mode documents.
        searchOrigin:
          type: object
          nullable: true
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
          description: >-
            Pins the synthetic `searchOrigin` every /candidate-proposals
            response returns while this state is active (adr/0025 decision
            1), independently of which mode is selected. Omit or set to
            null to use an implementation-chosen synthetic constant --
            every scenario's behavior from before this property existed is
            unaffected. A synthetic coordinate only: never a real search
            origin, and never read from or written to any runtime or
            production configuration (mirroring this file's existing
            never-touches-the-configured-search-origin boundary for
            resetCandidateProposalAcceptanceState above). Verifying that
            candidate-search-browser-interface.yaml's
            searchOriginMarker.presenceRule actually derives the map
            marker's position from the response, rather than from a
            fixture-baked or hardcoded value, requires setting this
            property to a value the acceptance test itself chooses --
            independent-audit finding F1
            (reviews/audit-tdr-cs-origin-marker-position.md) found that a
            self-consistency check against a single shared constant
            returned by every mode cannot make that distinction, because a
            hardcoded implementation and a correctly wired one are both
            indistinguishable against a fixed value.
    AcceptanceAccountState:
      type: object
      additionalProperties: false
      required: [loginIdentifier, password, isActive]
      properties:
        loginIdentifier:
          type: string
          minLength: 1
          description: >-
            Synthetic identifier supplied unchanged to the browser sign-in
            form. It is the known credential name for this scenario and must
            not be a real name or email address.
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: >-
            A synthetic acceptance-test credential. Password-policy selection is
            outside ADR-0006, so this acceptance-only seam must make the exact
            supplied value usable by the corresponding browser sign-in flow.
        isActive:
          type: boolean
          description: >-
            Whether this synthetic account may authorize protected use. False
            models the administrator-deactivated state; it does not disclose
            that state through a browser sign-in response.
    ThrottledSignInState:
      type: object
      additionalProperties: false
      required: [loginIdentifier]
      properties:
        loginIdentifier:
          type: string
          minLength: 1
          description: >-
            Synthetic identifier supplied unchanged to the subsequent browser
            sign-in form. It need not identify an existing account and must not
            be a real name or email address.
    AcceptanceSecurityBoundary:
      type: object
      additionalProperties: false
      required:
        [profile, transport, sessionCookie, csrfProtectedOperations,
         credentialedArbitraryOriginCorsAllowed,
         browserLocalStorageBearerTokenUsed]
      properties:
        profile:
          type: string
          enum: [acceptance]
        transport:
          type: string
          enum: [HTTP_LOCAL_ONLY]
          description: >-
            This is a local acceptance transport marker, never proof of public
            HTTPS. Actual HTTPS transport is verified only by the deployment
            slice under ADR-0007.
        sessionCookie:
          type: object
          additionalProperties: false
          required: [secure, httpOnly, sameSite]
          properties:
            secure:
              type: boolean
              enum: [false]
            httpOnly:
              type: boolean
              enum: [true]
            sameSite:
              type: string
              enum: [Lax, Strict]
        csrfProtectedOperations:
          type: array
          uniqueItems: true
          minItems: 4
          items:
            type: string
            enum: [SIGN_IN, SIGN_OUT, CHANGE_PASSWORD, CANDIDATE_PROPOSAL]
        credentialedArbitraryOriginCorsAllowed:
          type: boolean
          enum: [false]
        browserLocalStorageBearerTokenUsed:
          type: boolean
          enum: [false]
    ParticipantLinkTokenSeed:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: >-
            A signed participant-link token previously returned by a public
            issueParticipantLinks or recopyParticipantLink call
            (gathering-scheduling-api.yaml) during the current acceptance
            scenario. This seam never generates, predicts, or accepts a
            test-chosen token value of its own -- it only changes the state
            of a token the public boundary already issued (adr/0037 decision
            4). Supplying a token this acceptance run never issued is
            rejected the same way the corresponding public participant-facing
            operation would reject it (LINK_NOT_FOUND-equivalent failure);
            this seam does not itself return gathering or participant
            identity for an unknown token.
