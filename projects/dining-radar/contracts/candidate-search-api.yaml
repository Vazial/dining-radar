# Status: human content-approved in chat (2026-08-03 amendment; original
# approval 2026-08-01), made durable by merged PR #76.
# 2026-08-07 amendment: human review of a real Hot Pepper production run
# produced two product rules -- cap displayed candidates per concept at 5
# (a display cap over the ranked population, not a population-fetch limit),
# and exclude genres whose lunch service cannot be confirmed from returned
# provider fields (e.g. izakaya/bar) from the default candidate population
# unless the organizer selects a dedicated re-proposal lens for them. See
# adr/0015. This revision becomes durable when its PR merges.
# 2026-08-08 amendment (adr/0016): a second real-data review found
# GENRE_VARIETY converged to the same candidate set and order as PROXIMITY
# (genre-diverse ranking has no effect once the nearest candidates already
# span distinct genres), so it is removed from ConceptKind. reproposalKind
# may now also repeat the currently displayed proposal's own kind, to
# support a same-lens "try again" action that relies only on the existing
# current-screen repeat demotion (adr/0008 decision 2) rather than any new
# ranking criterion or randomness. Removing GENRE_VARIETY also resolves a
# capacity defect from adr/0015: with GENRE_VARIETY, five ConceptKind values
# minus the one displayed could exceed reProposalOptions.maxItems: 3,
# silently dropping IZAKAYA_BAR_INCLUDED; with four remaining kinds, at most
# three are ever offered, so no kind is ever dropped by this cap. This
# revision becomes durable when its PR merges.
# 2026-08-08 amendment #2 (adr/0017): a third real-data review found the
# "try again" action structurally unable to surface a new candidate --
# because adr/0015 already caps every response at exactly 5 candidates, the
# browser-only repeat demotion adr/0008 decision 2 established never had an
# unseen candidate to promote (the browser can only ever hold what it was
# just given, and it was never given more than the display cap). The
# browser may now echo back, on a re-proposal request, the providerPageUrl
# values of candidates it has already been shown in this screen's lifetime
# (a new optional previouslyShownProviderPageUrls request field); the server
# uses them only to demote matching candidates, in ranked order, before
# applying the existing 5-item display cap, and does not persist them. This
# amends adr/0008 decision 2 and the "never sends state back to the server"
# clause of decision 3; adr/0008's other decisions are unchanged (see
# adr/0017 for the full boundary and why this is not durable history). The
# same review also found business hours the single largest contributor to
# mobile card height (measured 55px of 345px, 50 characters); the organizer
# already cannot rely on it to infer real-time lunch availability (the
# provider's `open` field is unparseable free text and its `lunch` field
# only ever reports "available" once already lunch-filtered, per adr/0015),
# so it is removed from the candidate card and from this API's Candidate
# schema -- the server no longer returns it. The provider page link remains
# the authoritative source for hours. This revision becomes durable when its
# PR merges.
# 2026-08-09 amendment (adr/0019): a field survey across the same 64 live
# candidates found CAPACITY_REFERENCE and AMENITY_REFERENCE weak or
# unwanted as comparison lenses (the human: sorting by the exact seat count
# adds no value; AMENITY_REFERENCE's constituent fields other than
# non_smoking are sparse or unusable in real data), while genre and
# non-smoking status are well-populated and well-distributed. ConceptKind is
# regrouped to PROXIMITY, GENRE_FOCUS (new -- ranks only the single most
# common genre in the eligible population, a structural subset of
# PROXIMITY's population so it cannot reproduce GENRE_VARIETY's exact-match
# degeneracy), NON_SMOKING_REFERENCE (new, replacing AMENITY_REFERENCE --
# ranks primarily by non-smoking reference), and IZAKAYA_BAR_INCLUDED
# (unchanged); the total stays at four so reProposalOptions.maxItems: 3
# remains satisfied without change (adr/0019 decision 1, responding to the
# capacity-check follow-up recorded by adr/0016 decision 4). Candidate gains
# capacityTier (a coarse SMALL/MEDIUM/LARGE seating-scale reference derived
# from totalSeats, displayed instead of the raw number; it does not imply
# reservation ease or availability), nonSmokingStatus (the provider-supplied
# non-smoking reference), and cardPaymentAvailable (the provider-supplied
# credit-card-acceptance reference, surfaced only as a caution when false;
# it reflects card acceptance only, never a claim that a shop is
# cash-only). access is removed from Candidate entirely -- the map already
# shows shop location. This revision becomes durable when its PR merges.
# 2026-08-09 amendment #2 (adr/0019 decision 8, same-day correction): the
# first draft of this amendment rejected any dinner-budget display; the
# human, on re-confirmation after a reasoning error was found in that
# rejection, asked for a coarse staged display instead. Candidate gains
# dinnerBudgetTier (a coarse LOW/MID/HIGH dinner-price-range reference
# derived from the provider's budget data; null when not supplied). Its
# visible label must always state it is a dinner reference, and no
# rationale, label, or caution derived from it may state or imply a lunch
# price. It is never a ConceptKind or ranking input. This revision becomes
# durable when its PR merges.
openapi: 3.0.3
info:
  title: Toyama Dining Radar Candidate Proposal API
  version: 0.9.0
  description: >-
    Produces deterministic lunch-candidate concepts around one private
    runtime-configured location. The location, configured radius, credentials,
    provider identifiers, and provider images are never accepted or returned by
    this browser-facing API. A response is held in current browser memory only;
    it is not a provider-response cache or a durable search session. During one
    screen lifetime, the browser may retain a non-persistent shown-candidate
    comparison state (the providerPageUrl values of candidates it has been
    shown) and send it back on a re-proposal request so the server can lower
    the display priority of repeats in that one response (adr/0017); neither
    side persists this state beyond, respectively, current-screen memory and
    the single request being handled.
servers:
  - url: https://app.example.invalid
    description: >-
      Placeholder HTTPS public origin. The authentication and public-deployment
      slice selects and configures the real origin; browser access is same-origin.
paths:
  /candidate-proposals:
    post:
      operationId: proposeCandidates
      summary: Generate one displayed lunch-candidate proposal
      description: >-
        Performs one fresh Hot Pepper search and returns the initial deterministic
        proposal, or a newly chosen re-proposal lens, with its normalized candidate
        set. Opening the authenticated screen sends an empty request and displays
        the returned proposal immediately. Re-proposal is a separate fresh request
        after the browser presents the response's available lenses in a modal and
        the organizer selects one, or after the organizer asks to try the
        currently displayed lens again. The configured search origin and its
        exact radius are server-only and are not request parameters. For a
        re-proposal request, the browser may include the providerPageUrl values
        of candidates already shown in this screen's lifetime; the server uses
        them only to lower those candidates' selection priority in this one
        response's ranking, before its 5-item display cap, and does not persist
        them (adr/0017).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProposalRequest'
      responses:
        '200':
          description: >-
            A complete replacement displayed-proposal response. A null proposal
            is a successful no-match result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProposalResponse'
        '400':
          description: A browser-visible re-proposal lens is invalid or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              example:
                code: PROPOSAL_REPROPOSAL_KIND_INVALID
                message: This proposal lens is not available. Choose another one.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/RequestRejected'
        '429':
          $ref: '#/components/responses/ProposalRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  securitySchemes:
    organizerSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: >-
        Same-origin Django session cookie for an authenticated organizer. The
        authentication boundary in contracts/authentication-api.md defines
        login, logout, account lifecycle, cookie settings, and the decisions
        intentionally deferred from this API contract.
  parameters:
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
      description: >-
        Django CSRF token obtained by the same-origin browser. This header is
        required for this cookie-authenticated state-changing request.
  responses:
    AuthenticationRequired:
      description: The caller is not an authenticated organizer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Sign in is required to view candidate proposals.
    RequestRejected:
      description: The request did not pass the browser-session security check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: REQUEST_REJECTED
            message: The request could not be accepted. Refresh the page and try again.
    ProposalRateLimited:
      description: The organizer exceeded the allowed proposal request frequency.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Seconds before the browser may retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROPOSAL_RATE_LIMITED
            message: Too many proposal requests were made. Please try again shortly.
    ProviderUnavailable:
      description: Provider communication, authentication, rate limiting, or outage prevented completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROVIDER_UNAVAILABLE
            message: Candidate proposals cannot be retrieved right now. Please try again later.
  schemas:
    CandidateProposalRequest:
      type: object
      additionalProperties: false
      properties:
        reproposalKind:
          $ref: '#/components/schemas/ConceptKind'
          description: >-
            Omit when the authenticated screen first opens. For re-proposal,
            send exactly one kind: either one selected from the current
            response's reProposalOptions (a different comparison lens), or
            the current response's own proposal.kind unchanged (a same-lens
            "try again" request; adr/0016). A same-lens request relies only
            on repeat demotion (adr/0017), not a new ranking criterion or
            randomness, and is not guaranteed to return a different candidate
            set. It is an application-owned comparison lens, not a provider
            identifier, candidate reference, or durable history.
        previouslyShownProviderPageUrls:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Present only on a re-proposal request. The exact providerPageUrl
            values of candidates the server has already returned to this same
            browser earlier in this screen's lifetime (adr/0017), echoed back
            unchanged; the browser must not invent these values or source
            them from storage, a cookie, or the URL. The server uses this
            list only to lower the selection priority of matching candidates
            in this one response's ranking, before the existing 5-candidate
            display cap is applied (adr/0015); it does not exclude them, and
            it is not stored, logged, or reused beyond computing this one
            response. Omit or send an empty array when opening the screen for
            the first time or when no candidate has been shown yet.
    CandidateProposalResponse:
      type: object
      required: [proposal, reProposalOptions, providerCredit]
      additionalProperties: false
      properties:
        proposal:
          allOf:
            - $ref: '#/components/schemas/CandidateConcept'
          nullable: true
          description: >-
            The one concept and candidate set to display immediately. It is null
            when the selected lens has no matching lunch candidates. The browser
            replaces the displayed cards and map on every successful response. It
            may retain the shown candidates' providerPageUrl values in
            current-screen memory and echo them back in a later re-proposal
            request so the server can demote repeats there (adr/0017); the
            browser does not persist this state outside current-screen memory,
            and the server does not persist it beyond computing that one
            response.
        reProposalOptions:
          type: array
          maxItems: 3
          description: >-
            Application-owned lenses the browser may show only after the organizer
            chooses to re-propose. For a non-null proposal, this array excludes the
            displayed proposal's kind. It does not contain provider IDs, candidate
            references, search-origin data, or a guarantee that a fresh search will
            return candidates.
          items:
            $ref: '#/components/schemas/ReproposalOption'
        providerCredit:
          $ref: '#/components/schemas/ProviderCredit'
    ReproposalOption:
      type: object
      required: [kind, title, rationale]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ConceptKind'
        title:
          type: string
          description: >-
            A plain-language label for the next comparison lens. For
            GENRE_FOCUS this is generated per response and names the genre
            it selected (adr/0019); it remains deterministic for a given
            candidate set.
        rationale:
          type: string
          description: >-
            A plain-language explanation of the lens. It must not promise seats,
            reservations, payment, or other unavailable facts.
    CandidateConcept:
      type: object
      required: [conceptRef, kind, title, rationale, candidates]
      additionalProperties: false
      properties:
        conceptRef:
          type: string
          description: >-
            Opaque current-response UI identity. It is not a provider identifier
            and must not be persisted or used as a durable reference.
        kind:
          $ref: '#/components/schemas/ConceptKind'
        title:
          type: string
          description: An explainable, deterministic concept label.
        rationale:
          type: string
          description: >-
            A plain-language explanation based only on provider fields used for
            this concept; it must not promise seats, reservations, payment, or
            other unavailable facts.
        candidates:
          type: array
          maxItems: 5
          description: >-
            The top-ranked candidates for this concept after ranking the full
            retrieved eligible population and, for a re-proposal request,
            demoting any candidate named in the request's
            previouslyShownProviderPageUrls to the end of that ranking
            (adr/0017); 5 is a display cap applied last, not a limit on the
            population that was fetched, ranked, or demoted (adr/0015). The
            browser may keep these candidates only in current-screen memory
            while the response is being compared; it must not persist them
            beyond that memory. It may echo only their providerPageUrl values
            back to the server on a later re-proposal request (adr/0017); it
            must not otherwise return this array or any other candidate field
            to the server.
          items:
            $ref: '#/components/schemas/Candidate'
    ConceptKind:
      type: string
      enum: [PROXIMITY, GENRE_FOCUS, NON_SMOKING_REFERENCE, IZAKAYA_BAR_INCLUDED]
      description: >-
        The deterministic selection lens. The server returns only kinds it can
        explain from the current normalized provider data. PROXIMITY,
        GENRE_FOCUS, and NON_SMOKING_REFERENCE rank only candidates outside a
        default-excluded genre category whose lunch service cannot be
        confirmed from returned provider fields (adr/0015). That default
        exclusion reflects unconfirmed lunch status, not a confirmed absence
        of lunch service, and no rationale may claim otherwise.
        IZAKAYA_BAR_INCLUDED is the only kind whose candidate population
        additionally includes that category; the organizer reaches it only by
        selecting it as a re-proposal lens, the same way as any other kind,
        never as an upfront filter or secondary condition. GENRE_FOCUS ranks
        by proximity only the candidates sharing the single most common genre
        in the eligible population, and is explainable only when that
        population spans at least two distinct genres -- its candidate set is
        therefore always a strict subset of PROXIMITY's own candidate set when
        offered, which by construction differs from it (adr/0019; GENRE_VARIETY,
        removed by adr/0016, instead reordered the same full population and
        sometimes produced an identical set and order -- GENRE_FOCUS cannot
        reproduce that exact failure because its population is always a
        narrower subset when built). NON_SMOKING_REFERENCE ranks candidates
        primarily by their provider-supplied non-smoking reference (full
        non-smoking, then partial, then none, then unconfirmed), then by
        proximity, and is explainable only when the population spans at least
        two distinct non-smoking references; it replaces AMENITY_REFERENCE
        (adr/0019), whose combined constituent fields (private_room, parking,
        wifi, barrier_free) real-data review found too sparse or unusable to
        compare by. CAPACITY_REFERENCE was also removed (adr/0019): the
        organizer found sorting by the exact seat count added no comparison
        value; every Candidate now instead carries a coarse capacityTier
        reference shown regardless of the active lens. GENRE_VARIETY was
        removed (adr/0016): under real data it produced the same candidate
        set and order as PROXIMITY whenever the nearest candidates already
        spanned distinct genres, so it no longer described a distinct,
        explainable lens. dinnerBudgetTier (adr/0019 decision 8) is a
        Candidate field, never a ConceptKind: dinner-price banding is never
        offered as a comparison lens, only shown on every card.
    Candidate:
      type: object
      required:
        [candidateRef, name, genre, description, regularHoliday,
         totalSeats, capacityTier, nonSmokingStatus, cardPaymentAvailable,
         dinnerBudgetTier, location, providerPageUrl]
      additionalProperties: false
      properties:
        candidateRef:
          type: string
          description: >-
            Opaque current-response UI identity for card-marker highlighting. It
            is not a provider identifier and must not be shown or persisted.
        name:
          type: string
        genre:
          type: string
          description: Provider-supplied genre label; do not alter it.
        description:
          type: string
          nullable: true
          description: Provider-supplied introduction text; null when not supplied.
        regularHoliday:
          type: string
          nullable: true
          description: Provider-supplied regular-holiday reference; null when not supplied.
        totalSeats:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Provider-supplied total-seat reference; null when not supplied.
            Retained for exact machine comparison only (see the browser
            interface's rawValueAttribute); the visible card value is
            capacityTier's coarse label, not this number (adr/0019). This
            value does not indicate reservation availability.
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
          description: >-
            A coarse seating-scale reference derived from totalSeats
            (adr/0019); null exactly when totalSeats is null. It describes the
            shop's scale only -- it is not a claim about reservation ease,
            availability, or whether a given party size can be seated.
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
          description: >-
            Provider-supplied non-smoking reference (full non-smoking,
            partial, or no non-smoking seating); null when not supplied. Do
            not treat null as NONE -- an unconfirmed reference is not a claim
            of no non-smoking seating.
        cardPaymentAvailable:
          type: boolean
          nullable: true
          description: >-
            Provider-supplied credit-card-acceptance reference; null when not
            supplied. This reflects credit-card acceptance only, not other
            payment methods (cash, e-money, or other cashless methods), and
            must not be presented as a claim that the shop accepts only cash.
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
          description: >-
            A coarse dinner-price-range reference derived from the provider's
            budget data (adr/0019 decision 8); null when not supplied. This
            is the provider's dinner-oriented budget figure only -- it must
            never be presented as, or used to infer, a lunch price, and no
            rationale, label, or caution derived from it may state or imply
            a lunch price threshold. Its visible label must always make
            clear it is a dinner reference (for example a "dinner" or
            equivalent qualifier). It is never a ConceptKind or ranking
            input; it is shown on every card regardless of the active lens.
        location:
          $ref: '#/components/schemas/ShopLocation'
        providerPageUrl:
          type: string
          format: uri
          description: >-
            Provider page for the organizer's final menu, hours, and reservation
            confirmation. During one screen lifetime only, the browser may
            retain this value and echo it back in a later re-proposal request's
            previouslyShownProviderPageUrls so the server can lower its repeat
            display priority (adr/0017); the server uses it only for that one
            request's candidate selection and does not persist it. The browser
            must not persist this value outside current-screen memory or use it
            as a durable candidate identity.
    ShopLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        Returned shop location for the Leaflet marker only. It never represents
        the private configured search origin, a route, or the browser's current
        location.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ProviderCredit:
      type: object
      required: [text, url]
      additionalProperties: false
      properties:
        text:
          type: string
          enum: ['Powered by ホットペッパーグルメ Webサービス']
          description: Required Hot Pepper text credit; do not alter it.
        url:
          type: string
          format: uri
          enum: ['http://webservice.recruit.co.jp/']
          description: Required destination of the Hot Pepper text credit.
    ProblemResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [AUTHENTICATION_REQUIRED, REQUEST_REJECTED, PROPOSAL_REPROPOSAL_KIND_INVALID,
             PROPOSAL_RATE_LIMITED, PROVIDER_UNAVAILABLE]
        message:
          type: string
          description: Safe user-facing text without a private location, credentials, or provider internals.
