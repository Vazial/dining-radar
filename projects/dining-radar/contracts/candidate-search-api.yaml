# Status: human content-approved in chat (2026-08-03 amendment; original
# approval 2026-08-01), made durable by merged PR #76.
# 2026-08-07 amendment: human review of a real Hot Pepper production run
# produced two product rules -- cap displayed candidates per concept at 5
# (a display cap over the ranked population, not a population-fetch limit),
# and exclude genres whose lunch service cannot be confirmed from returned
# provider fields (e.g. izakaya/bar) from the default candidate population
# unless the organizer selects a dedicated re-proposal lens for them. See
# adr/0015. This revision becomes durable when its PR merges.
# 2026-08-08 amendment (adr/0016): a second real-data review found
# GENRE_VARIETY converged to the same candidate set and order as PROXIMITY
# (genre-diverse ranking has no effect once the nearest candidates already
# span distinct genres), so it is removed from ConceptKind. reproposalKind
# may now also repeat the currently displayed proposal's own kind, to
# support a same-lens "try again" action that relies only on the existing
# current-screen repeat demotion (adr/0008 decision 2) rather than any new
# ranking criterion or randomness. Removing GENRE_VARIETY also resolves a
# capacity defect from adr/0015: with GENRE_VARIETY, five ConceptKind values
# minus the one displayed could exceed reProposalOptions.maxItems: 3,
# silently dropping IZAKAYA_BAR_INCLUDED; with four remaining kinds, at most
# three are ever offered, so no kind is ever dropped by this cap. This
# revision becomes durable when its PR merges.
openapi: 3.0.3
info:
  title: Toyama Dining Radar Candidate Proposal API
  version: 0.6.0
  description: >-
    Produces deterministic lunch-candidate concepts around one private
    runtime-configured location. The location, configured radius, credentials,
    provider identifiers, and provider images are never accepted or returned by
    this browser-facing API. A response is held in current browser memory only;
    it is not a provider-response cache or a durable search session. During one
    screen lifetime, the browser may retain a non-persistent shown-candidate
    comparison state solely to lower the display priority of repeats after a
    fresh re-proposal; it never sends that state back to the server.
servers:
  - url: https://app.example.invalid
    description: >-
      Placeholder HTTPS public origin. The authentication and public-deployment
      slice selects and configures the real origin; browser access is same-origin.
paths:
  /candidate-proposals:
    post:
      operationId: proposeCandidates
      summary: Generate one displayed lunch-candidate proposal
      description: >-
        Performs one fresh Hot Pepper search and returns the initial deterministic
        proposal, or a newly chosen re-proposal lens, with its normalized candidate
        set. Opening the authenticated screen sends an empty request and displays
        the returned proposal immediately. Re-proposal is a separate fresh request
        after the browser presents the response's available lenses in a modal and
        the organizer selects one. The configured search origin and its exact radius
        are server-only and are not request parameters. The server does not receive
        previously shown candidates; after a successful re-proposal, the browser
        applies its current-screen-only repeat demotion to the replacement display.
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProposalRequest'
      responses:
        '200':
          description: >-
            A complete replacement displayed-proposal response. A null proposal
            is a successful no-match result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProposalResponse'
        '400':
          description: A browser-visible re-proposal lens is invalid or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              example:
                code: PROPOSAL_REPROPOSAL_KIND_INVALID
                message: This proposal lens is not available. Choose another one.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/RequestRejected'
        '429':
          $ref: '#/components/responses/ProposalRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  securitySchemes:
    organizerSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: >-
        Same-origin Django session cookie for an authenticated organizer. The
        authentication boundary in contracts/authentication-api.md defines
        login, logout, account lifecycle, cookie settings, and the decisions
        intentionally deferred from this API contract.
  parameters:
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
      description: >-
        Django CSRF token obtained by the same-origin browser. This header is
        required for this cookie-authenticated state-changing request.
  responses:
    AuthenticationRequired:
      description: The caller is not an authenticated organizer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Sign in is required to view candidate proposals.
    RequestRejected:
      description: The request did not pass the browser-session security check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: REQUEST_REJECTED
            message: The request could not be accepted. Refresh the page and try again.
    ProposalRateLimited:
      description: The organizer exceeded the allowed proposal request frequency.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Seconds before the browser may retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROPOSAL_RATE_LIMITED
            message: Too many proposal requests were made. Please try again shortly.
    ProviderUnavailable:
      description: Provider communication, authentication, rate limiting, or outage prevented completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROVIDER_UNAVAILABLE
            message: Candidate proposals cannot be retrieved right now. Please try again later.
  schemas:
    CandidateProposalRequest:
      type: object
      additionalProperties: false
      properties:
        reproposalKind:
          $ref: '#/components/schemas/ConceptKind'
          description: >-
            Omit when the authenticated screen first opens. For re-proposal,
            send exactly one kind: either one selected from the current
            response's reProposalOptions (a different comparison lens), or
            the current response's own proposal.kind unchanged (a same-lens
            "try again" request; adr/0016). A same-lens request relies only
            on the browser's existing current-screen repeat demotion, not a
            new ranking criterion or randomness, and is not guaranteed to
            return a different candidate set. It is an application-owned
            comparison lens, not a provider identifier, candidate reference,
            or durable history.
    CandidateProposalResponse:
      type: object
      required: [proposal, reProposalOptions, providerCredit]
      additionalProperties: false
      properties:
        proposal:
          allOf:
            - $ref: '#/components/schemas/CandidateConcept'
          nullable: true
          description: >-
            The one concept and candidate set to display immediately. It is null
            when the selected lens has no matching lunch candidates. The browser
            replaces the displayed cards and map on every successful response. It
            may retain only a current-screen shown-candidate comparison state to
            demote repeated candidates after a later successful re-proposal; this
            state is not persisted or returned to the server.
        reProposalOptions:
          type: array
          maxItems: 3
          description: >-
            Application-owned lenses the browser may show only after the organizer
            chooses to re-propose. For a non-null proposal, this array excludes the
            displayed proposal's kind. It does not contain provider IDs, candidate
            references, search-origin data, or a guarantee that a fresh search will
            return candidates.
          items:
            $ref: '#/components/schemas/ReproposalOption'
        providerCredit:
          $ref: '#/components/schemas/ProviderCredit'
    ReproposalOption:
      type: object
      required: [kind, title, rationale]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ConceptKind'
        title:
          type: string
          description: A plain-language label for the next comparison lens.
        rationale:
          type: string
          description: >-
            A plain-language explanation of the lens. It must not promise seats,
            reservations, payment, or other unavailable facts.
    CandidateConcept:
      type: object
      required: [conceptRef, kind, title, rationale, candidates]
      additionalProperties: false
      properties:
        conceptRef:
          type: string
          description: >-
            Opaque current-response UI identity. It is not a provider identifier
            and must not be persisted or used as a durable reference.
        kind:
          $ref: '#/components/schemas/ConceptKind'
        title:
          type: string
          description: An explainable, deterministic concept label.
        rationale:
          type: string
          description: >-
            A plain-language explanation based only on provider fields used for
            this concept; it must not promise seats, reservations, payment, or
            other unavailable facts.
        candidates:
          type: array
          maxItems: 5
          description: >-
            The top-ranked candidates for this concept after ranking the full
            retrieved eligible population; 5 is a display cap on this array, not
            a limit on the population that was fetched or ranked (adr/0015). The
            browser may keep them only in current-screen memory while the
            response is being compared; it must not persist them or return them
            to the server.
          items:
            $ref: '#/components/schemas/Candidate'
    ConceptKind:
      type: string
      enum: [PROXIMITY, CAPACITY_REFERENCE, AMENITY_REFERENCE, IZAKAYA_BAR_INCLUDED]
      description: >-
        The deterministic selection lens. The server returns only kinds it can
        explain from the current normalized provider data. PROXIMITY,
        CAPACITY_REFERENCE, and AMENITY_REFERENCE rank only candidates outside
        a default-excluded genre category whose lunch service cannot be
        confirmed from returned provider fields (adr/0015). That default
        exclusion reflects unconfirmed lunch status, not a confirmed absence
        of lunch service, and no rationale may claim otherwise.
        IZAKAYA_BAR_INCLUDED is the only kind whose candidate population
        additionally includes that category; the organizer reaches it only by
        selecting it as a re-proposal lens, the same way as any other kind,
        never as an upfront filter or secondary condition. GENRE_VARIETY was
        removed (adr/0016): under real data it produced the same candidate
        set and order as PROXIMITY whenever the nearest candidates already
        spanned distinct genres, so it no longer described a distinct,
        explainable lens.
    Candidate:
      type: object
      required:
        [candidateRef, name, genre, description, businessHours, regularHoliday,
         totalSeats, access, location, providerPageUrl]
      additionalProperties: false
      properties:
        candidateRef:
          type: string
          description: >-
            Opaque current-response UI identity for card-marker highlighting. It
            is not a provider identifier and must not be shown or persisted.
        name:
          type: string
        genre:
          type: string
          description: Provider-supplied genre label; do not alter it.
        description:
          type: string
          nullable: true
          description: Provider-supplied introduction text; null when not supplied.
        businessHours:
          type: string
          nullable: true
          description: Provider-supplied business-hours reference; null when not supplied.
        regularHoliday:
          type: string
          nullable: true
          description: Provider-supplied regular-holiday reference; null when not supplied.
        totalSeats:
          type: integer
          nullable: true
          minimum: 0
          description: Provider-supplied total-seat reference; null when not supplied.
        access:
          type: string
          nullable: true
          description: Provider-supplied access reference; null when not supplied.
        location:
          $ref: '#/components/schemas/ShopLocation'
        providerPageUrl:
          type: string
          format: uri
          description: >-
            Provider page for the organizer's final menu, hours, and reservation
            confirmation. During one screen lifetime only, the browser may compare
            this returned value with a prior displayed value to lower repeat display
            priority after a fresh re-proposal. It must not persist or post this
            value, or use it as a durable candidate identity.
    ShopLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        Returned shop location for the Leaflet marker only. It never represents
        the private configured search origin, a route, or the browser's current
        location.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ProviderCredit:
      type: object
      required: [text, url]
      additionalProperties: false
      properties:
        text:
          type: string
          enum: ['Powered by ホットペッパーグルメ Webサービス']
          description: Required Hot Pepper text credit; do not alter it.
        url:
          type: string
          format: uri
          enum: ['http://webservice.recruit.co.jp/']
          description: Required destination of the Hot Pepper text credit.
    ProblemResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [AUTHENTICATION_REQUIRED, REQUEST_REJECTED, PROPOSAL_REPROPOSAL_KIND_INVALID,
             PROPOSAL_RATE_LIMITED, PROVIDER_UNAVAILABLE]
        message:
          type: string
          description: Safe user-facing text without a private location, credentials, or provider internals.
