# ステータス: 承認済み — adr/0024 の改訂は 2026-08-29 にチャットで承認された（15日間 status: 提案中 の
#   まま実装だけが本番に載っていた滞留を、実態の照合を経て解消したもの。同ADRの approved_by 参照）。
#   **adr/0025 の改訂は 2026-08-24 に PR #156 のマージをもって承認済み**（ADR-0035 方式(i)）であり、
#   契約・実装・テストが同一スライスで main に載っている。この行の形式はmeta/adr/0043の機械検証が要求する
#
# 以下は2026-08-12に承認済み(PR #90、adr/0023)だったv1.0.2の内容である。この上に2026-08-14の
# adr/0024ドラフト差分、続けて2026-08-20のadr/0025ドラフト差分（いずれも下記ブロック）が重なる。
#
# ステータス（v1.0.2、承認済み）: 承認済み(2026-08-12) — PR #90 のマージをもって人間が承認した（meta/adr/0035 方式(i)）。
#   adr/0023 の組み替え。ConceptKindを廃し、絞り込み＋固定の
#   近い順並べ替え＋近傍プールからの無作為抽出へ置き換える破壊的変更（v1.0.0）。この変更は
#   product-brief.md §2・§3・TDR-CS-04・ADR-0004決定1・TDR-CS-01・product-briefの表題と衝突して
#   いた。この衝突はPR #91のproduct-brief改訂で解消され、adr/0023も同PRで承認条件を満たした
#   （adr/0023の矛盾報告を参照）。この行の形式はmeta/adr/0043の機械検証が要求する
#
# 2026-08-10 起草 (adr/0023):
# - ConceptKind, CandidateConcept, ReproposalOption, reproposalKind,
#   reProposalOptions, previouslyShownProviderPageUrls をすべて削除する。
# - CandidateProposalRequest は任意の filters オブジェクトだけを持つ
#   (genres, includeIzakayaBar, nonSmokingOnly, cardPaymentOnly,
#   budgetTiers)。初期表示・「もう一度探す」・「絞り込みを変更する」は
#   いずれも同じ形の POST であり、API から見て区別しない。
# - nonSmokingOnly / cardPaymentOnly / budgetTiers はソフトフィルタである
#   (adr/0023 決定2, 人間の明示的な判断): 確認できた非該当だけを除き、
#   情報なし (null) は候補集合に残る。除外ではなく表示順の後方配置で
#   「情報なし」を扱う。
# - candidates の並び順は「有効な絞り込みについて確認済み一致の候補が
#   先、情報なしの候補は後ろ、各段は距離昇順」の固定規則である
#   (adr/0023 決定4)。並べ替え基準を選ぶ操作は存在しない。
# - candidates は、絞り込み後の母集団を上記の順で並べ、近い方から
#   min(母集団, 20) 件の近傍プールを作り、そこから無作為に最大5件を
#   抽出したのち、表示直前に同じ規則へ並べ直したものである
#   (adr/0023 決定4)。これは product-brief.md ・ ADR-0004 決定1 ・
#   ADR-0005 ・ ADR-0008 ・ ADR-0016 が確立した「決定的ルールだけで
#   選ぶ」という要求への明示的な違反であり、人間の再承認点である
#   (adr/0023 矛盾4)。乱数のseedはこの公開APIに一切存在しない
#   (test-support-api.yaml だけが持つ)。
# - izakayaBarFallbackApplied を追加する (adr/0023 決定6, TDR-CS-10の
#   後継)。includeIzakayaBar が false のまま他の filters を適用して
#   候補が尽きたときだけ、既定除外を取り下げて示したことを表す。
#   ユーザーが明示的に選んだ他の filters は、これが原因で0件になっても
#   自動で緩めない。
# - availableGenres を追加する (adr/0023 決定9)。専用の filter
#   taxonomy エンドポイントは復活させない。
# - 400 PROPOSAL_REPROPOSAL_KIND_INVALID を廃止する (adr/0023 決定8;
#   TDR-CS-07 廃止)。絞り込みモデルには「無効な切り口」という概念が
#   存在しない。
# - businessHours は引き続き存在しない (adr/0017 のまま、無変更)。
#   capacityTier/nonSmokingStatus/cardPaymentAvailable/totalSeats/name/
#   genre/description/regularHoliday/providerPageUrl/location/
#   candidateRef は Must により無変更 (adr/0023 は adr/0019 が確立した
#   カード表示項目を変えない)。
# - dinnerBudgetTier の可視表示は段階語（低/中/高）だけにする。ディナー
#   基準である開示だけを、展開中の絞り込みパネル内の1行注記へ置き、金額・
#   レンジ・段階から金額への対応は表示しない (adr/0023 決定10の2026-08-11
#   人間修正)。
#   enum値 (LOW/MID/HIGH) 自体、しきい値、切り口にしないという扱いは
#   adr/0019 決定8のまま無変更。これは adr/0019 決定8の「可視ラベルに
#   必ずディナーである語を含める」というMustの適用単位をカード単位から
#   画面単位へ変えるものであり、人間の再承認点である (adr/0019への
#   追記注記を参照)。
#
# 2026-08-14 起草 (adr/0024、未承認):
# - 近傍プールからの一様抽出（旧手順4・5、固定プールサイズ min(母集団,20)）を
#   廃止し、絞り込み後の母集団全体から距離に応じた重み付き抽出へ改める
#   (adr/0024 決定3)。近いほど選ばれやすく（P1）、母集団の裾（最も遠い
#   候補）も常に0でない確率を持つ（P2）。重み関数の具体形は非拘束の
#   推奨とする。表示直前の並べ替え（確認済み一致→情報なし、各段は
#   距離昇順）は無変更。
# - `shownProviderPageUrls`（任意のrequestフィールド、providerPageUrlの
#   URI文字列配列、最大200件）を追加する。ブラウザがsessionStorageへ
#   蓄積した「このタブで既に表示したproviderPageUrl」を任意で送る
#   (adr/0024 決定4)。これは除外ではなく優先度の引き下げであり、絞り込み
#   後の母集団のうち未送付（未表示）の候補を優先して抽出する。
# - `shownPoolExhausted`（新規必須responseフィールド、真偽値）を追加する。
#   今回の絞り込み後母集団の全員が`shownProviderPageUrls`に含まれていた
#   （出し切った）場合にだけtrueになる。ブラウザはこれを受け取ったら
#   sessionStorageの蓄積をリセットし、この応答のcandidatesから新しい
#   蓄積を始める (adr/0024 決定4)。
# - `providerPageUrl`のdescriptionから「サーバへ送り返してはならない」と
#   いうMustを外し、`shownProviderPageUrls`の要素としてのみ送り返して
#   よいという限定Mustに置き換える。
# - これはadr/0023決定5（既表示降格の廃止）の部分的な巻き戻しである。
#   supersedeはしない——巻き戻すのは「機能」であって「メカニズムの主体・
#   範囲」ではない。サーバは相変わらず何も永続化しない。乱数のseedと
#   合成母集団の形は引き続きtest-support-api.yamlだけが持つ。
#   詳細はadr/0024を参照。
#
# 2026-08-14 追補 (adr/0024 決定4項目8、未承認): shownProviderPageUrlsは
# ブラウザ側のsessionStorage（candidate-search-browser-interface.yamlの
# shownCandidateMemory）で24時間以下（契約値20時間）の期限管理下にある。
# これはHot Pepper利用規約の「アプリケーション上またはアプリケーション内の
# キャッシュは24時間以内に更新・削除する」という条項に対応するためであり、
# サーバ側のこのフィールド自体のスキーマは変わらない——期限管理は完全に
# ブラウザ側の責務であり、サーバはタイムスタンプを一切受け取らない。
#
# 2026-08-20 起草 (adr/0025、未承認、本ファイルはこのドラフトを反映する):
# - `CandidateProposalResponse` に `searchOrigin`（新規必須フィールド、緯度経度）を追加する。認証済み
#   候補画面が検索基点をマーカーとして表示し、それを中心とする徒歩圏の同心リングを描けるようにする
#   (adr/0025 決定1)。設定された探索範囲（半径）の値は引き続きこのAPIで返さない・受け取らない——
#   変わるのは基点の座標だけである (adr/0025 決定4、決定8)。
# - `Candidate` に `walkingTimeMinutes`（新規必須フィールド、分単位の整数、null不可）を追加する。
#   検索基点とこの候補の座標から算出した徒歩時間の推定値であり、実測の経路ではない (adr/0025 決定2)。
#   算出方式（直線距離からの推定か、道のり基準か）はここでは選定しない——実装スライスの判断に送る
#   (adr/0025 文脈0節「検証の申告」)。location・providerPageUrlと異なり、この値に「情報なし」は
#   ない——基点も候補の座標も常にサーバー側に存在するため、providerが値を欠くという事態が起こらない。
# - `CandidateFilters` に `walkingTimeMaxMinutes`（新規任意フィールド、分単位の整数、nullable）を
#   追加する。指定すると、確認済みの `walkingTimeMinutes` がこの上限を超える候補だけを除く
#   (adr/0025 決定3)。他のnullable絞り込み（nonSmokingOnly・cardPaymentOnly・budgetTiers）と異なり
#   **ソフト絞り込みではない**——`walkingTimeMinutes` に「情報なし」の候補が存在しないため、確認
#   できない値を保持するというADR-0023決定2の対象にそもそも当たらない。providerへは送らない
#   （providerに徒歩時間の検索パラメータが無い）。ブラウザ側の選択肢は少数の固定値に閉じる想定だが、
#   値そのものの候補集合をこのスキーマでは列挙しない（`genres` と同じ扱い——UI側の閉じた選択という
#   実装上の制約であり、スキーマの受理範囲そのものは狭めない）。
# - `PopulationAttribute` に `walkingTimeBand`（新規必須フィールド、分単位の整数、nullable）を追加し、
#   `walkingTimeMaxMinutes` の保留中の変更が何件に効くかをブラウザがローカルに予告できるようにする
#   (adr/0025 決定3)。**`Candidate.walkingTimeMinutes` の生の値そのものではない**——
#   `populationAttributes` の行は店舗を同定しない、という adr/0022 の性質を壊さないため、この値は
#   ブラウザが現在提示している `walkingTimeMaxMinutes` の候補値のうち、この候補がなお該当する最小の
#   値（同定に使える精度を持たない粗い区分）であり、候補との対応順序を持たない。ブラウザが提示する
#   上限値の集合が変われば、この列が表す区分の粒度も追随して変わるという関係を保つ責務は実装側にある。
# - `populationAttributes` の禁止属性列から「walking time」を単純に外すのではなく、上記の粗い
#   `walkingTimeBand` だけを明示的な例外として書き直す。coordinates・search origin・configured
#   search range・exact distance・route・current locationは引き続きすべて禁止のままである
#   (adr/0025 決定3、adr/0022)。
# - `Candidate` の description と本ファイル冒頭の info.description から、検索基点・徒歩時間を
#   返さない旨の記述を外す。`ShopLocation`（候補店舗の座標専用スキーマ）自体は無変更——新設した
#   `SearchOriginLocation`/`searchOrigin` は別スキーマであり、`ShopLocation` の「検索基点を表さない」
#   というMustは店舗座標について引き続き真である。
# - route（徒歩経路）とcurrent location（現在地）はこのAPIに一切追加しない (adr/0025 決定6、無変更)。
openapi: 3.0.3
info:
  title: Dining Radar Candidate Proposal API
  version: 1.2.0
  description: >-
    Produces up to 5 lunch candidates around one private runtime-configured
    location, after filtering, distance-weighted random selection that
    prioritizes candidates the browser has not yet shown during the current
    tab (adr/0023, adr/0024), and a fixed display re-ordering. The private
    search origin's coordinates are returned as `searchOrigin`, for map
    display only (adr/0025 decision 1); its configured radius, credentials,
    provider identifiers, and provider images are never accepted or returned
    by this browser-facing API. Each candidate carries an estimated
    `walkingTimeMinutes` computed from `searchOrigin` and the candidate's own
    `location`; it is an estimate, not a measured route, and this API never
    accepts or returns a walking route or the browser's current location
    (adr/0025 decisions 2 and 6). A response is
    held in current browser memory only; it is not a provider-response cache
    or a durable search session. This API carries no random seed. It carries
    browser-supplied, browser-held shown-candidate state
    (`shownProviderPageUrls`, adr/0024) that the server neither stores beyond
    the current request's processing nor uses for any cross-session or
    cross-device identification; the server remains stateless (adr/0023
    decision 3, adr/0024 decision 4 and its relationship to adr/0023 decision
    5 and adr/0018). The browser bounds its own retention of this
    provider-derived state to no more than 24 hours, per Hot Pepper's terms
    of service (see `Candidate.providerPageUrl` and
    `CandidateProposalRequest.shownProviderPageUrls` below; the bound is
    enforced entirely client-side and this API's schema carries no
    timestamp). DRAFT: this contract version is not yet human-approved; see
    adr/0023-replace-concept-lenses-with-filters-sort-and-randomized-pool-selection.md,
    adr/0022-expose-identity-free-population-filter-attributes.md,
    adr/0024-refine-candidate-diversity-and-filter-discoverability-from-live-feedback.md
    (draft, 2026-08-14, including its 2026-08-14 addendum on retention limits),
    and
    adr/0025-disclose-search-origin-and-walking-time-to-the-authenticated-screen.md
    (draft, 2026-08-20).
servers:
  - url: https://app.example.invalid
    description: >-
      Placeholder HTTPS public origin. The authentication and public-deployment
      slice selects and configures the real origin; browser access is same-origin.
paths:
  /candidate-proposals:
    post:
      operationId: proposeCandidates
      summary: Generate one displayed lunch-candidate proposal from the current filters
      description: >-
        Performs one fresh Hot Pepper search over the full eligible
        population, applies the requested filters, including the hard
        `walkingTimeMaxMinutes` filter (adr/0025 decision 3; applied before
        the nullable-filter ordering described next, since it has no
        unconfirmed candidate to preserve -- `Candidate.walkingTimeMinutes`
        is never null) (adr/0023 decisions 1-3), orders the result
        (confirmed matches before unconfirmed/unavailable values for any
        active nullable filter, each group nearest-first),
        partitions the ordered population into not-yet-shown and
        already-shown using the request's `shownProviderPageUrls` (adr/0024
        decision 4; empty or omitted `shownProviderPageUrls` behaves as an
        entirely not-yet-shown population), then draws up to 5 candidates by
        distance-weighted random sampling (adr/0024 decision 3) that draws
        exclusively from the not-yet-shown partition while it has at least 5
        members, fills any remaining slots from the already-shown partition
        when the not-yet-shown partition is smaller than the display cap, and
        draws from the full eligible population without regard to
        `shownProviderPageUrls` when the not-yet-shown partition is empty
        (reporting this as `shownPoolExhausted: true`). The sampled
        candidates are then re-ordered by the same confirmed/unconfirmed-
        then-nearest-first rule for display (adr/0023 decision 4, as amended
        by adr/0024 decision 3). Opening the authenticated screen sends an
        empty or shown-state-only request. "Try again" and "change filters"
        are the same operation: both are a fresh POST with a `filters` body,
        identical (unchanged) or different from the previous request
        respectively, each optionally carrying the browser's current
        `shownProviderPageUrls`. The configured search origin and its exact
        radius are server-only and are not request parameters; the origin's
        coordinates are nonetheless included in every successful response as
        `searchOrigin` for map display (adr/0025 decision 1), while the
        configured radius is never included. This
        operation carries no random seed on the public API; production
        responses are non-deterministic between requests by design (adr/0023
        decision 4, adr/0024 decision 3). Acceptance testing pins determinism
        through contracts/test-support-api.yaml only.
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProposalRequest'
      responses:
        '200':
          description: >-
            A complete replacement displayed-proposal response. An empty
            `candidates` array is a successful no-match result for the
            applied filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProposalResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/RequestRejected'
        '429':
          $ref: '#/components/responses/ProposalRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  securitySchemes:
    organizerSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: >-
        Same-origin Django session cookie for an authenticated organizer. The
        authentication boundary in contracts/authentication-api.md defines
        login, logout, account lifecycle, cookie settings, and the decisions
        intentionally deferred from this API contract.
  parameters:
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
      description: >-
        Django CSRF token obtained by the same-origin browser. This header is
        required for this cookie-authenticated state-changing request.
  responses:
    AuthenticationRequired:
      description: The caller is not an authenticated organizer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Sign in is required to view candidate proposals.
    RequestRejected:
      description: The request did not pass the browser-session security check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: REQUEST_REJECTED
            message: The request could not be accepted. Refresh the page and try again.
    ProposalRateLimited:
      description: The organizer exceeded the allowed proposal request frequency.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Seconds before the browser may retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROPOSAL_RATE_LIMITED
            message: Too many proposal requests were made. Please try again shortly.
    ProviderUnavailable:
      description: Provider communication, authentication, rate limiting, or outage prevented completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PROVIDER_UNAVAILABLE
            message: Candidate proposals cannot be retrieved right now. Please try again later.
  schemas:
    CandidateProposalRequest:
      type: object
      additionalProperties: false
      properties:
        filters:
          $ref: '#/components/schemas/CandidateFilters'
        shownProviderPageUrls:
          type: array
          items:
            type: string
            format: uri
          maxItems: 200
          description: >-
            Provider page URLs this browser has already displayed to the
            organizer during the current tab lifetime, held in the browser's
            `sessionStorage` only (adr/0024 decision 4). Every value must be
            a `providerPageUrl` this same API has previously returned to this
            browser in an earlier response; the server does not validate
            membership against any durable store, because it keeps none.
            Omit this property, or send an empty array, when no shown-set
            exists yet (a fresh tab, a fresh sign-in, or after the browser
            cleared its accumulated set in response to a prior
            `shownPoolExhausted: true`, or after the browser pruned every
            entry older than its own 24-hour-or-less retention bound --
            adr/0024 decision 4 item 8, 2026-08-14 addendum; see
            candidate-search-browser-interface.yaml's
            `shownCandidateMemory.expiry`). This is priority information, not
            an exclusion filter: every candidate in this list remains
            eligible under `filters` and may still be returned (see
            `CandidateProposalResponse.shownPoolExhausted` and the
            `candidates` ordering/selection rule). The server discards this
            value once the current request finishes; it is never written to
            a log, a database, a trace, or any storage the server retains
            between requests. This field carries only URL values, never a
            timestamp -- the 24-hour-or-less retention bound is enforced
            entirely by the browser before it builds this array, not by the
            server. `maxItems: 200` is a defensive schema bound far above
            this product's measured real population size, not an expected
            operating size.
      description: >-
        Omit `filters`, or send it as `{}`, when opening the screen for the
        first time. Before filtering, the server normalizes an omitted
        `filters`, an empty `filters` object, and omitted properties within
        `filters` to CandidateFilters' semantic defaults. "Try again" sends
        filters whose normalized value equals the currently applied value;
        it need not repeat byte-for-byte the same JSON object. "Change
        filters" sends a normalized value that differs from the applied one.
        Both use this request shape (adr/0023 decisions 1 and 13).
        `shownProviderPageUrls` is independent of this normalization/
        equivalence rule: it always reflects the browser's current
        `sessionStorage` snapshot at request time and does not affect
        whether two `filters` values are considered the same request for
        "try again" purposes (adr/0024 decision 4).
      x-default-normalization:
        normalizedFilters:
          genres: []
          includeIzakayaBar: false
          nonSmokingOnly: false
          cardPaymentOnly: false
          budgetTiers: []
          walkingTimeMaxMinutes: null
        semanticallyEquivalentRequestBodies:
          - {}
          - {filters: {}}
          - {filters: {genres: [], includeIzakayaBar: false,
                       nonSmokingOnly: false, cardPaymentOnly: false,
                       budgetTiers: [], walkingTimeMaxMinutes: null}}
    CandidateFilters:
      type: object
      additionalProperties: false
      properties:
        genres:
          type: array
          items:
            type: string
          description: >-
            Provider genre labels to include (OR match against each
            candidate's genre). Omit or send an empty array for no genre
            restriction beyond `includeIzakayaBar`. Not affected by, and does
            not affect, `availableGenres` in the response (adr/0023 decision
            9): the offered genre choices never shrink as the organizer
            narrows.
        includeIzakayaBar:
          type: boolean
          default: false
          description: >-
            When false (the default), genres whose lunch service cannot be
            confirmed from returned provider fields (adr/0015's
            DEFAULT_EXCLUDED_GENRES) are excluded from the eligible
            population. When true, they are included. This default exclusion
            reflects unconfirmed lunch status, not a confirmed absence of
            lunch service. See also `izakayaBarFallbackApplied` in the
            response. Its browser-facing control renders alongside the genre
            filter options (adr/0024 decision 2), since it changes the scope
            of the genre category rather than expressing a value-confirmation
            preference like `nonSmokingOnly` or `cardPaymentOnly`; this is a
            control-placement change only and does not alter this property's
            request semantics.
        nonSmokingOnly:
          type: boolean
          default: false
          description: >-
            When true, excludes only candidates whose `nonSmokingStatus` is
            the confirmed value NONE. Candidates with FULL, PARTIAL, or an
            unconfirmed (null) reference remain in the eligible population
            (adr/0023 decision 2): unconfirmed information is never treated
            as a confirmed non-match. Unconfirmed candidates are ordered
            after confirmed matches in the response (see `candidates`).
        cardPaymentOnly:
          type: boolean
          default: false
          description: >-
            When true, excludes only candidates whose `cardPaymentAvailable`
            is the confirmed value false. Candidates with true or an
            unconfirmed (null) reference remain (adr/0023 decision 2), same
            treatment as `nonSmokingOnly`.
        budgetTiers:
          type: array
          items:
            type: string
            enum: [LOW, MID, HIGH]
          description: >-
            When non-empty, excludes only candidates whose `dinnerBudgetTier`
            is a confirmed value not in this set. Candidates with an
            unconfirmed (null) reference remain regardless of the selection
            (adr/0023 decision 2), same treatment as `nonSmokingOnly`. This
            filter is never sent to the provider (its search-budget parameter
            cannot represent this three-tier scheme within its two-code
            limit); it is always evaluated locally. The browser-facing filter
            option labels for LOW/MID/HIGH must use the same 低/中/高
            terminology as the per-candidate visible label. The single
            dinner-basis disclosure appears only inside the expanded filter
            panel and contains no tier-to-yen mapping (adr/0023 decision 10,
            as amended 2026-08-11).
        walkingTimeMaxMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            When present, excludes only candidates whose `walkingTimeMinutes`
            is greater than this maximum (adr/0025 decision 3). Omit or send
            null for no walking-time restriction. Unlike `nonSmokingOnly`,
            `cardPaymentOnly`, and `budgetTiers`, this is **not a soft
            filter**: `Candidate.walkingTimeMinutes` is never null (see its
            description), so there is no unconfirmed value for this filter to
            preserve under adr/0023 decision 2's soft-filter treatment -- an
            excluded candidate here is always a confirmed exclusion. This
            filter is never sent to the provider (Hot Pepper has no
            walking-time search parameter). The browser-facing control offers
            a small, closed set of implementation-chosen preset integer
            values rather than a free-numeric or continuous input (matching
            this contract's other filter controls and
            candidate-search-browser-interface.yaml's prohibition on native
            range/slider form controls); the exact preset values and their
            count are a UI-implementation detail this schema does not fix,
            which accepts any positive integer minute value. This is the same
            "closed selection over a UI-owned vocabulary" pattern `genres`
            already uses with `availableGenres` -- the schema itself stays
            open so a future change to the offered presets is not an API
            breaking change. `PopulationAttribute.walkingTimeBand` lets the
            browser predict this filter's applied match count locally,
            exactly as with the other filters, as long as the browser only
            ever offers this value from the same closed preset set the
            population bands were computed against.
    CandidateProposalResponse:
      type: object
      required:
        [candidates, izakayaBarFallbackApplied, availableGenres,
         populationAttributes, providerCredit, shownPoolExhausted,
         searchOrigin]
      additionalProperties: false
      properties:
        candidates:
          type: array
          maxItems: 5
          description: >-
            Up to 5 candidates, distance-weighted-randomly sampled with
            not-yet-shown priority and then ordered by the fixed display
            rule: candidates confirmed to match every active nullable filter
            come first, any candidate unconfirmed (null) for at least one
            active nullable filter comes after, and each group is ordered
            nearest-first (adr/0023 decision 4). This ordering equals plain
            nearest-first when no nullable filter (`nonSmokingOnly`,
            `cardPaymentOnly`, `budgetTiers`) is active; `walkingTimeMaxMinutes`
            is never part of this nullable-filter grouping, because it is a
            hard filter applied earlier (adr/0025 decision 3; see
            `CandidateFilters.walkingTimeMaxMinutes`). An empty array is a
            successful no-match result for the applied filters, distinct
            from a fetch failure (503) or rate limiting (429). Filtering and
            selection are always performed over the full retrieved,
            normalized, deduplicated population, never over a
            display-truncated subset (adr/0023 decision 3). Selection draws,
            with a distance-based weighting that favors closer candidates
            without ever reducing a farther candidate's selection
            probability to zero, from the subset of the eligible population
            absent from the request's `shownProviderPageUrls`; only when
            that not-yet-shown subset is smaller than 5 are already-shown
            candidates drawn to fill the remaining slots, and only when it
            is empty does selection draw from the full eligible population
            without regard to `shownProviderPageUrls` (see
            `shownPoolExhausted`) (adr/0024 decisions 3 and 4). The response
            carries no random seed; production sampling is non-deterministic
            between requests (adr/0023 decision 4, adr/0024 decision 3).
          items:
            $ref: '#/components/schemas/Candidate'
        izakayaBarFallbackApplied:
          type: boolean
          description: >-
            True only when the effective `includeIzakayaBar` was false but
            excluding that genre category, combined with the rest of the
            applied filters, left no candidate, so the server included that
            category anyway (adr/0023 decision 6, the successor to
            adr/0015's `IZAKAYA_BAR_INCLUDED` fallback). False whenever the
            exclusion was not the cause of an empty result, including
            whenever `includeIzakayaBar` was explicitly true. This never
            happens for any other filter (`genres`, `nonSmokingOnly`,
            `cardPaymentOnly`, `budgetTiers`, `walkingTimeMaxMinutes`): those
            are never silently loosened.
        availableGenres:
          type: array
          items:
            type: string
          description: >-
            The distinct provider genre labels present in the eligible
            population given only the current `includeIzakayaBar` value; not
            narrowed by the current `genres` selection or by any other active
            filter (adr/0023 decision 9). Lets the browser offer genre
            choices without a dedicated filter-taxonomy endpoint and without
            the offered choices shrinking as the organizer narrows. This
            array's own order carries no meaning (unchanged since adr/0023):
            the browser derives its own presentation order, including the
            count-descending order defined by
            contracts/candidate-search-browser-interface.yaml's
            `genrePresentation` (adr/0024 decision 1), from this array
            together with `populationAttributes`; the server is not required
            to, and need not, return this array in any particular order.
        populationAttributes:
          type: array
          description: >-
            Identity-free attributes for every retrieved, normalized,
            deduplicated candidate before any request filter is applied,
            including the default izakaya/bar exclusion. The browser uses
            this to count the effect of a pending filters selection before
            it makes another proposal request (adr/0022), and to compute
            each offered genre's population count for `genrePresentation`'s
            count-descending presentation order (adr/0024 decision 1): for a
            given `availableGenres` entry, its count is the number of
            `populationAttributes` rows whose `genre` equals that string,
            restricted to rows with `defaultExcluded=false` when the
            response's effective `includeIzakayaBar` was false, or to every
            such row when it was true -- the same population scoping
            `availableGenres` itself already uses. Rows do not identify shops
            and their sequence has no public ranking, distance, map, or
            candidate-correspondence meaning. They must not contain or be
            extended with a name, candidateRef, provider identifier or page
            URL, coordinates, search origin, configured search range, exact
            distance, walking route, current location, image, description,
            business hours, seats, or any other identifying/location
            attribute, with exactly one deliberate exception:
            `walkingTimeBand` below, which adr/0025 decision 3 permits
            precisely because it is a coarse bucket, not an exact distance,
            and carries no candidate-correspondence order (see its own
            description for the re-identification reasoning it exists to
            avoid).
          items:
            $ref: '#/components/schemas/PopulationAttribute'
        providerCredit:
          $ref: '#/components/schemas/ProviderCredit'
        searchOrigin:
          $ref: '#/components/schemas/SearchOriginLocation'
        shownPoolExhausted:
          type: boolean
          description: >-
            True only when every candidate in the filtered, eligible
            population for this request was already present in the
            request's `shownProviderPageUrls`, so this response's selection
            drew from the full eligible population exactly as if
            `shownProviderPageUrls` had been empty (adr/0024 decision 4).
            The browser must respond to `true` by clearing its accumulated
            `sessionStorage` shown-set and starting a new one from this
            response's `candidates`, so that not-yet-shown priority resumes
            on the next request instead of remaining permanently exhausted.
            `false` whenever at least one eligible candidate was absent from
            `shownProviderPageUrls`, regardless of whether that candidate
            was actually selected this time (the eligible population may
            still have more not-yet-shown members than the five-candidate
            display cap can show). This field carries no location, distance,
            or identity information beyond the boolean itself.
    PopulationAttribute:
      type: object
      required:
        [genre, nonSmokingStatus, cardPaymentAvailable, dinnerBudgetTier,
         defaultExcluded, walkingTimeBand]
      additionalProperties: false
      description: >-
        One anonymous filter-membership row for `populationAttributes`.
        It is not a candidate, a stable identity, or an association to any
        displayed candidate or marker. `null` is unavailable information, not
        a negative value or confirmed non-match (adr/0023 decision 2), except
        for `walkingTimeBand`, whose own description states its distinct
        null meaning.
      properties:
        genre:
          type: string
          description: >-
            Provider-supplied genre label used only for the closed `genres`
            filter vocabulary, match count, and (with `defaultExcluded`) the
            count-descending genre presentation order (adr/0023 decision 9,
            adr/0024 decision 1). It is not a shop identity.
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
          description: >-
            The same coarse non-smoking reference used by
            `CandidateFilters.nonSmokingOnly`; null means unavailable, never
            `NONE`.
        cardPaymentAvailable:
          type: boolean
          nullable: true
          description: >-
            The same credit-card-acceptance reference used by
            `CandidateFilters.cardPaymentOnly`; null means unavailable. False
            means only that credit cards are not accepted, not that payment is
            cash-only.
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
          description: >-
            The same coarse provider-derived dinner-budget reference used by
            `CandidateFilters.budgetTiers`; null means unavailable. It never
            represents or implies a lunch price.
        walkingTimeBand:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            A coarse walking-time upper-bound bucket for this row -- **not**
            this candidate's exact `walkingTimeMinutes` value (adr/0025
            decision 3). Its value is the smallest value in the browser's
            currently offered `CandidateFilters.walkingTimeMaxMinutes` preset
            set that this row's (undisclosed) exact walking time does not
            exceed; null when the row's walking time exceeds every currently
            offered preset. Because walking time is always computable (see
            `Candidate.walkingTimeMinutes`), null here does **not** mean
            "unavailable" the way it does for `nonSmokingStatus`,
            `cardPaymentAvailable`, or `dinnerBudgetTier` above -- it means
            only "farther than any currently offered maximum." This
            coarseness, not the exact minute value, is what keeps this row
            from re-identifying a displayed candidate: an exact value would
            let a reader match this otherwise-anonymous row to a specific
            card by value alone, even without any stated order, which is
            exactly the identity-free guarantee `adr/0022` and this schema's
            `additionalProperties: false` exist to protect. The browser's
            local match-count prediction for a pending
            `walkingTimeMaxMinutes` selection counts rows whose
            `walkingTimeBand` is less than or equal to (in the offered
            preset order) the pending value; this requires the population
            bands in a given response to have been computed against the same
            preset set the browser is currently offering as filter options,
            which is an implementation responsibility this schema cannot
            enforce structurally.
        defaultExcluded:
          type: boolean
          description: >-
            Whether this row is in ADR-0015's default-excluded genre category.
            It lets the browser count the effect of `includeIzakayaBar`
            without asking the provider again, and lets it scope a genre's
            population count for `genrePresentation`'s ordering the same way
            (adr/0024 decision 1). This is a genre-category property: all
            rows with the same `genre` have the same value, so acceptance may
            classify a displayed candidate's already-public genre for
            TDR-CS-09. It still must not associate that candidate with any
            particular populationAttributes row or reveal an identity.
    Candidate:
      type: object
      required:
        [candidateRef, name, genre, description, regularHoliday,
         totalSeats, capacityTier, nonSmokingStatus, cardPaymentAvailable,
         dinnerBudgetTier, location, providerPageUrl, walkingTimeMinutes]
      additionalProperties: false
      properties:
        candidateRef:
          type: string
          description: >-
            Opaque current-response UI identity for card-marker highlighting. It
            is not a provider identifier and must not be shown or persisted.
        name:
          type: string
        genre:
          type: string
          description: Provider-supplied genre label; do not alter it.
        description:
          type: string
          nullable: true
          description: Provider-supplied introduction text; null when not supplied.
        regularHoliday:
          type: string
          nullable: true
          description: Provider-supplied regular-holiday reference; null when not supplied.
        totalSeats:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Provider-supplied total-seat reference; null when not supplied.
            Retained for exact machine comparison only (see the browser
            interface's rawValueAttribute); the visible card value is
            capacityTier's coarse label, not this number. This value does
            not indicate reservation availability.
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
          description: >-
            A coarse seating-scale reference derived from totalSeats; null
            exactly when totalSeats is null. It describes the shop's scale
            only -- it is not a claim about reservation ease, availability,
            or whether a given party size can be seated. Card-display only;
            never a filter or a sort key (adr/0023: the organizer judged
            sorting by exact seat count unhelpful, and this remains
            display-only reference information, unchanged from adr/0019).
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
          description: >-
            Provider-supplied non-smoking reference (full non-smoking,
            partial, or no non-smoking seating); null when not supplied. Do
            not treat null as NONE -- an unconfirmed reference is not a claim
            of no non-smoking seating. See `CandidateFilters.nonSmokingOnly`
            for how this drives filtering and ordering.
        cardPaymentAvailable:
          type: boolean
          nullable: true
          description: >-
            Provider-supplied credit-card-acceptance reference; null when not
            supplied. This reflects credit-card acceptance only, not other
            payment methods (cash, e-money, or other cashless methods), and
            must not be presented as a claim that the shop accepts only cash.
            See `CandidateFilters.cardPaymentOnly` for how this drives
            filtering and ordering.
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
          description: >-
            A coarse dinner-price-range reference derived from the provider's
            budget data; null when not supplied. This is the provider's
            dinner-oriented budget figure only -- it must never be presented
            as, or used to infer, a lunch price, and no rationale, label, or
            caution derived from it may state or imply a lunch price
            threshold. The per-candidate visible label is the tier word
            alone (e.g. 低/中/高 for LOW/MID/HIGH); it does not itself
            restate that this is a dinner figure or any yen amount/range. The
            dinner-basis disclosure appears once, only in the expanded filter
            panel, and does not include a tier-to-yen mapping (adr/0023
            decision 10 as amended 2026-08-11). This changes the unit at
            which adr/0019 decision 8's "always disclose this is a dinner
            figure" requirement is satisfied, from per-card to the expanded
            filter panel. See `CandidateFilters.budgetTiers`
            for how this drives filtering and ordering; this filter is never
            sent to the provider.
        location:
          $ref: '#/components/schemas/ShopLocation'
        providerPageUrl:
          type: string
          format: uri
          description: >-
            Provider page for the organizer's final menu, hours, and
            reservation confirmation. The browser may hold this value in
            `sessionStorage` for the sole purpose of later sending it back as
            a member of a request's `shownProviderPageUrls` (adr/0024
            decision 4); it must not be persisted anywhere else (browser
            `localStorage`, a cookie, any other request field, a log, or any
            storage surviving the current tab), must not be used as a
            durable candidate identity across sign-in sessions or devices,
            and must not be retained for longer than
            candidate-search-browser-interface.yaml's
            `shownCandidateMemory.expiry.maxAge` (no more than 24 hours,
            per Hot Pepper's terms of service; adr/0024 decision 4 item 8,
            2026-08-14 addendum). adr/0023 decision 5 removed the
            previously-shown-candidate mechanism that once demoted repeats
            within a single response's processing using this value; adr/0024
            reintroduces a bounded, browser-held, tab-lifetime-and-24-hour-
            or-less use of the same value for selection priority -- see
            adr/0024 for how this differs from, and why it does not reopen,
            adr/0023 decision 5 or adr/0018's deferral of durable
            provider-identifier and cache adoption.
        walkingTimeMinutes:
          type: integer
          minimum: 0
          description: >-
            Estimated one-way walking minutes from the search origin
            (`CandidateProposalResponse.searchOrigin`) to this candidate's
            `location` (adr/0025 decision 2). It is always present: unlike
            `totalSeats`, `nonSmokingStatus`, `cardPaymentAvailable`, and
            `dinnerBudgetTier`, this value is computed by the server from two
            coordinates that are always available server-side, not read from
            a provider field that can be missing, so there is no "not
            supplied" case and this property is never null. It is an
            **estimate, not a measurement of an actual walked route**; the
            visible card value must be presented in a way that cannot be read
            as a definitive or measured time (e.g. approximation wording),
            and never as a guarantee. The calculation basis (straight-line or
            road-network distance) is an implementation choice this contract
            deliberately does not fix (adr/0025 decision 2 and its "検証の
            申告" context section). See `CandidateFilters.walkingTimeMaxMinutes`
            for how this drives filtering; this value and that filter are
            never sent to or received from the provider.
    ShopLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        Returned shop location for the Leaflet marker only. It never represents
        the private configured search origin, a route, or the browser's current
        location. See `SearchOriginLocation` for the separate schema that now
        carries the search origin's own coordinates for map display (adr/0025
        decision 1); this schema's meaning (a candidate shop's own location)
        is unchanged by that addition.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    SearchOriginLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        The private runtime-configured search origin's coordinates, returned
        so the authenticated screen may show it as a map marker and may draw
        walking-time rings around it (adr/0025 decision 1). This is the
        organizer's own private search origin, supplied server-side by
        runtime environment variable and never committed to the public
        repository (adr/0002, adr/0025 decision 4); it becomes visible only
        to an authenticated organizer through this response, never to an
        unauthenticated visitor, a public URL, a log, an error, a trace, or
        Git. It carries only the origin's own coordinates -- never the
        configured search radius/range, a walking route, or the browser's
        current location (adr/0025 decisions 4 and 6). This is a distinct
        schema from `ShopLocation`: `ShopLocation` continues to mean a
        candidate shop's own location only and never represents this origin.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ProviderCredit:
      type: object
      required: [text, url]
      additionalProperties: false
      properties:
        text:
          type: string
          enum: ['Powered by ホットペッパーグルメ Webサービス']
          description: Required Hot Pepper text credit; do not alter it.
        url:
          type: string
          format: uri
          enum: ['http://webservice.recruit.co.jp/']
          description: Required destination of the Hot Pepper text credit.
    ProblemResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [AUTHENTICATION_REQUIRED, REQUEST_REJECTED,
             PROPOSAL_RATE_LIMITED, PROVIDER_UNAVAILABLE]
        message:
          type: string
          description: Safe user-facing text without a private location, credentials, or provider internals.
