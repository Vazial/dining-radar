# Dining Radar gathering-scheduling API — TDR-GTH candidate proposals
#
# ステータス: 承認待ち — architectが起草したドラフトである。人間の承認前（meta/adr/0043 方式(ii)）。
#   会スコープの契約。この行の形式はmeta/adr/0043の機械検証が要求する
#
# 2026-08-30 起草 (architect、ADR-0035):
# - 会（Gathering）・候補日（CandidateDate）・参加者リンク（ParticipantLink）・日程回答
#   （ScheduleResponse）を、この製品が初めて持つ永続データとして新設する（ADR-0034決定6・§7が
#   定める境界: 会に固有のデータだけを保持し、provider由来の店舗属性は永続化しない）。
# - 会の状態遷移: 会を作成する操作は、名前と1件以上の候補日を同時に受け取り、作成直後から
#   `SCHEDULING`（日程を聞き中）の局面で作られる。`DRAFT`（下書き）は本APIが公開する永続状態としては
#   持たない——product-brief.md §2の状態機械の最初の局面は、会をつくるための入力（名前・候補日）を
#   まだ揃えていない、フォーム記入中のクライアント側の一時的な状態を指すものと解釈した
#   （architectの設計判断。ADR-0035文脈4節参照。契約全体がまだ承認待ちのため、この解釈自体も
#   人間のレビュー対象である）。**2026-09-01、この解釈はD10（人間裁定）により正式に確定した——
#   下記2026-09-01追補、およびADR-0038を参照。**
# - 「その日に開いている店」の判定（`CandidateDateOpenShopPreview.openShopCount`・
#   `ParticipantScheduleQuestion.openShopCount`）は、`regularHoliday`の自由記述から曜日を緩く
#   照合する方式を採用する（ADR-0035決定6、ADR-0023決定2のソフト絞り込み哲学を踏襲）。この方式が
#   product-brief.md §3・§6 の従来の記述の範囲を部分的に広げることは、**2026-08-30の人間裁定
#   （選択肢UI、案A「曜日照合をスコープへ」）で会スコープに限り正式に確定済みである**——起草時点では
#   この点をADR-0035の未決事項1として持ち越していたが、同日中に決着した（ADR-0035決定6）。祝日・
#   営業時間・特定日単位の営業断定は引き続き対象外であり、この照合は除外の目安であって営業を保証する
#   ものではない。product-brief.md §3・§6もこの決着に合わせて改訂済みである。
# - 署名付きリンク（ParticipantLink）のトークンは、会ごと・参加者スロットごとに一意で使い回しが
#   できないが、有効期限内は同じトークンで繰り返しアクセス・変更ができる（ADR-0035決定4。
#   「使い捨て」の意味の確定）。有効期限・レート制限の具体値はADR-0035決定4を参照——契約の
#   スキーマ自体には具体的なレート制限の閾値を固定しない（`candidate-search-api.yaml`の
#   `ProposalRateLimited`と同じ流儀）。
# - browser-interface契約（`gathering-scheduling-browser-interface.yaml`）は今回起草しない
#   （ADR-0035決定5）。本APIはブラウザの画面レイアウトに依存しない業務・データ契約としてのみ
#   起草した。
# - 承認投票・店の絞り込み連携・確定は次スライス以降の契約が扱う（ADR-0035決定2、当時）。本ファイルは
#   `SELECTING_SHOP`局面への遷移までを扱い、その先の店の絞り込み・投票・確定に関するエンドポイントは
#   含まない。**2026-09-03、この境界はADR-0040により統合スライスへ変更された——下記参照。**
#
# 2026-08-30 追補 (architect、ADR-0036決定7。人間裁定「発行済みリンクの管理面を第1弾に含める」):
# - 発端は人間の懸念「リンクがわからなくなったら管理されなくなっちゃうかもね」。幹事が発行済みの
#   参加者リンクを一覧で確認し、再コピーし、未回答のものを失効できるようにする
#   （listParticipantLinks・recopyParticipantLink・revokeParticipantLink）。
# - **D2の分母の定義を改める**: 「まだn人が未回答」の分母は、これまで`totalIssuedParticipantLinks`
#   （生涯発行本数）そのものだったが、失効したリンクを分母から除くため、新設の
#   `Gathering.activeParticipantLinkCount`（=生涯発行本数−生涯失効本数）へ差し替える。
#   `totalIssuedParticipantLinks`自体の意味（生涯発行本数、失効の有無に関わらず単調増加）は変えない
#   ——監査目的でこの値も引き続き残す。新設の`totalRevokedParticipantLinks`と合わせて3値
#   （発行・失効・実効）を透明に見せる。
# - **失効は未回答のリンクに限る**（人間裁定）: 既に日程へ1件でも回答したリンクは失効できない
#   （`PARTICIPANT_LINK_ALREADY_ANSWERED`）。名前だけを付けて日程には未回答のリンクは、本契約の
#   「回答済み」の定義（`respondedParticipantCount`と同じ——日程回答が1件以上あること）に照らして
#   失効できる側に含まれる。
# - **トークンの一覧内再露出はしない**（architectの設計判断、ADR-0036決定7）: 一覧
#   （`listParticipantLinks`）の各項目にはtoken/urlを含めない。再コピーは専用の1件だけを対象とする
#   別操作（`recopyParticipantLink`）とし、参加者アクセス資格情報が一度に複数件レスポンスへ載る
#   経路を作らない。管理用の識別子`linkId`は参加者アクセスに使えない別種のIDとする。
# - 失効済みトークンで参加者がアクセスすると`LINK_REVOKED`（410、`LINK_EXPIRED`と同じステータス
#   コードだが別コード）を返す——失効と有効期限切れは原因が異なるため区別する。
#
# 2026-09-01 追補 (architect、ADR-0038。人間裁定6件、実機フィードバック「幹事画面への入口が無い」への対応):
# - 実装スライス第1弾の公開後、人間が実機で「ランチ候補画面から会へ辿れない・会をつくる画面が無い・
#   会一覧が無い」ことを発見した。designerが入口画面群（`E:\AWS\dsg-out\party\Entry.dc.html`・
#   `AddDate.dc.html`・`Handoff.dc.html`）を描き、人間が2026-09-01のチャット（選択肢UI）で6件を
#   裁定した。
# - **D10: 会の作成は候補日1つ以上を要求するため、下書き（候補日0件の会）という状態は最初から
#   存在しない。会の作成は直接`SCHEDULING`局面で行われる**。これは本ファイルが起草時点から
#   採用していた設計そのものである（`GatheringPhase`enumは元々`DRAFT`を含まない）——本追補は
#   この既存設計を人間が正式に承認したことを記録するだけであり、スキーマ変更は伴わない。
# - **会の一覧**（`listGatherings`）を新設する。幹事の入口画面（Entry.dc.html E-1）であり、
#   「新しい順」（`createdAt`降順）に並ぶ。`Gathering`へ`createdAt`（新規必須フィールド）を追加した
#   ——一覧の並び順に必要になったため。削除操作は追加しない（D4＝案A、2026-08-30裁定、維持）。
# - **候補日の重複防止**（architectの設計判断、人間裁定の対象外——designerが「契約が定めていない」と
#   申し送っていた2点のうちの1つ）: 同じ会に同一`startAt`（日時が完全一致）の候補日を重ねて追加
#   しようとすると`DUPLICATE_CANDIDATE_DATE`で拒否する。`createGathering`のリクエスト内の重複
#   （複数の`candidateDates`要素が同一`startAt`を持つ）も同じコードで拒否する。理由は
#   `AddDate.dc.html`が指摘したとおり——インライン フォームは「足したあとフォームは閉じない」
#   ため、連続入力時の誤操作（同じ日時をもう一度送る）が構造的に起きやすい。
# - **時刻は既存スキーマで既に必須**（designerの申し送りへの回答）: `CandidateDateInput.startAt`は
#   `format: date-time`であり、日付だけの入力を受け付けない——時刻を必須にするかどうかという
#   designerの問いは、起草時点の本スキーマが既に「必須」側で答えていたことになる。新しい決定は
#   要らない。
# - **ランチ候補画面から会への導線**（人間裁定: ヘッダーに「会」ボタン＋進行中件数バッジ、
#   `Handoff.dc.html`案B）が必要とする「進行中の会の件数」を返す`getInProgressGatheringCount`を
#   新設する。候補探索画面（`candidate-search-browser-interface.yaml`）がこのエンドポイントを
#   呼ぶ——2つの機能が初めて結合する（designerの指摘どおり）。件数は`SCHEDULING`・
#   `SELECTING_SHOP`局面の会だけを数え、`FINALIZED`は数えない（用が済んでいるため、designerの
#   判断をそのまま採用）。
#
# 2026-09-03 追補 (architect、ADR-0040。人間裁定「作りかけ。見て判断できるところまで作りこんでほしい」
#   を受け、第2〜4弾（店の絞り込み連携・承認投票・確定・確定後表示）を1本の契約スライスへ統合):
# - **スライス統合**: ADR-0035決定2が定めた4分割（第1弾=会の作成と日程調整／第2弾=店の絞り込み連携／
#   第3弾=承認投票／第4弾=確定）のうち、まだ実装されていない第2〜4弾を、本ファイルの1回の改訂で
#   まとめて契約化する。これは人間の明示裁定（2026-09-03）による——分割の判断そのもの
#   （ADR-0035決定2）を撤回するものではなく、その後の統合実装方針として上書きする。
# - **5件選定（shortlist）**: `PUT /gatherings/{gatheringId}/shortlisted-shops`
#   （`setShortlistedShops`）を新設する。開催日確定後、その日に開いている店（既存の
#   `previewOpenShopsForCandidateDate`が返す母集団と同じ判定を使う）から幹事が1〜5件を選び、
#   参加者の承認投票を開始する。**この呼び出しは`Gathering.phase`を進めない**——product-brief.md
#   §2は「この5件で投票する」を局面を進める3操作の1つとして書いているが、`GatheringPhase`enumは
#   ADR-0035起草時から一貫して3値（`SCHEDULING`/`SELECTING_SHOP`/`FINALIZED`）であり、
#   `SELECTING_SHOP`局面の中に「絞り込み中」「投票実施中」という2つのサブ状態を区別する専用の
#   enum値は存在しない——`Organizer.dc.html`自身も②を「店を選び中・投票実施中」という1つの局面
#   ラベルの下で描いている。**これはFR-028として報告する食い違いである**: product-brief.md §2の
#   文言（「局面を進める3操作」に本操作を含める）と、確定済みのenum値集合（3値のまま、ADR-0035）は
#   文字どおりには両立しない。architectは新しい局面値を追加せず、既存のenumをそのまま維持する
#   側で解消した——投票開始は`Gathering.votingStartedAt`（null→非null）というサブ状態遷移として
#   表現し、`phase`自体は`SELECTING_SHOP`のまま変わらない。人間のレビュー対象として記録する
#   （ADR-0040参照）。**2026-09-03、続く選択肢UIで人間がこの点（未決事項1）を決着させた——下記
#   2026-09-03追補2、およびADR-0041を参照。**
# - **D7（投票開始後の差し替え）**: `setShortlistedShops`は投票開始後も呼び直せる（差し替え）。
#   残す店（前回と同じ`shopId`）は`addedAt`と票を引き継ぐ。新しく加える店は`addedAt`を今回の
#   呼び出し時刻にリセットし、票は0から始まる。外れる店は一覧から取り除かれ、票の履歴は保持しない
#   （再度同じ`shopId`を加えたときは新規追加として扱う——architectの設計判断、簡潔さを優先した）。
# - **承認投票**: `PUT /participant-links/{token}/shop-votes`（`setShopVotes`）を新設する。
#   参加者は現在の5件（以下）の中から「行ってもいい店」を0件以上いくつでも選べる（1人1票ではない、
#   product-brief.md §2）。呼び出すたびに全体を置き換える（部分トグルではない）。**D7のための
#   分母設計**: 各`ShortlistedShop`は自分の`addedAt`以降に投票した参加者の数を独自の分母
#   （`respondedParticipantCount`）として持つ——`Vote.dc.html`が示すとおり、投票開始時から
#   ある店は「回答した8人のうち」、差し替えで後から加わった店は「入れたあとに答えた1人のうち」と、
#   店ごとに異なる分母を表示するため。参加者の直近の投票送信時刻が、ある店の`addedAt`より前で
#   あれば、その参加者はその店については「まだ答えていない」（`yourApproval: null`）として扱う。
# - **確定**: `POST /gatherings/{gatheringId}/finalize`（`finalizeGathering`）を新設する。
#   幹事が5件のうち1件を選んで確定する（票は決定のための材料であって決定そのものではない、
#   product-brief.md §2——最多得票を自動採用するAPI設計にはしない）。`phase`を`FINALIZED`へ
#   進める。product-brief.md §2の3つ目の操作にあたる。
# - **確定後の拒否は既存の`GATHERING_FINALIZED`（409）を再利用する**（依頼どおり、新しいコードを
#   増やさない）: `setScheduleResponse`（既存）・`setShopVotes`（新規）・`issueParticipantLinks`
#   （新規で409を追加）のいずれも、確定後は`GATHERING_FINALIZED`で拒否する
#   （`Organizer.dc.html`②列の「もう発行しない（会が締まっている）」に対応）。
# - **確定後の表示**: `ParticipantView.decision`（新設、null許容）に、確定した候補日・確定した店
#   （店は生きた投影——ADR-0034決定6のとおり永続化しない）を載せる。非nullになるのは
#   `phase: FINALIZED`のときだけである（D1、2026-08-30裁定）。組織者向けは既存の`GET
#   /gatherings/{gatheringId}`がそのまま`phase`・`confirmedCandidateDateId`・
#   `finalizedShopId`を返すので新しいエンドポイントを増やさない。**2026-09-03、続く選択肢UIで
#   人間がこの内容を拡張した（P5）——下記2026-09-03追補2を参照。**
# - **browser-interface契約はまだ起こさない**（ADR-0013の順序）: designerが並行で、5件選定の導線・
#   参加者の確定後画面・幹事の確定後画面という、まだ描かれていない3点を描いている。人間が画面骨格を
#   承認した後、`gathering-scheduling-browser-interface.yaml`をこの契約に追随させる
#   （ADR-0040参照）。本ファイルと`gathering-scheduling.feature`は、画面に依存しない業務・データ
#   契約の部分を先に確定する。
# - **既知のギャップの解消・予告**（activeContext.mdより）: (1) FINALIZED局面の観測面ギャップは、
#   API面ではこの追補で解消した（`finalizeGathering`・`GATHERING_FINALIZED`の再利用・
#   `ParticipantView.decision`）——ただし**ブラウザ観測面（test id）は上記のとおりまだ起こさない**。
#   (2) 会一覧の「名前」data属性ギャップ（監査指摘、`gathering-list-item`に会の名前を機械観測する
#   手段が無い）は、本ファイルの変更範囲外（ブラウザ契約側の課題）であることを確認した——
#   `gathering-scheduling-browser-interface.yaml`を今回のスライドで改訂する際に追加する前提を
#   ADR-0040へ予告として記録する。
#
# 2026-09-03 追補2 (architect、ADR-0041。人間裁定6件、P1〜P6、2026-09-03チャット選択肢UI):
# - **P1（確認のみ）**: 5件選定は幹事ダッシュボード内で完結する（案A）。`setShortlistedShops`・
#   `previewOpenShopsForCandidateDate`の再利用という既存API設計は、この前提とすでに整合して
