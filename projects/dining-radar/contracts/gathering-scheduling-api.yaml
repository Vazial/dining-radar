# 2026-09-04 追補 (architect、ADR-0042。designerがPickFive.dc.html／Final.dc.htmlを仕上げ、
#   browser-interface契約を起草する過程で発見した1件の自己監査による修正):
# - **`OpenShopPreviewItem`に`shopId`を追加する**: PickFive.dc.html（5件選定、案A＝ダッシュボード
#   内のチェックリスト）を観測可能にするには、一覧の各行が`setShortlistedShops`へ送る実際の
#   `shopId`を特定できる必要がある。しかし`previewOpenShopsForCandidateDate`（`ADR-0040`が
#   「5件選定の下見にも再利用する」とした既存エンドポイント）の`OpenShopPreviewItem`は、起草時点
#   （`ADR-0035`）から一貫して表示専用フィールドのみを持ち、`shopId`を含んでいなかった——
#   `CandidateDateOpenShopPreview.previewShops`の説明文も「この対応づけ方法は固定しない」と
#   明示的に先送りしていた。browser-interface契約がチェックボックスと`shopId`を結びつける
#   具体的な観測面を必要とする段になり、この先送りは実装不能な仕様になることが判明したため、
#   `OpenShopPreviewItem`へ`shopId`（必須）を追加し、先送りの記述を削除した。これは今回の
#   designer材料・人間裁定のいずれにも起因しない、architect自身が契約起草の過程で見つけた
#   実装可能性の穴の修正である（FR-028として報告する）。
#
# 2026-09-04 追補2 (architect、ADR-0043。developerが実装中に発見した契約の自己矛盾、FR-028):
# - `browserEntry.participantAnswer.validLinkOutcome`と`scheduleQuestion.presenceRule`
#   （いずれも`gathering-scheduling-browser-interface.yaml`側）が、確定後の状態について
#   文字どおり矛盾していた件を修正した。本ファイル（`gathering-scheduling-api.yaml`）自体は
#   この修正で変更していない——詳細はADR-0043を参照する。
#
# 2026-09-04 追補3 (architect、ADR-0044。本番の実機フィードバック3点への対応。人間裁定は
#   2026-09-04チャット選択肢UIによる。version 0.5.1 -> 0.6.0):
# - **不具合の修正（参加者の店の並びが投票のたびに変わって見える）**: 原因は
#   `ParticipantView.shopVoteQuestions`の並び順が、幹事向けの`Gathering.shortlistedShops`
#   （得票数の多い順、投票が増減するたびに変わりうる）をそのまま流用していたことだった。
#   **参加者向けの並びを`addedAt`昇順（この参加者が最初にこの投票画面を開いたときの並びが、
#   誰が何票入れても変わらない）へ切り離した**——幹事向けの並び（票数順、常に変わりうる）とは
#   意図的に異なる基準にする。`addedAt`はこのフィールド自体をParticipantShopVoteOptionへ
#   新規公開するのではなく、レスポンスの配列順序という形で表現する（幹事向け管理メタデータを
#   参加者に不要に開示しないため）。同じ理由でD7の「差し替えで新しく加わった店は末尾に来る」
#   という既存の設計（`addedAt`リセット）は、参加者向けの並びにもそのまま矛盾なく適用される
#   （新しく加わった店は参加者の目にも新しく最後に現れる、票が動くことでは動かない）。
#   **2026-09-04、この`addedAt`昇順という並びの基準は、下記追補4で近い順へ置き換わった**——
#   「投票しても並びが動かない」という性質自体はこの追補3の記述どおり保たれるが、その実現方法が
#   変わった。この段落は下書き時点の判断として履歴に残す。
# - **店の投票を三段階にする**（人間裁定、日程回答と同じ手触り「行ける・たぶん・むり」）:
#   `ParticipantShopVoteOption.yourApproval`（boolean、null許容）を`yourVote`
#   （新設`ShopVoteStatus`、null許容）へ置き換えた。`ShortlistedShop.approvalCount`を
#   `goingCount`/`maybeCount`/`notGoingCount`（`CandidateDate`と同型の3値内訳）へ置き換えた
#   ——`respondedParticipantCount`（D7の店ごと分母）はそのまま維持し、常に3値の合計に等しい
#   という不変条件を明記した。`SetShopVotesRequest.approvedShopIds`（文字列配列、包含=承認）を
#   `votes`（`{shopId, status}`の配列、この参加者の現在の完全な回答集合を置き換える）へ置き換えた
#   ——`setShopVotes`のパス・operationId自体は変更していない（既存の「クリックのたびに現在の
#   全回答を送り直す」呼び出し形を維持し、browser-interface側の`securityObservations`・
#   `browserActions`が参照するoperationId名を無用に壊さないため）。`ParticipantView.decision`の
#   `yourApprovedShops`（承認した店だけの一覧）を`yourShopVotes`（投票にかけられた全店への
#   この参加者自身の回答、三段階の値つき）へ置き換えた——三段階には単一の「承認した」区分が
#   無いため、旧来の「trueだけを抽出する」設計をそのまま引き継げなかった。**この一般化は
#   `yourScheduleResponse`（値によらず1つの回答を返す）と同じ流儀であり、P5の「投票後に
#   振りかえられる」という意図をより完全に満たす**（旧設計は「むり」相当の回答を暗黙に
#   落としていた）。**2026-09-04、この三段階の呼び名（enum値・表示文言）は下記追補4で
#   人間裁定どおりの語彙へ是正された**——この段落は下書き時点の判断として履歴に残す。
#   **1人1票ではないという原則は保たれる**: 三段階でも、参加者は「1店だけを選ぶ」のではなく
#   「投票にかけられた店それぞれに」答える——最多得票が2〜3票にしかならない、という当初の懸念
#   （product-brief.md §2）に対する対策としての多店舗回答という構造は変わっていない。むしろ
#   二値の承認/非承認より粒度が上がった分、幹事が受け取る材料は増えている。
# - **会の中に地図と店の情報を出す**（人間裁定、幹事の選定画面・参加者の投票画面の両方に、ランチ
#   候補画面と同じ地図・徒歩の目安・席数の目安・禁煙対応・予算感の目安・店のページへのリンクを
#   出す）: `OpenShopPreviewItem`・`ShortlistedShop`・`ParticipantShopVoteOption`・
#   `LiveProjectedShop`のいずれにも`location`（新設`ShopLocation`、緯度経度）・
#   `walkingTimeMinutes`（新設、整数分、非null）・`providerPageUrl`（新設、URI）を追加した。
#   「席数の目安」「禁煙対応」「予算感の目安」は`capacityTier`/`nonSmokingStatus`/
#   `dinnerBudgetTier`としてこれら4スキーマにすでに存在しており追加不要だった。
#   **`ADR-0034`決定6は必ず守る**——これら3フィールドはいずれも会のレコードに永続化しない。
#   `candidate-search-api.yaml`の`Candidate.location`/`walkingTimeMinutes`/`providerPageUrl`と
#   同じ計算・同じ非公開の検索基点を、読み出しのたびに引き直す生きた投影である。
#   **地図の範囲を明示的に絞った**: 本追補が追加するのは各店「自身」の位置（`ShopLocation`、
#   店のピン）だけであり、`candidate-search-api.yaml`の`SearchOriginLocation`
#   （幹事の非公開の検索基点、同心リング付きの地図）に相当するものは追加していない——「同じ地図」
#   という人間の言葉を、この契約では「各店の位置を示す地図」として満たす。幹事の選定画面が将来
#   ランチ候補画面と同じ基点マーカー・同心リング付きの地図まで欲しくなった場合は、別途この契約への
#   追加判断が要る（ADR-0044未決事項として申し送る）。
#   **ADR-0025との境界の拡張について（人間の確認を要する未決事項として明記）**: `ADR-0025`は
#   「検索基点・徒歩時間は認証済み画面（招待制の幹事アカウント）に表示してよい」と決定した際、
#   その根拠を「この画面を開けるのは招待制認証を通った幹事だけであり、幹事は全員が基点の界隈に
#   いる」ことに置いていた。参加者は署名付き共有リンクでアクセスする、個別に認証されていない
#   利用者であり、必ずしも基点の近くにいるとは限らない（家族・遠方の知人等がリンクを受け取る
#   可能性がある）。`walkingTimeMinutes`（数値の徒歩分）は基点の座標そのものを開示しないが、
#   店の住所（`providerPageUrl`から確認できる、または`location`から地図で分かる）と組み合わせると、
#   基点のおおよその位置——product-brief.md §4が公開リポジトリ・実装から隠すことを求めている
#   「生活圏」——を間接的に推測できてしまう余地がある。本追補はこの点を解消せず、依頼どおり
#   `walkingTimeMinutes`を`ParticipantShopVoteOption`へも追加した（人間の2026-09-04裁定が
#   参加者の投票画面を明示的に対象へ含めていたため）が、**この拡張がADR-0025の認証済み画面限定
#   という前提を意図して広げたものか、見落としだったのかは、人間の再確認を推奨する**——FR-028の
#   流儀（解消せず報告）に従う。**2026-09-04、この未決事項は下記追補4・ADR-0045で決着した**——
#   人間は参加者画面への検索基点の開示そのものを明示的に裁定しており、見落としではなく意図した
#   拡張である。
#
# 2026-09-04 追補4 (architect、ADR-0044・ADR-0045。version 0.6.0 -> 0.7.0。並行して本ファイルへ
#   書き込み中だった上記追補3の下書きを土台に、人間裁定との3点の食い違いを是正し、参加者画面への
#   検索基点の開示を追加する):
# - **是正1（三段階の呼び名）**: 人間裁定は店の投票の三段階を「行きたい／行ってもいい／むり」と
#   名付けている——追補3までの下書きは日程回答と同じ「行ける／たぶん／むり」をそのまま流用していた。
#   `ShopVoteStatus`の enum 値を`GOING`/`MAYBE`/`NOT_GOING`から`WANT_TO_GO`/`OK_TO_GO`/
#   `NOT_GOING`へ改め、店の好みという別の意味を持つ値であることを名前でも示す
#   （`ScheduleResponseStatus`とは意図的に異なる語彙のまま。ADR-0044決定1参照）。付随して
#   `ShortlistedShop`・`ParticipantShopVoteOption.tally`の集計フィールド名を`goingCount`/
#   `maybeCount`から`wantToGoCount`/`okToGoCount`へ改めた（`notGoingCount`は据え置き——「むり」の
#   意味は日程・店のどちらでも変わらないため）。
# - **是正2（幹事の並び）**: 人間裁定は幹事の店の並びを「行ける人が多い順（＝『行きたい』＋
#   『行ってもいい』の合計が多い順）」と定めている——追補3までの下書きは単一の`goingCount`
#   （「行きたい」だけ）で並べていた。`Gathering.shortlistedShops`・`ShortlistedShop`の並び規則を
#   `wantToGoCount + okToGoCount`の降順へ改めた（ADR-0044決定3）。
# - **是正3（参加者の並び）**: 人間裁定は参加者の店の並びを「近い順（答えても並びは動かない）」と
#   定めている——追補3までの下書きは`addedAt`昇順で固定する方式を採っていた（並びが動かないという
#   性質は満たすが、近い順ではない）。`ParticipantView.shopVoteQuestions`の並びを、`candidate-
#   search-api.yaml`と同じ近い順（検索基点からの距離の昇順、`walkingTimeMinutes`の丸め値ではなく
#   生の距離で同着を避ける）へ改めた（ADR-0044決定2）——距離は店の位置と検索基点だけで決まり投票
#   結果に依存しないため、この基準は`addedAt`方式と同じく「投票しても変わらない」という要求を
#   自動的に満たし、かつ人間の指定どおり近い順にもなる。`addedAt`自体は`yourVote`の「まだ答えて
#   いない」判定（D7）には引き続き使う——並び順の基準からだけ外した。
# - **参加者の地図に検索基点を出す**（人間裁定、`ADR-0045`が`ADR-0025`決定1の認証済み画面限定を
#   署名付きリンクの参加者画面へ拡張する）: `ParticipantView.searchOrigin`
#   （新設`SearchOriginLocation`、`candidate-search-api.yaml`と同型）を追加した。非nullになる条件は
#   `shopVoteQuestions`と同じ（`Gathering.votingStartedAt`が非null、つまり投票開始後——確定後も
#   含む）。**`ADR-0025`との境界拡張は`ADR-0045`が正式に判断する**——前回追補が「解消せず報告」と
#   していた未決事項はこれで決着した。
# - **既存の二択の投票データは移行しない**（人間裁定）: 本番で稼働していた旧`approvedShopIds`方式の
#   投票データは、実運用の記録が実質無いことを理由に、移行の仕組みを設計しない。実装スライスでは
#   単純に破棄（テーブルの列を置き換え、既存行は失われる）してよい——ADR-0044決定5参照。
openapi: 3.0.3
info:
  title: Dining Radar Gathering Scheduling API
  version: 0.7.0
  description: >-
    Lets an authenticated organizer list their gatherings, create a gathering
    with candidate dates, add further candidate dates while scheduling, issue
    signed participant links, list/recopy/revoke previously issued links
    (recopy and revoke remain available even after finalization, P4,
    adr/0041 -- only new issuance is blocked), confirm one candidate date
    once schedule responses have arrived, shortlist 1 to 5 open shops from
    within the same organizer dashboard and start voting (P1, adr/0041),
    replace that shortlist while keeping kept shops' votes, and finalize one
    date/shop pair -- from the shops open on the confirmed date, ordered by
    the combined count of participants willing to go (WANT_TO_GO plus
    OK_TO_GO, descending, adr/0044). Lets a participant holding a signed
    link answer per-date availability (GOING/MAYBE/NOT_GOING) without an
    account, optionally attach a display name at any time, change any
    answer at any time, and once shop voting has started, answer each
    currently shortlisted shop with a three-tier WANT_TO_GO/OK_TO_GO/
    NOT_GOING vote of its own -- 行きたい／行ってもいい／むり, a distinct
    vocabulary from schedule availability's 行ける／たぶん／むり, since a
    shop vote expresses preference for a shop rather than availability on a
    date (adr/0044, 2026-09-04 human decision) -- also changeable at any
    time, and presented nearest-first from the private search origin, an
    order that never changes as votes are cast, by this participant or
    anyone else, because a shop's distance from that origin does not depend
    on its votes (adr/0044's fix for a production defect where the
    participant list re-sorted itself after every vote using the
    organizer-facing vote-count order). Every shop the organizer's
    shortlist screen and the participant's vote screen show carries the
    same map/detail information the lunch-candidate screen shows --
    location, an estimated walking time, a coarse seating-scale reference,
    a non-smoking reference, a coarse dinner-budget reference, and a link
    to the shop's own provider page (adr/0044, 2026-09-04 human decision)
    -- computed live from the same private search origin on every read,
    never persisted (adr/0034 decision 6). Once shop voting has started,
    the participant's own map also shows this same private search origin
    as a marker, the same disclosure ADR-0025 decision 1 already made to
    the authenticated organizer screen, now extended to this
    unauthenticated, signed-link screen (adr/0045, 2026-09-04 human
    decision). Once the organizer finalizes, both organizer and
    participant see the decision only, including the participant's own
    retrospective schedule answer and this participant's own answer for
    every shop they were asked about at the finalized date (P5, adr/0041,
    generalized to the three-tier model by adr/0044) -- never another
    participant's answers or votes; no further schedule response, shop
    vote, or link issuance is accepted (GATHERING_FINALIZED). This
    contract now covers the full "会の作成と日程調整・店の絞り込み連携・
    承認投票・確定" scope (adr/0040 merges what adr/0035 decision 2 had
    originally split into 4 slices, per explicit 2026-09-03 human decision;
    adr/0041 records a further round of 6 human decisions the same day,
    P1-P6; adr/0042 adds the browser-interface contract and a self-audited
    OpenShopPreviewItem.shopId fix needed to make it implementable; adr/0044
    responds to three points of production field feedback -- a
    nearest-first, vote-independent participant shop order, a distinctly
    worded three-tier vote in place of the original
    approve-any-number-of-shops model, and map/detail information on both
    the organizer's shortlist screen and the participant's vote screen;
    adr/0045 extends adr/0025 decision 1's search-origin disclosure from the
    authenticated organizer screen to this unauthenticated participant
    screen). The gathering never persists provider-derived shop attributes
    (name, genre, location, walking time, seating/smoking/budget tier,
    provider page, hours, images); "open shop" counts, previews, and
    shortlisted-shop displays are all recomputed from the private candidate
    population on every read (adr/0034 decision 6). DRAFT: this contract
    version is not yet human-approved; see
    adr/0035-scope-the-gathering-scheduling-slice-and-record-2026-08-30-decisions.md,
    adr/0036-adopt-gathering-scheduling-browser-interface-contract.md
    (decision 7, participant-link management),
    adr/0038-add-gathering-entry-screens-and-remove-the-draft-phase.md
    (gathering list, creation screen, inline add-date form, candidate-screen
    entry point),
    adr/0040-merge-shop-narrowing-voting-and-finalization-into-one-slice.md,
    adr/0041-refine-shortlisting-recopy-and-the-finalized-participant-view.md,
    adr/0042-adopt-shortlist-vote-finalize-browser-interface-contract.md,
    adr/0044-move-shop-voting-to-three-tiers-stabilize-participant-order-and-add-shop-map-details.md,
    and
    adr/0045-extend-search-origin-disclosure-to-the-participants-signed-link-screen.md
    (this revision).
servers:
  - url: https://app.example.invalid
    description: >-
      Placeholder HTTPS public origin, same as candidate-search-api.yaml. The
      authentication and public-deployment slice selects and configures the
      real origin.
paths:
  /gatherings:
    get:
      operationId: listGatherings
      summary: List every gathering the authenticated organizer organizes
      description: >-
        The organizer's entry point (Entry.dc.html E-1, adr/0038). Ordered by
        `createdAt` descending (新しい順). Includes gatherings in every phase,
        including FINALIZED -- there is no delete operation (D4, 2026-08-30
        decision, unchanged) and finalized gatherings remain visible for
        reference. An organizer with zero gatherings receives an empty array
        (the empty-state screen, Entry.dc.html E-1b, is a pure client-side
        rendering of that empty array, not a distinct API state).
      security:
        - organizerSession: []
      responses:
        '200':
          description: Every gathering this organizer organizes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
    post:
      operationId: createGathering
      summary: Create a gathering with its initial candidate dates
      description: >-
        Creates a gathering in the SCHEDULING phase. A gathering cannot be
        created without at least one candidate date; this contract does not
        expose a persisted DRAFT phase (see 起草時の判断 in this file's
        header comment; confirmed by human decision D10, 2026-09-01,
        adr/0038). Also generates no participant links -- issuing links is a
        separate operation (issueParticipantLinks). Rejects the request with
        DUPLICATE_CANDIDATE_DATE if `candidateDates` contains two or more
        entries with the exact same `startAt` (adr/0038, architect design
        judgment -- see this file's 2026-09-01 header comment).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringRequest'
      responses:
        '201':
          description: The created gathering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/RequestRejected'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/DuplicateCandidateDate'
  /gatherings/in-progress-count:
    get:
      operationId: getInProgressGatheringCount
      summary: Count this organizer's gatherings that are not yet finalized
      description: >-
        Supports the candidate-search screen's header entry point to the
        gathering feature (Handoff.dc.html option B, human decision
        2026-09-01, adr/0038): a "会" button with a badge showing this count.
        Counts gatherings in phase SCHEDULING or SELECTING_SHOP only; a
        FINALIZED gathering is not counted (its business is done, designer's
        judgment carried into this contract). This is a deliberate coupling
        point between the candidate-search screen and the gathering feature
        -- see candidate-search-browser-interface.yaml's gatheringEntry
        section for how the browser consumes this value.
      security:
        - organizerSession: []
      responses:
        '200':
          description: The count of this organizer's not-yet-finalized gatherings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InProgressGatheringCountResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /gatherings/{gatheringId}:
    get:
      operationId: getGathering
      summary: Get the organizer dashboard view of one gathering
      description: >-
        Returns everything the organizer dashboard needs across all three
        phases of the same screen (Organizer.dc.html's own framing: "同じ1画面
        が3つの顔を持つ") -- schedule tallies and link-management counters
        while SCHEDULING, shortlisted-shop vote tallies once shortlisted
        (SELECTING_SHOP, adr/0040), and the finalized date/shop once
        FINALIZED. Shop shortlisting itself happens from within this same
        dashboard response/screen, not a separate one (P1, adr/0041). This
        contract does not split these into separate endpoints per phase.
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/GatheringId'
      responses:
        '200':
          description: >-
            The gathering, its candidate dates (with schedule tallies),
            participant-link issuance counters, and (once shortlisted)
            shortlisted-shop vote tallies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
  /gatherings/{gatheringId}/candidate-dates:
    post:
      operationId: addCandidateDate
      summary: Add one more candidate date while the gathering is scheduling
      description: >-
        Only accepted while the gathering's phase is SCHEDULING
        (product-brief.md §2: the organizer may add candidate dates until
        choosing one). Once the gathering has moved to SELECTING_SHOP or
        FINALIZED, this operation is rejected. Rejects the request with
        DUPLICATE_CANDIDATE_DATE if `startAt` exactly matches an existing
        candidate date already on this gathering (adr/0038, architect design
        judgment).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateDateInput'
      responses:
        '201':
          description: The updated gathering, including the newly added candidate date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
        '409':
          description: >-
            Either the gathering is not in the SCHEDULING phase
            (GatheringNotInSchedulingPhase) or `startAt` duplicates an
            existing candidate date (DuplicateCandidateDate); the `code`
            field distinguishes the two.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              examples:
                notScheduling:
                  value:
                    code: GATHERING_NOT_IN_SCHEDULING_PHASE
                    message: This gathering has already moved past scheduling.
                duplicate:
                  value:
                    code: DUPLICATE_CANDIDATE_DATE
                    message: This candidate date has already been added.
  /gatherings/{gatheringId}/candidate-dates/{candidateDateId}/open-shop-preview:
    get:
      operationId: previewOpenShopsForCandidateDate
      summary: Preview shops open on one candidate date, without changing gathering state
      description: >-
        Supports the "simultaneous decision" flow (adr/0035 decision 1 item
        1, human addition 2026-08-30): the organizer may tentatively
        cross-check a candidate date against shop availability before
        choosing it. Also reused, unchanged, once the gathering has moved to
        SELECTING_SHOP to browse the confirmed date's open-shop population
        before calling setShortlistedShops, from within the same organizer
        dashboard (P1, adr/0041; adr/0040) -- this operation was already
        generic over any candidateDateId and phase, so no new endpoint or
        separate screen was needed for that later purpose. Calling this
        operation never advances the gathering's phase and never records
        which date, if any, the organizer is tentatively looking at -- the
        tentative selection is client-side UI state only. The population
        considered is the same private search origin used by
        candidate-search-api.yaml with default filters only
        (includeIzakayaBar=false, no organizer-narrowing filters yet, since
        shop narrowing has not started -- adr/0035 decision 2 slice
        boundary, at drafting time). `openShopCount` uses the weekday-based
        regularHoliday matching described in this file's header comment;
        its adoption for the gathering scope was confirmed by human
        decision 2026-08-30 (adr/0035 decision 6, option A).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/GatheringId'
        - $ref: '#/components/parameters/CandidateDateId'
      responses:
        '200':
          description: The open-shop count and a nearest-first preview subset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDateOpenShopPreview'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/CandidateDateNotFound'
  /gatherings/{gatheringId}/participant-links:
    post:
      operationId: issueParticipantLinks
      summary: Issue a batch of new, distinct signed participant links
      description: >-
        Issues `count` new tokens, each valid for this gathering and exactly
        one participant slot (adr/0035 decision 4). Calling this operation
        again later adds to `Gathering.totalIssuedParticipantLinks`; it does
        not replace or invalidate previously issued links. The organizer is
        responsible for distributing the returned URLs outside this product
        (Slack, email, etc. -- product-brief.md §2). Tokens and full URLs
        returned by this operation must never appear in a log, error, trace,
        or any storage this API retains beyond fulfilling this response
        (product-brief.md §4's API-key handling boundary, extended to
        participant tokens by adr/0035 decision 4). The approved screen
        always calls this with count: 1 -- one click issues and copies
        exactly one link (human decision 2026-08-30, ADR-0036 decision 4,
        option A); `count` accepting larger values remains schema headroom
        for a possible future bulk-issuance screen, not exercised by this
        slice. Rejected once the gathering is FINALIZED
        (Organizer.dc.html's confirmed-phase column: "もう発行しない（会が
        締まっている）", adr/0040) -- reuses the existing GATHERING_FINALIZED
        code rather than introducing a new one. **Contrast with
        recopyParticipantLink/revokeParticipantLink below, which remain
        available after FINALIZED (P4, adr/0041)** -- only issuing brand-new
        links is blocked.
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueParticipantLinksRequest'
      responses:
        '201':
          description: The newly issued links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueParticipantLinksResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
        '409':
          $ref: '#/components/responses/GatheringFinalized'
    get:
      operationId: listParticipantLinks
      summary: List every participant link issued for this gathering, in issuance order
      description: >-
        Supports the organizer-facing link-management surface (ADR-0036
        decision 7, human concern 2026-08-30: "リンクがわからなくなったら管理
        されなくなっちゃうかもね"). Ordered by `issuedAt` ascending (発行順).
        Includes revoked links (marked `revoked: true`) rather than deleting
        them from view, so revocation stays auditable. **Does not include the
        participant token or URL for any item** -- see
        `ParticipantLinkSummary` and this file's header comment for why;
        obtain a usable URL only via `recopyParticipantLink`, one link at a
        time, on explicit organizer request. Remains available after
        FINALIZED (adr/0040/adr/0041 do not restrict list/recopy/revoke by
        phase; only new issuance is blocked -- see issueParticipantLinks).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/GatheringId'
      responses:
        '200':
          description: Every participant link issued for this gathering (active and revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantLinkListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
  /gatherings/{gatheringId}/participant-links/{linkId}/recopy:
    post:
      operationId: recopyParticipantLink
      summary: Re-obtain the full participant URL for one previously issued link
      description: >-
        Returns the same token/URL originally issued for `linkId`, for the
        organizer to copy again (e.g. because the original message was lost
        -- ADR-0036 decision 7). Does not issue a new token, does not change
        `Gathering.totalIssuedParticipantLinks`, and does not affect
        `hasResponded` or `revoked` for this link. Allowed regardless of
        `hasResponded` (an already-answered participant's link may still be
        worth re-sharing); rejected once `revoked` is true, since a revoked
        link no longer grants participant access and re-copying it would be
        misleading. **This contract explicitly does not restrict recopy by
        Gathering.phase, including FINALIZED** (P4, human decision
        2026-09-03, adr/0041; Organizer.dc.html's design table already did
        not call for blocking it after FINALIZED, unlike issuance --
        adr/0041 makes this an explicit human-confirmed decision rather than
        only an unstated absence of a restriction). A participant whose link
        is re-copied after finalization reaches the same
        `ParticipantView.decision` any other holder of that link would
        (adr/0041's P5 addition) -- recopy after FINALIZED is useful
        precisely so a lost link can still be used to see the decision.
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
        - $ref: '#/components/parameters/ParticipantLinkId'
      responses:
        '200':
          description: The link's participant-facing URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedParticipantLink'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/ParticipantLinkNotFound'
        '409':
          $ref: '#/components/responses/ParticipantLinkRevoked'
  /gatherings/{gatheringId}/participant-links/{linkId}/revoke:
    post:
      operationId: revokeParticipantLink
      summary: Revoke one previously issued, still-unanswered participant link
      description: >-
        Marks `linkId` revoked. Only accepted while `hasResponded` is false
        for this link (human decision 2026-08-30: revocation is for
        cleaning up lost/mis-sent links, not for removing a participant who
        has already answered -- that is a distinct use case explicitly out
        of this slice). Once revoked, the token can no longer be used to
        reach the participant view (`LINK_REVOKED`), and this link no longer
        counts toward `Gathering.activeParticipantLinkCount` -- the
        denominator for "n人が未回答" (D2, amended 2026-08-30) -- though it
        remains visible in `listParticipantLinks` with `revoked: true` for
        audit. Revocation cannot be undone by this contract (no
        un-revoke/reissue-to-same-linkId operation exists; the organizer
        issues a new link instead). This contract does not restrict revoke
        by Gathering.phase (adr/0040), matching recopy above (P4, adr/0041
        makes this explicit for recopy; this contract has never restricted
        revoke by phase either, and this remains unchanged).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
        - $ref: '#/components/parameters/ParticipantLinkId'
      responses:
        '200':
          description: The revoked link's summary and the gathering's updated counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeParticipantLinkResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/ParticipantLinkNotFound'
        '409':
          $ref: '#/components/responses/ParticipantLinkAlreadyAnswered'
  /gatherings/{gatheringId}/confirm-date:
    post:
      operationId: confirmCandidateDate
      summary: Choose one candidate date and advance the gathering to SELECTING_SHOP
      description: >-
        The "この日にする" operation (product-brief.md §2, one of the two
        phase-advancing organizer operations -- see GatheringPhase's
        description; amended 2026-09-03, P6/adr/0041, from an earlier draft
        that described three). Only accepted while the gathering's phase is
        SCHEDULING and `candidateDateId` names one of its own candidate
        dates. Advances `phase` to SELECTING_SHOP and sets
        `confirmedCandidateDateId`. Once confirmed, no other candidate date
        may be confirmed for this gathering. Schedule responses -- for the
        confirmed date and for any other candidate date -- continue to be
        accepted after this call and are still reflected in
        `CandidateDate` tallies (product-brief.md §2: no deadline, progress
        never blocks on unanswered participants).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateDateId]
              properties:
                candidateDateId:
                  type: string
      responses:
        '200':
          description: The updated gathering, now in SELECTING_SHOP phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/CandidateDateNotFound'
        '409':
          $ref: '#/components/responses/GatheringNotInSchedulingPhase'
  /gatherings/{gatheringId}/shortlisted-shops:
    put:
      operationId: setShortlistedShops
      summary: Set (or replace) the shortlist of shops open for voting
      description: >-
        The "この5件で投票する" / "5件を差し替える" operation (product-brief.md
        §2, Organizer.dc.html state②; adr/0040). Performed from within the
        same organizer dashboard used for the rest of this phase, not a
        separate screen (P1, human decision 2026-09-03, adr/0041 --
        confirms this contract's existing design, which never introduced a
        separate endpoint or screen concept for shortlisting). Replaces the
        entire shortlist with `shopIds` (1 to 5 entries -- the lower bound
        of 1 was an architect judgment at drafting time and was confirmed
        by human decision P2, 2026-09-03, adr/0041 -- each drawn from the
        same open-shop population previewOpenShopsForCandidateDate exposes
        for the confirmed candidate date). The first successful call sets
        `Gathering.votingStartedAt` (previously null) and starts voting;
        this call **does not itself advance `Gathering.phase`** -- phase
        remains SELECTING_SHOP before and after every call to this
        operation (see GatheringPhase's description; this was reported as
        an FR-028 tension against product-brief.md §2's original wording at
        drafting time and was resolved by human decision P6, 2026-09-03,
        adr/0041 -- §2 itself has since been revised to match). A shop id
        already present in the previous shortlist keeps its `addedAt` and
        vote tallies (D7: "残した店の票はそのまま引き継がれます"); a newly
        added shop id starts with `addedAt` set to now and every tally at
        zero, and is "not yet answered" (`yourVote: null`) for every
        participant who last submitted setShopVotes before this call (D7:
        "新しく入れた店は、すでに投票した人には未回答のまま残ります"). A shop
        id present before this call but absent from `shopIds` is dropped
        from the shortlist entirely, along with its vote history --
        re-adding the same shop id in a later call is treated as a
        brand-new entry (architect design judgment, simplicity;
        product-brief.md and the reviewed canvases do not require
        preserving a removed shop's history). No filter/narrowing controls
        (genre, walking time, etc.) apply to this shortlist or its
        underlying open-shop population (P3, human decision 2026-09-03,
        adr/0041 -- confirms this contract already had no such controls; no
        schema change).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetShortlistedShopsRequest'
      responses:
        '200':
          description: The updated gathering, including the new shortlistedShops.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/InvalidShopSelection'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
        '409':
          description: >-
            Either the gathering has not yet reached SELECTING_SHOP
            (GatheringNotInSelectingShopPhase, still SCHEDULING) or the
            gathering is already FINALIZED (GatheringFinalized); the `code`
            field distinguishes the two.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              examples:
                notSelectingShop:
                  value:
                    code: GATHERING_NOT_IN_SELECTING_SHOP_PHASE
                    message: Confirm a candidate date before selecting shops to vote on.
                finalized:
                  value:
                    code: GATHERING_FINALIZED
                    message: This gathering is already finalized.
  /gatherings/{gatheringId}/finalize:
    post:
      operationId: finalizeGathering
      summary: Choose one shortlisted shop and finalize the date and shop
      description: >-
        The "日と店を確定する" operation (product-brief.md §2, one of the
        two phase-advancing organizer operations -- see GatheringPhase's
        description; amended 2026-09-03, P6/adr/0041). The organizer
        chooses `shopId` from the current shortlist -- **this contract
        never auto-selects the most-supported shop** (product-brief.md §2:
        "決定は幹事が行う。票は、決定のための材料であって、決定そのもの
        ではない"). Advances `phase` to FINALIZED and sets
        `finalizedShopId`. Once finalized, setScheduleResponse,
        setShopVotes, and issueParticipantLinks are all rejected with
        GATHERING_FINALIZED (reusing the existing code introduced by
        setScheduleResponse's contract, per explicit 2026-09-03 human
        instruction not to add a new one) -- this operation cannot be
        undone by this contract (no un-finalize operation exists).
      security:
        - organizerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/GatheringId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeGatheringRequest'
      responses:
        '200':
          description: The finalized gathering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/InvalidShopSelection'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/GatheringNotFound'
        '409':
          description: >-
            One of three reasons, distinguished by `code`: the gathering has
            not yet reached SELECTING_SHOP
            (GatheringNotInSelectingShopPhase), the gathering is in
            SELECTING_SHOP but voting has never started
            (ShopVotingNotStarted, `shortlistedShops` is empty), or the
            gathering is already FINALIZED (GatheringFinalized).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              examples:
                notSelectingShop:
                  value:
                    code: GATHERING_NOT_IN_SELECTING_SHOP_PHASE
                    message: Confirm a candidate date before finalizing.
                votingNotStarted:
                  value:
                    code: SHOP_VOTING_NOT_STARTED
                    message: Select shops to vote on before finalizing.
                finalized:
                  value:
                    code: GATHERING_FINALIZED
                    message: This gathering is already finalized.
  /participant-links/{token}:
    get:
      operationId: getParticipantView
      summary: Get the participant-facing view behind one signed link
      description: >-
        No organizer session is required; the path `token` itself is the
        sole credential (adr/0035 decision 4). Every candidate date carries
        an `openShopCount` regardless of whether this participant has
        answered it yet (D6, 2026-08-30) -- this is a distinct, unconditional
        field from `tally`, which is present only once this participant has
        answered that specific candidate date (product-brief.md §2's
        "answer first, then see others" rule; adr/0035 decision 1 item D6
        does not gate `openShopCount` the same way). `shopVoteQuestions` is
        null until the organizer has started voting (Gathering.
        votingStartedAt non-null, adr/0040); once non-null, each entry
        mirrors setShopVotes' own "answer first, then see others" gating
        for its own tally, independent of the schedule questions' gating.
        **`shopVoteQuestions`' array order is nearest-first (each shop's
        distance from the private search origin, ascending) and never
        changes as votes are cast, by this participant or anyone else**
        (adr/0044, 2026-09-04: fixes a production defect where this array
        reused the organizer-facing vote-count order, which reordered on
        every vote; see `shopVoteQuestions`' own schema description for why
        distance, rather than the `addedAt` an in-progress draft of this
        contract had used, is the ordering basis). `searchOrigin` is null
        under the same gating as `shopVoteQuestions` -- non-null once shop
        voting has started, extending ADR-0025 decision 1's search-origin
        disclosure to this unauthenticated screen (adr/0045). `decision` is
        null until `phase` is FINALIZED, at which point it holds the
        finalized candidate date, shop, and this participant's own
        retrospective schedule answer and this participant's own answer for
        every shop they were asked about -- never another participant's
        answers or votes (adr/0040, extended by P5/adr/0041 and generalized
        to the three-tier vote model by adr/0044). Once the organizer has
        revoked this link (ADR-0036 decision 7), this operation returns
        `LINK_REVOKED` instead, regardless of whether the token would
        otherwise still be within its validity period.
      parameters:
        - $ref: '#/components/parameters/ParticipantToken'
      responses:
        '200':
          description: The participant view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantView'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '410':
          $ref: '#/components/responses/LinkExpiredOrRevoked'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /participant-links/{token}/responses/{candidateDateId}:
    put:
      operationId: setScheduleResponse
      summary: Set or change this participant's answer for one candidate date
      description: >-
        Accepted while the gathering's phase is SCHEDULING or
        SELECTING_SHOP (product-brief.md §2: responses keep arriving and are
        reflected after the organizer confirms a date; there is no
        deadline). Rejected once the gathering is FINALIZED (D1,
        2026-08-30: after finalization, a participant sees the decision only
        and no operation is offered). Also rejected once this link has been
        revoked (LINK_REVOKED, ADR-0036 decision 7) -- but note that
        revocation itself is only ever accepted by revokeParticipantLink
        while this link had zero recorded responses, so a revoked link never
        transitions out from under a participant who was mid-response.
      parameters:
        - $ref: '#/components/parameters/ParticipantToken'
        - $ref: '#/components/parameters/CandidateDateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ScheduleResponseStatus'
      responses:
        '200':
          description: The updated participant view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantView'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '409':
          $ref: '#/components/responses/GatheringFinalized'
        '410':
          $ref: '#/components/responses/LinkExpiredOrRevoked'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /participant-links/{token}/shop-votes:
    put:
      operationId: setShopVotes
      summary: Set (replace) this participant's three-tier answer for every currently shortlisted shop
      description: >-
        The per-shop "行きたい／行ってもいい／むり" operation (product-brief.md
        §2, Vote.dc.html; adr/0040, moved from an approve-any-number model to
        a three-tier model by adr/0044, 2026-09-04 human decision). This
        wording is deliberately distinct from setScheduleResponse's "行ける／
        たぶん／むり" -- a shop vote expresses preference for a shop, not
        schedule availability, even though both operations share the same
        always-changeable, answer-every-item shape (an in-progress draft of
        this description had instead reused the schedule wording verbatim;
        this revision corrects that against the explicit human decision).
        `votes` replaces this participant's entire set of per-shop answers
        in one call (not a per-shop toggle endpoint -- the operationId and
        path are unchanged from the original approve-any-number design so
        that browser-interface's existing references to this operation by
        name keep pointing at the same call; only the request/response
        *shape* changed). Each entry names a shop currently in
        `Gathering.shortlistedShops` and a `ShopVoteStatus`; a shop present
        in `Gathering.shortlistedShops` but omitted from `votes` is left
        "not yet answered" (`yourVote: null`) for this participant, the
        same meaning `null` already had under the prior boolean model.
        `votes` may be empty (this participant has not yet decided on any
        shop; this is a meaningful, valid state, not an error -- mirrors the
        prior model's "0 approved shops" case). Every entry must name a
        shop currently in `Gathering.shortlistedShops`
        (INVALID_SHOP_SELECTION otherwise -- a shop id dropped by a prior
        setShortlistedShops replacement is no longer a valid target).
        Rejected with SHOP_VOTING_NOT_STARTED while
        `Gathering.shortlistedShops` is empty (the organizer has not yet
        called setShortlistedShops), and with GATHERING_FINALIZED once
        `phase` is FINALIZED (reusing the existing code, adr/0040). Also
        rejected once this link has been revoked (LINK_REVOKED) or has
        expired (LINK_EXPIRED), matching setScheduleResponse.
      parameters:
        - $ref: '#/components/parameters/ParticipantToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetShopVotesRequest'
      responses:
        '200':
          description: The updated participant view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantView'
        '400':
          $ref: '#/components/responses/InvalidShopSelection'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '409':
          description: >-
            Either voting has never started (ShopVotingNotStarted) or the
            gathering is already finalized (GatheringFinalized); the `code`
            field distinguishes the two.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
              examples:
                votingNotStarted:
                  value:
                    code: SHOP_VOTING_NOT_STARTED
                    message: The organizer has not started shop voting yet.
                finalized:
                  value:
                    code: GATHERING_FINALIZED
                    message: This gathering is already finalized.
        '410':
          $ref: '#/components/responses/LinkExpiredOrRevoked'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /participant-links/{token}/display-name:
    put:
      operationId: setParticipantDisplayName
      summary: Attach or change this participant's self-reported display name
      description: >-
        A participant may remain nameless indefinitely and attach a name at
        any later point (D5, 2026-08-30). Answers recorded before a name was
        attached remain attributed to the same participant slot and are not
        affected (TDR-GTH-05).
      parameters:
        - $ref: '#/components/parameters/ParticipantToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: The updated participant view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantView'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '410':
          $ref: '#/components/responses/LinkExpiredOrRevoked'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
components:
  securitySchemes:
    organizerSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: >-
        Same-origin Django session cookie for an authenticated organizer, as
        defined by contracts/authentication.feature and
        candidate-search-api.yaml's identical scheme.
  parameters:
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
      description: Django CSRF token, same requirement as candidate-search-api.yaml.
    GatheringId:
      name: gatheringId
      in: path
      required: true
      schema:
        type: string
    CandidateDateId:
      name: candidateDateId
      in: path
      required: true
      schema:
        type: string
    ParticipantLinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
      description: >-
        An opaque organizer-facing identifier for one issued participant
        link (ParticipantLinkSummary.id). This is a distinct value from the
        participant-facing token in ParticipantToken below -- knowing
        `linkId` never grants access to the participant view, and it is safe
        to appear in organizer-authenticated URLs, logs, and traces the way
        the token itself must not (ADR-0036 decision 7).
    ParticipantToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: >-
        The signed participant-link token itself. OpenAPI 3.0's apiKey
        security scheme does not support an `in: path` location, so this
        credential is declared as a plain path parameter rather than a
        `securitySchemes` entry; it functions as the sole credential for
        every /participant-links/{token}* operation (adr/0035 decision 4).
        Never log, trace, or persist this value beyond validating and
        fulfilling the current request. Distinct from `linkId`
        (ParticipantLinkId above), which the organizer-facing management
        endpoints use instead precisely so this value need not appear there.
  responses:
    AuthenticationRequired:
      description: The caller is not an authenticated organizer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Sign in is required to manage this gathering.
    RequestRejected:
      description: The request did not pass validation or the browser-session security check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: REQUEST_REJECTED
            message: The request could not be accepted. Refresh the page and try again.
    GatheringNotFound:
      description: No gathering exists with the given id, or it does not belong to this organizer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: GATHERING_NOT_FOUND
            message: This gathering could not be found.
    CandidateDateNotFound:
      description: No candidate date exists with the given id for this gathering.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: CANDIDATE_DATE_NOT_FOUND
            message: This candidate date could not be found.
    GatheringNotInSchedulingPhase:
      description: >-
        The requested operation is only accepted while the gathering's phase
        is SCHEDULING.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: GATHERING_NOT_IN_SCHEDULING_PHASE
            message: This gathering has already moved past scheduling.
    GatheringNotInSelectingShopPhase:
      description: >-
        The requested operation (shortlisting shops or finalizing) is only
        accepted once the gathering has reached the SELECTING_SHOP phase
        (adr/0040) -- it is still SCHEDULING (no candidate date has been
        confirmed yet).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: GATHERING_NOT_IN_SELECTING_SHOP_PHASE
            message: Confirm a candidate date before selecting shops to vote on.
    ShopVotingNotStarted:
      description: >-
        The requested operation requires Gathering.shortlistedShops to be
        non-empty (the organizer must call setShortlistedShops at least once
        first, adr/0040).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: SHOP_VOTING_NOT_STARTED
            message: Select shops to vote on before finalizing.
    InvalidShopSelection:
      description: >-
        The submitted shop id(s) are not a valid selection (adr/0040):
        either `shopIds` has 0 or more than 5 entries (setShortlistedShops
        -- the 1-5 boundary was confirmed by human decision P2, 2026-09-03,
        adr/0041), a duplicate id appears in the same request, a shop id is
        not part of the confirmed candidate date's open-shop population
        (setShortlistedShops), or a shop id named by a `votes` entry
        (setShopVotes) or `shopId` (finalizeGathering) is not currently
        shortlisted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: INVALID_SHOP_SELECTION
            message: One or more selected shops are not valid for this gathering.
    DuplicateCandidateDate:
      description: >-
        The candidate date being added exactly matches (same `startAt`) a
        candidate date already present -- either elsewhere in the same
        createGathering request, or already persisted on this gathering for
        addCandidateDate (adr/0038, architect design judgment; not part of
        the 2026-09-01 human decisions).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: DUPLICATE_CANDIDATE_DATE
            message: This candidate date has already been added.
    ParticipantLinkNotFound:
      description: No participant link exists with the given linkId for this gathering.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PARTICIPANT_LINK_NOT_FOUND
            message: This participant link could not be found.
    ParticipantLinkAlreadyAnswered:
      description: >-
        The link has at least one recorded schedule response and cannot be
        revoked (revocation is limited to unanswered links, ADR-0036
        decision 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PARTICIPANT_LINK_ALREADY_ANSWERED
            message: This link has already been answered and cannot be revoked.
    ParticipantLinkRevoked:
      description: The link has already been revoked; re-copying it is not offered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: PARTICIPANT_LINK_REVOKED
            message: This link has already been revoked.
    LinkNotFound:
      description: The token does not correspond to any issued participant link.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: LINK_NOT_FOUND
            message: This link is not valid.
    LinkExpiredOrRevoked:
      description: >-
        The token corresponds to a participant link whose validity period
        has passed (LINK_EXPIRED) or that the organizer has revoked
        (LINK_REVOKED, ADR-0036 decision 7). Both share this response's
        410 status; the `code` field distinguishes the reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          examples:
            expired:
              value:
                code: LINK_EXPIRED
                message: This link has expired. Please ask the organizer for a new one.
            revoked:
              value:
                code: LINK_REVOKED
                message: This link is no longer valid. Please ask the organizer for a new one.
    LinkRateLimited:
      description: This token exceeded the allowed request frequency.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Seconds before the participant may retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: LINK_RATE_LIMITED
            message: Too many requests were made with this link. Please try again shortly.
    GatheringFinalized:
      description: >-
        The gathering has been finalized; no further schedule response, shop
        vote, or link issuance is accepted (D1, 2026-08-30; extended to shop
        votes and link issuance by adr/0040, reusing this same code per
        explicit human instruction rather than adding new ones). Recopying
        or revoking an existing link is not affected by this response --
        see recopyParticipantLink/revokeParticipantLink (P4, adr/0041).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
          example:
            code: GATHERING_FINALIZED
            message: This gathering is already finalized.
  schemas:
    GatheringPhase:
      type: string
      enum: [SCHEDULING, SELECTING_SHOP, FINALIZED]
      description: >-
        product-brief.md §2's state machine, excluding the persisted DRAFT
        value (see this file's header comment) -- this exclusion was
        architect's design judgment at drafting time and was confirmed by
        human decision D10 (2026-09-01, adr/0038): a gathering cannot be
        created without at least one candidate date, so a "candidate-date-
        less draft" state never exists to represent. SCHEDULING corresponds
        to "日程を聞き中", SELECTING_SHOP to "店を選び中", FINALIZED to
        "確定". Only two organizer operations advance this enum:
        confirmCandidateDate (SCHEDULING -> SELECTING_SHOP) and
        finalizeGathering (SELECTING_SHOP -> FINALIZED, adr/0040). Shop
        voting (setShortlistedShops/setShopVotes) happens entirely within
        the SELECTING_SHOP phase and does not get its own enum value --
        Organizer.dc.html itself labels this one phase "店を選び中・投票
        実施中" (narrowing and voting under one label). This was reported
        as an FR-028 tension against product-brief.md §2's original wording
        (which listed "この5件で投票する" alongside the two phase-advancing
        operations) at drafting time (adr/0040); human decision P6
        (2026-09-03, adr/0041) settled it by revising §2 itself to describe
        two phase-advancing operations plus one important-but-non-advancing
        one, matching this enum -- see Gathering.votingStartedAt/
        shortlistedShops for how voting's own start is represented instead.
    ScheduleResponseStatus:
      type: string
      enum: [GOING, MAYBE, NOT_GOING]
      description: 行ける／たぶん／むり (product-brief.md §2).
    ShopVoteStatus:
      type: string
      enum: [WANT_TO_GO, OK_TO_GO, NOT_GOING]
      description: >-
        Added 2026-09-04 (adr/0044, human decision: shop voting should have
        the same three-tier, always-changeable shape as answering a
        candidate date -- but its own distinct wording, since a shop vote
        expresses preference for a shop, not schedule availability).
        WANT_TO_GO means 行きたい (this participant wants to go to this
        shop); OK_TO_GO means 行ってもいい (this participant is fine with
        going, without it being their preference); NOT_GOING means むり
        (this participant does not want to go). Deliberately not the same
        enum values as ScheduleResponseStatus's GOING/MAYBE/NOT_GOING, and
        not the same wording either (行ける／たぶん／むり) -- an
        in-progress draft of this schema had reused ScheduleResponseStatus's
        own vocabulary verbatim; this revision corrects that against the
        explicit human decision (行きたい／行ってもいい／むり), keeping the
        two schemas distinct so they may diverge further in the future
        without a breaking rename. This replaces the prior
        approve-any-number-of-shops model (a plain boolean/"included in a
        set" per shop), which this contract used from adr/0040 (2026-09-03)
        until this revision.
    CandidateDateInput:
      type: object
      additionalProperties: false
      required: [startAt]
      properties:
        startAt:
          type: string
          format: date-time
          description: >-
            The candidate date and start time the organizer is proposing.
            `format: date-time` requires a time component -- this schema has
            never accepted a date-only value, which already settles
            designer's open question (AddDate.dc.html, adr/0038) of whether
            time should be required: it always has been, by this existing
            field's type.
    CreateGatheringRequest:
      type: object
      additionalProperties: false
      required: [title, candidateDates]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The organizer-chosen name for this gathering (e.g. "第7回 社内ランチ会").
        candidateDates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CandidateDateInput'
          description: >-
            At least one candidate date is required at creation time; this
            contract does not expose a persisted zero-date state (see this
            file's header comment; confirmed by D10). No two entries may
            share the exact same `startAt` (DUPLICATE_CANDIDATE_DATE,
            adr/0038).
    CandidateDate:
      type: object
      required: [id, startAt, goingCount, maybeCount, notGoingCount, isConfirmed]
      additionalProperties: false
      properties:
        id:
          type: string
        startAt:
          type: string
          format: date-time
        goingCount:
          type: integer
          minimum: 0
          description: Number of participants who answered GOING for this candidate date.
        maybeCount:
          type: integer
          minimum: 0
        notGoingCount:
          type: integer
          minimum: 0
          description: >-
            Number of participants who answered NOT_GOING for this candidate
            date. This is a confirmed answer, distinct from an unanswered
            participant -- it is never used as a stand-in for "did not
            respond" (see Gathering.activeParticipantLinkCount /
            respondedParticipantCount for that distinct denominator, D2).
        isConfirmed:
          type: boolean
          description: >-
            True only for the one candidate date confirmCandidateDate has
            chosen, if any. At most one candidate date in a given gathering
            may be true.
    ShopLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        Added 2026-09-04 (adr/0044, human decision: show the same map/detail
        information the lunch-candidate screen shows). Mirrors
        candidate-search-api.yaml's ShopLocation exactly (same field names
        and bounds) -- a shop's own location for a map marker, never the
        organizer's private search origin. See `SearchOriginLocation` below
        for the separate schema that carries the search origin's own
        coordinates (adr/0044/adr/0045); this schema's own meaning (a shop's
        own location) is unchanged by that addition.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    SearchOriginLocation:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      description: >-
        Added 2026-09-04 (adr/0044/adr/0045, human decision: show the
        organizer's private search origin on the participant's map too, the
        same disclosure ADR-0025 decision 1 already made to the
        authenticated organizer screen, now extended to the unauthenticated
        participant screen -- see ParticipantView.searchOrigin). Same shape
        as candidate-search-api.yaml's schema of the same name -- the
        private runtime-configured search origin's coordinates (adr/0002,
        never committed to the public repository), supplied server-side by
        runtime environment variable. ADR-0025 decision 1 reasoned that
        every reader who could open the organizer screen worked near the
        origin, because that screen requires invited-employee
        authentication; ADR-0045 extends this disclosure to a screen that
        requires no such authentication (only a signed link), and records
        the widened threat model that extension accepts. Distinct from
        `ShopLocation`: `ShopLocation` continues to mean a shop's own
        location only and never represents this origin.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    LiveProjectedShop:
      type: object
      required:
        [shopId, name, genre, capacityTier, nonSmokingStatus,
         dinnerBudgetTier, location, walkingTimeMinutes, providerPageUrl]
      additionalProperties: false
      description: >-
        A minimal, live, non-persisted shop projection (ADR-0034 decision
        6) shared by ParticipantView.decision's `shop` and
        `yourShopVotes[].shop` fields (adr/0041, extended by adr/0044). Only
        `shopId` is durable; every display field is refetched on every
        read, the same discipline OpenShopPreviewItem and ShortlistedShop
        already establish -- this schema exists so `decision`'s shop-shaped
        fields do not each repeat the same display properties inline.
        `location`/`walkingTimeMinutes`/`providerPageUrl` were added
        2026-09-04 (adr/0044) alongside the same addition to
        OpenShopPreviewItem, ShortlistedShop, and ParticipantShopVoteOption
        -- a participant reaching the finalized decision has already seen
        these same values for this same shop during voting (shopVoteQuestion),
        so their presence here is not a new disclosure.
      properties:
        shopId:
          type: string
        name:
          type: string
        genre:
          type: string
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
        location:
          $ref: '#/components/schemas/ShopLocation'
        walkingTimeMinutes:
          type: integer
          minimum: 0
          description: >-
            Estimated one-way walking minutes from the (never-exposed here)
            private search origin to this shop's `location`, computed the
            same way as candidate-search-api.yaml's Candidate.
            walkingTimeMinutes (same origin, same pipeline function,
            ADR-0029). An estimate, not a measurement of an actual walked
            route (same caveat as candidate-search-api.yaml).
        providerPageUrl:
          type: string
          format: uri
          description: >-
            The shop's own provider page, same field candidate-search-api.
            yaml's Candidate.providerPageUrl exposes for the same shop.
    ShortlistedShop:
      type: object
      required:
        [shopId, addedAt, name, genre, capacityTier, nonSmokingStatus,
         dinnerBudgetTier, location, walkingTimeMinutes, providerPageUrl,
         wantToGoCount, okToGoCount, notGoingCount, respondedParticipantCount]
      additionalProperties: false
      description: >-
        One shop the organizer has shortlisted for voting (adr/0040,
        Organizer.dc.html state②). A live, non-persisted projection --
        only `shopId` is stored; every display field is refetched from the
        provider population on every read, the same pattern
        OpenShopPreviewItem already establishes (ADR-0034 decision 6).
        Ordered within Gathering.shortlistedShops by
        `wantToGoCount + okToGoCount` descending -- 行ける人が多い順
        (changed 2026-09-04, adr/0044, human decision, from the retired
        single `approvalCount`; an in-progress draft of this schema had
        instead ordered by `wantToGoCount` alone, which this revision
        corrects -- the human decision explicitly combines both positive
        tiers, not either alone); no manual reorder control exists
        (unavailableControls.forbiddenPurposes' manual-ordering category
        already covers this list, adr/0042 -- see
        gathering-scheduling-browser-interface.yaml). This schema carries
        its own display fields (rather than reusing LiveProjectedShop)
        because it additionally requires `addedAt` and the three-tier
        vote-tally fields, which LiveProjectedShop's narrower, finalize-only
        use case does not need.
      properties:
        shopId:
          type: string
          description: >-
            The same opaque provider shop identifier
            OpenShopPreviewItem.shopId uses (adr/0042 -- the organizer
            builds setShortlistedShops' shopIds from the shopId attributes
            it reads off the open-shop preview it browsed).
        addedAt:
          type: string
          format: date-time
          description: >-
            When this shop entered the *current* shortlist. Reset to the
            setShortlistedShops call's time whenever this shop id is newly
            added or re-added after having been removed (adr/0040 design
            judgment: a re-added shop is treated as brand new, not restored).
            Every shop present since voting started shares the same value as
            Gathering.votingStartedAt. This is the basis for D7's per-shop
            denominator (respondedParticipantCount below) and for
            ParticipantShopVoteOption.yourVote's "not yet answered" state.
            It is **not** the basis for ParticipantView.shopVoteQuestions'
            own array order (that array is ordered nearest-first by
            distance from the search origin instead, adr/0044 -- see that
            field's own description; an in-progress draft of this contract
            had used `addedAt` for that ordering too, which this revision
            replaces).
        name:
          type: string
        genre:
          type: string
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
        location:
          $ref: '#/components/schemas/ShopLocation'
        walkingTimeMinutes:
          type: integer
          minimum: 0
          description: Same computation and caveats as LiveProjectedShop.walkingTimeMinutes.
        providerPageUrl:
          type: string
          format: uri
          description: Same field as LiveProjectedShop.providerPageUrl, for this same shop.
        wantToGoCount:
          type: integer
          minimum: 0
          description: >-
            Added 2026-09-04 (adr/0044), replacing the retired
            `approvalCount` (and an in-progress draft's `goingCount`). The
            count of participants whose most recent setShopVotes call was
            submitted at or after this shop's `addedAt` and named this shop
            with status WANT_TO_GO (行きたい).
        okToGoCount:
          type: integer
          minimum: 0
          description: >-
            Same gating as wantToGoCount, for status OK_TO_GO (行ってもいい,
            adr/0044).
        notGoingCount:
          type: integer
          minimum: 0
          description: >-
            Same gating as wantToGoCount, for status NOT_GOING (むり,
            adr/0044). `wantToGoCount + okToGoCount + notGoingCount` always
            equals `respondedParticipantCount` below -- the same
            three-way-tally shape CandidateDate already uses for schedule
            responses.
        respondedParticipantCount:
          type: integer
          minimum: 0
          description: >-
            The count of participants whose most recent setShopVotes call
            was submitted at or after this shop's `addedAt`, regardless of
            which of the three statuses they chose for this specific shop
            -- this is the D7 per-shop denominator ("回答した8人のうち" vs.
            a newly added shop's smaller "入れたあとに答えた1人のうち",
            Vote.dc.html). Always equal to
            `wantToGoCount + okToGoCount + notGoingCount` for the same shop.
            Every shop sharing the same `addedAt` as
            Gathering.votingStartedAt shares the same value here (they
            became votable at the same moment).
    Gathering:
      type: object
      required:
        [id, title, phase, createdAt, candidateDates, totalIssuedParticipantLinks,
         totalRevokedParticipantLinks, activeParticipantLinkCount,
         respondedParticipantCount, anonymousRespondedParticipantCount,
         confirmedCandidateDateId, votingStartedAt, shortlistedShops,
         finalizedShopId]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        phase:
          $ref: '#/components/schemas/GatheringPhase'
        createdAt:
          type: string
          format: date-time
          description: >-
            When createGathering created this gathering. listGatherings
            orders its array by this field descending (新しい順, adr/0038).
            Never changes after creation.
        candidateDates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateDate'
          description: >-
            Ordered by goingCount descending (product-brief.md §2: "行ける
            人が多い順"); ties are an implementation-chosen stable order this
            schema does not fix.
        totalIssuedParticipantLinks:
          type: integer
          minimum: 0
          description: >-
            The lifetime count of every participant link ever issued for
            this gathering via issueParticipantLinks, across every call.
            Monotonically non-decreasing -- revoking a link does not reduce
            this value. Retained for audit/transparency only; it is **no
            longer the D2 denominator** by itself (amended 2026-08-30,
            ADR-0036 decision 7) -- see `activeParticipantLinkCount` below
            for the value "n人が未回答" now divides against.
        totalRevokedParticipantLinks:
          type: integer
          minimum: 0
          description: >-
            The lifetime count of links revoked via revokeParticipantLink
            for this gathering. Monotonically non-decreasing (revocation
            cannot be undone by this contract). Always
            <= totalIssuedParticipantLinks.
        activeParticipantLinkCount:
          type: integer
          minimum: 0
          description: >-
            `totalIssuedParticipantLinks - totalRevokedParticipantLinks`.
            This, not `totalIssuedParticipantLinks`, is the denominator for
            "n人が未回答" (D2, amended 2026-08-30: a revoked link no longer
            counts as an outstanding unanswered invitation -- ADR-0036
            decision 7, resolving the human concern that a lost/mis-issued
            link would otherwise leave "まだ1人未回答" permanently stuck).
            Unanswered participant count is
            `activeParticipantLinkCount - respondedParticipantCount`.
        respondedParticipantCount:
          type: integer
          minimum: 0
          description: >-
            The count of distinct participant slots that have submitted at
            least one schedule response for this gathering (any candidate
            date, any status). Unanswered participant count is
            `activeParticipantLinkCount - respondedParticipantCount`
            (D2, amended 2026-08-30 -- see activeParticipantLinkCount). This
            is a different denominator from each CandidateDate's own
            goingCount/maybeCount/notGoingCount, which are scoped to one
            candidate date only and may not sum to this value if some
            participants have answered only some candidate dates. It is
            also a different denominator from each ShortlistedShop's own
            respondedParticipantCount (adr/0040), which counts shop-vote
            submissions, not schedule responses. A revoked link is, by
            construction, never counted here -- revocation is only ever
            accepted for a link with zero recorded responses
            (revokeParticipantLink's PARTICIPANT_LINK_ALREADY_ANSWERED
            guard), so this field needs no adjustment for revocation.
        anonymousRespondedParticipantCount:
          type: integer
          minimum: 0
          description: >-
            The subset of respondedParticipantCount that has not attached a
            display name (setParticipantDisplayName was never called for
            that participant slot). Supports the organizer-facing disclosure
            "8人が回答（うち2人は名前なし）"; this schema does not expose a
            per-participant list here (designer's own scoping decision,
            2026-08-30 board) -- see listParticipantLinks for the separate,
            per-link management view that does name each link (ADR-0036
            decision 7).
        confirmedCandidateDateId:
          type: string
          nullable: true
          description: Non-null exactly when phase is SELECTING_SHOP or FINALIZED.
        votingStartedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null until the organizer's first successful setShortlistedShops
            call (adr/0040); non-null and unchanged thereafter (replacing
            the shortlist does not reset this timestamp -- only removing and
            never re-adding any shops would make shortlistedShops empty
            again, which this contract does not otherwise prevent, but
            votingStartedAt itself is never cleared once set). Distinct from
            `phase`, which does not change when voting starts (see
            GatheringPhase's description).
        shortlistedShops:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ShortlistedShop'
          description: >-
            Empty until the organizer calls setShortlistedShops at least
            once. Ordered by `wantToGoCount + okToGoCount` descending --
            行ける人が多い順 (see ShortlistedShop; changed 2026-09-04,
            adr/0044, human decision, from the retired single
            `approvalCount`; an in-progress draft had instead ordered by
            `wantToGoCount` alone, which this revision corrects). May become
            empty again only if every previously shortlisted shop is removed
            by a later setShortlistedShops call without any replacement
            (this contract does not forbid submitting an empty list to
            setShortlistedShops... -- see SetShortlistedShopsRequest, which
            in fact requires minItems: 1 (P2, confirmed 2026-09-03,
            adr/0041), so in practice this array cannot be emptied again
            once non-empty; documented here for completeness of the
            field's own nullability story).
        finalizedShopId:
          type: string
          nullable: true
          description: >-
            Non-null exactly when phase is FINALIZED (adr/0040). Always
            equal to one of shortlistedShops' shopId values at the moment
            finalizeGathering was called.
    GatheringListResponse:
      type: object
      required: [gatherings]
      additionalProperties: false
      properties:
        gatherings:
          type: array
          items:
            $ref: '#/components/schemas/Gathering'
          description: >-
            Every gathering this organizer organizes, ordered by createdAt
            descending (新しい順, adr/0038). Empty when the organizer has
            none yet (Entry.dc.html E-1b's empty state is a client-side
            rendering of this empty array).
    InProgressGatheringCountResponse:
      type: object
      required: [inProgressGatheringCount]
      additionalProperties: false
      properties:
        inProgressGatheringCount:
          type: integer
          minimum: 0
          description: >-
            The count of this organizer's gatherings whose phase is
            SCHEDULING or SELECTING_SHOP. FINALIZED gatherings are excluded
            (adr/0038, designer's judgment carried into this contract).
    OpenShopPreviewItem:
      type: object
      required:
        [shopId, name, genre, capacityTier, nonSmokingStatus,
         dinnerBudgetTier, location, walkingTimeMinutes, providerPageUrl]
      additionalProperties: false
      description: >-
        A live, non-persisted projection of one shop for the organizer's
        same-decision preview (adr/0034 decision 6: the gathering does not
        store this data; it is refetched on every open-shop-preview call).
        Uses the same coarse, tier-based vocabulary as
        candidate-search-api.yaml's Candidate schema (ADR-0019) -- not the
        raw seat counts shown in the designer's non-approved exploratory
        canvas (adr/0035 decision 5's scope: that canvas is an input, not an
        approved design). `shopId` was added 2026-09-04 (adr/0042,
        architect self-audit, not part of any human decision that round) --
        drafting-time versions of this schema left the item display-only,
        deferring how a client would correlate a previewed row with the
        shopId it later submits to setShortlistedShops; once
        gathering-scheduling-browser-interface.yaml needed a concrete
        checkbox-to-shopId observation for PickFive.dc.html, this
        deferral turned out to make the approved screen unimplementable,
        so this field was added rather than left open any longer.
        `location`/`walkingTimeMinutes`/`providerPageUrl` were added
        2026-09-04 (adr/0044, human decision: show the same map/detail
        information the lunch-candidate screen shows, on both the
        organizer's shortlist-selection screen and the participant's vote
        screen -- this schema also backs the shortlist-selection screen,
        adr/0040's header comment on previewOpenShopsForCandidateDate's
        reuse).
      properties:
        shopId:
          type: string
        name:
          type: string
        genre:
          type: string
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
        location:
          $ref: '#/components/schemas/ShopLocation'
        walkingTimeMinutes:
          type: integer
          minimum: 0
          description: Same computation and caveats as LiveProjectedShop.walkingTimeMinutes.
        providerPageUrl:
          type: string
          format: uri
          description: Same field as LiveProjectedShop.providerPageUrl, for this same shop.
    CandidateDateOpenShopPreview:
      type: object
      required: [candidateDateId, openShopCount, previewShops]
      additionalProperties: false
      properties:
        candidateDateId:
          type: string
        openShopCount:
          type: integer
          minimum: 0
          description: >-
            The count of shops in the default-filtered private population
            (includeIzakayaBar=false, no organizer-narrowing filters) that
            this contract's weekday-based regularHoliday matching (see this
            file's header comment) does not confirm as closed on this
            candidate date. Shops whose closure cannot be confirmed remain
            counted as open (ADR-0023 decision 2's soft-filter philosophy).
            Adopting this weekday-based matching for the gathering scope was
            confirmed by human decision 2026-08-30 (adr/0035 decision 6,
            option A) -- it does not judge national holidays, business
            hours, or a specific date's actual opening.
        previewShops:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/OpenShopPreviewItem'
          description: >-
            A nearest-first subset of the open shops for this candidate
            date. The exact number shown is a UI-implementation detail this
            schema does not fix (same pattern as candidate-search-api.
            yaml's display cap); `openShopCount` is the authoritative
            total. Once the gathering reaches SELECTING_SHOP, this same
            array (now with each item's `shopId`, adr/0042, and its
            `location`/`walkingTimeMinutes`/`providerPageUrl`, adr/0044) is
            also what the organizer's shortlist-selection surface renders
            and chooses from (PickFive.dc.html) -- when `openShopCount`
            exceeds `previewShops.length`, the excess shops are not
            reachable through this contract's selection surface in this
            slice; this is a known, unmeasured scale limitation
            PickFive.dc.html itself flags ("母集団が多い日の見え方は描いて
            いない"), not resolved here.
    SetShortlistedShopsRequest:
      type: object
      additionalProperties: false
      required: [shopIds]
      properties:
        shopIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
          description: >-
            The complete replacement shortlist (adr/0040). At least 1 and at
            most 5 entries -- the lower bound of 1 was confirmed by human
            decision P2 (2026-09-03, adr/0041); this contract has required
            it since drafting, so P2 ratifies rather than changes this
            value. Must contain no duplicates (`uniqueItems`) and every id
            must belong to the confirmed candidate date's open-shop
            population, or the request is rejected with
            INVALID_SHOP_SELECTION.
    ParticipantShopVoteEntry:
      type: object
      additionalProperties: false
      required: [shopId, status]
      description: >-
        Added 2026-09-04 (adr/0044), replacing the retired boolean-set
        model (a bare array of approved shopIds). One participant's answer
        for one currently shortlisted shop.
      properties:
        shopId:
          type: string
        status:
          $ref: '#/components/schemas/ShopVoteStatus'
    SetShopVotesRequest:
      type: object
      additionalProperties: false
      required: [votes]
      properties:
        votes:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/ParticipantShopVoteEntry'
          description: >-
            This participant's complete replacement set of per-shop
            three-tier answers (adr/0044, replacing the retired
            `approvedShopIds` boolean-set model from adr/0040). May be
            empty, and any shop currently in Gathering.shortlistedShops but
            omitted here is left "not yet answered"
            (ParticipantShopVoteOption.yourVote: null) for this
            participant -- product-brief.md §2 sets no minimum and no
            requirement that every shop be answered in one call. No two
            entries may name the same shopId (the client is expected to
            send its complete current answer set on every call, mirroring
            the prior model's "resend the complete set" call shape). Every
            entry's shopId must name a shop currently in
            Gathering.shortlistedShops, or the request is rejected with
            INVALID_SHOP_SELECTION.
    FinalizeGatheringRequest:
      type: object
      additionalProperties: false
      required: [shopId]
      properties:
        shopId:
          type: string
          description: >-
            Must name one of Gathering.shortlistedShops' current shopId
            values, or the request is rejected with INVALID_SHOP_SELECTION
            (adr/0040). The organizer's own choice -- never computed from
            goingCount by this contract (product-brief.md §2: votes are
            material for the decision, not the decision itself).
    IssueParticipantLinksRequest:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 200
          description: >-
            How many new, distinct participant links to issue in this call.
            The approved screen always sends count: 1 (human decision
            2026-08-30, ADR-0036 decision 4, option A); this schema still
            accepts a larger value as headroom for a possible future
            bulk-issuance screen. `maxItems: 200` is a defensive schema
            bound, not an expected operating size (same convention as
            candidate-search-api.yaml's shownProviderPageUrls).
    IssuedParticipantLink:
      type: object
      required: [token, url]
      additionalProperties: false
      properties:
        token:
          type: string
          description: >-
            Opaque, unguessable, URL-safe token (adr/0035 decision 4). Must
            never be logged, traced, or persisted by any component other
            than the record needed to validate it on a later request.
        url:
          type: string
          format: uri
          description: The full same-origin URL the organizer shares with one participant.
    IssueParticipantLinksResponse:
      type: object
      required: [issuedLinks, totalIssuedParticipantLinks, activeParticipantLinkCount]
      additionalProperties: false
      properties:
        issuedLinks:
          type: array
          items:
            $ref: '#/components/schemas/IssuedParticipantLink'
        totalIssuedParticipantLinks:
          type: integer
          minimum: 0
          description: Gathering.totalIssuedParticipantLinks after this call, for convenience.
        activeParticipantLinkCount:
          type: integer
          minimum: 0
          description: >-
            Gathering.activeParticipantLinkCount after this call, for
            convenience (the current D2 denominator, amended 2026-08-30).
    ParticipantLinkSummary:
      type: object
      required: [id, issuedAt, hasResponded, revoked, displayName]
      additionalProperties: false
      description: >-
        One row of the organizer-facing link-management list
        (listParticipantLinks, ADR-0036 decision 7). Deliberately carries no
        token or URL -- see ParticipantLinkId and this file's header comment
        for why re-exposure is scoped to recopyParticipantLink's single-item
        response instead of appearing here for every link at once.
      properties:
        id:
          type: string
          description: >-
            Opaque organizer-facing identifier (see the ParticipantLinkId
            parameter). Not usable as a participant-access credential.
        issuedAt:
          type: string
          format: date-time
          description: >-
            When issueParticipantLinks created this link. listParticipantLinks
            orders its array by this field ascending (発行順).
        hasResponded:
          type: boolean
          description: >-
            True exactly when this participant slot has submitted at least
            one schedule response (the same condition
            Gathering.respondedParticipantCount counts). Attaching a display
            name alone, without any schedule response, does not make this
            true. revokeParticipantLink is only accepted while this is
            false.
        revoked:
          type: boolean
          description: >-
            True once revokeParticipantLink has succeeded for this link.
            Revoked links remain in this list (not deleted) for audit, but
            no longer count toward Gathering.activeParticipantLinkCount.
            `revoked: true` implies `hasResponded: false` -- revocation is
            never accepted otherwise.
        displayName:
          type: string
          nullable: true
          description: >-
            This participant's self-reported name, or null if still
            nameless (same field ParticipantView.displayName exposes to the
            participant themselves). Supports showing "名無し" per row in
            the organizer's list (D5-adjacent disclosure, distinct from the
            aggregate-only anonymousRespondedParticipantCount on Gathering).
    ParticipantLinkListResponse:
      type: object
      required: [participantLinks]
      additionalProperties: false
      properties:
        participantLinks:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantLinkSummary'
    RevokeParticipantLinkResponse:
      type: object
      required: [participantLink, gathering]
      additionalProperties: false
      properties:
        participantLink:
          $ref: '#/components/schemas/ParticipantLinkSummary'
          description: The just-revoked link (revoked now true).
        gathering:
          $ref: '#/components/schemas/Gathering'
          description: >-
            The gathering with updated totalRevokedParticipantLinks and
            activeParticipantLinkCount, so the dashboard's denominators
            refresh without a second request.
    ParticipantScheduleQuestion:
      type: object
      required: [candidateDateId, startAt, openShopCount, yourResponse]
      additionalProperties: false
      properties:
        candidateDateId:
          type: string
        startAt:
          type: string
          format: date-time
        openShopCount:
          type: integer
          minimum: 0
          description: >-
            "この日に開いている店 N件" (D6, 2026-08-30). Always present
            regardless of whether this participant has answered this
            candidate date -- unlike `tally` below, it is not gated by the
            "answer first, then see others" rule. No shop name or other
            shop attribute is included (D6 explicitly limits this to a
            count).
        yourResponse:
          $ref: '#/components/schemas/ScheduleResponseStatus'
          nullable: true
          description: Null when this participant has not yet answered this candidate date.
        tally:
          type: object
          nullable: true
          required: [goingCount, maybeCount, notGoingCount]
          additionalProperties: false
          properties:
            goingCount:
              type: integer
              minimum: 0
            maybeCount:
              type: integer
              minimum: 0
            notGoingCount:
              type: integer
              minimum: 0
          description: >-
            Null until `yourResponse` is non-null for this same candidate
            date (product-brief.md §2: other participants' answers are
            visible only after answering yourself, applied per candidate
            date, TDR-GTH-12). Once present, mirrors the organizer-facing
            CandidateDate counts for this same candidate date.
    ParticipantShopVoteOption:
      type: object
      required:
        [shopId, name, genre, capacityTier, nonSmokingStatus,
         dinnerBudgetTier, location, walkingTimeMinutes, providerPageUrl,
         yourVote, tally]
      additionalProperties: false
      description: >-
        One currently shortlisted shop, from this participant's point of
        view (adr/0040, Vote.dc.html). Mirrors ShortlistedShop's live-
        projected display fields (ADR-0034 decision 6) but exposes only
        this participant's own answer and a gated aggregate tally, never
        the shop's addedAt or other participants' identities.
        `location`/`walkingTimeMinutes`/`providerPageUrl` were added
        2026-09-04 (adr/0044, human decision: show the same map/detail
        information the lunch-candidate screen shows on this screen too).
        Whether extending this disclosure to this unauthenticated,
        signed-link-only surface needed re-examination against ADR-0025's
        authenticated-screen-only rationale was flagged in an earlier draft
        of this file as an unresolved question -- ADR-0045 now answers it:
        the origin-adjacent reasoning ADR-0025 applied to the organizer is
        deliberately extended here (adr/0045), and this same file adds
        `ParticipantView.searchOrigin` alongside this field.
      properties:
        shopId:
          type: string
        name:
          type: string
        genre:
          type: string
        capacityTier:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
        nonSmokingStatus:
          type: string
          nullable: true
          enum: [FULL, PARTIAL, NONE]
        dinnerBudgetTier:
          type: string
          nullable: true
          enum: [LOW, MID, HIGH]
        location:
          $ref: '#/components/schemas/ShopLocation'
        walkingTimeMinutes:
          type: integer
          minimum: 0
          description: Same computation and caveats as LiveProjectedShop.walkingTimeMinutes.
        providerPageUrl:
          type: string
          format: uri
          description: Same field as LiveProjectedShop.providerPageUrl, for this same shop.
        yourVote:
          $ref: '#/components/schemas/ShopVoteStatus'
          nullable: true
          description: >-
            Added 2026-09-04 (adr/0044), replacing the retired boolean
            `yourApproval`. Null exactly when this participant's most
            recent setShopVotes call (if any) either predates this shop's
            addedAt, or did not include an entry naming this shopId --
            "まだ答えていません" (Vote.dc.html's D7 depiction of a
            just-added shop). Once this participant submits a `votes` entry
            for this shop at or after this shop's addedAt, becomes the
            submitted ShopVoteStatus value and stays non-null unless this
            shop is later removed and re-added by the organizer (which
            resets addedAt and therefore can make this null again).
        tally:
          type: object
          nullable: true
          required: [wantToGoCount, okToGoCount, notGoingCount, respondedParticipantCount]
          additionalProperties: false
          properties:
            wantToGoCount:
              type: integer
              minimum: 0
            okToGoCount:
              type: integer
              minimum: 0
            notGoingCount:
              type: integer
              minimum: 0
            respondedParticipantCount:
              type: integer
              minimum: 0
          description: >-
            Null exactly when `yourVote` is null for this same shop
            (product-brief.md §2's "answer first, then see others" rule,
            applied per shop the same way ParticipantScheduleQuestion.tally
            applies it per candidate date, TDR-GTH-12's precedent extended
            to shop voting). Once present, mirrors this same shop's
            organizer-facing ShortlistedShop.wantToGoCount/okToGoCount/
            notGoingCount/respondedParticipantCount exactly (changed
            2026-09-04, adr/0044, from the retired single approvalCount).
    ParticipantDecisionShopVote:
      type: object
      required: [shop, status]
      additionalProperties: false
      description: >-
        Added 2026-09-04 (adr/0044), replacing the retired
        `yourApprovedShops` (an array of only-approved LiveProjectedShop
        entries). One entry per shop among Gathering.shortlistedShops at
        the moment of finalization for which this participant had answered
        (ParticipantShopVoteOption.yourVote was non-null) -- a shop this
        participant never got a chance to vote on (yourVote null) is
        excluded, the same gating the prior model already applied, but
        this schema now carries the actual three-tier `status` chosen
        rather than filtering to a single "approved" bucket, since the
        three-tier model has no single bucket that unambiguously
        corresponds to the retired boolean "approved". This mirrors
        `yourScheduleResponse` below (which reports the answer's value,
        not only a subset of favorable answers) and more completely
        satisfies the human's stated intent ("投票後に振りかえられる", a
        personal retrospective of what this participant actually said) --
        the retired model silently dropped a NOT_GOING-equivalent answer
        from this retrospective, which this generalization no longer does.
      properties:
        shop:
          $ref: '#/components/schemas/LiveProjectedShop'
        status:
          $ref: '#/components/schemas/ShopVoteStatus'
    ParticipantView:
      type: object
      required:
        [gatheringTitle, phase, displayName, scheduleQuestions,
         confirmedCandidateDate, shopVoteQuestions, searchOrigin, decision]
      additionalProperties: false
      properties:
        gatheringTitle:
          type: string
        phase:
          $ref: '#/components/schemas/GatheringPhase'
        displayName:
          type: string
          nullable: true
          description: Null while this participant has not attached a name (D5).
        scheduleQuestions:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantScheduleQuestion'
        confirmedCandidateDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Non-null once phase is SELECTING_SHOP or FINALIZED.
        shopVoteQuestions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ParticipantShopVoteOption'
          description: >-
            Null until the organizer has started voting
            (Gathering.votingStartedAt non-null, adr/0040) -- in particular,
            always null while phase is SCHEDULING. Once non-null, mirrors
            Gathering.shortlistedShops (same set of shops, same live-
            projected display fields), but **ordered nearest-first: each
            shop's distance from the private search origin, ascending, the
            same underlying calculation `walkingTimeMinutes` is derived
            from (ADR-0029) -- not by any vote tally, and not by the shop's
            rounded `walkingTimeMinutes` value either, to avoid ties among
            same-minute shops** (changed 2026-09-04, adr/0044, human
            decision: 参加者の店の並び＝近い順 -- this fixes a production
            defect where this array reused Gathering.shortlistedShops' own
            order, wantToGoCount+okToGoCount descending, which reordered
            visibly every time any participant cast a vote). Because a
            shop's distance from the search origin never changes during a
            gathering, this ordering is automatically stable as votes are
            cast, by this participant or anyone else -- an in-progress
            draft of this schema had instead ordered by each shop's
            `addedAt` ascending, which also achieves stability but not the
            human-specified near-order; this revision replaces that with
            distance so both properties hold at once. `addedAt` remains the
            basis for `yourVote`'s "not yet answered" gating (D7) -- only
            this array's *order* changed. Remains present (not reset to
            null) once phase is FINALIZED, so a participant who never
            checked before finalization can still see how the shops they
            were asked about looked; see `decision` below for the
            authoritative finalized answer.
        searchOrigin:
          $ref: '#/components/schemas/SearchOriginLocation'
          nullable: true
          description: >-
            Added 2026-09-04 (adr/0044/adr/0045, human decision: show the
            organizer's private search origin on this participant's map
            too). Non-null under the same condition as `shopVoteQuestions`
            (Gathering.votingStartedAt non-null) -- present once shop
            voting has started and remains present after finalization,
            extending ADR-0025 decision 1's authenticated-organizer-screen
            disclosure to this unauthenticated, signed-link screen
            (ADR-0045, which records the widened threat model this
            extension accepts).
        decision:
          type: object
          nullable: true
          required: [confirmedCandidateDate, shop, yourScheduleResponse,
                     yourShopVotes]
          additionalProperties: false
          properties:
            confirmedCandidateDate:
              type: string
              format: date-time
            shop:
              $ref: '#/components/schemas/LiveProjectedShop'
              description: >-
                The finalized shop (ADR-0034 decision 6, live projection),
                keyed by Gathering.finalizedShopId.
            yourScheduleResponse:
              $ref: '#/components/schemas/ScheduleResponseStatus'
              nullable: true
              description: >-
                Added by human decision P5 (2026-09-03, adr/0041): this
                participant's own answer for `confirmedCandidateDate`
                specifically (the same value found in `scheduleQuestions`
                for the candidate date matching Gathering.
                confirmedCandidateDateId), so the confirmed screen can let a
                participant retrospectively see whether they had said they
                could make it on the day that was chosen. Null if this
                participant never answered that specific candidate date.
                Never another participant's answer.
            yourShopVotes:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantDecisionShopVote'
              description: >-
                Added by human decision P5 (2026-09-03, adr/0041) as
                `yourApprovedShops`; generalized to the three-tier vote
                model 2026-09-04 (adr/0044) and renamed accordingly -- see
                ParticipantDecisionShopVote for why this now carries every
                shop this participant answered (with the answer's actual
                three-tier value), not only a filtered "approved" subset.
                Ordered the same way shopVoteQuestions was ordered at the
                moment of finalization (nearest-first by distance from the
                search origin, adr/0044) -- this contract does not require
                re-deriving a different order here.
          description: >-
            Null until phase is FINALIZED; non-null and unchanged
            thereafter (adr/0040, D1 2026-08-30: "確定後、参加者には決定
            内容だけが見えます"). Extended by human decision P5 (2026-09-03,
            adr/0041) to also include this participant's own retrospective
            record (yourScheduleResponse, yourShopVotes) -- explicitly
            never another participant's answers or votes, per the human's
            stated intent ("投票後に振りかえられる", not a disclosure of
            others' choices). This is the sole content this contract
            expects a finalized-gathering screen to need beyond the
            gathering's title -- scheduleQuestions/shopVoteQuestions remain
            in the response for historical reference (this participant's
            own past answers, in their original per-candidate-date/per-shop
            shape), but gathering-scheduling-browser-interface.yaml's
            finalizedView (adr/0042) fully replaces both surfaces with the
            flat `decision` summary rather than rendering them alongside it
            -- resolving this schema's own previously-open note ("left to
            that later contract, ADR-0013 order") in favor of replacement,
            not coexistence. No further mutation is accepted regardless
            (setScheduleResponse/setShopVotes both reject with
            GATHERING_FINALIZED once phase is FINALIZED).
    ProblemResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [AUTHENTICATION_REQUIRED, REQUEST_REJECTED, GATHERING_NOT_FOUND,
             CANDIDATE_DATE_NOT_FOUND, GATHERING_NOT_IN_SCHEDULING_PHASE,
             GATHERING_NOT_IN_SELECTING_SHOP_PHASE, SHOP_VOTING_NOT_STARTED,
             INVALID_SHOP_SELECTION, DUPLICATE_CANDIDATE_DATE,
             PARTICIPANT_LINK_NOT_FOUND, PARTICIPANT_LINK_ALREADY_ANSWERED,
             PARTICIPANT_LINK_REVOKED, LINK_NOT_FOUND, LINK_EXPIRED,
             LINK_REVOKED, LINK_RATE_LIMITED, GATHERING_FINALIZED]
        message:
          type: string
          description: Safe user-facing text without a private location, credentials, or provider internals.
