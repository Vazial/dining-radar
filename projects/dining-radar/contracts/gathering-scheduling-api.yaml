# - **自己発見の修正**: 本追補の作業中、`setShopVotes`が参照する`SetShopVotesRequest`スキーマが
#   前回の改訂で定義漏れ（宙に浮いた`$ref`）になっていたことに気づき、あわせて追加した
#   （`approvedShopIds`、0件以上）——今回の人間裁定とは独立した、architect自身の監査による修正
