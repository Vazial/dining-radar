{% extends "base.html" %}
{% load static %}

{% block title %}ランチ候補{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'dining_radar/web/vendor/leaflet/leaflet.css' %}">
  <style>
    /* The candidate screen compares a map and cards side by side, so it uses
       a wider working area than the narrow authentication forms. */
    .app-shell { width: min(100% - 2rem, 72rem); }
    #candidate-app { display: flex; flex-direction: column; gap: 1rem; }
    [data-testid="candidate-map"] { height: 22rem; border-radius: 0.5rem; overflow: hidden; }
    [data-testid="candidate-proposal-cards"] { display: grid; gap: 0.75rem; }
    [data-testid="candidate-card"] { border: 1px solid #dce3da; border-radius: 0.5rem; padding: 0.85rem 1rem; cursor: pointer; }
    [data-testid="candidate-card"][data-selection-state="selected"] { border-color: #155c42; box-shadow: 0 0 0 1px #155c42; }
    [data-testid="candidate-card"] dl { margin: 0.5rem 0; display: grid; gap: 0.25rem; }
    [data-testid="candidate-card"] dt { font-weight: 650; font-size: 0.85rem; color: #536057; }
    #candidate-reproposal-overlay:not([hidden]) {
      position: fixed; inset: 0; background: rgb(28 36 32 / 45%);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    [data-testid="candidate-reproposal-dialog"] { background: #fff; border-radius: 0.75rem; padding: 1.25rem; max-width: 32rem; width: 100%; }
    [data-testid="candidate-reproposal-option"] { display: block; width: 100%; text-align: left; margin-bottom: 0.5rem; background: #f4f5f1; color: #1c2420; }
    [data-testid="candidate-reproposal-option"][aria-pressed="true"] { background: #d7e9df; }
  </style>
{% endblock %}

{% block content %}
    <header data-testid="authenticated-application-shell">
      <div class="app-header">
        <h1>ランチ候補</h1>
      </div>
      <nav class="account-nav" aria-label="アカウント">
        <a
          href="{% url 'authentication:password_change' %}"
          data-testid="auth-password-change-open"
          data-candidate-control-category="button"
          data-candidate-control-purpose="auth-password-change-open"
        >パスワード変更</a>
        <form method="post" action="{% url 'authentication:logout' %}" data-testid="auth-sign-out-form">
          {% csrf_token %}
          <button
            type="submit"
            data-testid="auth-sign-out"
            data-candidate-control-category="button"
            data-candidate-control-purpose="auth-sign-out"
          >サインアウト</button>
        </form>
      </nav>
    </header>
    <main>
      <p
        data-testid="auth-individual-account-guidance"
        data-auth-account-use="individual-only"
        data-auth-credential-sharing="not-requested"
      >管理者から案内された個別アカウントで利用してください。認証情報は共有しないでください。</p>

      <div hidden>{% csrf_token %}</div>
      <div id="candidate-app"></div>
      <div id="candidate-reproposal-overlay" hidden></div>
    </main>

    <script src="{% static 'dining_radar/web/vendor/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'dining_radar/web/candidate.js' %}"></script>
{% endblock %}
