{% extends "base.html" %}

{% block title %}パスワード変更 | ランチ候補{% endblock %}

{% block content %}
    <main>
      <header class="app-header">
        <h1>パスワードを変更しました</h1>
      </header>
      <p><a href="{% url 'web:home' %}">候補画面へ戻る</a></p>
      <form method="post" action="{% url 'authentication:logout' %}" data-testid="auth-sign-out-form">
        {% csrf_token %}
        <button type="submit" data-testid="auth-sign-out">サインアウト</button>
      </form>
    </main>
{% endblock %}
