{% extends "base.html" %}

{% block title %}パスワード変更 | ランチ候補{% endblock %}

{% block content %}
    <main>
      <header class="app-header">
        <h1>パスワード変更</h1>
      </header>
      <form method="post" data-testid="auth-password-change-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" data-testid="auth-password-change-submit">変更する</button>
      </form>
      <p><a href="{% url 'web:home' %}">候補画面へ戻る</a></p>
    </main>
{% endblock %}
